       * fichiers, une seule taille). Au-delà de 1 516 px de haut, l'écran
       * étirerait un fichier qu'il n'a pas — la garde ④ de Croze, tenue dans
       * le sens de la mesure. Sur un 1080, `74vh` (799) mène toujours, comme
       * avant.
       */
      /*
       * ⛑ S129 — **×2 PLUS PETIT ZOOMÉ.** Retour de test Croze : *« ×2 plus
       * PETITES zoomées »*. `74vh` → `37vh`.
       *
       * ⚠ **CELA REVIENT SUR UNE PART DU S119, ET IL FAUT LE DIRE.** Ce palier
       * avait ARRACHÉ le plafond gravé de 760 px pour que le zoom monte jusqu'à
       * la résolution de sa source en 4K, et il avait raison sur le principe :
       * *un plafond en pixels enferme.* La borne reste donc relative (`vh`) —
       * elle n'est pas re-gravée, elle est **divisée**. Ce que Croze corrige
       * n'est pas le fait de suivre l'écran, c'est la PART d'écran prise : une
       * carte qui remplit les trois quarts de la hauteur n'est plus un zoom,
       * c'est une interruption. Et depuis le S129 elle est lisible à 208 px dans
       * la main, ce qui n'était pas vrai quand `74vh` a été choisi.
       *
       * Le second terme du `min` suit : `1516` était la hauteur SOURCE, il
       * devient `758` — la moitié, pour la même raison.
       */
      .cz-grande { display: block; height: min(calc(var(--uvh) * 37), 758px); width: auto;
                   aspect-ratio: 1004 / 1516;
                   border: 1px solid var(--rule); border-radius: 3px; }
      .cz-cote { display: flex; flex-direction: column; gap: 6px;
                 max-width: 300px; padding-top: 4px; }
      .cz-nom    { font-weight: 700; font-size: 15px; color: var(--stock); }
      .cz-rarete { font-size: 9px; letter-spacing: .18em; color: var(--stock-dim); }
      .cz-stats  { font-family: var(--mono); font-size: 12px; color: var(--stock-2); }
      .cz-texte  { font-size: 11px; line-height: 1.4; color: var(--stock-dim); }
      /*
       * LA MARQUE DE DÉRIVE. Rouge tampon — c'est la teinte du REFUS et de ce
       * qui ne fait pas foi, et une carte qui imprime un chiffre faux est
       * exactement ça. Elle ne s'allume que sur les neuf mesurées.
       */
      /* ⛑ S244 — 10 px, même raison que `.perte-montant`. */
      .cz-derive { font-size: 10px; line-height: 1.35; color: var(--alert);
                   border-top: 1px solid var(--stamp); padding-top: 6px; }

      .prix { display: block; font-size: 10px; letter-spacing: .06em; margin-top: 4px;
              text-transform: uppercase; }
      .prix-payable   { color: var(--stock-dim); }
      /*
       * ⛑ S301 — **MÊME DIVISION, MÊME MESURE.** Un prix qu'on ne peut pas
       * payer est barré : *c'est la FORME qui dit le refus*, l'encre n'a qu'à
       * se laisser lire. Huit états : uniquement sur `rgb(31,27,22)`, jamais
       * sur du clair. `--stamp` **2,40** → `--alert` **5,09**.
       */
      .prix-impayable { color: var(--alert); text-decoration: line-through; }
      /* ⛑ S164 — `#6B6355` était une encre SOMBRE, choisie pour le carton beige
         du châssis. Le châssis parti, ces deux lignes se posent sur le bandeau
         sombre : elles prennent l'encre claire, sans quoi elles disparaissaient
         en même temps que le gris. */
      .card .prix-payable { color: #E6DCC4; }
      .quitte { display: block; margin-top: 2px; }
      .quitte-lbl  { font-weight: 700; letter-spacing: .1em; }
      .quitte-noms { text-decoration: line-through; }
      .card .quitte { color: #E6DCC4; }
      button .prix { pointer-events: none; }

      /*
       * ─── LA RÈGLE DU PLI — trois états, un seul déployé à la fois ────────
       *
       * PLIÉ (2 à 4 faits) · DÉPLOYÉ (tout, au clic) · ABSENT.
       * `UI_SPEC §5` dit « visibles SIMULTANÉMENT, tout le temps » — et
       * « visible » n'est pas « déplié ». La faute a coûté 49 lignes de tableau
       * sur les quatre joueurs, avec la tuile réduite à une case.
       */
      /*
       * **LE PLI S'OUVRE AU SURVOL.** `<details>` ne connaît que le clic et
       * n'anime rien — l'état existait, le geste n'existait pas.
       *
       * `grid-template-rows: 0fr → 1fr` s'anime SANS qu'on ait à connaître la
       * hauteur du contenu : c'est ce qui permet de plier des blocs de tailles
       * très différentes avec une seule règle.
       *
       * Le délai est à l'ENTRÉE seulement (80 ms, pour ne pas se déclencher au
       * passage du curseur) et **nul à la sortie** — un bloc qui traîne en se
       * refermant donne l'impression que l'écran colle.
       */
      .pli { border: 1px solid var(--rule); background: var(--ink-2); margin: 4px 0; }
      .pli-tete { cursor: pointer; padding: 5px 9px; display: flex; gap: 12px;
                  align-items: baseline; flex-wrap: wrap; user-select: none; }
      .pli-tete::before { content: "▸"; color: var(--slate); transition: transform .16s ease; }
      .pli:hover, .pli.verrouille { border-color: var(--stock-dim); }
      .pli-corps { display: grid; grid-template-rows: 0fr;
                   transition: grid-template-rows .18s ease; }
      .pli-corps > * { overflow: hidden; min-height: 0; }
      .pli:hover > .pli-corps { grid-template-rows: 1fr; transition-delay: 80ms; }
      .pli:hover > .pli-tete::before { transform: rotate(90deg); }
      /* Le VERROU : le survol ne le referme plus. Un second clic, oui. */
      .pli.verrouille > .pli-corps { grid-template-rows: 1fr; transition-delay: 0s; }
      .pli.verrouille > .pli-tete::before { transform: rotate(90deg); color: var(--stock); }
      .pli.verrouille > .pli-tete { border-bottom: 1px solid var(--rule); }
      /*
       * **UN SEUL DÉPLOYÉ À LA FOIS.** Survoler un bloc replie le verrouillé —
       * sinon deux blocs ouverts se disputeraient l'écran, ce que la règle du
       * pli existe pour empêcher.
       */
      body:has(.pli:hover) .pli.verrouille:not(:hover) > .pli-corps { grid-template-rows: 0fr; }
      /* Un bloc qui a une surface pleine le DIT : le curseur change, la tête s'allume. */
      .pli.a-plein > .pli-tete::after { content: "⤢"; color: var(--slate); margin-left: auto;
                                        font-size: 13px; }
      .pli.a-plein:hover > .pli-tete::after { color: var(--stock); }

      /*
       * ═══ LE PLEIN ÉCRAN — le troisième niveau ═══════════════════════════
       *
       * Maquette de Croze : *« si on clic dessus on arrive sur leur écran »*.
       * SURVOL = déploiement inline · CLIC = plein écran · et **il REND l'écran**
       * — clic ailleurs ou `Échap`. C'est la seconde moitié de la règle du
       * moment 3, appliquée ici : *pas de panneau qui reste posé.*
       */
      .plein { position: fixed; inset: 0; z-index: 950; display: grid; place-items: center;
               background: rgba(10, 8, 6, .82); padding: 24px; cursor: zoom-out;
               animation: fadein .14s ease; }
      .plein-boite { background: var(--ink-2); border: 2px solid var(--rule); cursor: default;
                     max-width: 1100px; width: 100%; max-height: calc(var(--uvh) * 88); overflow-y: auto;
                     animation: monte .18s var(--pop); }
      @keyframes monte { from { transform: translateY(14px) scale(.985); opacity: 0 }
                         to   { transform: none; opacity: 1 } }
      .plein-tete { display: flex; align-items: baseline; gap: 16px; padding: 12px 16px;
                    border-bottom: 1px solid var(--rule); position: sticky; top: 0;
                    background: var(--ink-2); }
      .plein-titre { font-family: var(--display); font-weight: 800; font-size: 26px;
                     letter-spacing: .02em; text-transform: uppercase; margin-right: auto; }
      /*
       * ─── ㉟ ③ · L'ONGLET OPTIONS ────────────────────────────────────────
       *
       * Il vit dans `.plein-boite` : aucune surface neuve, aucun z-index de
       * plus, et il rend l'écran par la même touche que tout le reste. Deux
       * colonnes fixes (le NOM, l'interrupteur) et une troisième qui s'étire
       * — l'état est la seule chose dont la longueur varie.
       */
      .opt { padding: 16px 20px 22px; display: flex; flex-direction: column; gap: 6px; }
      .opt-titre { font-family: var(--display); font-weight: 800; font-size: 15px;
                   letter-spacing: .10em; text-transform: uppercase; color: var(--stock-2);
                   margin-top: 14px; padding-bottom: 4px; border-bottom: 1px solid var(--rule); }
      .opt-titre:first-child { margin-top: 0; }
      .opt-ligne { display: flex; align-items: center; gap: 12px; padding: 6px 0; }
      .opt-nom { font-family: var(--display); font-weight: 700; font-size: 14px;
                 letter-spacing: .06em; min-width: 120px; }
      .opt-etat { color: var(--stock-2); font-size: 13px; }
      .opt-note { color: var(--stock-2); font-size: 12px; opacity: .8; max-width: 70ch; }
      /* S1249 · H-T2 étape 2 — Options : plus aucun bouton gris à bord fin.
         Case = la case PEINTE du kit (vide / cochée), le mot à côté ; les
         autres boutons du panneau = la plaque CONTOUR en trois tranches
         (bouts 100 | 90 px, comme l'écran titre) ; curseur = une piste peinte
         (le trait dense de `slider_full`, bouts au pinceau des deux côtés) et
         son bouton rond peint, découpés au S1249 dans la planche du kit. */
      .opt button { border: 0; border-style: solid; background: none; height: 34px;
        min-width: 94px; padding: 0 18px; color: #F2F2F2;
        border-image: url(art/hud/controls/button_outline.png) 0 90 0 100 fill / 0 8px 0 9px stretch; }
      .opt button.opt-case { border-image: none; min-width: 0; padding: 0 0 0 36px;
        background: url(art/hud/controls/checkbox_empty.png) left center / 26px 26px no-repeat; }
      .opt button.opt-case.coche { background-image: url(art/hud/controls/checkbox_checked.png); }
      .opt button:hover { color: #8B0D0D; }
      .opt button[disabled] { opacity: .32; }
      .opt-vol input[type="range"] { -webkit-appearance: none; appearance: none; height: 22px;
        background: none; border: 0; border-style: solid;
        border-image: url(art/hud/controls/slider_piste.png) 0 80 0 80 fill / 0 12px 0 12px stretch; }
      .opt-vol input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none;
        width: 24px; height: 26px; border: 0; cursor: pointer;
        background: url(art/hud/controls/slider_bouton.png) center / contain no-repeat; }
      .pli-titre { font-family: var(--display); font-weight: 700; font-size: 15px;
                   letter-spacing: .06em; text-transform: uppercase; }
      .pli-faits { display: flex; gap: 12px; flex-wrap: wrap; margin-left: auto; }
      .pli-faits .fait { font-size: 12px; color: var(--stock-2); }
      .pli-faits .quete { color: var(--gold); }

      /*
       * ─── LA CARTE DE TUILE — le centre du jeu, et c'était une case ───────
       *
       * Un rectangle avec le VRAI TEXTE dedans. Aucun asset : le nom résolu, la
       * table 1-6, l'interaction et son texte sont tous publiés. L'illustration
       * viendra dans un cadre qui se lit déjà (`ECRANS §14.4`).
       */
      .carte-tuile { border: 2px solid var(--rule); background: var(--ink-2);
                     padding: 12px 14px; margin: 8px 0; }
      .tuile-tête { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
      .tuile-nom { font-family: var(--display); font-weight: 800; font-size: 30px;
                   line-height: 1; letter-spacing: .02em; text-transform: uppercase; }
      .tuile-bloc { margin: 10px 0 0; }
      .tuile-lbl { font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
                   color: var(--stock-dim); display: block; margin-bottom: 3px; }
      /* La table d'exploration : six faces de dé, lisibles d'un coup d'œil. */
      .faces { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 4px; }
      .face { display: flex; gap: 8px; align-items: baseline;
              border: 1px solid var(--rule); padding: 3px 7px; background: var(--ink); }
      .face-n { font-family: var(--display); font-weight: 800; font-size: 17px;
                color: var(--stock); min-width: 14px; }
      .face-txt { font-size: 11px; color: var(--stock-2); }

      body { font: 14px/1.5 var(--mono); margin: 0; background: var(--ink); color: var(--stock); }
      h2 { font-size: 13px; margin: 10px 0 4px; border-bottom: 1px solid var(--edge); }
      h3 { font-size: 12px; margin: 6px 0 2px; }
      table { border-collapse: collapse; margin-bottom: 6px; }
      td, th { border: 1px solid var(--line); padding: 1px 5px; text-align: left; vertical-align: top; }
      th { color: var(--dim); font-weight: normal; }
      button {
        font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
        margin: 1px; background: transparent; color: var(--stock);
        border: 1px solid var(--stock-dim); padding: 7px 14px; cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: var(--stock); background: var(--ink-3); }
      button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
      button:disabled { color: var(--slate); border-color: var(--rule); cursor: not-allowed; }
      /*
       * ⛑ S1252 · H-T2 — LA PLAQUE PEINTE EN JEU (reco `Q-PLAQUE-EN-JEU`) : les
       * mêmes trois tranches que l'écran titre (S1248), découpes mesurées :
       * `button_solid` 1161 × 360, bouts 120 | 100 ; `button_outline` 1088 × 391,
       * bouts 100 | 90. Hauteur FIXE 44 px, donc des bouts à leur rapport exact
       * (solid 14,7 | 12,2 px ; outline 11,3 | 10,1 px) et une largeur MINIMALE
       * = la plaque à sa taille naturelle (142 / 122 px). Pleine = ce que le jeu
       * attend de toi MAINTENANT ; contour = les autres.
       */
      button.plaque {
        border: 0; border-style: solid; background: none; color: var(--ink);
        border-image: url(art/hud/controls/button_solid.png) 0 100 0 120 fill / 0 12.2px 0 14.7px stretch;
        height: 44px; min-width: 142px; padding: 0 22px;
        font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: .12em;
      }
      button.plaque.plaque-contour {
        color: var(--stock); min-width: 122px;
        border-image: url(art/hud/controls/button_outline.png) 0 90 0 100 fill / 0 10.1px 0 11.3px stretch;
      }
      button.plaque:hover:not(:disabled) { background: none; color: var(--rouge-vif); }
      button.plaque:disabled { opacity: .32; filter: grayscale(1); color: var(--ink); }
      button.plaque.plaque-contour:disabled { color: var(--stock); }
      /* ⛑ S1267 · H-T2 étape 12 (note 170 ① ⓐ) — les trois onglets de la bande
         (COMBAT · DUNGEON TIMER · ← LES COLONNES) en plaques. À 44 px et 142 px
         minimum, la bande passait sur DEUX lignes (51 → 109 px, mesuré à
         1920 × 1080 : le ruban tombait dessous). Plaque réduite à 36 px, bouts
         à leur rapport exact (solid 120|100 / 360 → 12 | 10 px ; outline
         100|90 / 391 → 9,2 | 8,3 px) : la bande tient sur une ligne, 53 px. */
      .onglets button.bt-bascule.plaque {
        min-width: 0; height: 36px; padding: 0 16px; font-size: 12px; letter-spacing: .1em;
        border-image-width: 0 10px 0 12px;
      }
      .onglets button.bt-bascule.plaque.plaque-contour { border-image-width: 0 8.3px 0 9.2px; }
      /* S1262 · H-T2 (Q-PLAQUE-ICONES) — un outil (⤢ agrandir) n'est pas une
         action de jeu : ni plaque ni cadre gris, l'icône seule, rouge au survol. */
      button.bouton-outil { border: 0; background: transparent; color: var(--stock); }
      button.bouton-outil:hover:not(:disabled) { background: transparent; color: var(--rouge-vif); }
      /* La couche debug garde des boutons SERRÉS : ils sont cent, pas cinq. */
      #debug button { font-size: 11px; letter-spacing: .04em; text-transform: none; padding: 1px 6px; }

      /*
       * ═══ LE REGISTRE DE LA MARGE — décision de Croze, close ═══════════════
       *
       * **La couche debug n'est pas une seconde peau : c'est LA MARGE DU
       * RELEVÉ.** Elle doit être VISIBLEMENT SUBORDONNÉE — si elle ressemble à
       * l'écran joueur, on perd la capacité de dire ce qu'un joueur voit, et
       * c'est toute la raison d'avoir refusé les deux onglets.
       *
       * ─── Un passage de JETONS, et rien d'autre ────────────────────────────
       *
       * Tout ce bloc ne fait que **redéfinir des variables dans `#debug`**. Pas
       * un composant neuf, pas une règle de mise en page, **pas une ligne du
       * rendu joueur touchée** : les mêmes classes, les mêmes éléments, servis
       * par d'autres valeurs. C'est ce qui garantit que la marge ne peut pas
       * diverger de l'écran — elle en est la copie au carbone, au sens propre.
       *
       * ─── LES DEUX SIGNAUX INTERDITS, ET POURQUOI ──────────────────────────
       *
       * **L'orange braise reste au Collapse. Le tampon rouge reste au refus.**
       * Les emprunter en marge ferait mal lire un vrai refus — exactement ce
       * qu'un mode admin doit rendre impossible. Ils sont donc neutralisés
       * ici : un refus affiché en marge est gris, parce que **la marge
       * enregistre, elle ne signale pas.**
       *
       * ─── Courier seul ─────────────────────────────────────────────────────
       *
       * **Big Shoulders est la voix du jeu.** `--display` retombe sur `--mono`,
       * et les vingt endroits qui l'utilisent suivent sans être touchés — un
       * nom, un geste. La marge n'a pas de voix : elle a une machine à écrire.
       */
      #debug {
        /* Le carbone : plus froid et plus gris que le carton joueur. */
        --ink:       #14161A;
        --ink-2:     #1A1D22;
        --ink-3:     #22262C;
        --stock:     #AEB4BC;
        --stock-2:   #99A0A8;
        --stock-dim: #767D86;
        --rule:      #333940;
        /* LES DEUX INTERDITS, neutralisés à la source. */
        --ember:     #7C8894;
        --stamp:     #6E767F;
        --alert:     #8A9099;
        /*
         * ② **LE VERT SUIT LES INTERDITS, et il fallait le poser ICI aussi.**
         * `#debug .abil` existe (voir plus bas) : sans cette ligne, le seul
         * signal chaud de la marge aurait été un vert — la marge n'a pas de voix,
         * et un jeton neuf hérité du joueur lui en donne une sans qu'on l'ait
         * décidé. *Neutraliser à la source est le geste, pas une exception par
         * sélecteur.*
         */
        --activable: #6E767F;
        /* Courier seul. */
        --display:   var(--mono);
        /* Les alias de l'ancienne couche suivent, sinon ils gardent le chaud. */
        --bg: var(--ink); --panel: var(--ink-2); --raised: var(--ink-3);
        --dim: var(--stock-dim); --line: var(--rule); --edge: var(--rule);

        background: var(--ink);
        color: var(--stock);
        border-top: 2px dashed var(--rule);
        margin-top: 28px;
        padding: 10px 18px 40px;
      }
      /* Une marge n'a pas de titres de jeu : tout y a la même taille. */
      #debug h2, #debug h3 { font-family: var(--mono); font-size: 11px; font-weight: 700;
                             letter-spacing: .18em; text-transform: uppercase;
                             color: var(--stock-dim); border-bottom: 1px solid var(--rule); }
      /* Le papier est plus mat : rien ne saille dans la marge. */
      #debug .card, #debug .abil { box-shadow: none; }
      #debug .card:hover { transform: none; box-shadow: none; }

      /*
       * **LE BANDEAU ADMIN NE DÉFILE PAS.** *Une capture d'écran ne doit jamais
       * être ambiguë* — donc il est `fixed`, pas `sticky` : un `sticky` dans
       * `#debug` disparaîtrait dès qu'on cadre la zone ①, et c'est précisément
       * la capture qui prêterait à confusion.
       *
       * Il vit sur `body.avec-debug::before`, **donc sans une ligne de DOM en
       * plus** : le drapeau est déjà posé sur `body` par `render()`. Le
       * `padding-top` compense la hauteur du bandeau et **ne s'applique qu'en
       * mode admin** — l'écran joueur seul n'a rien qui le décale.
       */
      /*
       * ⛑⛑ **S851 — LA HAUTEUR DE CETTE BANDE EST UN JETON, PARCE QU'UNE
       * SECONDE RÈGLE DOIT LA SOUSTRAIRE.** Elle était écrite en dur ici et
       * nulle part ailleurs ; `.ouv-deux-blocs` réclamait `100vh` **dans un
       * corps déjà décalé de cette bande**, donc débordait d'exactement 22 px
       * — et le bas de l'OUVERTURE passait sous les portes fixes du coin.
       * *Un `100vh` dans un corps rembourré déborde du rembourrage, en
       * silence.*
       */
      :root { --bande-debug: 22px; }
      /*
       * ⛑⛑ **S851 — ET LA BANDE DES PORTES EN EST UNE AUSSI.** Les trois
       * portes du coin (`.porte-options`, `.porte-rapport`) sont `fixed`,
       * `bottom: 0`, hautes de 20 px : elles tapissent **les 20 derniers
       * pixels de la fenêtre, sur toute la vie de la page**. Une mise en page
       * qui prend `100vh` pose donc sa dernière rangée SOUS elles.
       *
       * ⚠ **ET LA MARGE DE 2 px N'EST PAS DÉCORATIVE.** Premier correctif :
       * je n'avais soustrait que `--bande-debug`, et la mesure rendait
       * `100 %` atteignable à 1920×1080 — **par 1 px**. À 1440×900, les mêmes
       * boutons retombaient à `92 %` et `84 %`. *Une correction éprouvée à une
       * seule taille mesure cette taille-là*, et une mise en page
       * proportionnelle ne garantit rien contre une bande en PIXELS.
       */
      :root { --bande-portes: 22px; }
      body.avec-debug { padding-top: var(--bande-debug); }
      body.avec-debug::before {
        content: "ADMIN · ?debug=1 · CE N'EST PAS L'ÉCRAN DU JOUEUR";
        position: fixed; top: 0; left: 0; right: 0; z-index: 999;
        background: #22262C; color: #AEB4BC;
        border-bottom: 1px solid #333940;
        font: 700 10px/22px "Courier Prime", "Courier New", monospace;
        letter-spacing: .28em; text-align: center; text-transform: uppercase;
        pointer-events: none;
      }
      input {
        font: inherit; background: var(--panel); color: var(--stock);
        border: 1px solid var(--edge); padding: 1px 4px;
      }
      .cols { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
      .col { min-width: 260px; }
      #log {
        height: 240px; overflow-y: scroll; border: 1px solid var(--line);
        padding: 4px; background: var(--panel);
      }
      .me { background: var(--raised); }
      .err { color: var(--alert); white-space: pre-wrap; }
      .decision { border: 1px solid var(--rule); padding: 8px 10px; margin: 6px 0; background: var(--ink-2); }
      .muted { color: var(--dim); }
      /*
       * ⛑ S1192 · ANNULER — **UN RETRAIT, PAS UNE ACTION.** Il ferme la
       * question sans rien engager : il ne doit donc jamais avoir l'aplomb des
       * boutons qui, eux, jouent quelque chose. Discret, en retrait, et
       * TOUJOURS le dernier de la boîte — c'est le « même endroit » de la
       * note 143 ①, et le seul qui le reste quand le nombre de boutons
       * au-dessus change d'une scène à l'autre.
       *
       * ⚠ Aucune unité de FENÊTRE ici (`vw`/`vh` nus) : le verrou de 1080.
       */
      .annuler-declaration {
        display: block; margin: 10px 0 0; padding: 4px 10px;
        background: transparent; color: var(--dim);
        border: 1px solid var(--rule); font-size: 13px;
      }
      .annuler-declaration:hover { color: var(--stock); border-color: var(--stock); }
      /* Le dernier jet : c'est ce qu'on vient lire quand un résultat surprend. */
      .roll { font-size: 14px; color: var(--stock); padding: 2px 0; }

      /*
       * ─── LE MOMENT PREND LE CADRE, IL NE DÉPLACE RIEN ──────────────────
       *
       * `.prompt` est la MÊME boîte que `.decision` — `renderDecision` n'a pas
       * changé de forme, elle a reçu une classe de plus. C'est ce qui garantit
       * qu'un moment ne remet pas la page en page : il remplit un cadre qui
       * était déjà là, à sa place dans la zone ②.
       */
      .prompt { border: 2px solid var(--ember); background: linear-gradient(var(--ink-2), var(--ink));
                padding: 12px 16px; margin: 0 0 12px; }
      .prompt h3 { font-family: var(--display); font-weight: 800; font-size: 26px;
                   letter-spacing: .02em; text-transform: uppercase; line-height: 1.05;
                   margin: 0 0 4px; color: var(--stock); }
      .prompt .rien { font-size: 11px; color: var(--slate); font-style: italic; }

      /*
       * ═══ ⚑ S171 — LA FENÊTRE DE PRIORITÉ : LA PHRASE, PUIS LE REBOURS ═════
       *
       * Ordre de Croze : *l'info d'abord, l'action ensuite.* Le titre porte la
       * phrase, la sous-ligne dit ce que « passer » fera, le jeton brut reste
       * en petit pour le débogage, et le rebours se glisse entre les deux et
       * les boutons.
       */
      .fen-titre { font-family: var(--display); font-weight: 800; font-size: 24px;
                   letter-spacing: .02em; text-transform: uppercase; line-height: 1.05;
                   margin: 0 0 4px; color: var(--stock); }
      .fen-sous { font-size: 13px; color: var(--dim); margin: 0 0 8px; }
      .fen-jeton { font-size: 10px; color: var(--slate); letter-spacing: .04em; }
      /* S1352 · note 201 ① — « TU REÇOIS 8 DMG DU COLLAPSE » puis « VEUX-TU RÉAGIR ? ». */
      .fen-recois { display: flex; align-items: center; gap: 16px; margin: 0 0 6px; }
      .fen-recois-titre { margin: 0; font-size: 26px; }
      .fen-recois-n { font-size: 56px; color: var(--rouge-vif); vertical-align: -6px;
                      padding: 0 2px; }
      .fen-recois-visuel.die { flex: 0 0 auto; }
      .fen-recois-visuel.fen-mob-art { width: 96px; }
      .fen-reagir { font-family: var(--display); font-weight: 800; font-size: 18px;
                    letter-spacing: .04em; color: var(--stock); margin: 2px 0 8px; }
      .sig-carte { display: flex; flex-direction: column; justify-content: space-between;
                   flex: 0 0 auto; width: 120px; min-height: 160px; padding: 10px 8px;
                   border: 2px solid var(--stock); border-radius: 6px; background: var(--ink);
                   color: var(--stock); text-align: left; cursor: pointer; }
      .sig-carte-tag { font-size: 9px; letter-spacing: .12em; color: var(--dim); }
      .sig-carte-nom { font-family: var(--display); font-weight: 800; font-size: 17px;
                       text-transform: uppercase; line-height: 1.05; }
      .sig-carte-cout { font-size: 12px; font-weight: 700; color: var(--stock); }

      /*
       * ⛑ S179 — le tampon de build. Minuscule, en bas à droite, non
       * sélectionnable au clic : il répond à une question, il n'en pose aucune.
       */
      .tampon-build { position: fixed; right: 6px; bottom: 4px; z-index: 5;
                      font-family: var(--mono); font-size: 9px; color: var(--slate);
                      opacity: .55; pointer-events: auto; letter-spacing: .02em; }

      /*
       * ⛑ S178 — l'indicateur du « tout passer ». `sig-etat` n'a jamais eu de
       * règle à lui (les jetons `state`/`rien` portent tout) : celle-ci ne fait
       * que ranger la ligne, sans inventer une couleur de plus.
       */
      .tout-passe { display: flex; gap: 8px; align-items: baseline;
                    flex-wrap: wrap; margin: 4px 0 0; }

      /*
       * ⛑ S177 — L'ALARME, ET ELLE PASSE AVANT LA PHRASE.
       *
       * ⚠ **NI L'EMBER NI LE VERT.** L'ember appartient au Collapse (règle
       * gravée) et le vert est ce qui est JOUABLE ; une alarme n'est ni l'un
       * ni l'autre. Elle prend `--alert`, le tampon — le seul jeton de la
       * palette dont le métier est d'arrêter l'œil.
       *
       * ⚠ **Un filet, pas un aplat.** Un bloc plein de tampon ferait lire la
       * fenêtre entière comme un refus, alors qu'elle demande une RÉPONSE.
       */
      .fen-alarme { border-left: 3px solid var(--alert); padding: 2px 0 2px 8px;
                    margin: 0 0 6px; }
      .fen-alarme-l { font-family: var(--display); font-weight: 800; font-size: 15px;
                      letter-spacing: .04em; text-transform: uppercase;
                      color: var(--alert); line-height: 1.15; }

      /* La charge du déclencheur — le « pour quoi ». Sous la phrase, en petit. */
      .fen-detail { display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline;
                    margin: 0 0 8px; }
      .fen-detail-qui { font-size: 12px; color: var(--stock-2); }
      .fen-detail-v { font-family: var(--mono); font-size: 11px; color: var(--dim); }
      .fen-detail-trou { font-size: 10px; color: var(--slate); font-style: italic; }
      /*
       * ═══ ⛑⛑ S1113 · R3 — LA CARTE DU MOB DANS LA FENÊTRE DE RÉACTION ══════
       *
       * `PLAN_SEQUENCEMENT R3` : *« la carte du mob est à l'écran quand on te
       * demande de réagir à son coup »*. Elle est COMPACTE par obligation —
       * `.mobcard` fait `333 × 769` et le panneau entier de la fenêtre mesure
       * `403 px` : la carte pleine chasserait les boutons de réponse hors du
       * cadre.
       *
       * ⚠ **AUCUNE UNITÉ DE FENÊTRE (`vw`/`vh`) ET AUCUNE `@media`.** Le
       * verrou de 1080 refuse les deux, et une requête de média lit la FENÊTRE
       * et jamais la composition : sous verrou c'est un re-flow **par
       * construction** (`verrou_1080.js`, bloc ②).
       *
       * ⚠ **NI `object-fit`, NI RECADRAGE.** Le fichier est la carte IMPRIMÉE
       * entière (`1024 × 1536`) : la recadrer couperait ses lignes d'attaque.
       * C'est la forme de `.mc-img`, reprise telle quelle — largeur pleine,
       * hauteur libre.
       */
      .fen-mob { display: flex; gap: 12px; align-items: flex-start;
                 border-left: 3px solid var(--rule); padding: 4px 0 4px 8px;
                 margin: 0 0 8px; }
      .fen-mob-art { flex: 0 0 auto; width: 150px; }
      .fen-mob-img { display: block; width: 100%; height: auto; }
      .fen-mob-dit { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .fen-mob-nom { font-family: var(--display); font-weight: 800; font-size: 16px;
                     letter-spacing: .02em; text-transform: uppercase;
                     line-height: 1.1; color: var(--stock); }
      .fen-mob-pv { font-size: 13px; color: var(--stock-2); }
      .fen-mob-att { font-size: 13px; color: var(--dim); }
      .fen-mob-tx { font-size: 12px; color: var(--dim); font-style: italic; }
      .fen-mob-passif { font-size: 12px; color: var(--slate); }


      /*
       * ⚠ **LE REBOURS N'EMPRUNTE NI L'EMBER NI LE ROUGE.** L'ember appartient
       * au Collapse et le rouge est le refus ; un compte à rebours n'est ni
       * l'un ni l'autre. Il prend le vert jouable — c'est un délai POUR JOUER,
       * et il s'éteint tout seul.
       *
       * ⚠ **`transition` INTERDITE sur la jauge.** Elle est PEINTE à chaque
       * tic depuis une échéance qui vit dans le module : une transition la
       * ferait glisser en retard, et un redessin la relancerait — c'est
       * exactement le défaut du S166.
       */
      .reb { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; flex-wrap: wrap; }
      .reb-tx { font-size: 12px; color: var(--dim); letter-spacing: .03em; }
      .reb-sec { font-family: var(--display); font-weight: 800; font-size: 20px;
                 color: var(--activable); min-width: 44px; }
      .reb-piste { flex: 1 1 160px; height: 6px; background: var(--rule); overflow: hidden; }
      .reb-jauge { height: 100%; background: var(--activable);
                   transform-origin: left center; transform: scaleX(1); }
      .reb-off { font-size: 11px; color: var(--slate); font-style: italic; }
      /* E-T3 — la PAUSE : le bouton à côté du délai, la réserve qui descend,
         et le bandeau « X réfléchit » que toute la table voit. */
      .reb .pause-bouton { flex: 0 0 auto; font-weight: 800; letter-spacing: .06em; }
      .reb-en-pause .reb-sec { color: #fff; }
      .pause-autre { position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
                     z-index: 9000; padding: 8px 18px; background: rgba(0,0,0,.88);
                     border: 2px solid #fff; color: #fff; font-family: var(--display);
                     font-weight: 800; font-size: 20px; letter-spacing: .06em;
                     pointer-events: none; }

      /*
       * ⚑ S174 — le compte des gestes SAUTÉS, sur le bloc qui montre la scène.
       * Discret : il ne dispute pas la vedette à la carte, mais il est là —
       * *jamais d'écrasement muet* (doctrine de file S125).
       */
      .tv-scene-saut { font-size: 10px; color: var(--slate); letter-spacing: .04em;
                       font-style: italic; }
      /*
       * ⛑ S193 — **LES GESTES AVALÉS SE NOMMENT.** Le compte disait qu'il y
       * avait eu quelque chose ; la ligne dit QUOI. Elle reste dans la matière
       * du saut — discrète, en retrait — parce qu'elle raconte ce qui est
       * DÉJÀ passé : elle ne dispute pas la vedette à la scène en cours.
       */
      .tv-saut-ligne { padding-left: 8px; border-left: 1px solid var(--rule);
                       font-style: normal; color: var(--stock-dim); }

      /* ② LE RELEVÉ — une ligne, un filet, et le temps à gauche. */
      .fil { border: none; background: transparent; padding: 12px 0 16px;
             display: flex; flex-direction: column; gap: 9px; }
      .fil > div { padding: 0 0 0 12px; border-left: 2px solid var(--rule); }
      .fil > div.roll { border-left-color: var(--stock-dim); }
      .fil > div.err { border-left-color: var(--stamp); }

      /*
       * ⚑ **S380 — LA NOTE POUR QUI RÉPARE (`M-S378`), ET ELLE NE PARAÎT QUE
       * SOUS `?debug=1`.** Fermée, elle ne coûte qu'une ligne ; ouverte, elle
       * rend la note du moteur INTACTE (jusqu'à 1 238 caractères). Elle ne
       * prend aucune teinte réservée — ce n'est pas un fait de jeu, c'est
       * l'atelier : `--slate`, la même encre que les autres textes de service.
       */
      .fil .note-repare { margin: 3px 0 0; font-size: 12px; color: var(--slate); }
      .fil .note-repare > summary { cursor: pointer; opacity: .75; }
      .fil .note-repare > div { margin-top: 4px; padding-left: 10px;
                                border-left: 1px solid var(--rule); line-height: 1.45;
                                white-space: pre-wrap; }

      /*
       * ─── MOMENT 3 : TROIS NOMBRES, TROIS CADRES ──────────────────────────
       *
       * `ECRANS.md` moment 3 : « la face nue atterrit seule · le modificateur
       * arrive après, DANS UN CADRE SÉPARÉ · le total se tamponne en dernier ».
       *
       * Ce ne sont pas trois morceaux d'une phrase, ce sont **trois faits que
       * des règles différentes lisent** : `FACE:`/`NAT:`/`SET_DIE` lisent la
       * face, `GTE:`/`LTE:` lisent le total. `Wild Swing` du Golmon portait
       * `FACE:1-14` en face d'un `GTE:15` et les deux moitiés d'un « sinon »
       * s'appliquaient ensemble. Une phrase les met sur la même ligne de
       * lecture ; trois cadres les rendent impossibles à confondre.
       *
       * La mise en scène dans le TEMPS — les trois qui arrivent l'un après
       * l'autre — n'a aucune surface ici : le fil est un journal, tout y est
       * déjà arrivé. Elle attend l'écran de jeu. C'est écrit dans AUDIT_ECRAN.
       */
      .jet { display: inline-flex; gap: 0; align-items: stretch; vertical-align: middle;
             margin: 0 2px; }
      .jet > span {
        border: 1px solid var(--edge); padding: 0 5px; font-size: 13px;
        display: inline-flex; align-items: center;
      }
      .jet > span + span { border-left: none; }
      .jet .quoi   { color: var(--dim); font-size: 11px; background: var(--bg); }
      /*
       * La face NUE : celle sur laquelle les cartes agissent.
       *
       * ⛑ S536 — elle était `#ffd479`, **le jaune que la note 55 nomme**. Sous
       * la loi des trois valeurs, les trois parts d'un jet ne se distinguent
       * plus par TROIS TEINTES mais par leur RANG : la face nue est le chiffre
       * que les cartes touchent → l'ACCENT ; le modificateur est un
       * commentaire → l'atténué ; le total est ce que les seuils lisent → le
       * blanc plein, et il porte déjà son liseré de 2 px.
       */
      .jet .face   { color: var(--rouge-vif); font-weight: bold; background: var(--raised); }
      /* Le modificateur : à part, jamais fondu dans la face ni dans le total. */
      .jet .mod    { color: var(--stock-dim); background: var(--panel); }
      /* Le total : celui que lisent les seuils. Tamponné en dernier. */
      .jet .total  { color: var(--stock); font-weight: bold; background: var(--raised);
                     border-width: 2px; }
      .jet .seuil  { color: var(--dim); background: var(--bg); }
      .jet .rang   { color: var(--dim); font-size: 11px; background: var(--bg); }
      .jet .vs     { color: var(--dim); border: none; padding: 0 6px; font-weight: bold; }
      /*
       * LA SÉRIE OPPOSÉE — un adversaire par ligne, les DEUX dés côte à côte.
       * `.vs` et `.rang` sont portés hors d'un `.jet` ici : ils sont repris tels
       * quels, sinon le `VS` d'une série se lirait autrement que celui d'une
       * fuite, et **deux grammaires pour un dé feraient lire deux dés.**
       */
      .jet-duel { display: flex; align-items: center; flex-wrap: wrap; gap: 4px;
                  padding: 2px 0 2px 12px; }
      .jet-duel > .rang { color: var(--dim); font-size: 11px; min-width: 62px; }
      .jet-duel > .vs   { color: var(--dim); padding: 0 6px; font-weight: bold; }
      .jet-duel > .refus { color: var(--alert); font-weight: bold; }

      /*
       * ═══ LA FENÊTRE DE MOMENT — UNE SURFACE, TROIS CONTENUS ══════════════
       *
       * Aucun cadre neuf : `combat-fenetre` sert les trois. Ce qui suit ne
       * style que ce que le combat n'avait pas — la FILE et les deux corps.
       *
       * ⚠ La file est affichée MÊME VIDE, comme la bande des obligations : un
       * repère qui n'apparaît qu'en cas de problème ne se lit pas quand il
       * apparaît, parce qu'on ne l'a jamais vu à sa place.
       */
      .cf-file { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px;
                 padding: 3px 10px; border-bottom: 1px solid var(--rule);
                 font-size: 11px; }
      .cf-file.on { background: var(--ink-3); }
      .moment-piege, .moment-coffre { padding: 8px 10px; }
      .moment-degats { display: flex; flex-direction: column; gap: 3px;
                       margin-top: 8px; padding-top: 6px;
                       border-top: 1px solid var(--rule); }
      /* Une perte de PV : le montant tamponné, la source et l'auteur à côté. */
      .perte { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px;
               padding: 2px 0; }
      .perte > .rang { color: var(--dim); font-size: 11px; }
      /* ⛑ S244 — 11 px : le petit corps prend `--alert` (2,40 → mesuré après). */
      .perte-montant { color: var(--alert); font-weight: 800; }
      /*
       * LE CALCUL DU COUP — faits 48 et 49. Les dés avec leur expression, puis
       * la chaîne dans l'ordre où le moteur l'applique. Le zéro dit sa cause,
       * et les deux causes sont séparées : `immune` est un court-circuit
       * d'école, un `×0` est une multiplication.
       */
      .perte-calcul { display: flex; flex-direction: column; gap: 1px;
                      padding: 2px 0 4px 14px; }
      .calc-jet    { font-size: 10px; color: var(--stock-2); }
      .calc-chaine { font-size: 10px; color: var(--stock-dim); letter-spacing: .04em; }
      .calc-zero   { font-size: 10px; font-weight: 800; color: var(--stock);
                     letter-spacing: .1em; }

      /*
       * LE LOG DE COMBAT — tout le combat, séparé par ROUND. L'en-tête n'est
       * pas compté par l'écran : il est lu sur `COMBAT_TURN_BEGAN`.
       */
      .cf-round { font-size: 9px; letter-spacing: .2em; text-transform: uppercase;
                  color: var(--stock-dim); border-top: 1px solid var(--rule);
                  margin-top: 6px; padding-top: 4px; }
      .cf-round.on { color: var(--stock); font-weight: 800; }
      /*
       * LE ROUND COURANT, ANNONCÉ EN PERMANENCE — Croze : « je n'ai pas le
       * round ». L'en-tête n'était posé qu'au CHANGEMENT de numéro : sur un
       * combat qui ne dépasse pas son premier round, rien ne sortait jamais.
       *
       * L'animation se rejoue sur le seul changement de `data-round`, sans
       * qu'aucun état d'écran ne retienne le round précédent.
       */
      .cf-round-actuel { margin-left: 10px; padding: 1px 8px; font-weight: 800;
                         background: var(--stock); color: var(--ink);
                         letter-spacing: .16em; animation: round-entre .5s var(--pop); }
      @keyframes round-entre {
        from { opacity: 0; transform: translateY(-6px) scale(.86); }
        to   { opacity: 1; transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        .cf-round-actuel { animation: none; }
      }
      .cf-parade { margin-top: 8px; padding-top: 6px;
                   border-top: 1px solid var(--rule); }
      /*
       * MES QUÊTES — colonne gauche, à la suite. Elles reviennent à la demande
       * de Croze, et le panneau DIT que rien ne peut s'accomplir : 13 conditions
       * distinctes, aucun évaluateur au moteur.
       *
       * ⚠ **`ACCOMPLIE` n'emprunte AUCUNE teinte réservée** — l'or est la
       * sortie, l'orange le Collapse, le rouge le refus. Une quête faite se
       * distingue par la GRAISSE et un liseré neutre : *un jeton par FAIT, pas
       * par teinte.*
       */
      .quetes { padding-bottom: 10px; }
      .quete { padding: 5px 18px; border-top: 1px solid var(--rule);
               display: flex; flex-wrap: wrap; align-items: baseline; gap: 7px; }
      .quete-nom { font-family: var(--display); font-weight: 800; font-size: 13px;
                   text-transform: uppercase; letter-spacing: .06em; }
      .quete-texte { flex: 1 0 100%; font-size: 11px; line-height: 1.45;
                     color: var(--stock-2); }
      .quete.faite { border-left: 2px solid var(--stock); }
      .quete.faite .quete-nom { color: var(--stock); }

      /* LE REGISTRE DES PERTES — une lecture du journal, pas un second journal. */
      .registre { margin-top: 10px; }
      .registre-corps { display: flex; flex-direction: column; gap: 2px; }
      .registre-cloture { display: flex; flex-wrap: wrap; align-items: baseline;
                          gap: 6px; padding: 3px 0; border-top: 1px solid var(--rule); }
      .verdict { font-weight: bold; margin-left: 6px; }
      .verdict.ok   { color: #7fe3a0; }
      .verdict.ko   { color: var(--alert); }
      .verdict.crit { color: #ffd479; }

      /*
       * ─── LE MOTIF DE REFUS : AU SURVOL, JAMAIS EN PERMANENCE ─────────────
       *
       * `ECRANS.md §3`, décision close : « toujours affiché, ça capte trop
       * l'attention et ça noie le joueur ». La carte reste GRISÉE en
       * permanence — c'est le fait —, seule la RAISON se replie.
       *
       * Le porteur garde `title` : la raison reste atteignable au clavier et
       * aux lecteurs d'écran, que `:hover` seul laisserait dehors.
       */
      /*
       * **LE MOTIF NE SE REPLIE PLUS.** Il était en `display: none` jusqu'au
       * survol : la ligne disait *« ⊘ équiper »* et rien d'autre, donc un refus
       * qu'il fallait DÉCOUVRIR. *Muette ne veut pas dire absente, ça veut dire
       * non lue.* Le survol ne fait plus qu'ÉCLAIRCIR — il est un complément.
       */
      .porte-refus .refus { display: inline; color: #8C5A54; font-size: 10px; }
      .porte-refus:hover .refus, .porte-refus:focus-within .refus { color: var(--alert); }
      .porte-refus:hover > .grise, .porte-refus:focus-within > .grise { opacity: 1; }
      .refus { color: var(--alert); }
      .grise { opacity: .45; }
      .tampon {
        color: var(--alert); border: 1px solid var(--alert); border-radius: 2px;
        padding: 0 4px; margin-left: 6px; font-size: 11px;
      }

      /*
       * ─── LES DEUX ÉTATS D'ÉCRAN, ET IL N'Y EN A QUE DEUX ─────────────────
       *
       * `ECRANS.md §1` : la bascule est la différence entre AGIR et RÉAGIR, et
       * elle est déjà dans les règles. `pendingDecision !== null` la porte
       * entièrement — aucun fait du moteur ne manque, c'est pour ça qu'elle
       * passe avant tout le reste du moment 1.
       *
       * TON TOUR : la tuile est GRANDE, le relevé se tasse.
       * UN MOMENT : la fenêtre prend le CENTRE ; gauche, droite et la rangée
       * des autres sièges restent.
       *
       * ⚠ **CE BLOC DISAIT « RIEN NE DISPARAÎT JAMAIS : ce qui recule se
       * replie dans un `<details>` », ET C'ÉTAIT FAUX DEUX FOIS.** Le
       * `<details>` n'a jamais eu d'appelant (voir `sectionRepliable`, retirée),
       * et depuis S18 — arbitrage de Croze — le centre n'est pas replié, il est
       * **REMPLACÉ**. Ce qui vivait dedans et devait survivre a été re-parenté,
       * un bloc à la fois : `lesChoix` + `zoneAgir` dans les trois surfaces
       * modales, `laTable` dans la colonne droite. *Une phrase rassurante qui
       * n'est plus vraie coûte plus cher qu'une phrase absente : elle dispense
       * d'aller vérifier.*
       */
      body.moment #log { height: 120px; }
      body.tour   #log { height: 240px; }
      /* Le relevé prend la place pendant un moment, et se tasse pendant le tour. */
      body.moment .fil { max-height: 420px; overflow-y: auto; border-color: var(--edge); }
      body.tour   .fil { max-height: 180px; overflow-y: auto; }
      /*
       * ⛑⛑ **S988 — CES DEUX RÈGLES PLAFONNAIENT AUSSI LE FIL D'UNE SCÈNE, ET
       * C'EST LA CAPTURE QUI L'A MONTRÉ.**
       *
       * L'arène du spectateur demande **quarante** lignes (`arèneSpectateur`,
       * `max: 40`), et son commentaire écrit noir sur blanc *« celle de l'arène
       * en tient 40 et respire »*. Mesuré sur `?etat=pvp-frappe&siege=Joueur 3`,
       * 1920 × 1080, peau JOUEUR :
       *
       * ```
       * body            « tour »          → le fil hérite de max-height: 180px
       * .arene-spec .fil  178 px visibles pour 223 px de contenu (7 lignes)
       * .plein-boite      391 px de haut … pour un plafond de 950 px
       * ```
       *
       * La scène flotte donc au centre d'un voile où **689 px sont vides**,
       * pendant que le récit du duel — la seule chose qu'un absent vienne y
       * lire — est coupé sous une barre de défilement. Le plafond n'est pas
       * une décision de la scène : c'est celui de la COLONNE de la page qui
       * dort dessous, et `body.tour` s'applique partout.
       *
       * ⚑ **Le commentaire de `arèneSpectateur` ne vieillissait pas, il
       * MENTAIT** (㉝) : il décrit un COMPORTEMENT — *« elle en tient 40 »* —
       * qu'aucun chiffre ne datait, donc que personne ne relisait. Et le DOM
       * ne pouvait pas le démentir : les quarante lignes ÉTAIENT dans le nœud,
       * `--dump-dom` les voyait toutes. *Il a fallu regarder l'image.*
       *
       * La scène pose donc son propre plafond, plus spécifique que `body.tour`
       * (`.plein` le porte, 0,3,0 contre 0,2,1) et exprimé en `vh` : elle
       * grandit avec ce qu'elle a à dire, sans jamais dépasser la boîte.
       */
      .plein .arene-spec .fil { max-height: calc(var(--uvh) * 56); }
      /*
       * ⛑ S1236 · P3-T2ter — *« …je vois les deux camps face à face, sans
       * aucune question, et un bouton me ramène à la table. »* Sur la nouvelle
       * table l'arène empilait les deux camps en COLONNE, et la barre de vie
       * peinte (sa hauteur suit sa largeur, H-T1) prenait les 1 080 px de
       * l'arène : 111 px de haut chacune, mesuré sur `pvp-frappe`. Les deux
       * camps se font face, 420 px chacun. `:has(.bar.peinte)` : la barre
       * peinte n'existe que sur la nouvelle table — l'ancien écran ne reçoit
       * rien.
       */
      .plein .arene-spec .siege-combat:has(.bar.peinte) {
        flex-direction: row; flex-wrap: wrap; justify-content: center;
        align-items: flex-end; column-gap: 64px;
      }
      .plein .arene-spec .siege-combat:has(.bar.peinte) > .siege-lbl { flex-basis: 100%; }
      .plein .arene-spec .siege-combat:has(.bar.peinte) > .vital { flex: 0 1 420px; }
      /*
       * ⚙ **S46 — LES QUATRE RÈGLES `.recule` SONT PARTIES AVEC LEUR FONCTION.**
       * `sectionRepliable` était sans appelant depuis longtemps ; ces règles
       * l'attendaient. *Un style qui attend un élément que rien ne produit se
       * lit comme un élément qui existe.*
       */
      /* Le bandeau d'état : il DIT dans lequel des deux on est. */
      .mode {
        display: inline-block; padding: 0 6px; margin-right: 8px;
        border: 1px solid var(--edge); font-weight: bold;
      }
      body.moment .mode { color: var(--stock); border-color: var(--stock); }
      body.tour   .mode { color: var(--rouge-vif); border-color: var(--rouge-vif); }
      /*
       * **LE TROISIÈME ÉTAT — le séquenceur attend QUELQU'UN D'AUTRE.**
       *
       * Ni le vert d'« j'agis » ni l'ambre de « je réagis » : ce siège n'a rien
       * à faire, et la couleur doit le dire avant le texte. Éteint, comme
       * `.demande-titre.attente`.
       *
       * La règle porte `body.X` EN PLUS de `.attente` — sans ça elle aurait la
       * même spécificité que les deux au-dessus et perdrait sur l'ordre. Le vert
       * de `body.tour` resterait allumé sous un texte qui dit le contraire :
       * exactement le mensonge qu'on vient de retirer, repeint.
       */
      body.moment .mode.attente,
      body.tour   .mode.attente { color: var(--stock-dim); border-color: var(--rule); }
      /* Les outils de debug se distinguent : ils ne passent par aucune règle. */
      .tools {
        border: 1px dashed var(--edge); padding: 4px; margin: 4px 0;
        background: var(--panel); color: var(--dim);
      }
      /* Une couleur par siège, pour s'y retrouver. Aucune règle n'en dépend. */
      .col { border-left: 5px solid transparent; padding-left: 6px; }
      .p-name { font-weight: bold; }

      /*
       * ─── LA BARRE D'ACTION ────────────────────────────────────────────────
       *
       * Elle ne colle pas en haut par coquetterie. Mesuré deux fois, le même
       * jour, des deux côtés : Croze doit remonter EN HAUT pour changer de
       * siège et redescendre TOUT EN BAS pour trouver où cliquer, et la
       * désignation de cible vivait après SEPT panneaux. Deux de ses trois
       * derniers « bugs » étaient des boutons qu'il ne trouvait pas.
       *
       * Un playtesteur qui scrolle entre deux clics remonte du bruit à la place
       * des défauts. C'est l'instrument de mesure du projet, pas du confort.
       */
      .barre {
        position: sticky; top: 0; z-index: 10;
        background: var(--panel); border: 2px solid var(--edge);
        padding: 4px 6px; margin: 0 0 8px;
        box-shadow: 0 6px 12px -6px #000;
      }
      .barre h3 { margin: 4px 0 2px; color: var(--dim); }
      .barre .rien { color: var(--dim); font-style: italic; }
      /*
       * §7.2 — le rang de nombres d'une consultation secrète. Il peut être long
       * (`SECRET_NUMBER(1,20)` est grammaticalement valide) : il enveloppe, il
       * ne déborde pas.
       */
      .rang-nombres { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
      .rang-nombres button { min-width: 34px; font-family: var(--display);
                             font-weight: 800; font-size: 15px; }
      /* Ce que la partie attend : lisible sans le chercher. */
      .etat { display: flex; gap: 14px; flex-wrap: wrap; align-items: baseline; }
      .etat b { font-weight: bold; }
      /* Le fil : ce qui vient de se passer, en clair. */
      .fil { border: 1px solid var(--line); background: var(--panel); padding: 4px; }
      .fil div { padding: 1px 0; }
      .neuf { color: #7fe3a0; font-weight: bold; }
      /* Le combat : un ECHANGE, pas une pile d'evenements. Il vit tant que le
         combat vit, et il ne concourt pas avec le fil, qui est borne. */
      .combat { border: 1px solid var(--line); background: var(--panel); padding: 6px;
                max-height: 340px; overflow-y: auto; }
      .combat .coup { padding: 3px 0; border-top: 1px solid rgba(255,255,255,.06); }
      .combat .coup:first-child { border-top: none; }
      .combat .qui { font-weight: bold; }
      /*
       * S1196 · note 145 (6) — DEUX PHRASES QUI SE COLLAIENT, et Croze l'a
       * photographiee : « 1 en attenteon attend : TOI » (capture 06).
       *
       * Cause mesuree : `renderDecision` pose DEUX <span> FRERES dans le meme
       * bloc — la ligne CONSULTATION (`.qui`) et la ligne des sieges dus
       * (`.qui-attend`) — et `.qui-attend` n'avait AUCUNE regle. Deux spans
       * inline cote a cote se rendent colles : il n'y a pas de blanc entre
       * deux noeuds adjacents du DOM.
       *
       * > On ne touche PAS a `.qui` : elle a SEPT porteurs, dont deux amorces
       * > voulues qui finissent par « : » et doivent rester en ligne avec ce
       * > qui suit (le VERROU, le BANC). *Une classe deja prise repeint une
       * > autre surface en silence* — la regle va sur la classe qui n'a qu'un
       * > seul porteur.
       */
      .qui-attend { display: block; }
      .combat .det { padding-left: 22px; opacity: .92; }
      .combat .rien { padding-left: 22px; color: #d8a657; }
      .combat .mort { color: #e06c75; font-weight: bold; }
      .combat .fini { color: #8f8f8f; font-style: italic; }

      /*
       * ═══ LE BLOC DE COMBAT ═════════════════════════════════════════════
       *
       * Il vit au CENTRE, sous la fenêtre de priorité. **Il ne prend aucune
       * teinte à lui** : l'orange braise est le Collapse, l'or `--portail` est
       * la sortie, et le combat ne touche ni l'un ni l'autre. Il se distingue
       * par son CADRE et sa graisse — une quatrième teinte aurait fait un
       * sixième sens sur une couleur déjà chargée.
       *
       * ⚠ **Une seule exception, et elle n'en est pas une** : la barre de PV du
       * mob prend `--stamp`, comme la pastille de PV du joueur juste au-dessus.
       * Ce rouge-là ne dit pas « refus » ici, il dit **les points de vie**, et
       * c'est l'emploi qu'il a déjà sur cet écran. Donner une autre teinte aux
       * PV du mob qu'aux PV du joueur ferait lire deux grandeurs différentes là
       * où il n'y en a qu'une.
       */
      .bloc-combat { border: 2px solid var(--rule); background: var(--ink-2);
                     margin: 10px 0; padding: 8px 10px 10px; }
      .bc-tete { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
                 border-bottom: 1px solid var(--rule); padding-bottom: 6px; margin-bottom: 8px; }
      .bc-titre { font-family: var(--display); font-weight: 800; font-size: 16px;
                  letter-spacing: .18em; text-transform: uppercase; color: var(--stock); }
      .bc-kind, .bc-round { font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
                            color: var(--stock-dim); border: 1px solid var(--rule);
                            padding: 1px 6px; }
      .bc-vous { margin-left: auto; font-size: 10px; letter-spacing: .12em;
                 text-transform: uppercase; color: var(--slate); }
      .bc-vous.on { color: var(--stock); font-weight: 800; }
      .bc-sous { display: block; font-size: 9px; letter-spacing: .2em;
                 text-transform: uppercase; color: var(--stock-dim); padding-bottom: 3px; }
      /* La rangée d'initiative : la colonne vertébrale, elle existe SANS mob. */
      .combat-order { padding: 4px 0 8px; line-height: 1.9; }
      .combat-order .arw { color: var(--slate); }
      .combat-order .ini-actif { font-weight: 800; text-decoration: underline;
                                 text-underline-offset: 3px; }

      /* La carte du mob — la maquette v9 : bandeau, titre, visuel, table, PV. */
      /*
       * ═══ ⛑ S210 · L'ONGLET DES SORTS, EN COMBAT — « tu présentes ça bien
       *     comme il faut » ═════════════════════════════════════════════════
       *
       * Note ⑫ ④. Le panneau se distingue de ce qui l'entoure par un LISERÉ et
       * un fond légèrement levé, pas par une couleur : `--stamp` est l'encre du
       * dé (S209) et `--ember` celle du Collapse — *une troisième surface qui
       * réclamerait sa teinte ferait trois signaux là où il en faut zéro.* Ce
       * qui doit sauter aux yeux dans ce bloc, ce sont les capacités JOUABLES,
       * et elles portent déjà leur propre marque.
       *
       * Il ne porte AUCUN pli : c'est le pli qui l'avait enterré.
       */
      /*
       * ⚑ **S462 — `.cf-sorts` EST DEVENU `.cf-passifs`, ET LA TÊTE A DISPARU
       * AVEC SON PANNEAU** (note ㊹ ②). `.cf-sorts-tete` portait le titre « CE
       * QUE TU PEUX FAIRE » et le compte de jouables : les deux sont morts avec
       * lui. Le cadre reste parce que les PASSIFS restent — *un cadre se renomme
       * quand son contenu change de nature, sans quoi la feuille ment.*
       */
      .cf-passifs { border: 1px solid var(--rule); background: var(--raised);
                    padding: 10px 12px 12px; margin-top: 12px; }
      /*
       * Le foyer des quatre blocs que la note ⑫ ④ retire de la vue. Il vit DANS
       * le pli : aucune règle de visibilité propre, c'est `.pli` qui la porte —
       * *une seconde grammaire de repli divergerait au premier ajustement.*
       */
      .cf-repli-corps { display: flex; flex-direction: column; gap: 10px; }
      /*
       * ═══ ⛑⛑⛑ S1100 · GESTE ⑦ ② — LE RAIL À QUATRE TIENT DANS 1080 ════════
       *
       * Croze, `Q-RAIL-A-QUATRE`, tranché : ***« la loi de 1080 s'applique au
       * rail : à trois adversaires et plus, les cartes se RÉDUISENT pour tenir,
       * rien ne passe sous le bord »***.
       *
       * ─── CE QUE `flex-wrap: wrap` FAISAIT, MESURÉ ────────────────────────
       *
       * `?etat=banniere-ordre`, 1920×1080, en unités de composition :
       *
       * ```
       * rail 594 de large · QUATRE cartes de 292 · flex-basis 260
       *   carte 1 et 2   top  322   bas   934
       *   carte 3 et 4   top  944   bas  1992      ← 912 px SOUS LE BORD
       *   le rail lui-même : hauteur 1679, bas à 2000
       * ```
       *
       * ⚠ **LE S1028 AVAIT MESURÉ 1 048 À TROIS CARTES ; À QUATRE C'EST 1 992.**
       * *Un défaut de débordement ne se mesure pas sur la population qu'on a
       * sous la main* — la fourchette dépend du nombre d'adversaires, et c'est
       * le pire cas qui décide.
       *
       * ─── LE REMÈDE, ET IL TIENT EN TROIS DÉCLARATIONS ────────────────────
       *
       * `nowrap` interdit la seconde rangée ; `flex-basis: 0` fait partager la
       * largeur au lieu de la réclamer ; **`min-width: 0` est celle sans
       * laquelle les deux autres ne servent à rien** — un élément flex refuse
       * par défaut de descendre sous la largeur de son contenu, et la rangée
       * déborderait à l'horizontale au lieu de déborder en bas. *Un débordement
       * qu'on chasse d'un axe revient sur l'autre si on ne le dit pas.*
       *
       * ⚑ **À DEUX CARTES, RIEN NE BOUGE** : `1 1 0` sur deux colonnes de 594
       * rend les mêmes 292 qu'un `1 1 260`. La réduction ne commence qu'à trois
       * — exactement le seuil que Croze nomme.
       */
      .mob-rail { display: flex; gap: 10px; flex-wrap: nowrap; padding-bottom: 8px; }
      .mobcard { flex: 1 1 0; min-width: 0;
                 border: 1px solid var(--rule); background: var(--ink);
                 padding: 0 0 6px; }
      /* ⚠ le nom est en 19px de police d'affichage : sans ça il déborde de sa
         carte dès que la carte rétrécit, et le débordement revient par l'autre
         axe (voir le bloc ci-dessus). */
      .mc-nom { overflow-wrap: anywhere; }
      /*
       * ═══ LE MOB QUI VIENT D'ÊTRE FRAPPÉ — demande de Croze ═════════════
       *
       * *« un clignotement blanc sur le mob frappé »* : savoir LEQUEL a
       * encaissé sans relire le déroulé.
       *
       * **Le blanc et rien d'autre.** Les quatre teintes réservées sont
       * prises — orange braise le Collapse, rouge tampon le refus, or la
       * sortie, liseré or le gear (`ECRANS §2`). Un coup encaissé n'est
       * aucune des quatre, et lui prêter une teinte réservée ferait lire
       * l'autre fait. Le blanc est la matière du carton, pas un signal
       * d'événement : c'est la carte elle-même qui s'éclaire.
       *
       * ⚠ **DEUX FOIS, PUIS ÇA S'ARRÊTE.** Une pulsation infinie deviendrait
       * un état — « ce mob est frappé » — au lieu d'un événement — « ce mob
       * VIENT d'être frappé. » L'écran ne porte aucun état ici : le `data-`
       * est posé tant que le coup est le fait le plus récent, et la CSS ne
       * bat que le temps de le voir.
       */
      .mobcard[data-frappe] { animation: mob-frappe .34s ease-out 2; }
      @keyframes mob-frappe {
        0%   { background: var(--stock); border-color: var(--stock); }
        100% { background: var(--ink);   border-color: var(--rule); }
      }
      @media (prefers-reduced-motion: reduce) {
        /* Le fait doit rester LISIBLE sans mouvement : le liseré tient seul. */
        .mobcard[data-frappe] { animation: none; border-color: var(--stock); }
      }
      .mc-kd { display: flex; align-items: center; gap: 8px; padding: 3px 8px;
               background: var(--ink-3); font-size: 9px; letter-spacing: .2em;
               text-transform: uppercase; color: var(--stock-dim); }
      .mc-actif { margin-left: auto; color: var(--stock); font-weight: 800; }
      .mc-etat { color: var(--stock-2); border: 1px solid var(--rule); padding: 0 4px; }
      .mc-nom { font-family: var(--display); font-weight: 800; font-size: 19px;
                text-transform: uppercase; padding: 6px 8px 2px; }
      /*
       * ⚠ **LE TIER SE VOIT AVANT LE NOM** — 31 NORMAL, 9 SUBBOSS, 3 BOSS sur
       * 43 (`MASTER_v0999_55`). Même grammaire que la rareté du butin :
       * l'escalade passe par l'ÉPAISSEUR du cadre, **jamais par une teinte**.
       * L'or, l'orange et le rouge sont pris (sortie · Collapse · refus). Le
       * BOSS ajoute le contraste inversé sur son seul libellé — c'est le
       * dernier cran disponible qui ne soit pas une couleur.
       */
      .mobcard[data-tier="NORMAL"]  { border-width: 1px; }
      .mobcard[data-tier="SUBBOSS"] { border-width: 2px; border-color: var(--stock-dim); }
      .mobcard[data-tier="BOSS"]    { border-width: 3px; border-color: var(--stock-2); }
      .mc-tier { font-weight: 800; }
      .mobcard[data-tier="SUBBOSS"] .mc-tier { color: var(--stock-2); }
      .mobcard[data-tier="BOSS"] .mc-tier { background: var(--stock); color: var(--ink);
                                            padding: 1px 5px; }
      /*
       * L'EMPLACEMENT D'ILLUSTRATION — **les 43 arts sont livrés depuis v55**
       * et servis depuis `public/art/mobs/`.
       *
       * ⚠ **CE N'EST PAS UNE ILLUSTRATION, C'EST LA CARTE IMPRIMÉE ENTIÈRE.**
       * Vu à l'œil sur `astragor.webp` (1024×1536) : titre, visuel, ligne de
       * stats, table d'attaques, passif, loot, et le tier en pied. Le premier
       * jet l'a cadrée comme un visuel — `aspect-ratio` forcé, `object-fit:
       * cover`, `max-height` — et **rognait le loot et le pied**. Une carte
       * porte du TEXTE : la couper, c'est la rendre à moitié lue, et un asset à
       * moitié lu retombe dans le défaut qu'on vient de payer.
       *
       * Donc AUCUN cadrage : ratio naturel, `height: auto`, rien qui coupe.
       * La colonne décide de la largeur, l'image suit.
       *
       * Le pointillé reste, mais il ne se voit plus que sur l'ÉTAT VIDE — un
       * art qui manque doit se lire comme un art qui manque, et un cadre qui
       * disparaît en silence ne dit ni l'un ni l'autre.
       */
      .mc-art { display: flex; align-items: center; justify-content: center;
                min-height: 74px; margin: 4px 8px; text-align: center; }
      .mc-art:not(:has(.mc-img)) { padding: 8px; border: 1px dashed var(--rule); }
      /*
       * ⛑ S69 — le « i » du mob, et **il est désormais le SEUL** : `.tuile-i`
       * est morte à S114 avec le pavé des tuiles. Ses règles étaient jumelles
       * des siennes ; elles tiennent maintenant toutes seules ici, et c'est
       * pour ça qu'elles sont écrites en entier plutôt que par renvoi.
       * `.mc-art` reçoit `position: relative`, comme `.tuile-visuel` le fait.
       */
      .mc-art { position: relative; }
      .mc-i { position: absolute; top: 8px; right: 8px;
              width: 26px; height: 26px; border-radius: 50%;
              border: 0; background: var(--ink-2); /* S1267 · H-T2 étape 12 : un outil
                 sur l'art garde son disque (lisible), il perd son bord — comme
                 la loupe de la tuile au S1262 (Q-PLAQUE-ICONES). */
              color: var(--stock); font: italic 700 15px/1 Georgia, serif;
              cursor: pointer; padding: 0; opacity: .85; }
      .mc-i:hover { opacity: 1; }
      .mc-i.on { background: var(--stock); color: var(--ink); opacity: 1; }
      /*
       * ═══ ⚑ S12 · LA CARTE A UNE TAILLE, LA COLONNE A UNE PLACE ═══════════
       *
       * Croze, depuis que la colonne centrale a doublé : *« les cartes sont
       * trop grosses en combat, comme elles sont responsive à la taille de la
       * colonne. »* **Mesuré** : `955 × 1431 px` pour une carte native
       * `1024×1536`, dans une fenêtre de combat de 1734.
       *
       * ⚠ **IL PROPOSAIT 50 % ET ON NE PREND PAS LE CHIFFRE** — un pourcentage
       * redevient faux au prochain changement de colonne, et la colonne vient
       * de doubler une fois. **Une carte de mob est un objet qui a sa taille de
       * lecture** : elle porte du TEXTE — titre, stats, table d'attaques,
       * passif, loot (`§14.5`) —, donc sa largeur se borne en ABSOLU et la
       * colonne varie autour.
       *
       * `440px` est calé sur cette lecture : au ratio `1024/1536`, cela fait
       * `660px` de haut, la carte entière visible sans défiler sur un écran
       * courant. `width: 100%` reste pour les colonnes plus étroites que la
       * borne — *borner n'est pas figer.*
       */
      /*
       * ⊕ **LA HAUTEUR EST DÉCLARÉE, PLUS HÉRITÉE DU FICHIER.** `height: auto`
       * seul rendait la hauteur égale à `largeur × le ratio du .webp` — un
       * nombre que personne n'avait choisi. Mesuré sur la population ENTIÈRE :
       * **43 arts de mob sur 43 sont en 1024×1536**, soit exactement `2/3`. Le
       * ratio est donc ÉCRIT ici plutôt que subi, et `object-fit: contain`
       * garantit la consigne gravée — *jamais d'étirement* — au lieu de la
       * devoir à une coïncidence : aujourd'hui les 43 fichiers tombent juste, et
       * `fill` ne déformait rien **par chance**. Le 44ᵉ n'aura pas à avoir de la
       * chance.
       *
       * ⚠ **CE BLOC NE CORRIGE PAS LA HAUTEUR, IL LA REND MESURABLE.** Le
       * commentaire ci-dessus dit *« la carte entière visible sans défiler sur un
       * écran courant »* — c'est FAUX, mesuré à 1920×1080, la référence gravée :
       * la carte fait **988 px**, dont **659 d'image**, et pousse la rangée
       * d'initiative et le déroulé **sous le pli**. *Une borne calculée sur
       * l'image seule ne borne pas la carte.* `.tuile-art`, la surface sœur, a
       * reçu `max-height: 62vh` pour exactement cette raison — *« la borne est en
       * unités de VUE, pas en pixels : elle suit l'écran au lieu de le
       * supposer »*. **La leçon n'a jamais traversé jusqu'ici**, et le nombre qui
       * la traduirait est un choix de design : il est rendu à Croze
       * (`QUESTIONS_CLASSEUR.md`, palier 67), pas inventé ici.
       */
      /*
       * ⛑ **S202 — LA FICHE DU MOB EST RÉDUITE** (note ⑨ ③ : *« sa fiche, qui
       * doit être réduite »*). **Mesuré au banc, 1920×1080, `Mummy` :**
       *
       * ```
       * .mobcard  333 × 769     dont .mc-art  315 × 473  ← les deux tiers
       * ```
       *
       * L'art EST la fiche, en volume. `max-width: 440 → 190` : à ratio `2/3`
       * cela borne l'art à **190 × 285**, soit **−40 % de hauteur** sur les 473
       * mesurés — **la même réduction que la tuile au S199**, parce que c'est
       * la même demande dans les mêmes mots, et qu'une seconde grammaire de
       * réduction ferait deux tailles pour une seule consigne.
       *
       * ⚠ **LE `440` NE MORDAIT PAS.** L'art était large de 315 px, borné par
       * sa colonne et jamais par cette règle : *un plafond qu'aucune mesure
       * n'atteint ne réduit rien.* C'est en le descendant sous la largeur réelle
       * qu'il devient une borne au lieu d'une intention.
       */
      /*
       * ⛑ **S208 — la carte mob suit la tuile, au MÊME facteur.** Le S202 avait
       * borné l'art à `190px` pour retirer 40 % des **315 px réellement
       * rendus** ; note ⑫ ② dit que c'est trop. `315 × 0,8 = 252px` rend la
       * moitié du geste. **Le plafond reste sous la largeur réelle** — c'est ce
       * qui en fait une borne et non une intention, la leçon payée au S202 sur
       * le `440` qui ne mordait pas (`252 < 315`).
       */
      .mc-img { display: block; width: 100%; max-width: 252px; height: auto;
                aspect-ratio: 2 / 3; object-fit: contain;
                margin: 0 auto; border: 1px solid var(--rule); }
      .mobcard .vital { padding: 2px 8px 6px; }
      .bar.mob > i { background: var(--stamp); }

      /*
       * ═══ ⛑ S225 · LA BARRE DU MOB, ET L'ART QUI SUIT SA COLONNE ══════════
       *
       * *« sa barre de vie PLUS LARGE qu'aujourd'hui, toujours au-dessus de
       * lui, tout à droite. »*
       *
       * ⚠ **« PLUS LARGE » NE PEUT PAS VOULOIR DIRE PLUS LONGUE.** Mesurée,
       * elle fait DÉJÀ toute la largeur de sa carte — `490` sur `490`. Ce qui
       * lui manque est l'ÉPAISSEUR : `5 px`, un cheveu, pour la seule jauge
       * qui dit si le combat se gagne. Elle passe à `14`. *Quand un mot a deux
       * lectures, c'est la mesure qui tranche, pas le dictionnaire.*
       *
       * ⚠ **ET LA RÈGLE EST PORTÉE, PAS GLOBALE.** `.bar` sert aussi aux PV du
       * joueur et aux jauges des colonnes d'adversaires ; l'épaissir partout
       * aurait repeint la moitié de l'écran pour une phrase qui parle du mob.
       * La portée est `.cf-corps .mob-rail` — la colonne droite de la fenêtre
       * de combat, exactement ce dont Croze parle.
       *
       * **La position ne bouge pas** : la barre est déjà DANS `.vital`, au-dessus
       * de `.mc-art` (relevé : barre `y 370`, art `y 385`). *« toujours au-dessus
       * de lui »* était déjà tenu — on ne touche donc à rien d'autre.
       */
      .cf-corps .mob-rail .bar.mob { height: 14px; }
      /*
       * ═══ ⛑ S638 · ET LA MÊME BARRE DE L'AUTRE CÔTÉ (note 72 C) ═══════════
       *
       * *« la vie de l'avatar affichée comme celle du mob (même barre,
       * miroir) »*. Le `14 px` ci-dessus a été porté **exprès** au S225 :
       * l'épaissir partout aurait repeint les jauges des colonnes
       * d'adversaires pour une phrase qui parlait du mob.
       *
       * ⚠ **LA PORTÉE S'ÉTEND À CE QUE LE NOUVEAU VERDICT NOMME, PAS PLUS.**
       * `.cf-cote` est la colonne GAUCHE de la fenêtre de combat — le seul
       * endroit où 72 C demande le miroir. Les jauges des autres sièges, que
       * le S225 protégeait, restent à `5 px` : *un verdict s'applique à la
       * surface qu'il nomme.*
       *
       * ⚠ Et le remplissage n'est pas recopié : la classe posée est
       * `pv moi`, donc la couleur vient de `.bar.pv > i` — celle que les PV du
       * joueur portent DÉJÀ partout ailleurs, et qui se trouve être `--stamp`,
       * la même que le mob. *Deux barres qui doivent se lire en miroir ne
       * peuvent pas venir de deux règles.*
       */
      .cf-cote .bar.moi { height: 14px; }
      /*
       * Le plafond de l'art suit la colonne, sinon la colonne grossit sans que
       * le MOB grossisse — et c'est le mob que la consigne veut plus gros. Le
       * plafond reste sous la largeur réelle de la case (~583 px), donc il
       * MORD encore : c'est la leçon du S202 sur le `440` qui ne mordait pas.
       */
      .cf-corps .mob-rail .mc-img { max-width: 380px; }
      /*
       * ⛑⛑ S1232 · NOTE 164 ① — LA CARTE DU MOB EST ENTIÈRE, SANS DÉFILER.
       * Vu sur la capture de Croze : sa ligne d'attaque (« 1–4 — Stab : Deal
       * DEX… ») tranchée en bas du panneau. Mesuré à 2165 × 1203 : la carte
       * fait **837 px** dans une fenêtre de **757** (plafond 680 en
       * composition), dont **635** d'image. Deux gestes, et aucun ne touche la
       * main ni la fenêtre : ① l'IMAGE est plafonnée par la hauteur de la
       * fenêtre moins ce qui l'entoure (tête, PV, pied, bande d'obligations :
       * 290 px de composition) — le rapport largeur/hauteur tient, c'est un
       * `max-height` sur un élément remplacé ; ② le rail COLLE en haut de la
       * fenêtre (`sticky`) : faire défiler MA fiche ne pousse plus le mob hors
       * de l'écran.
       */
      .cf-corps .mob-rail { position: sticky; top: 0; }
      .cf-corps .mob-rail .mc-img { width: auto; margin-inline: auto;
        max-height: calc(var(--uvh) * 100 - 140px - var(--reserve-de-la-main) - 290px); }

      /*
       * ═══ ⛑ S226 · LA FICHE CLIQUABLE — note ⑬ ③ ═══════════════════════════
       *
       * La fiche imprimée prend la colonne gauche de la fenêtre de combat, et
       * ses lignes de COMBAT deviennent des zones. **Aucune dimension en dur** :
       * l'image prend la largeur de sa case, les zones sont en `%` de l'image,
       * et les `%` viennent de `gabarit_fiches.gen.json` — mesurés au pixel.
       *
       * ⚠ **MÊME GRAMMAIRE QUE LE CALQUE DE LA TUILE (S222).** Cadre
       * `--activable` pour ce qui est jouable, aucun fond au repos (le carton
       * EST l'information), voile et cadre épais au survol ET au focus — la
       * règle doit rester mesurable dans un volet qui ne compose pas.
       *
       * ⚠ **ET LA LIGNE REFUSÉE SE VOIT SANS SURVOL** (`§0.1 ②`) : elle porte
       * la teinte du tampon, pas une simple absence de réaction. *Une ligne qui
       * ne répond pas au clic ne se voit pas ; une ligne barrée se voit.*
       */
      /*
       * ═══ ⛑⛑ S270 · LE PLAFOND DE LA FICHE — 560 px, GO de Croze (note ㉑ ②)
       *
       * Ma question du S248 : *« il reste 440 px de trop dans l'écran de combat,
       * et seule ta fiche peut les rendre — je propose de la plafonner à
       * 560 px. »* Réponse : **GO, rien d'autre.**
       *
       * ⚠ **LE PLAFOND SE POSE SUR LA BOÎTE, PAS SUR L'IMAGE.** Le calque des
       * bandes est `inset: 0` sur `.fc-boite` et ses zones sont en `%` de
       * CETTE boîte. Plafonner la seule image l'aurait fait rétrécir à
       * l'intérieur d'une boîte restée large : **les dix-huit bandes auraient
       * glissé**, toutes, sans qu'aucune ne le dise. La boîte se plafonne,
       * l'image la remplit, le calque la suit. *Un calque en pourcentage ne
       * pardonne pas qu'on redimensionne son support et pas lui.*
       *
       * ⚠ **ET LE NOMBRE N'EST PAS CALCULÉ À LA MAIN.** Le plafond de Croze est
       * une HAUTEUR ; la boîte se borne en LARGEUR. La conversion est le ratio
       * du carton — `1414 × 2000`, déjà écrit trente lignes plus bas — et elle
       * reste écrite dans la règle : `calc(560px * 1414 / 2000)`. *Un nombre
       * qu'on pose déjà réduit a perdu la raison qui le rendait juste* — celui-
       * ci se relit, et il suivra le jour où le carton change de format.
       */
      .fc-boite { position: relative; display: block; width: 100%;
                  max-width: calc(560px * 1414 / 2000); margin-inline: auto; }
      /*
       * ═══ ⚑⚑ S638 · NOTE 72 C — LA FICHE PLUS GRANDE, **EN COMBAT SEULEMENT**
       *
       * Verbatim : *« Sa fiche de perso PLUS GRANDE »*, dans le verdict qui
       * commence par *« C · COMBAT »*.
       *
       * ⚠⚠ **ET LE `560px` CI-DESSUS EST UN ARBITRAGE DE CROZE (S270).** Le
       * relever globalement défairait sa décision **là où il l'a prise** — sur
       * l'écran principal, où la fiche partage une colonne avec le reste. Son
       * verdict de combat ne parle que du combat : **la borne bouge donc dans
       * `.cf-cote`, et nulle part ailleurs.**
       *
       * *Un verdict s'applique à la surface qu'il nomme ; l'étendre est un
       * second arbitrage, et il ne m'appartient pas.*
       *
       * ⚠ **LE RATIO NE BOUGE PAS.** `1414 / 2000` est celui du carton
       * imprimé, et les dix-huit bandes du calque sont en `%` de cette boîte :
       * changer la largeur sans la hauteur les ferait TOUTES glisser, en
       * silence (le paragraphe juste au-dessus l'a déjà payé). On ne touche
       * qu'au plafond, la boîte garde sa forme.
       *
       * ⚠⚠ **LE PLAFOND EST UNE COURBE RELEVÉE, PAS UN CHIFFRE CHOISI.** La
       * colonne DROITE est fixe (`761 px`, elle ne dépend pas de la fiche) ; la
       * gauche vaut `boîte + 179`. En poussant le plafond et en relisant le bas
       * de la fenêtre à chaque cran, en peau JOUEUR :
       *
       * ```
       * plafond   560   582   600   640   680   700
       * boîte     559   581   599   639   679   699
       * bas      1023  1023  1023  1044  1084  1104     ← le pli est à 1080
       * ```
       *
       * `640` est le dernier cran qui tient. La fiche passe de `396 × 559` à
       * `452 × 639` — la carte du mob en face fait `576 × 570`, elle cesse donc
       * d'être la petite des deux.
       *
       * ⚠⚠⚠ **ET J'AI FAILLI RABATTRE CE PLAFOND À `570` POUR UN DÉBORDEMENT
       * QUI N'EXISTE PAS.** Sous `?debug=1` la fenêtre passait `33 px` sous le
       * pli — mais ces pixels étaient la BANNIÈRE DE HALTE (`.zone-agir >
       * .barre`, `131 px`), que ma porte d'URL pose et que Croze ne voit
       * jamais. Masquée, le bas retombe à `1023`. *Un débordement mesuré sous
       * l'outil qui l'a créé n'est pas un débordement de l'écran* — et le
       * plafond « corrigé » ne rendait plus que `403 × 569`, sept pixels de
       * plus que l'original : la consigne « PLUS GRANDE » annulée en croyant
       * la servir.
       *
       * ⚠ **LA SECONDE BORNE EST EN `vh`, ET ELLE NE MORD QU'EN DESSOUS.** Le
       * `640` est relevé sur un écran de `1080`. Le reste de la fenêtre pèse
       * `425 px` (chrome `338` + le haut `67`, mesurés au même cran), donc à
       * `1080` la borne vaut `655` : **elle ne mord pas**, et c'est exprès —
       * *une borne de secours qui mord au repos change la mise en page qu'elle
       * devait seulement protéger.* Éprouvée à `1600 × 900` : la fiche tombe à
       * `336 × 474`. Elle mord.
       *
       * ⚠⚠ **ET ELLE NE SAUVE PAS LA FENÊTRE, elle sauve seulement la fiche.**
       * Au même essai `900`, le bas reste `99 px` sous le pli : à cette
       * hauteur le plancher n'est plus la fiche (`474 + 179 = 653`) mais la
       * COLONNE DU MOB, fixe à `761`. Ce que `min()` garantit est donc étroit
       * et il faut le dire tel quel : **la fiche ne sera jamais la CAUSE du
       * débordement.** Le débordement des écrans courts est antérieur, il tient
       * à la taille de l'art du mob — arbitrée par Croze au S225 — et 72 C ne
       * demande pas d'y toucher. Il est porté au classeur, pas réparé ici.
       * *Une borne qui protège une chose ne protège pas la fenêtre entière ;
       * l'écrire au singulier serait une promesse que la mesure dément.*
       */
      /*
       * ⛑⛑ S933 · NOTE 110 ⑤ — **LA MÊME TAILLE ENTRE LA CARTE ET LA FICHE**
       *
       * Verbatim de Croze : *« ça devrait être la même taille entre la carte
       * du perso et ma fiche de perso (donc faudrait zoomer les 2) »*.
       *
