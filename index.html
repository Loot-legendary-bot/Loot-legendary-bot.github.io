       * `--stamp` y rend **1,77** à 12 px pour un seuil de `4,5`, et sa
       * bordure **1,88** sur le `[21,21,21]` de l'`.abil` pour un seuil de
       * `3`. *Une couleur n'a pas un contraste : elle en a un par fond*
       * (S545) — et c'est le MÊME sélecteur qui porte les deux.
       *
       * `--alert` ici, et là seulement : **4,70** pour le mot, **4,99**
       * pour le cadre. Le tampon de carte ne bouge pas.
       *
       * ⚠ **IL NE SE VOIT QU'AU SURVOL** (`opacity: 0` → `1` sur
       * `.abil.no:hover`), ce qui l'a rendu invisible à `encres_stamp`
       * jusqu'au S555 : *un nœud qu'un geste révèle n'est pas un nœud
       * absent, c'est un nœud qu'on n'a pas demandé.*
       */
      .abil .stamp { background: rgba(31,27,22,.94); font-size: 12px; width: 92%;
                     color: var(--alert);
                     border-color: var(--alert); outline-color: var(--alert); }
      .card.no:hover .stamp, .card.no:focus-visible .stamp,
      .abil.no:hover .stamp, .abil.no:focus-visible .stamp { opacity: 1; }

      /*
       * ═══ LE MOTIF SE LIT SANS UN GESTE ═════════════════════════════════
       *
       * **Deux consignes de Croze, et elles ne se contredisent pas** :
       * *« toujours affiché, ça capte trop l'attention et ça noie le joueur »*
       * (décision close) et *« inclickable sans savoir pourquoi »* (le défaut
       * vécu, sur `Fire Pot`).
       *
       * **Ce qui noyait n'était pas la raison, c'était le TAMPON** — un pavé
       * rouge pivoté en surimpression sur toute la carte. Le replier était
       * juste ; replier la raison AVEC lui était l'erreur.
       *
       * Le partage est de MATIÈRE, pas de geste : le tampon reste au survol,
       * le motif est une ligne grise, petite, permanente. **Il ne capte rien :
       * on le lit quand on cherche pourquoi.** Ni braise, ni or — il emprunte
       * le rouge du refus, mais en TEINTE ATTÉNUÉE et sans aplat : c'est une
       * note de lecture, pas un tampon.
       */
      /*
       * ⛑ S291 — **UNE TEINTE EN DUR, HORS PALETTE, À `3,02`.** `#8C5A54`
       * n'était nommée nulle part : ni jeton, ni raison écrite. `--alert` est
       * la teinte que Croze donne au refus LISIBLE (note ⑰ ②) — c'est le
       * métier exact de cette ligne, et elle passe de `3,02` à `5,09`.
       * *Une couleur écrite en dur est une décision que personne ne peut
       * relire.*
       */
      .motif-lu { font-size: 9px; line-height: 1.35; letter-spacing: .02em;
                  color: var(--alert); text-transform: none; font-weight: 400;
                  padding-top: 3px; text-align: left; }
      .motif-lu.neutre { color: var(--slate); font-style: italic; }
      /* Sur la carte, il passe sous le texte et ne pousse pas la mise en page. */
      .card .motif-lu, .abil .motif-lu { width: 100%; }

      /*
       * ⛑⛑ S499 · `M-S489` — **CETTE CAPACITÉ NE PRODUIRA RIEN AVEC CE QUI EST
       * PORTÉ.** Verdict 12 de Croze : *« jamais bloquant. »*
       *
       * ⚠ **CE N'EST PAS `.motif-lu`, ET LA FORME DOIT LE DIRE.** Un refus
       * porte trois marques — la classe `no`, le tampon `injouable`, et le `⊘`
       * de `motifVisible`. La ligne, elle, reste JOUABLE : elle n'en porte
       * aucune. Ce qui la distingue est un **filet à gauche**, pas une teinte
       * de refus — *une forme dit un statut, une couleur dit une famille.*
       *
       * `--alert` sur la première ligne (la même que `.motif-lu`, dont le
       * contraste est déjà mesuré à ce corps) ; `--stock-2` sur la seconde,
       * celle de `.abil .cost`, à la même taille. Aucune teinte neuve : les
       * deux sont dans le jeu déjà relevé par `contraste_dom.js`.
       */
      .inerte-equip { display: flex; flex-direction: column; gap: 1px;
                      width: 100%; padding: 3px 0 0 5px; margin-top: 3px;
                      border-left: 2px solid var(--alert); text-align: left; }
      .inerte-equip .inerte-tx { font-size: 9px; line-height: 1.35;
                                 letter-spacing: .02em; color: var(--alert);
                                 text-transform: none; font-weight: 400; }
      .inerte-equip .inerte-porte { font-size: 9px; line-height: 1.35;
                                    color: var(--stock-2); text-transform: none; }
      .cz-bandeau .inerte-equip { padding-top: 0; }

      /*
       * La porte du mode admin : discrète, permanente, HORS des trois zones.
       * Elle n'ajoute aucune ligne à l'écran de jeu — elle ouvre une porte.
       * Un mode qu'on ne peut pas atteindre se lit comme une panne.
       *
       * ⚠ **CE COMMENTAIRE A ÉTÉ ORPHELIN DE `67deac9` À AUJOURD'HUI.** Il
       * décrivait la porte, aucune règle ne la dessinait, aucun élément ne la
       * rendait — et il était suivi, sans transition, du commentaire du portail.
       * Le seul accès au mode admin était `?debug=1` tapé à la main ; Croze est
       * revenu sans la chaîne de requête et a cru l'avoir perdu. **Un
       * commentaire qui promet une porte est une porte pour qui le lit.**
       *
       * `position: fixed` la sort du flux : hors des trois zones, aucune ligne
       * ajoutée — le même geste que le bandeau. `main.ts` ne la pose pas du tout
       * quand la build la ferme (`PLAN` J7).
       */
      /*
       * ═══ ⛑ S398 · `--z-portes` — LE COIN DES INSTRUMENTS PASSE AU-DESSUS DE
       *              LA COUCHE DES SCÈNES ═════════════════════════════════════
       *
       * ⛔ **UNE PROMESSE QUE LA COUCHE NE TENAIT PAS.** `porte-rapport` porte
       * dans son propre `title` : *« Marche partie figée »*, et son volet vit à
       * `z 1000` **exactement pour ça** — *« on veut le rapport PENDANT qu'une
       * scène est à l'écran, y compris quand c'est elle qui ne se referme
       * pas »*. La porte, elle, était à `200`, **sous `.dicelayer` (900)**.
       * Mesuré : `elementFromPoint` au centre du bouton rend `DIV.dicelayer`.
       * *Le volet était au-dessus de la scène et le bouton qui l'ouvre était
       * dessous* — la moitié d'une décision, appliquée à une seule des deux
       * pièces.
       *
       * ⚠ **LE CLIC-QUI-COUPE NE SUFFIT PAS ICI, ET C'EST TOUT LE POINT.** Le
       * S303 fait couper la scène par n'importe quel clic, donc le chemin
       * existait en DEUX gestes. Mais **le cas que la promesse vise est celui
       * où la scène ne répond plus** : le premier geste est alors celui qui
       * manque. *Un secours qui dépend du mécanisme en panne n'est pas un
       * secours.*
       *
       * ⚠ **`903`, ET LA BANDE EXISTAIT DÉJÀ.** `file-tue` vit à `901` et
       * `hide-btn` à `902` — deux commandes posées SUR la scène, pour la même
       * raison. Les portes s'y rangent, au-dessus d'elles et **sous
       * `.bv-couche` (940) et `.plein` (950)** : un modal doit couvrir les
       * portes, une scène non.
       *
       * ⚠ **LES TROIS ENSEMBLE, ET C'EST LA RAISON DU JETON.** `admin`,
       * `rapport` et `options` sont UNE bande de 20 px dans un coin, même
       * matière et même opacité. *Une bande à deux z-index est une divergence
       * en attente* — le jeton la tient d'un seul endroit.
       *
       * ⚠ **CE QUE ÇA COÛTE, DIT PLUTÔT QUE TU** : pendant un dé qui roule,
       * trois libellés de 9 px à `opacity .35` restent dans le coin bas-droit.
       * C'est le prix exact de la promesse, et `hide-btn` le paie déjà.
       */
      /*
       * ⛑⛑ **S504 — `903` → `930`, ET C'EST L'INVARIANT DE CE BLOC QUI LE
       * DEMANDE, PAS UN GOÛT.**
       *
       * La règle ci-dessus dit son critère en toutes lettres : les portes se
       * rangent **au-dessus des commandes posées sur la scène** et **sous
       * `.bv-couche` (940) et `.plein` (950)** — *« un modal doit couvrir les
       * portes, une scène non. »*
       *
       * Le S504 monte `.main-basse` à **921** pendant une fenêtre (le bandeau
       * du joueur doit rester au-dessus de la colonne que le S486 a portée à
       * 920). **Un bandeau de joueur n'est ni un modal ni une scène** : par le
       * critère écrit ici, il ne doit pas couvrir les portes. Il les couvrait —
       * mesuré, et réversible :
       *
       * ```
       * `.main-basse` à 921   →  couverts : porte-rapport · porte-options
       * `.main-basse` à  40   →  couverts : aucun
       * ```
       *
       * ⚠ **Le défaut était le MIEN, et il est né du correctif d'à côté.** *Un
       * z-index qui monte pour rendre une chose atteignable en rend une autre
       * inatteignable* — deux fois de suite, dans le même palier, et la seconde
       * fois c'est l'instrument qui l'a dit avant moi.
       *
       * `930` garde les deux bornes du critère : au-dessus de tout ce qui monte
       * pendant une fenêtre (920, 921), sous les deux surfaces pleines.
       */
      :root { --z-portes: 930; }

      .porte-admin {
        position: fixed; right: 0; bottom: 0; z-index: var(--z-portes);
        font-family: var(--mono); font-size: 9px; letter-spacing: .16em;
        text-transform: uppercase; text-decoration: none;
        color: var(--stock-dim); background: var(--ink-2);
        border: 1px solid var(--rule); border-right: none; border-bottom: none;
        padding: 3px 9px; opacity: .35; transition: opacity .12s, color .12s;
      }
      .porte-admin:hover,
      .porte-admin:focus-visible { opacity: 1; color: var(--stock); }
      /*
       * ═══ ⚑ S302 · NOTE ㉖ ③ — LA PORTE DU RAPPORT ══════════════════════
       *
       * **Même matière et même discrétion que `porte-admin`, à côté d'elle.**
       * Ce n'est pas une coquetterie : les deux sont des choses qui NE FONT PAS
       * PARTIE DU JEU, et `ECRANS §2` dit que rien de tel n'ajoute une ligne
       * aux trois zones. Elles occupent donc le même coin, hors du flux, à la
       * même opacité — *un instrument se range avec les instruments.*
       *
       * ⚠ **ELLE EST À GAUCHE D'`admin`, ET LE DÉCALAGE EST EN `em`.** En `px`
       * il aurait fallu le recalculer au premier changement de corps ; le mot
       * « admin » fait cinq lettres à `9px` avec `.16em` d'interlettrage, et
       * `6.2em` le passe sans le toucher. Mesuré à l'écran, pas estimé.
       *
       * ⚠ **AUCUN `--ember` ET AUCUN `#7FB069`** : ce bouton n'est ni le
       * Collapse ni une chose jouable. Il emprunte l'encre atténuée, comme la
       * porte voisine.
       */
      /*
       * ═══ ⚑ S310 · LA FLÈCHE DE CIBLAGE — note ㉘ ② ══════════════════════
       *
       * ⓐ **`pointer-events: none` SUR LA COUCHE ENTIÈRE.** Sans ça, la flèche
       *    s'interposerait entre le curseur et la cible qu'elle désigne — *un
       *    indicateur qui empêche le geste qu'il indique.*
       * ⓑ **`z-index: 800` — SOUS la couche des scènes (900) et sous le volet
       *    du rapport (1000).** Une flèche par-dessus un dé qui roule dirait
       *    qu'on peut viser pendant une scène ; on ne peut pas.
       * ⓒ **`--stock`, ni ember ni vert jouable.** Même borne qu'au S307 : la
       *    flèche est une TRAJECTOIRE, pas un verdict.
       * ⓓ **`opacity` seule pour l'entrée** — la règle `transform/opacity`.
       *    Elle n'est peinte qu'une fois le curseur bougé (`.vive`) : une
       *    flèche posée d'avance pointerait un coin que personne n'a visé.
       */
      #fleche { position: fixed; inset: 0; z-index: 800; pointer-events: none;
                width: 100%; height: 100%; opacity: 0; transition: opacity .12s; }
      #fleche.vive { opacity: 1; }
      #fleche-trait { fill: none;
                      stroke: color-mix(in srgb, var(--stock) 78%, transparent);
                      stroke-width: 3; stroke-linecap: round;
                      filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .8)); }
      #fleche-pointe { fill: var(--stock);
                       filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .8)); }

      /*
       * ═══ ⚑ S397 · NOTE ㉟ ③ — LA PORTE DES OPTIONS ══════════════════════
       *
       * ⚠ **CE DÉPÔT A DÉJÀ PAYÉ EXACTEMENT CE DÉFAUT.** `index.html` portait un
       * commentaire qui promettait la porte du mode admin, et la porte n'existait
       * pas : *« le seul accès au mode admin était de taper `?debug=1` à la main,
       * et Croze, revenu sans la chaîne de requête, a conclu qu'il l'avait
       * perdu. »* **Un mode qu'on ne peut pas atteindre se lit comme une panne.**
       * L'onglet OPTIONS naissait au S395 avec une touche et RIEN à l'écran pour
       * la dire — la même panne, un jour après avoir relu son récit.
       *
       * ⚠ **ELLE NOMME SA TOUCHE, et ces six caractères sont le point.** La
       * convention `refusé()` (*le fait visible, la raison repliée*) ne s'applique
       * pas ici : `Échap` n'est pas une raison, c'est **le geste**, et un geste
       * qui vit dans un `title` n'est appris par personne. Il s'affiche une fois,
       * en 9 px atténués, dans le coin des instruments — et le jour où Croze le
       * sait, il ne le lit plus.
       *
       * ⚠ **`16.4em`, ET CE N'EST PAS UNE ESTIMATION.** Relevé à l'écran, corps
       * `9px` : `admin` occupe `[0 ; 5.91em]`, `rapport` part à `6.2em` et fait
       * `9.83em` — il finit donc à `16.03em`, et l'écart que la paire s'accorde
       * est de `0.29em`. `16.4em` reprend le même écart, à `0.08em` près, et il
       * suivra un changement de corps comme les deux autres.
       */
      .porte-options {
        position: fixed; right: 16.4em; bottom: 0; z-index: var(--z-portes);
        font-family: var(--mono); font-size: 9px; letter-spacing: .16em;
        text-transform: uppercase;
        /* S1260 · H-T2 (Q-PLAQUE-ICONES) — un outil, pas une action : plus de
           bord gris, le texte seul. */
        color: var(--stock-dim); background: transparent; border: 0;
        padding: 3px 9px; opacity: .35; cursor: pointer;
        transition: opacity .12s, color .12s;
      }
      .porte-options:hover,
      .porte-options:focus-visible { opacity: 1; color: var(--stock); }

      .porte-rapport {
        position: fixed; right: 6.2em; bottom: 0; z-index: var(--z-portes);
        font-family: var(--mono); font-size: 9px; letter-spacing: .16em;
        text-transform: uppercase;
        /* S1260 · H-T2 (Q-PLAQUE-ICONES) — un outil, pas une action : plus de
           bord gris, le texte seul. */
        color: var(--stock-dim); background: transparent; border: 0;
        padding: 3px 9px; opacity: .35; cursor: pointer;
        transition: opacity .12s, color .12s;
      }
      .porte-rapport:hover,
      .porte-rapport:focus-visible { opacity: 1; color: var(--stock); }

      /*
       * ─── LE VOLET, ET IL AFFICHE LE TEXTE PLUTÔT QUE DE LE COPIER ────────
       *
       * `z-index: 1000` — **au-dessus de `.dicelayer` (900)**, et c'est la
       * raison d'être du volet : on veut le rapport PENDANT qu'une scène est à
       * l'écran, y compris quand c'est elle qui ne se referme pas.
       *
       * Le `<textarea>` est en `--mono` et il ne s'habille pas : ce qu'on y lit
       * doit être **exactement** ce qui partira dans le collage. Une police
       * proportionnelle y aurait cassé l'alignement des colonnes du journal, et
       * ce qu'on relit dans un rapport, ce sont des colonnes.
       */
      .volet-rapport {
        position: fixed; inset: 0; z-index: 1000;
        display: grid; place-content: center;
        background: rgba(10, 8, 6, .82);
      }
      .vr-boite {
        width: min(96vw, 900px); max-height: 82vh;
        display: flex; flex-direction: column; gap: 8px;
        background: var(--ink-2); border: 1px solid var(--rule); padding: 14px 16px;
      }
      .vr-titre {
        font-family: var(--mono); font-size: 10px; letter-spacing: .16em;
        text-transform: uppercase; color: var(--stock-2);
      }
      .vr-zone {
        flex: 1 1 auto; min-height: 46vh;
        font-family: var(--mono); font-size: 12px; line-height: 1.45;
        color: var(--stock); background: var(--ink);
        border: 1px solid var(--rule); padding: 10px;
        white-space: pre; overflow: auto; resize: none;
      }
      .vr-barre { display: flex; align-items: center; gap: 10px; }
      .vr-dit {
        font-family: var(--mono); font-size: 11px; color: var(--stock-dim);
      }
      /*
       * §4.2 — le portail est une SORTIE. C'est le seul fait d'une tuile qui
       * change ce qu'on peut faire d'elle ; il ne se lit pas au poids d'une
       * ligne de tableau. L'or, parce que c'est ce qu'on cherche — et il ne
       * marche ni sur l'orange du Collapse ni sur le rouge du refus.
       */
      .portail-ouvert { color: var(--portail); font-weight: 700; letter-spacing: .08em; }

      /*
       * ─── MOMENT 4 : LE PRIX AVANT LE CLIC ────────────────────────────────
       *
       * **`perd` ne ressemble PAS à une défausse**, et la distinction passe par
       * la TYPOGRAPHIE : une défausse repart sous le deck de sa rareté et
       * revient ; un `destroy_self` quitte la partie. Le barré dit « ça ne
       * revient pas » sans emprunter l'orange braise du Collapse ni le rouge du
       * refus — les deux sont réservés (`ECRANS §2`), et je n'invente pas un
       * signal qui n'a pas été décidé.
       */
      /*
       * ═══ LE DÉ PREND L'ÉCRAN — trois temps, trois faits ═════════════════
       *
       * `ECRANS` moment 3. Chaque temps a sa classe : `t1` la face, `t2` le
       * modificateur, `t3` le total et le verdict. `fini` les montre tous — et
       * c'est ce que le clic pose, donc **couper n'est pas un raccourci
       * d'affichage, c'est le même état final atteint plus tôt.**
       */
      /*
       * ⛑⛑ **S765 — LE VOILE ÉTAIT LE PLUS CLAIR EXACTEMENT LÀ OÙ IL Y A LE
       * TEXTE, ET J'AVAIS RÉPONDU LE CONTRAIRE À CROZE.**
       *
       * Note 91 ④, DEUXIÈME verdict, mêmes mots que la note 81 ① : *« je veux
       * que le fond soit obscurci ou que tu présentes via un pop-up, là c'est
       * transparent avec police très fine on voit rien. »*
       *
       * `Q-81-1` lui avait répondu *« le voile est déjà là, et il est plus
       * sombre que ta référence — 0,86 contre 0,55 »*, avec une reco *« ne
       * touche pas au voile »*. **C'était faux, et la faute est de lecture** :
       * `0.86` est le stop EXTÉRIEUR d'un gradient à deux stops. Le stop
       * INTÉRIEUR vaut `.10`, et `place-content: center` pose la scène pile
       * dessus. Recalculé au canvas (implémentation du navigateur, pas la
       * chaîne CSS), 1920×1080, `circle at 50% 44%`, farthest-corner r = 1135 :
       *
       * ```
       * centre du gradient   α 0,102        ← la scène est ICI
       * centre de l'écran    α 0,173
       * à 200 px du centre   α 0,329
       * à 450 px du centre   α 0,592
       * coin                 α 0,859        ← le SEUL endroit qui valait 0,86
       * témoin `.borne`      α 0,55 PLAT    ← sa référence, DÉBUT DE TOUR
       * ```
       *
       * **Derrière le texte, sa référence est trois fois plus opaque que la
       * scène que je défendais.** *Un gradient n'a pas « une » opacité : citer
       * un seul de ses stops, c'est mesurer l'endroit où il n'y a rien.*
       *
       * Le fond devient donc un APLAT sombre + la lueur ember par-dessus : le
       * centre monte à α ≈ 0,80 (composition `.10` sur `.78`), les bords à
       * `.78` — uniforme, et partout plus sombre que la borne, ce que la
       * doctrine du S209 demandait déjà (*« un dé DÉCIDE et noircit le jeu
       * derrière lui ; une borne ANNONCE »*). L'ember garde sa place et son
       * rôle ; seule son assise change.
       */
      .dicelayer { position: fixed; inset: 0; z-index: 900; display: grid; place-content: center;
                   background:
                     radial-gradient(circle at 50% 44%,
                       rgba(199,74,18,.10) 0%, rgba(199,74,18,0) 62%),
                     /*
                      * ⛑⛑ **S1068 · NOTE 129 ④ — LE VOILE PASSE DE 78 % À
                      * 94 %.** Croze, image `02_premier_joueur_voile.png` :
                      * *« le fond n'est pas assez opaque, il ne l'est même pas
                      * du tout ; pousse beaucoup plus l'opacité »*. Sur sa
                      * capture, tout l'écran de jeu se lit à travers la scène —
                      * les fiches, les tuiles, le fil. Sa fourchette est
                      * 92–95 % ; on prend le milieu. *Une scène qui prend
                      * l'écran le PREND.*
                      */
                     rgba(10, 8, 6, .94);
                   cursor: pointer; animation: fadein .14s ease; }
      @keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
      /*
       * ═══ ⛑ S209 · LES DEUX BORNES DU TOUR — « en gros et en rouge » ═══════
       *
       * Note ⑫ ③. **Même couche, même sortie, même rouge que la face du dé** :
       * `--stamp`, l'encre. Le bandeau ne fabrique donc PAS une septième
       * surface — il réemploie `.dicelayer`, sa grille centrée, son scrim et
       * son `couperLeJet`. Seule la classe `borne` s'ajoute, et elle ne porte
       * que ce qui diffère : le rythme (deux temps, `BORNE`) et la typo.
       *
       * ⚠ **LE SCRIM ÉTAIT PLUS LÉGER, ET C'ÉTAIT VOULU** — jusqu'à ce que
       * Croze tranche l'inverse. La doctrine du S209 disait : *un dé DÉCIDE et
       * noircit le jeu derrière lui ; une borne ANNONCE et doit laisser voir le
       * plateau qu'elle borne* (`.86 → .55`, la lueur du centre retirée).
       *
       * ⛑⛑ **S926 — `Q-VOILE-BORNES`, RÉPONDUE : LES BANDEAUX PASSENT SOUS LE
       * VOILE AUSSI.** Note 111 ④, verbatim : *« le voile est posé, seuls les
       * bandeaux gardent un fond clair — **les bandeaux passent sous le voile
       * aussi** ; une scène de table est seule à l'écran, **sans exception** »*.
       * L'exception tombe donc : `.55 → .78`, l'alpha des jets.
       *
       * ⚠ **CE QUI NE CHANGE PAS : LA LUEUR RESTE RETIRÉE.** Croze tranche
       * l'OPACITÉ du voile, pas l'ember — qui est réservé au Collapse et qui
       * dit *« un dé décide »*. *Une réponse qui porte sur un axe ne se lit pas
       * sur les deux.*
       */
      .dicelayer.borne { background: rgba(10, 8, 6, .78); }
      /*
       * ⛑⛑ **S831 · `Q-SORTIE-COLLECTIVE` — LA BANNIÈRE, ET POURQUOI ELLE N'EST
       * PAS UN VOILE.**
       *
       * Croze prend la reco (note 100 ③) en nommant *« le même objet que la
       * bannière NEW DUNGEON TURN »* — donc `.borne`, son rythme et son bloc —
       * **et** *« pas de couche plein écran »*. Les deux ne peuvent pas tenir
       * ensemble : cet objet-là EST une couche. **J'ai gardé l'objet et changé
       * sa PEAU** — le voile part, la bande reste, et le reste de l'écran ne
       * s'éteint pas pour un fait qui tombe deux fois sur quarante parties
       * (loi 92 ①, *« de moins en moins d'info flood »*).
       *
       * ⚠ **`background: transparent` NE SUFFIT PAS** : sans fond, le bloc se
       * lirait sur le plateau. La bande est posée sur le BLOC, pas sur la
       * couche — c'est ce qui la distingue d'un voile, et c'est mesurable :
       * la couche laisse passer les clics du dessous ? non, elle les prend,
       * comme toute borne — *un clic coupe*, et c'est la règle de partout.
       */
      /*
       * ⚠⚠ **`align-items: flex-start` ÉTAIT UNE PROPRIÉTÉ DE FLEX POSÉE SUR UNE
       * GRILLE, ET LE CALCULÉ LA RENDAIT TELLE QUELLE.** `.dicelayer` est
       * `display: grid; place-content: center`. La règle était valide, lue au
       * `getComputedStyle` (`align-items: flex-start`, `padding-top: 151,2px`)
       * — **et le bloc restait à `y 552` au lieu de `y 151`**, parce que
       * `place-content` centre la GRILLE entière et qu'`align-items` ne touche
       * que l'item DANS sa piste. Mesuré : `151 + (929 − 126) / 2 = 552`, au
       * pixel près. *Une propriété valide qui ne fait pas ce qu'on croit se lit
       * au calculé comme une propriété qui marche* — c'est la POSITION RENDUE
       * qui l'a dit, jamais la règle.
       */
      .dicelayer.borne.sortie-collective { background: transparent;
        align-content: start; padding-top: 14vh; }
      .dicelayer.borne.sortie-collective .borne-bloc {
        background: linear-gradient(180deg, rgba(10, 8, 6, .92), rgba(10, 8, 6, .78));
        border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
        padding: 18px 42px; box-shadow: 0 18px 40px -18px #000; }
      /* La bande n'est pas un bandeau de tour : son titre tient la moitié. */
      .dicelayer.borne.sortie-collective .borne-titre {
        font-size: clamp(28px, 3.2vh, 48px); }
      /*
       * ═══ ⛑⛑ S1288 · K-T1 — LA MISE À MORT ═════════════════════════
       *
       * Les quatre temps du brief sont QUATRE CLASSES posées par
       * `poseLaMiseÀMort` — `t1 → t2 → t3 → t4` — et rien ici ne compte le
       * temps : *une durée s'écrit à UN endroit*, et c'est le rythme.
       *
       * ⚠ **LES COULEURS SONT CELLES DE `vfx.ts`, PAS DES MIENNES.** La table
       * `TEINTE` (`vfx.ts:50`) est le canon des sept peaux et elle sert déjà aux
       * planches jouées sur les cartons. En reprendre d'autres ici aurait donné
       * **deux feux de couleurs différentes dans la même seconde**. `FIRE` et
       * `LIGHTNING` y valent `null` (le pack est natif) : ces deux-là seules ont
       * leur valeur écrite ici, et le commentaire de la table dit pourquoi.
       */
      .mise-a-mort { --mam: var(--stock); }
      .mise-a-mort.ecole-physical  { --mam: #C9D3E0; }
      .mise-a-mort.ecole-arcane    { --mam: #B57BFF; }
      .mise-a-mort.ecole-chaos     { --mam: #FF4FD8; }
      .mise-a-mort.ecole-frost     { --mam: #9EE4FF; }
      .mise-a-mort.ecole-poison    { --mam: #8FE04A; }
      /* natives dans le pack : la teinte est à `null` là-bas, elle est ICI. */
      .mise-a-mort.ecole-fire      { --mam: #FF7A2F; }
      .mise-a-mort.ecole-lightning { --mam: #BFE9FF; }

      .mise-a-mort { grid-template-rows: auto auto auto auto; gap: clamp(6px, 1.2vh, 18px);
                     place-content: center; justify-items: center; }

      /* ① LE COUP FATAL — le nombre, énorme, dans la couleur de l'école. */
      .mam-fatal { text-align: center; opacity: 0; transform: scale(1.5);
                   transition: opacity .12s linear, transform .18s var(--pop); }
      .mise-a-mort.t1 .mam-fatal { opacity: 1; transform: none; }
      .mam-nombre { font-family: var(--display); font-weight: 800; line-height: .88;
                    font-size: clamp(96px, calc(var(--uvh) * 17), 260px);
                    color: var(--mam);
                    text-shadow: 0 4px 0 var(--ink), 0 18px 44px rgba(0,0,0,.8); }
      .mam-ecole { font-family: var(--display); letter-spacing: .22em;
                   font-size: clamp(12px, calc(var(--uvh) * 1.5), 22px);
                   color: var(--mam); opacity: .86; }
      .mam-mot { font-family: var(--display); font-weight: 800; letter-spacing: .34em;
                 font-size: clamp(18px, calc(var(--uvh) * 2.4), 40px);
                 color: var(--stock); }

      /*
       * ② LA FICHE FRAPPÉE — **SEPT GESTES, UN PAR ÉCOLE**, exactement ceux
       * que le brief énumère : lame = tranchée (deux moitiés qui glissent) · feu
       * = brûle · givre = se fend · foudre = grille · poison = se dissout ·
       * chaos = glitche · arcane = s'efface.
       *
       * ⚠ **LA COUPE EST UN `clip-path` SUR DEUX COPIES, pas une image.** Le
       * carton est la même source dessinée deux fois — `.mam-carton` porte la
       * moitié haute, `.mam-coupe` la basse — et seule la moitié basse glisse.
       * *Un trait peint par-dessus aurait barré la carte ; là, elle se sépare.*
       */
      .mam-fiche { position: relative; opacity: 0;
                   width: clamp(140px, calc(var(--uvw) * 13), 260px);
                   aspect-ratio: 1024 / 1536; }
      .mise-a-mort.t2 .mam-fiche { opacity: 1; }
      .mam-carton, .mam-coupe { position: absolute; inset: 0; overflow: hidden;
                                border: 1px solid var(--rule); background: var(--ink); }
      .mam-art { width: 100%; height: 100%; object-fit: cover; display: block; }
      .mam-carton-nom { position: absolute; inset: auto 0 0 0; padding: 3px 5px;
                        font-family: var(--display); letter-spacing: .08em;
                        font-size: clamp(9px, calc(var(--uvh) * 1.1), 14px);
                        color: var(--stock); background: rgba(11,11,11,.82); }
      /* La moitié basse est une COPIE : elle prend le même fond, sans l'art. */
      .mam-coupe { display: none; }

      /* lame — TRANCHÉE : deux moitiés, la basse glisse et tombe. */
      .ecole-physical .mam-carton { clip-path: polygon(0 0, 100% 0, 100% 46%, 0 54%); }
      .ecole-physical .mam-coupe {
        display: block; clip-path: polygon(0 54%, 100% 46%, 100% 100%, 0 100%);
        background: var(--ink); border-color: var(--mam); }
      .mise-a-mort.ecole-physical.t2 .mam-coupe {
        animation: mam-tranche .9s ease-in forwards; }
      @keyframes mam-tranche {
        from { transform: none; opacity: 1; }
        to   { transform: translate(14%, 26%) rotate(5deg); opacity: .25; } }

      /* feu — BRÛLE : les bords se consument, la carte noircit. */
      .mise-a-mort.ecole-fire.t2 .mam-carton {
        animation: mam-brule .9s ease-in forwards; }
      @keyframes mam-brule {
        from { filter: none;
               box-shadow: inset 0 0 0 0 var(--mam); }
        60%  { filter: brightness(1.3) saturate(1.4);
               box-shadow: inset 0 0 26px 10px var(--mam); }
        to   { filter: brightness(.2) saturate(.3);
               box-shadow: inset 0 0 60px 30px rgba(0,0,0,.9); } }

      /* givre — SE FEND : des fissures blanches, puis des éclats. */
      .mise-a-mort.ecole-frost.t2 .mam-carton {
        animation: mam-fend .9s steps(6, end) forwards; }
      @keyframes mam-fend {
        from { box-shadow: inset 0 0 0 0 var(--mam); transform: none; }
        50%  { box-shadow: inset 0 0 0 3px var(--mam); transform: translateX(-2px); }
        to   { box-shadow: inset 0 0 0 6px var(--mam); transform: translateX(2px);
               opacity: .3; } }

      /* foudre — GRILLE : un flash, puis des traces noires. */
      .mise-a-mort.ecole-lightning.t2 .mam-carton {
        animation: mam-grille .9s steps(8, end) forwards; }
      @keyframes mam-grille {
        0%   { filter: none; }
        20%  { filter: brightness(3.4) contrast(.6); }
        40%  { filter: brightness(.6); }
        60%  { filter: brightness(2.8) contrast(.7); }
        to   { filter: brightness(.25) contrast(1.8) grayscale(.7); } }

      /* poison — SE DISSOUT : des coulures vertes, le carton fond. */
      .mise-a-mort.ecole-poison.t2 .mam-carton {
        animation: mam-dissout .9s ease-in forwards; }
      @keyframes mam-dissout {
        from { filter: none; transform: none; }
        to   { filter: hue-rotate(58deg) saturate(1.8) blur(3px);
               transform: scaleY(1.09) translateY(5%); opacity: .28; } }

      /* chaos — GLITCHE : une déchirure, des pixels. */
      .mise-a-mort.ecole-chaos.t2 .mam-carton {
        animation: mam-glitche .9s steps(9, end) forwards; }
      @keyframes mam-glitche {
        0%   { transform: none; filter: none; }
        30%  { transform: translateX(-7%) skewX(-9deg); filter: hue-rotate(90deg); }
        55%  { transform: translateX(6%) skewX(7deg); filter: invert(1); }
        80%  { transform: translateX(-3%); filter: hue-rotate(260deg) saturate(2); }
        to   { transform: none; filter: none; opacity: .22; } }

      /* arcane — S'EFFACE : violet, il se dématérialise. */
      .mise-a-mort.ecole-arcane.t2 .mam-carton {
        animation: mam-efface .9s ease-out forwards; }
      @keyframes mam-efface {
        from { filter: none; transform: none; }
        to   { filter: saturate(.2) brightness(1.5) blur(6px);
               transform: scale(1.14); opacity: 0; } }

      /*
       * ③ LE BANDEAU — **EN PEINTURE BLANCHE**, la DA du kit
       * (`docs/HUD_PEINTURE_BLANCHE.md` : noir · blanc peint · sang seule
       * couleur). Le point, lui, est à l'encre rouge : c'est ce qui se GAGNE.
       */
      .mam-bandeau { text-align: center; opacity: 0; transform: translateY(8px);
                     transition: opacity .16s linear, transform .2s var(--pop); }
      .mise-a-mort.t3 .mam-bandeau { opacity: 1; transform: none; }
      .mam-tue { font-family: var(--display); font-weight: 800; letter-spacing: .08em;
                 font-size: clamp(26px, calc(var(--uvh) * 4.2), 68px); line-height: 1;
                 color: var(--stock);
                 text-shadow: 0 3px 0 var(--ink), 0 12px 26px rgba(0,0,0,.75); }
      .mam-point { font-family: var(--display); font-weight: 800; letter-spacing: .18em;
                   font-size: clamp(16px, calc(var(--uvh) * 2.6), 40px);
                   color: var(--rouge-vif); margin-top: 2px; }

      /* ④ LA DÉPOUILLE — ce qui tombe se pose devant. */
      .mam-depouille { display: flex; gap: 8px; align-items: baseline;
                       opacity: 0; transform: translateY(6px);
                       transition: opacity .16s linear, transform .2s var(--pop); }
      .mise-a-mort.t4 .mam-depouille { opacity: 1; transform: none; }
      .mam-depouille-cap { font-family: var(--display); letter-spacing: .14em;
                           font-size: clamp(9px, calc(var(--uvh) * 1.1), 14px);
                           color: var(--stock-dim); }
      .mam-depouille-dit { font-family: var(--mono);
                           font-size: clamp(11px, calc(var(--uvh) * 1.4), 17px);
                           color: var(--stock); }

      .borne-bloc { text-align: center; opacity: 0; transform: scale(.86);
                    transition: opacity .18s ease, transform .22s var(--pop); }
      .dicelayer.borne.t1 .borne-bloc, .dicelayer.borne.fini .borne-bloc {
        opacity: 1; transform: none; }
      /*
       * ⛑⛑ **S547 — « DÉBUT DE TOUR » ÉTAIT À `2,04` DE CONTRASTE, EN 69 px, ET
       * LE JOUEUR LE LIT À CHAQUE TOUR.**
       *
       * Trouvé par le balayeur d'états (`population`, sonde `contraste`, ancre
       * `COMBAT_OPENED`) : **14 états sur 14**. Mesuré au grain sur le nœud
       * réel, `?seed=1&fait=COMBAT_OPENED&automates=UNIFORM` —
       * encre `rgb(139,13,13)` sur un fond composé `rgb(10,9,8)`, `69,12 px`,
       * **ratio `2,04` pour un seuil de 3**.
       *
       * C'est la troisième fois de la même famille (S536 la palette, S545 la
       * bulle du ruban) : `--stamp` est le rouge des APLATS et du carton
       * CLAIR ; posé en ENCRE sur un noir il ne se lit pas. La couche de bornes
       * est un voile `rgba(10,8,6,.55)` sur l'écran sombre — donc un noir.
       *
       * ⚠ **ET LE `text-shadow` DE `--ink` NE RATTRAPAIT RIEN** : son halo est
       * la couleur du fond. *Une ombre de la couleur du fond n'ajoute pas de
       * contraste, elle en retire* — même phrase qu'au S545, même faute, deux
       * paliers d'écart.
       */
      .borne-titre { font-family: var(--display); font-weight: 800;
                     font-size: clamp(54px, calc(var(--uvh) * 6.4), 96px); line-height: 1;
                     letter-spacing: .06em; color: var(--rouge-vif);
                     text-shadow: 0 3px 0 var(--ink), 0 14px 30px rgba(0,0,0,.7); }
      .borne-siege { font-family: var(--display); font-size: 20px;
                     letter-spacing: .22em; text-transform: uppercase;
                     color: var(--stock); margin-top: 10px; }
      /* ⛑ S415 — la CAUSE sous la conséquence (note ㊳ ⑥). Le ton du refus
         (`--stamp`) plutôt que celui du siege : ce n'est pas une information
         de plus, c'est ce qui explique pourquoi rien n'a été demandé. */
      /*
       * ⛑ **S547 — MÊME COUPLE, SEUIL PLUS HAUT.** Cette ligne porte la MÊME
       * encre sur la MÊME couche que `.borne-titre` — mesuré à `2,04` — mais
       * en `15 px`, donc pour un seuil de `4,5`. Elle passe au rouge d'encre
       * avec sa voisine. ⚠ **Je n'ai pas pu l'amener à l'écran** (elle ne
       * paraît que sur une borne à CAUSE, note ㊳ ⑥) : le chiffre est déduit
       * du couple mesuré, pas relevé sur ce nœud-là, **et je le dis** plutôt
       * que de laisser croire à deux mesures.
       */
      .borne-cause { font-family: var(--display); font-size: 15px;
                     letter-spacing: .14em; text-transform: uppercase;
                     color: var(--rouge-vif); margin-top: 12px; opacity: .92; }
      /*
       * ⛑⛑ S1080 — LA PILE AU MILIEU (note 130 ⑧ de Croze) : la carte jouée
       * en grand, la réponse à côté avec son siège, le signe du contre entre
       * les deux.
       *
       * ⚠ **AUCUNE UNITÉ DE FENÊTRE ICI** — `vw`/`vh` fuient hors du verrou de
       * 1080 (S1071, mesuré : c'est par là que la grille de sélection sortait
       * du cadre). Les tailles sont en `px` de la composition logique, et la
       * mise à l'échelle uniforme s'en charge.
       *
       * ⚠ **`min-width: 0` SUR LES DEUX BOÎTES** : un nom de carte est un mot
       * long et insécable ; sans lui une grille flex refuse de le rétrécir et
       * le duo pousse la couche hors du cadre.
       */
      .pile-duo { display: flex; align-items: stretch; justify-content: center;
                  gap: 28px; margin-top: 28px; max-width: 1180px; }
      .pile-carte { flex: 1 1 0; min-width: 0; padding: 22px 20px;
                    border: 2px solid var(--stock);
                    background: rgba(10, 8, 6, .55); }
      .pile-carte.pile-reponse { border-color: var(--rouge-vif); }
      .pile-nom { font-family: var(--display); font-weight: 800;
                  font-size: 34px; line-height: 1.1; color: var(--stock);
                  overflow-wrap: anywhere; }
      /* La carte ANNULÉE porte sa marque sur son NOM — qu'elle soit rendue en
         entier (`.butin-nom`, la fabrique du butin) ou réduite à son nom quand
         l'identité n'a pas pu se joindre (`.pile-nom`). */
      .pile-carte.pile-jouee .pile-nom,
      .pile-carte.pile-jouee .butin-nom { text-decoration: line-through;
                                          opacity: .72; }
      .pile-role { font-family: var(--display); font-size: 14px;
                   letter-spacing: .22em; text-transform: uppercase;
                   color: var(--rouge-vif); margin-top: 10px; }
      .pile-signe { font-family: var(--display); font-size: 52px;
                    align-self: center; color: var(--rouge-vif); }
      /* (6) note 140 - LA PROMESSE QUI ARRIVE, verbatim Croze : *« la bandage
         card s'affiche par-dessus ma tuile et CLIGNOTE pour me le rememorer »*.
         Le clignotement est une OPACITE, jamais un `display` : un noeud qui
         disparait et revient relance ses propres animations, et la carte
         rejouerait son entree six fois. SIX battements de 460 ms, puis elle
         se pose a `opacity: 1` - *un clignotement qui ne s'arrete pas cesse
         d'etre un rappel.*
         (5) S1152 - CE COMMENTAIRE DISAIT « Trois battements » ET SA PROPRE
         REGLE EN DIT SIX, trois lignes plus bas. Mesure au navigateur par
         `getComputedTiming()` sur la vraie couche : iterations 6, duration
         460, activeDuration 2760, playState `finished`, repos `opacity 1`.
         *Un commentaire qui decrit un COMPORTEMENT ne vieillit pas, il
         MENT* - et celui-ci se lit comme la specification du reglage. */
      .promesse-carte { max-width: 560px; margin: 28px auto 0;
                        border-color: var(--rouge-vif);
                        animation: promesse-bat .46s steps(1) 0s 6 both; }
      @keyframes promesse-bat { 0%, 100% { opacity: 1 } 50% { opacity: .18 } }
      @media (prefers-reduced-motion: reduce) {
        .promesse-carte { animation: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        .borne-bloc { transition: opacity .18s ease; transform: none; }
      }

      /*
       * ═══ ⛑ S437 · LA SCÈNE DU TIRAGE — note ㊷ ═══════════════════════════
       *
       * *« la scène montre LE TIRAGE (la tuile piochée se révèle, sa
       * respiration) »*. Elle RÉEMPLOIE `.dicelayer` — sa grille centrée, son
       * scrim, son `couperLeJet` — et le scrim allégé de `.borne` : une tuile
       * qui se révèle ne DÉCIDE rien, elle montre où l'on arrive.
       *
       * ⚠ **TRANSFORM ET OPACITY SEULEMENT** (`RELANCE ①`). La révélation est
       * une montée d'échelle et un fondu : aucune propriété de mise en page
       * n'est touchée, donc aucun reflow.
       *
       * ⚠ **ET LA RESPIRATION S'ARRÊTE SEULE.** Une boucle sur une couche qui
       * vit 1 100 ms serait un clignotement, pas un souffle : `.t1` pose l'état
       * d'arrivée, et la transition l'y mène UNE fois.
       */
      /*
       * ⛑ **S926 — LE TIRAGE SUIT LA BORNE**, dont il réemploie le scrim depuis
       * sa naissance : *« une scène de table est seule à l'écran, sans
       * exception »* (note 111 ④). Il aurait été le dernier `.55` du fichier,
       * et *une exception qui survit à la règle qui l'a créée se lit comme un
       * oubli.*
       */
      .dicelayer.tirage { background: rgba(10, 8, 6, .78); }
      .tirage-bloc { text-align: center; opacity: 0; transform: scale(.88);
                     transition: opacity .20s ease, transform .34s var(--pop); }
      .dicelayer.tirage.t1 .tirage-bloc, .dicelayer.tirage.fini .tirage-bloc {
        opacity: 1; transform: scale(1); }
      .tirage-bloc .cz-vignette { width: auto; height: min(46vh, 900px); }
      .tirage-nom { font-family: var(--display); font-weight: 800;
                    font-size: clamp(28px, 3.4vh, 52px); line-height: 1.05;
                    letter-spacing: .04em; color: var(--stock); margin-top: 14px;
                    text-shadow: 0 3px 0 var(--ink), 0 14px 30px rgba(0,0,0,.7); }
      .tirage-deck { font-family: var(--display); font-size: 15px;
                     letter-spacing: .18em; text-transform: uppercase;
                     color: var(--stamp); margin-top: 10px; opacity: .92; }
      @media (prefers-reduced-motion: reduce) {
        .tirage-bloc { transition: opacity .20s ease; transform: none; }
        .dicelayer.tirage.t1 .tirage-bloc { transform: none; }
      }

      /*
       * ═══ ⛑ S258 · LE COUP DU MOB — note ⑱ ⑤ ═══════════════════════════════
       *
       * *« le NOM de l'attaque + ses dégâts, EN GROS, comme un résultat de
       * dé. »* Le rythme et l'animation sont **ceux de la borne, repris en
       * entier** (`§3ter`) : mêmes classes `t1` / `fini`, même pop.
       *
       * ⚠ **LE CHIFFRE PREND `--stamp`, ET C'EST LA CONVENTION DU S209** —
       * *« chaque résultat de dé prend l'écran en grand et en ROUGE »*. Le NOM,
       * lui, prend l'encre du carton (`--stock`) : deux tailles, deux rôles,
       * une seule encre vive. **L'ember n'entre pas** — il est au Collapse.
       */
      /*
       * ═══ ⛑ S259 · L'AIDE « C'EST À TOI » — note ⑱ ⑥ ═══════════════════════
       *
       * Elle vit DANS le bandeau `À TOI`, à sa droite : *l'aide répond à la
       * question que le bandeau vient de poser* — la mettre ailleurs en ferait
       * un second bloc à trouver.
       *
       * ⚠ **TROIS TEINTES, TROIS NATURES, ET AUCUNE NEUVE.** `ok` prend le vert
       * jouable (`--activable`, la réserve de `§2`) ; `no` prend l'encre
       * éteinte du stock ; `regle` prend l'italique du stock — *ce qui n'est pas
       * lu ne se déguise pas en mesure.* Ni ember, ni rouge : rien ici n'est un
       * refus ni un Collapse.
       */
      .cf-aide { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px;
                 margin-left: auto; font-size: 12px; letter-spacing: .04em; }
      .cf-aide > span::before { content: '· '; color: var(--stock-dim); }
      .cf-aide .ok { color: var(--activable); }
      .cf-aide .no { color: var(--stock-dim); text-decoration: line-through; }
      .cf-aide .regle { color: var(--stock-dim); font-style: italic; }

      .cm-bloc { text-align: center; opacity: 0; transform: scale(.86);
                 transition: opacity .18s ease, transform .22s var(--pop); }
      .dicelayer.coup-mob.t1 .cm-bloc, .dicelayer.coup-mob.fini .cm-bloc {
        opacity: 1; transform: none; }
      .cm-mob { font-size: 13px; letter-spacing: .22em; text-transform: uppercase;
                color: var(--stock-dim); margin-bottom: 6px; }
      .cm-nom { font-family: var(--display); font-weight: 800;
                font-size: clamp(34px, 4.2vh, 60px); line-height: 1.05;
                letter-spacing: .04em; text-transform: uppercase; color: var(--stock);
                text-shadow: 0 3px 0 var(--ink), 0 14px 30px rgba(0,0,0,.7); }
      .cm-degats { display: flex; align-items: baseline; justify-content: center;
                   gap: 10px; margin-top: 8px; }
      .cm-n { font-family: var(--display); font-weight: 800;
              font-size: clamp(56px, 7vh, 104px); line-height: 1; color: var(--stamp);
              text-shadow: 0 3px 0 var(--ink), 0 14px 30px rgba(0,0,0,.7); }
      .cm-lbl { font-size: 15px; letter-spacing: .24em; color: var(--stock-dim); }
      .cm-cible { margin-top: 10px; font-size: 16px; letter-spacing: .1em;
                  color: var(--stock); }
      @media (prefers-reduced-motion: reduce) {
        .cm-bloc { transition: opacity .18s ease; transform: none; }
      }
      /* Il REND l'écran : la couche sort, elle ne s'installe pas. */
      .dicelayer.sort { opacity: 0; transition: opacity .2s ease; pointer-events: none; }
      .dicelayer .rollcap { font-size: 12px; letter-spacing: .22em; text-transform: uppercase;
                            color: var(--stock-dim); text-align: center; margin-bottom: 18px; }
      .dgroup { display: flex; gap: 10px; justify-content: center;
               align-items: center; }
      /*
       * ⛑ S854 — le mot entre les deux dés d'un jet opposé (note 108 ⑥).
       * Petit et en `--slate` : les DÉS sont le fait, ce mot n'est qu'une
       * charnière — *deux choses de même poids se lisent comme deux faits.*
       */
      .dgroup-vs { font-family: var(--display); font-weight: 800; font-size: 11px;
                   letter-spacing: .12em; color: var(--slate); text-transform: uppercase; }
      /*
       * Un vrai dé de la boîte : carton et encre. Pas une gemme.
       *
       * ⛑ **S209 — L'ENCRE PASSE AU ROUGE.** Note ⑫ ③, verbatim Croze :
       * *« afficher en gros et en rouge le résultat des dés systématiquement ».*
       *
       * ⚠ **« EN GROS » ÉTAIT DÉJÀ SERVI, ET JE L'AI MESURÉ AVANT DE TOUCHER**
       * — `118 × 118`, police `70px`, sur une couche plein écran (relevé du
       * S165, re-lu ici). **Ce qui manquait était la COULEUR, et elle seule.**
       * Le `.total`, lui, était rouge depuis toujours (`--ember`, 62px) : la
       * consigne portait donc sur la FACE.
       *
       * ⚑ **`--stamp` ET NON `--ember`, ET C'EST UN CHOIX QUI SE DIT.** `--ember`
       * est *« ce qui brûle : le moment, le total »* — l'étendre à chaque face
       * de chaque dé de la partie diluerait la teinte du Collapse jusqu'à ce
       * qu'elle ne signale plus rien. `--stamp` (#A32C25) est le rouge d'ENCRE
       * de la palette, et sur le carton `--stock` il rend **6,6:1** — au-dessus
       * du seuil de TEXTE COURANT, quand `--ember` n'y tiendrait que le seuil
       * « grand texte ». *Deux rouges, deux métiers : la face est tamponnée,
       * le total brûle.* Aucun septième rouge n'est inventé.
       */
      .die { width: 118px; height: 118px; display: grid; place-content: center;
             background: var(--stock); color: var(--stamp); border: 2px solid var(--ink);
             box-shadow: 0 14px 26px -12px #000;
             font-family: var(--display); font-weight: 800; font-size: 70px; line-height: 1;
             opacity: 0; transform: scale(.4) rotate(-220deg); }
      .dicelayer.t1 .die, .dicelayer.fini .die {
        opacity: 1; transform: none; transition: opacity .18s ease, transform .5s var(--pop); }
      /*
       * ═══ ⛑⛑⛑ S1155 · UN DÉ POSÉ HORS D'UNE COUCHE DE SCÈNE ÉTAIT INVISIBLE,
       * ET QUATRE L'ÉTAIENT À L'ÉCRAN ═══════════════════════════════════════
       *
       * Les deux déclarations au-dessus sont l'ENTRÉE de la scène de dés : le
       * repos (`opacity: 0`, `scale(.4) rotate(-220deg)`) et son ouverture,
       * **qui n'existe que sous `.dicelayer`**. Un `.die` bâti ailleurs — dans
       * une fenêtre de réaction, dans une colonne, dans un panneau de décision —
       * n'a donc **aucune règle qui l'ouvre**, et il reste sur son premier
       * cadre POUR TOUJOURS.
       *
       * ⚠⚠ **MESURÉ, peau JOUEUR, 1920×1080, `?etat=collapse-reaction&siege=Joueur 4`** :
       *
       * ```
       *   .die dans .fen-de        « ① le jet · 1d8 — tombé sur 4 »   opacity 0
       *     son image /dice/bones/d8_face_4.webp est CHARGÉE (256 px)  opacity 1
       *   .die mini dans .tv-jet   « dernier jet d'action de ce siège » × 3  opacity 0
       *   ────────────────────────────────────────────────────────────────────
       *   4 dés peints · 0 dans une .dicelayer · 4 à opacity 0
       * ```
       *
       * Le premier est le **R1 du PLAN_SÉQUENCEMENT** — *« le JET, dans la
       * fenêtre, avec la peau de dé de ton siège »* — publié LIVRÉ au tableau
       * de bord. *Un nœud présent n'est pas une encre vue*, et **un filtre
       * d'opacité range un défaut dans « jamais rendu » sans rien faire
       * rougir** : ni le typecheck, ni un banc, ni `balayage_geometrie` (le
       * nœud est dans la fenêtre, à la bonne place, avec la bonne taille).
       *
       * ⚑ **LA RÈGLE EST À SPÉCIFICITÉ MOINDRE QUE CELLES DE LA COUCHE**
       * (`.die:not(.dicelayer *)` = 0,2,0 · `.dicelayer.t1 .die` = 0,3,0) :
       * l'entrée de la scène garde donc son animation, intacte, et seul ce qui
       * vit HORS d'une couche s'allume. *On ouvre ce qui n'a pas d'entrée à
       * jouer ; on ne force pas celle des autres.*
       */
      .die:not(.dicelayer *) { opacity: 1; transform: none; }
      /*
       * ⛑⛑ S1155 · NOTE 140 ⑤ — LE DÉ QU ON DÉSIGNE EST UN DÉ, PAS UNE LIGNE.
       * Croze : « avoir les dés en image à l écran et cliquer sur celui qu on
       * veut changer ». Le bouton porte donc le dé PEINT (peau du siège, face
       * publiée) et garde le libellé du moteur dessous — l image DOUBLE la
       * phrase, elle ne la remplace pas.
       */
      .des-offerts { display: flex; gap: 14px; flex-wrap: wrap; align-items: stretch; }
      .de-offert { display: grid; justify-items: center; align-content: center;
                   gap: 8px; padding: 12px 16px; }
      .de-offert .die { width: 84px; height: 84px; font-size: 48px; }
      .de-offert-dit { font-size: 13px; line-height: 1.3; }
      /*
       * ═══ SIX TAILLES, SIX FORMES ═══════════════════════════════════════
       *
       * Croze : « 1d10 ressemble à un cube à l'écran ». Population du
       * classeur, 470 occurrences : d20 178 · d6 110 · d4 79 · d10 39 ·
       * d12 39 · d8 25. **Six tailles, aucune autre**, et le d6 n'est que le
       * deuxième — un cube pour tout est faux plus de huit fois sur dix.
       *
       * La silhouette est celle de la table : triangle, carré, losange,
       * cerf-volant, pentagone, hexagone. `data-faces` est posé depuis le
       * `die` PUBLIÉ ; **sans lui, aucune forme** — le carré neutre reste, et
       * il ne prétend rien.
       *
       * Le `clip-path` ne change ni la taille ni la police : le CHIFFRE reste
       * la chose qu'on lit, la forme dit seulement quel dé l'a produit.
       */
      .die[data-faces="4"]  { clip-path: polygon(50% 4%, 96% 92%, 4% 92%); }
      .die[data-faces="6"]  { clip-path: none; }
      .die[data-faces="8"]  { clip-path: polygon(50% 2%, 96% 50%, 50% 98%, 4% 50%); }
      .die[data-faces="10"] { clip-path: polygon(50% 2%, 94% 38%, 50% 98%, 6% 38%); }
      .die[data-faces="12"] { clip-path: polygon(50% 2%, 97% 37%, 79% 96%, 21% 96%, 3% 37%); }
      .die[data-faces="20"] { clip-path: polygon(50% 2%, 93% 26%, 93% 74%, 50% 98%, 7% 74%, 7% 26%); }
      /* Les formes pointues rognent les coins : le chiffre se resserre. */
      .die[data-faces="4"]  { font-size: 46px; align-content: end; padding-bottom: 8px; }
      .die[data-faces="8"], .die[data-faces="10"] { font-size: 54px; }

      /*
       * ═══ ⑧ LE RENDU LIVRÉ PREND LA PLACE DE LA SILHOUETTE ══════════════
       *
       * `die-rendue` n'est posée qu'au `onload` de l'image : **tant que le
       * rendu n'est pas là, rien ne bouge** — ni le carton, ni le clip-path, ni
       * le chiffre. Un dé sans render reste exactement le dé d'avant.
       *
       * ⚠ **LE CHIFFRE S'EFFACE, IL NE DISPARAÎT PAS DU DOM** : la face est
       * dessinée sur l'image, l'écrire par-dessus serait `§0.1 ⑤`. Mais elle
       * reste lisible aux lecteurs d'écran et au relevé — *on retire une
       * DUPLICATION visuelle, pas une information.*
       */
      /*
       * ⑤ — **LE GRAS EST TYPOGRAPHIQUE, PAS UNE COULEUR.**
       *
       * Croze : *« les nombres en gras typographique »*. C'est la GRAISSE et le
       * chiffre tabulaire qui portent le signal — **aucune teinte** : les
       * quatre réservations de `§2` sont prises, et `#7FB069` appartient au
       * JOUABLE. Un nombre coloré en vert dirait « activable », ce qu'il n'est
       * pas.
       *
       * `font-variant-numeric: tabular-nums` : dans un fil qui empile des
       * grandeurs, des chiffres de largeurs différentes font danser la colonne.
       */
      .fil .n, #log .n { font-weight: 700; font-variant-numeric: tabular-nums;
                         color: var(--stock); }

      /*
       * ⚑ L'ANNONCE DU SUIVI — elle doit se voir SANS crier.
       *
       * ⚠ **Pas de teinte réservée** : ni l'ember du Collapse, ni le rouge du
       * refus, ni l'or du portail, ni le vert du jouable. Ce n'est pas un fait
       * de JEU — c'est l'instrument qui dit ce qu'il vient de faire. Il prend
       * donc l'ardoise (`--slate`), la seule teinte de la palette qui ne porte
       * aucune réservation.
       *
       * Le COMPTE est en chiffre tabulaire et plus gras que le trajet : c'est
       * lui qu'on lit d'un coup d'œil, le trajet ne se lit qu'ensuite.
       */
      .suivi-annonce { display: inline-flex; align-items: baseline; gap: 6px;
                       padding: 2px 7px; border: 1px solid var(--slate);
                       font-family: var(--mono); font-size: 10px; }
      .suivi-n { font-weight: 700; font-variant-numeric: tabular-nums;
                 color: var(--slate); letter-spacing: .04em; }
      .suivi-trajet { color: var(--stock-dim); }

      /*
       * `PDF` planche 3 — **LE CADRE `WIN`.**
       *
       * Les deux camps vivaient côte à côte sans boîte : il n'y avait rien à
       * encadrer. `.camp` les sépare, `.camp-win` désigne.
       *
       * ⚠ **Le cadre ne déplace RIEN** — la bordure est posée sur les deux camps,
       * transparente sur le perdant. Sans ça, la ligne sauterait d'un pixel
       * quand le vainqueur change de côté, et *un fil qui danse se relit mal.*
       */
      .camp { display: inline-flex; align-items: center; gap: 6px;
              border: 1px solid transparent; padding: 1px 5px; }
      .camp-win { border-color: var(--win); }
      .win-tag { font-size: 9px; font-weight: 700; letter-spacing: .18em;
                 color: var(--win); }

      /*
       * ⚑ L'ÉPINGLE — MÊME FAMILLE QUE L'ANNONCE, MÊME ARDOISE.
       *
       * Le bouton du suivi CHANGE DE PEAU quand il tient : cadre et texte
       * passent à `--slate`. Pas un badge de plus à côté de lui — *deux
       * écritures du même état finiraient par se contredire, et `§0.1 ⑤` classe
       * la seconde comme une COPIE.* L'état est sur le bouton, une seule fois.
       *
       * ⚠ **AUCUNE RÉSERVATION TOUCHÉE** : l'ember reste au Collapse, le rouge
       * au refus, l'or au portail, le vert au jouable. L'épingle n'est pas un
       * fait de JEU — c'est l'instrument qui dit qu'il tient. Une teinte de jeu
       * la ferait lire comme un état de partie.
       *
       * Le `:hover` de `button` reste au-dessus (spécificité 0,2,1 contre
       * 0,1,1) : l'ardoise dit l'état, elle ne coûte pas le retour au survol.
       */
      button.suivi-epingle { color: var(--slate); border-color: var(--slate); }

      .die { position: relative; }
      .die-rendu { position: absolute; inset: 0; width: 100%; height: 100%;
                   object-fit: contain; pointer-events: none; }
      .die.die-rendue { background: transparent; border-color: transparent;
                        box-shadow: none; clip-path: none; color: transparent; }
      /*
       * L'ombre livrée, sous le dé et jamais dessus. Elle est à `45 %` de semi
       * transparence sur toute sa surface — la poser en `background` du bloc
       * suffit, aucune teinte à lui appliquer.
       */
      .die.die-rendue::before { content: ""; position: absolute; inset: -6% -6% -14%;
                                background: url("dice/die_shadow.png") center/contain no-repeat;
                                opacity: .55; z-index: -1; }
      /*
       * ⑧ — **LA TEINTE DU SIÈGE EST UN HALO, PAS UN FILTRE.** Un `hue-rotate`
       * retournerait le rendu ; on pose donc la couleur DERRIÈRE, et les pixels
       * passent intacts.
       *
       * ⛑ **S535 — CE COMMENTAIRE DISAIT *« le rim violet du rendu est VOULU
       * (raccord slides) »*, ET CE N'EST PLUS VRAI.** Verdict Croze du 28/08,
       * postérieur au raccord : *« le dé passe en pierre brute — plus rocky »*.
       * La peau servie (`/dice/pierre/`, `tools/peau_pierre.py`) prend sa chroma
       * dans sa référence de pierre : l'écart chromatique tombe de ~50 à ~14, le
       * rim violet avec. **La source PNG est intacte** — le raccord slides se
       * retrouve en une ligne. *Une référence n'est pas périmée parce qu'on s'en
       * éloigne : elle l'est quand personne n'écrit qu'on s'en éloigne exprès.*
       */
      .die.die-teinte.die-rendue { filter: drop-shadow(0 0 7px var(--teinte-siege)); }
      /* Sans rendu, le halo ne peut pas se lire : c'est le liseré qui le porte. */
      .die.die-teinte:not(.die-rendue) { border-color: var(--teinte-siege); }

      /*
       * ═══ ⚑ S71 — LE ROULÉ, ET IL TIENT LE SILENCE DE `t1` À `t2` ════════
       *
       * Croze a livré **36 images de roulé par taille** en même temps que les
       * faces. Les faces étaient lues ; le roulé ne l'était par personne — et
       * le PDF cible s'appelle `UI_CARD_DRAW_AND_ROLL`. Le dé entrait à `t1`
       * en montrant DÉJÀ sa face, puis plus rien pendant 1 120 ms.
       *
       * **La bande est UNE image de 36 vignettes** (`tools/planche_des.py`),
       * et le défilement est un `translateX` en `steps(36)` — *jamais un
       * `background-position` : la règle maison est transform/opacity only, et
       * elle vaut aussi pour ce qui a l'air d'un décor.*
       *
       * ⚑ **S462 — `--roule-passe` ET `--roule-tours` viennent de
       * `poseLesTroisTemps`.** La PASSE est la cadence du dé et ne bouge
       * jamais ; les TOURS sont ce que la fenêtre en contient, et ce sont eux
       * que `avec-seuil` et le ×3 de la note ㊹ ① font monter. Les replis
       * (`1120ms`, `1`) ne valent que pour un dé rendu hors couche.
       */
      /*
       * ═══ ⛑ S152 · LA SCÈNE D'UN AUTRE SIÈGE ══════════════════════════════
       *
       * Spec Croze : *« l'afficher EN GROS à la place de sa tuile »*. Le mot
       * est « en gros » : le nom prend la taille d'un titre, pas d'une légende.
       * **transform/opacity only** pour l'entrée — la règle gravée — et aucune
       * dimension en dur : la scène tient la case que la tuile occupait.
       *
       * ⚠ **LE VERT `#7FB069` N'EST PAS ICI, ET C'EST UNE RÉSERVE.** Il dit
       * *« cette carte, TU peux la jouer »* ; le poser sur le geste d'un AUTRE
       * siège le dépenserait pour dire le contraire. Le liseré est neutre, et
       * c'est la teinte du siège — déjà portée par son nom — qui identifie.
       */
      /*
       * ═══ ⛑⛑ S518 · « EN GROS », ET C'ÉTAIT 11 % — note 54 ② ════════════════
       *
       * La scène PREND DÉJÀ la place de la tuile depuis le S152 (*« faut
       * l'afficher en gros à la place de sa tuile »*). Croze le redemande dans
       * sa note 54 ②, et la mesure lui donne raison sans appel — même bloc,
       * même siège, l'un remplaçant l'autre :
       *
       * ```
       * .tv-art    (la tuile, au repos)   216 × 324      colonne large
       * .tv-scene  (ce qu'il fait)        315 ×  37      ← 11 % de la hauteur
       * .tv-art                            58 ×  87      colonne étroite
       * .tv-scene                          55 ×  37
       * ```
       *
       * **La scène tenait dans un onzième de ce qu'elle remplace.** *« À la
       * place de » avait été tenu ; « en gros » ne l'avait jamais été.*
       *
       * ⚠ **AUCUN PIXEL ÉCRIT : `aspect-ratio` REPREND L'EMPREINTE DE LA
       * TUILE.** Les deux colonnes n'ont pas la même largeur (216 et 58), et
       * une hauteur en dur aurait été juste dans l'une et fausse dans l'autre —
       * la faute que le S517 vient de payer sur `--h-bandeau`. Le rapport
       * `2 / 3` est celui de la tuile elle-même, dans les deux relevés
       * ci-dessus (216×324 et 58×87). *Ce qui remplace une chose en prend
       * l'empreinte, il ne la redéclare pas.*
       *
       * ⚠ **ET LE TEXTE SUIT LA BOÎTE, PAS L'ÉCRAN.** `container-type:
       * inline-size` fait de la scène son propre repère : les `cqw` grandissent
       * avec la colonne. Le `clamp` garde un plancher lisible dans la colonne
       * étroite (55 px de large) et un plafond qui n'écrase pas la large.
       */
      /*
       * ⚑⚑ S633 — `M-S518`, CE QUE L'AUTRE SIÈGE FAIT (note 54 ② de Croze,
       * blocage n° 2). Elle partage la boîte de `.tv-scene` — *c'est le même
       * moment de lecture*, la place de la tuile — et ne change que le POIDS :
       * l'ordre dit **« EN GROS »**, et une activité qui se lit comme une
       * légende n'obéirait pas à l'ordre.
       *
       * ⚠ **AUCUNE COULEUR DE SIÈGE ICI.** Les quatre teintes IDENTIFIENT un
       * joueur (`§2`) ; la vignette porte déjà la sienne. En reprendre une pour
       * dire un ÉTAT ferait dire deux choses à une seule encre.
       */
      .tv-activite .tv-act-tete { font-family: var(--display); font-weight: 800;
        font-size: clamp(9px, calc(var(--uvw) * .78), 12px); letter-spacing: .12em;
        color: var(--activable); }
      .tv-activite .tv-act-nom { font-weight: 700;
        font-size: clamp(11px, calc(var(--uvw) * 1), 15px); text-align: center; line-height: 1.15; }
      /*
       * ⚑ S635 — `M-S633` : LA CARTE DU MOB, ET « EN GROS » EST L'ORDRE.
       *
       * ⚠⚠ **PREMIER JET MESURÉ : 109 × 65 px pour une carte 1024 × 1536.** La
       * ligne était un `flex` en RANGÉE (art, nom, PV côte à côte) et l'art
       * plafonné à `116px` / `34%` : `contain` le rendait alors en ~43 × 65,
       * c'est-à-dire une vignette. *Un ordre qui dit « EN GROS » se mesure en
       * pixels, pas en intention.*
       *
       * La ligne passe donc en COLONNE — la carte au-dessus, le nom et les PV
       * dessous —, et l'art prend la place qu'il y a. `contain` le laisse
       * ENTIER plutôt que de le rogner : c'est une carte, elle se lit.
       */
      .tv-activite .tv-act-art { width: 100%; max-width: 200px; height: auto;
        max-height: 260px; object-fit: contain; display: block; margin: 0 auto 4px;
        border-radius: 4px; }
      .tv-activite .tv-act-mob { display: flex; flex-direction: column; gap: 2px;
        align-items: center; justify-content: center; }
      /* Les PV en second plan : le NOM est ce qu'on lit d'abord. */
      .tv-activite .tv-act-pv { font-variant-numeric: tabular-nums;
        font-size: clamp(9px, calc(var(--uvw) * .8), 12px); opacity: .85; }
      .tv-scene { display: grid; gap: 2px; place-content: center; justify-items: center;
                  text-align: center; width: 100%; aspect-ratio: 2 / 3;
                  container-type: inline-size;
                  /*
                   * ⚠⚠ **L'EMPREINTE EST UN PLANCHER, PAS UN PLAFOND — ET LE
                   * PREMIER JET EN FAISAIT UN PLAFOND.** `aspect-ratio` seul
                   * fixe la hauteur à `largeur × 3/2` : dans la colonne
                   * étroite (`55 × 82`), le nom débordait de sa boîte sur les
                   * quatre états mesurés, et `overflow: hidden` l'aurait
                   * simplement COUPÉ — c'est-à-dire caché le seul mot que
                   * Croze demande de montrer. `min-height: min-content` rend
                   * le ratio à son rôle : *ce qui remplace une tuile en prend
                   * au moins la place, jamais au plus.*
                   */
                  height: auto; min-height: min-content;
                  padding: 4px 2px; border: 1px solid color-mix(in srgb, var(--ink) 35%, transparent);
                  border-radius: 3px; animation: tv-scene-entre .22s ease both; }
      @keyframes tv-scene-entre { from { opacity: 0; transform: scale(.94); }
                                  to   { opacity: 1; transform: none; } }
      .tv-scene-quoi { font-size: clamp(9px, 4.5cqw, 15px); letter-spacing: .16em;
                       text-transform: uppercase; opacity: .7; }
      /*
       * ⚠⚠ **`overflow-wrap: anywhere` N'EST PAS DE LA COQUETTERIE — MESURÉ.**
       * L'empreinte de la tuile fait `55 × 82` dans la colonne étroite, et
       * `« Fecalome Gift »` au plancher de 12 px y DÉBORDAIT : un seul mot plus
       * large que sa boîte ne se coupe nulle part tout seul. Relevé sur trois
       * états, `DÉBORDE` les trois fois — *une empreinte reprise d'ailleurs
       * impose sa largeur, pas seulement sa hauteur.*
       */
      .tv-scene-nom  { font-family: var(--display); font-weight: 800;
                       font-size: clamp(12px, 11cqw, 34px);
                       line-height: 1.05; overflow-wrap: anywhere;
                       max-width: 100%; }
      .tv-scene-note { font-size: clamp(9px, 4cqw, 14px); opacity: .7; }
      /*
       * ⛑⛑ **S519 · « SUR QUI » DANS LA COUCHE DU DÉ — note 54 ③.**
       *
       * Elle se pose SOUS le total, jamais au-dessus : le regard va au chiffre,
       * et la cible est ce qu'on lit ensuite. Aucune couleur neuve — `--stock`
       * pour le nom, l'encre atténuée pour l'étiquette et l'arme, exactement
       * comme `.rollcap` au-dessus du dé. *Une ligne de plus dans une scène
       * déjà réglée prend la grammaire de la scène, elle n'en apporte pas une.*
       */
      .rollcible { display: flex; align-items: baseline; justify-content: center;
                   gap: 8px; margin-top: 6px; flex-wrap: wrap; }
      .rollcible-lbl  { font-size: 10px; letter-spacing: .18em; opacity: .55; }
      .rollcible-qui  { font-family: var(--display); font-weight: 800;
                        font-size: 20px; color: var(--stock); }
      .rollcible-arme { font-size: 12px; opacity: .65; }
      .rollcible-arme::before { content: '· '; }
      /*
       * ⚠⚠ **LA COLONNE ÉTROITE NE PEUT PAS ÊTRE « EN GROS », ET C'EST MESURÉ,
       * PAS CONCÉDÉ.** Son emplacement est une case de `.tv` (grille `308 ×
       * 642`) qui plafonne la scène à `55 × 82` : `min-height` n'y peut rien,
       * la contrainte vient du parent. Relevé, ANCIEN CSS compris :
       * `scrollWidth 59` pour `clientWidth 55` — **elle débordait déjà avant ce
       * palier**, l'étiquette `SIGNATURE` seule étant plus large que sa boîte.
       *
       * On retire donc l'ÉTIQUETTE sous 120 px, jamais le NOM : *ce que Croze
       * demande de montrer est ce qu'il fait, et « SIGNATURE » est la catégorie,
       * pas le geste.* La requête porte sur `.tv-scene` elle-même, qui est déjà
       * son propre conteneur — aucune classe, aucun drapeau, aucun second
       * chemin de rendu.
       */
      @container (max-width: 120px) {
        .tv-scene-quoi { display: none; }
        .tv-scene-note { display: none; }
      }
      .tv-scene-art  { max-width: 100%; max-height: 55cqh; height: auto;
                       border-radius: 2px; }
      /*
       * ═══ ⛑⛑ S582 · LE TEXTE PAR-DESSUS LA CARTE — note 69 ② ═══════════════
       *
       * Croze répond à sa propre question, verbatim : *« oui, le texte actuel
       * s'écrit par-dessus la carte affichée — la carte donne le quoi, la ligne
       * donne le combien. »* La scène passe donc de deux étages (l'art PUIS le
       * texte) à un seul : l'art remplit la boîte, le texte s'y superpose.
       *
       * ⚠ **LE VOILE N'EST PAS UNE COQUETTERIE : SANS LUI LE TEXTE EST
       * ILLISIBLE SUR UN ART CLAIR.** Un dégradé du bas vers le milieu, opaque
       * là où le texte vit — c'est la garde de contraste que ce dépôt a payée
       * quatre fois sur des encres rouges. La couleur est celle du fond, pas
       * une teinte neuve.
       *
       * ⚠ **`grid-area: 1 / 1` EMPILE SANS SORTIR DU FLUX** : `position:
       * absolute` aurait retiré l'art du calcul de hauteur, et
       * `min-height: min-content` — qui existe parce que le nom débordait dans
       * la colonne étroite (55 px) — n'aurait plus rien à mesurer.
       */
      .tv-scene-carte { align-content: end; }
      .tv-scene-carte > * { grid-area: 1 / 1; }
      .tv-scene-carte .tv-scene-art { max-height: none; width: 100%;
                                      align-self: stretch; object-fit: contain; }
      .tv-scene-carte .tv-scene-quoi,
      .tv-scene-carte .tv-scene-nom,
      .tv-scene-carte .tv-scene-note { align-self: end; z-index: 1;
                       padding: 2px 4px; border-radius: 2px;
                       background: linear-gradient(to top,
                         color-mix(in srgb, var(--ink) 92%, transparent) 0%,
                         color-mix(in srgb, var(--ink) 78%, transparent) 100%); }
      .tv-scene-carte .tv-scene-quoi { align-self: start; }
      /*
       * ═══ ⛑ S153 · LE BUTIN FLOTTANT — planche du PDF ══════════════════════
       *
       * Spec Croze : *« plutôt que l'encadré qui pop avec la carte […] les
       * cartes apparaissent flottantes, et le clic les fait rejoindre la
       * main. »* Donc : **pas de cadre, pas de fond opaque** — les cartes
       * flottent au-dessus de l'écran, qui reste lisible derrière.
       *
       * ⚠ **LA COUCHE NE CAPTE PAS LE POINTEUR, LES CARTES SI.** Un voile
       * plein écran qui avale les clics rendrait le reste de l'UI mort tant
       * qu'un butin flotte — le défaut exact de l'encadré qu'on remplace.
       *
       * ⚠ **transform/opacity UNIQUEMENT** — l'écart de l'éventail (`--i`) et
       * le voyage vers la main (`.bv-part`) sont deux `transform`.
       */
      /*
       * ⛑⛑ **S581 — LE TAPIS PLEIN ÉCRAN EST REMPLACÉ PAR UN VOL (note 69 ①).**
       *
       * Croze : *« les cartes qui popent en gros quand on les loote, on
       * oublie. »* **Mesuré avant de le retirer** (état `etat-butin-du-coffre`,
       * graine 7, 1920×1080) : la couche faisait `1905 × 1080`, les cartes
       * `432 × 424` (`515 × 508` au survol), et le titre demandait **quatre
       * clics** — *« clique-les pour qu'elles rejoignent ta main »*.
       *
       * Ce qui reste : la couche `fixed`, sans pointeur, au même `z-index 940`.
       * Ce qui part : le tapis, l'éventail, le survol, le titre, le clic.
       *
       * ⚠ **LA COUCHE NE CAPTE PAS LE POINTEUR, ET LES CARTES NON PLUS
       * DÉSORMAIS** — plus rien n'y est cliquable, donc rien ne doit intercepter.
       * *Un voile plein écran qui avale les clics rend le reste de l'UI mort.*
       *
       * ⚠ **transform / opacity UNIQUEMENT**, la règle gravée : la position de
       * DÉPART est posée en `left/top/width` une fois pour toutes, et c'est le
       * `transform` qui voyage.
       */
      .bv-couche { position: fixed; inset: 0; z-index: 940; pointer-events: none; }
      .bv-vol { position: fixed; pointer-events: none; transform-origin: top left;
                transition: transform .4s cubic-bezier(.4, 0, .2, 1), opacity .4s ease; }
      @media (prefers-reduced-motion: reduce) {
        .bv-vol { transition: opacity .12s linear; }
      }
      /*
       * ⛑⛑ **S549 — LA FENÊTRE DU DÉ, note 59 ② (verdict Croze).** La pellicule
       * fait `3 600 %` de large : mesurée, **4 104 px dans un dé de 118**. Rien
       * ne la retenait — `overflow: visible`, et le `clip-path` qui la contenait
       * par accident vaut `none` sur le d6 comme sur tout dé à peau de pierre.
       * Elle vit donc dans une fenêtre à elle, `inset: 0`, qui ne coupe QUE la
       * pellicule : l'ombre livrée déborde exprès, et elle continue.
       */
      .die-fenetre { position: absolute; inset: 0; overflow: hidden;
                     pointer-events: none; }
      /*
       * ⛑⛑ S802 · NOTE 97 (a) — **CES DEUX NOMBRES SONT LE DÉFAUT LEGACY, PLUS
       * LA RÈGLE.** `3600%` et `steps(36)` valent *« 36 images »*, ce que Croze
       * a fixé comme défaut d'un dossier SANS `peau.json`. Une peau qui porte un
       * manifeste les REMPLACE en style, sur le nœud, depuis `habilleLeDé` — la
       * peau suit le siège, donc deux sièges de la même scène peuvent tourner à
       * deux cadences. *Ce qui reste ici est le repli, et il est nommé.*
       */
      .die-roule { position: absolute; top: 0; left: 0; height: 100%; width: 3600%;
                   max-width: none; pointer-events: none; opacity: 0; }
      @keyframes de-roule { from { transform: translateX(0); }
                            to   { transform: translateX(-100%); } }
      .dicelayer.t1 .die-roule {
        opacity: 1;
        /*
         * ⚑⚑ S462 — note ㊹ ① : **LA DURÉE EST CELLE D'UN TOUR, PAS DE LA
         * FENÊTRE.** Écrite en longhand exprès : le raccourci `animation`
         * enchaîne deux `<time>` (durée puis délai) et un `<number>`, et y
         * glisser deux `var()` rend la déclaration illisible au premier coup
         * d'œil — celui qui règlera le prochain « fais-le tourner plus
         * longtemps » doit voir SANS compter que la durée et le nombre de
         * tours sont deux réglages distincts. C'est la confusion des deux qui
         * a rendu le ×3 en ralenti.
         */
        animation-name: de-roule;
        /*
         * ⚠⚠ **S802 — `1120ms` POUR 36 IMAGES FAISAIT 32,1 IMAGES/S, ET LA
         * BANDE EST RENDUE À 24.** C'est l'étirement que la note 97 interdit
         * en toutes lettres. La durée d'une passe vient désormais du manifeste
         * (`duree_s`), posée en style sur le nœud ; ce qui reste ici est le
         * repli d'une bande sans manifeste, et il garde l'ancienne valeur pour
         * ne rien changer à ce qui ne porte pas de peau.
         */
        animation-duration: var(--roule-passe, 1120ms);
        animation-timing-function: steps(36);
        animation-iteration-count: var(--roule-tours, 1);
        animation-fill-mode: both; }
      /*
       * LE DÉ SE POSE : la bande s'efface, la face paraît. Les deux se croisent
       * sur 120 ms — assez pour que la pose se voie, trop peu pour qu'on lise
       * deux dés à la fois.
       */
      .dicelayer .die-rendu { opacity: 0; }
      .dicelayer.t2 .die-rendu, .dicelayer.fini .die-rendu {
        opacity: 1; transition: opacity .12s ease; }
      .dicelayer.t2 .die-roule, .dicelayer.fini .die-roule {
        opacity: 0; transition: opacity .12s ease; }
      /*
       * ⛑⛑ S802 · NOTE 97 (b) — **LA FIN DE BANDE D'UNE PEAU FORGÉE EST UNE
       * COUPE SÈCHE.**
       *
       * Croze : *« peau forgée → coupe sèche sur la face (la silhouette est
       * identique, mesuré) ; peau legacy → ce que tu fais déjà, inchangé. »*
       * La forge mesure **`SEAMLESS = 1,0000`** — l'IoU de la dernière image de
       * bande contre une face — donc les 120 ms de fondu n'auraient rien à
       * fondre : ils feraient clignoter deux images identiques.
       *
       * ⚠ La classe est posée sur le DÉ (`habilleLeDé`), pas sur la couche : la
       * peau suit le siège, et une table peut mêler une peau forgée et une
       * legacy dans la même scène.
       */
      /*
       * ⚗ ESSAI CLASSEUR 2026-09-05 (Croze : « tente un truc ») — LA COUPE SÈCHE
       * EST SUSPENDUE POUR LES FORGÉES. Croze : « pas fluide, accroche sur la fin
       * du roll, quel que soit le dé — les premiers assets étaient fluides. » Les
       * premiers assets se posaient avec le fondu de 120 ms ci-dessus ; les
       * forgées le perdaient (coupe sèche S802). Hypothèse : les 10 dernières
       * images d'une bande forgée sont le « temps de présentation » (le dé se
       * pose, mouvement lent) et à 30 images/s un mouvement lent se lit par à-
       * coups — la coupe sèche les expose, le fondu les masquait. Le fondu est
       * rétabli le temps que Croze regarde ; s'il dit « mieux », la règle change ;
       * s'il dit « pareil », on remet la coupe et on cherche ailleurs (le
       * minuteur t2 contre `animationend`, ou la bande rendue à 60 images/s sur
       * sa pose, côté forge).
       */
      .dicelayer.t2 .die.die-forge .die-rendu,
      .dicelayer.fini .die.die-forge .die-rendu,
      .dicelayer.t2 .die.die-forge .die-roule,
      .dicelayer.fini .die.die-forge .die-roule { transition: opacity .12s ease; }
      /*
       * ⚠ **PENDANT LE ROULÉ, LE CHIFFRE NE SE LIT PAS — c'est tout l'objet.**
       * `die-rendue` l'efface déjà quand la FACE est chargée ; si elle manque,
       * le chiffre resterait sous le dé qui tourne et **donnerait le résultat
       * avant qu'il tombe**. Le carton et son liseré partent du même geste : ils
       * sont le repli d'un dé sans rendu, pas un socle sous celui-ci.
       */
      .dicelayer:not(.t2):not(.fini) .die.die-roulant {
        color: transparent; background: transparent;
        border-color: transparent; box-shadow: none; }
      .dline { display: flex; align-items: center; justify-content: center; gap: 14px;
               min-height: 60px; margin-top: 16px; }
      .dline .mod { font-size: 20px; letter-spacing: .06em; color: var(--stock);
                    border: 1px solid var(--rule); padding: 4px 12px; background: var(--ink-2);
                    opacity: 0; transform: translateX(-14px); }
      .dicelayer.t2 .mod, .dicelayer.fini .mod {
        opacity: 1; transform: none; transition: opacity .2s ease, transform .2s ease; }
      .dline .totlbl, .dline .total { opacity: 0; }
      .dicelayer.t3 .totlbl, .dicelayer.fini .totlbl { opacity: 1; transition: opacity .2s ease; }
      .dline .total { font-family: var(--display); font-weight: 800; font-size: 62px;
                      line-height: 1; color: var(--ember); transform: scale(1.8); }
      .dicelayer.t3 .total, .dicelayer.fini .total {
        opacity: 1; transform: none; transition: opacity .2s ease, transform .28s var(--pop); }
      .totlbl { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--slate); }
      .verdict-att { text-align: center; margin-top: 10px; opacity: 0; }
      .dicelayer.t3 .verdict-att, .dicelayer.fini .verdict-att { opacity: 1; transition: opacity .2s ease; }
      .dicelayer .rollverdict { display: block; text-align: center; margin-top: 14px;
                                font-family: var(--display); font-size: 24px; opacity: 0; }
      .dicelayer.t3 .rollverdict, .dicelayer.fini .rollverdict {
        opacity: 1; transition: opacity .22s ease; }
      /*
       * ⛑⛑ S1364 · note 204 ⑥ — L'ANNONCE DE JET. Tailles de la note, à 1080 :
       * titre 40 px, formule 32 px, chiffre 96 px ; rien sous 20 px sur ce
       * composant. La formule est dite AVANT le dé, puis se COMPLÈTE quand la
       * face tombe (`t2`) ; le dégât d'une arme arrive au troisième temps.
       */
      .dicelayer .aj { text-align: center; margin-bottom: 22px; }
