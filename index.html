      .dicelayer .aj-titre { font-family: var(--display); font-weight: 800; font-size: 40px;
        line-height: 1.05; letter-spacing: .04em; text-transform: uppercase; color: var(--stock); }
      .dicelayer .aj-formule { margin-top: 12px; font-family: var(--display); font-size: 32px;
        line-height: 1.1; color: var(--stock); display: grid; }
      .dicelayer .aj-formule > span { grid-area: 1 / 1; transition: opacity .2s ease; }
      /* S1365 — ① le titre seul 1,2 s, puis ② la formule (`aj-f`) ; un clic (`fini`) montre tout */
      .dicelayer.annonce-jet .aj-formule { opacity: 0; }
      .dicelayer.annonce-jet.aj-f .aj-formule, .dicelayer.annonce-jet.fini .aj-formule {
        opacity: 1; transition: opacity .25s ease; }
      .dicelayer .aj-apres { opacity: 0; }
      .dicelayer.t2 .aj-avant, .dicelayer.fini .aj-avant { opacity: 0; }
      .dicelayer.t2 .aj-apres, .dicelayer.fini .aj-apres { opacity: 1; }
      .dicelayer .aj-degats { display: flex; align-items: baseline; justify-content: center; gap: 18px;
        margin-top: 18px; opacity: 0; }
      .dicelayer.t3 .aj-degats, .dicelayer.fini .aj-degats {
        opacity: 1; transition: opacity .22s ease; }
      .dicelayer .aj-degats-lbl { font-family: var(--display); font-weight: 800; font-size: 32px;
        letter-spacing: .06em; text-transform: uppercase; color: var(--stock); }
      .dicelayer .aj-degats-n { font-family: var(--display); font-weight: 800; font-size: 96px;
        line-height: 1; color: var(--ember); }
      .dicelayer.annonce-jet .rollcible-arme { display: none; }
      .dicelayer.annonce-jet .rollcible-lbl, .dicelayer.annonce-jet .rollcible-qui { font-size: 20px; }
      /*
       * ⛑ **S232 — LE RÉSULTAT D'EXPLORATION, EN GROS.** Note ⑧① : *« le
       * résultat s'afficher en rouge en gros — TRAP, CHEST, MOB »*. Il montait
       * jusqu'ici dans `.rollcap` — 12 px, `--stock-dim`. Il prend le rang du
       * total : **même troisième temps, même pop, même encre que la face**
       * (`--stamp` ; `--ember` reste au Collapse et au total, S209).
       */
      /*
       * ⛑⛑ **S547 — `2,03` EN 60 px, ET C'EST « le résultat en GROS » QUE CROZE
       * A DEMANDÉ.** Relevé par le balayeur d'états, ancre `COMBAT_OPENED`,
       * échantillon de 4 graines : `explore-verdict · 60,48 px · ratio 2,03`
       * pour un seuil de 3. Même famille que `.borne-titre` juste au-dessus et
       * que la bulle du ruban (S545) : `--stamp` est le rouge des APLATS et du
       * carton CLAIR ; en ENCRE sur la couche des dés, il ne se lit pas.
       *
       * ⚠ **L'INTENTION DU S232 EST TENUE, PAS RENVERSÉE** : *« même encre que
       * la face »* voulait dire *le rouge du jeu, pas l'ember du Collapse*.
       * `--rouge-vif` EST ce rouge — même teinte, même saturation, clarté
       * montée jusqu'au seuil (S536) — et `--ember` reste au Collapse.
       */
      .dicelayer .explore-verdict {
        display: block; text-align: center; margin-top: 18px;
        font-family: var(--display); font-weight: 800;
        font-size: clamp(48px, 5.6vh, 86px); line-height: 1;
        letter-spacing: .06em; color: var(--rouge-vif);
        text-shadow: 0 3px 0 var(--ink), 0 14px 30px rgba(0,0,0,.7);
        opacity: 0; transform: scale(1.35); }
      .dicelayer.t3 .explore-verdict, .dicelayer.fini .explore-verdict {
        opacity: 1; transform: none;
        transition: opacity .2s ease, transform .28s var(--pop); }
      /*
       * ⛑ **S237 — L'ÉCHELLE DU CASINO.** Note ⑭ : *« les paliers s'empilent
       * visuellement (« COMMON ✓ → UNCO ✓ → RARE ? ») »*.
       *
       * ⚠ **LE BARREAU ATTEINT NE PREND PAS UN SEPTIÈME ROUGE** : il porte
       * `.explore-verdict` en plus de `.casino-verdict`, donc les six
       * déclarations du S232 s'appliquent telles quelles — même `--stamp`, même
       * troisième temps, même pop. `.casino-verdict` n'existe ici que pour la
       * lettre : le barreau est un MOT du jeu (`COMMON`), il ne se coupe pas.
       *
       * La rangée, elle, est de la légende : corps de `.rollcap`, pas de
       * rouge. Les acquis en `--stock`, le manqué en `--slate` barré — *le gris
       * n'emprunte ni l'orange braise ni le rouge* (`§2`).
       */
      .casino-verdict { white-space: nowrap; }
      .dicelayer .casino-echelle {
        display: flex; flex-wrap: wrap; justify-content: center;
        gap: 6px 10px; margin-top: 14px; }
      .dicelayer .ce-barreau {
        font-size: 12px; letter-spacing: .18em; text-transform: uppercase;
        border: 1px solid var(--rule); border-radius: 4px; padding: 3px 9px; }
      .dicelayer .ce-acquis { color: var(--stock); background: var(--ink-2); }
      .dicelayer .ce-manque { color: var(--slate); text-decoration: line-through; }
      /* Le barreau de CE jet arrive avec le verdict, pas avant — S232. */
      .dicelayer .ce-neuf { opacity: 0; transform: scale(1.2); }
      .dicelayer.t3 .ce-neuf, .dicelayer.fini .ce-neuf {
        opacity: 1; transform: none;
        transition: opacity .2s ease, transform .28s var(--pop); }
      .dicelayer.compacte .casino-echelle { margin-top: 0; gap: 4px 6px; }
      .dicelayer.compacte .ce-barreau { font-size: 10px; padding: 2px 6px; }
      /*
       * ⛑ **S233 — LE PLAFOND DE LA FILE DE SCÈNES PARLE.** Il coupe exprès
       * (`MAX_JETS_EN_FILE`), il le disait à personne. Même corps que `.skip`,
       * en face de lui : c'est la même famille de mention — l'écran qui dit ce
       * qu'il fait de lui-même. `--stamp` parce que c'est une PERTE, pas une
       * option ; `z-index` au-dessus de la couche, qui est fixe à 900.
       */
      /*
       * ═══ ⛑ S235 · `HIDE` — LA VUE COMPACTE ═════════════════════════════
       *
       * Arbitrage Croze (classeur, onglet `TODO` L512) : *« HIDE arbitré :
       * bascule vers la vue compacte, **le jeu continue dessous**. »* Les deux
       * moitiés de la phrase sont ici, et la seconde n'est pas décorative :
       * la couche **rend les clics** (`pointer-events: none`), sans quoi
       * « le jeu continue dessous » serait faux d'un pixel à l'autre.
       *
       * ⚠ **AUCUNE SECONDE COUCHE, AUCUN SECOND RYTHME.** La scène garde ses
       * trois temps, sa sortie, son `couperLeJet` — *un rythme se double en
       * entier ou il change de rythme* (`§3ter`). Ne changent que la PLACE et
       * la TAILLE. C'est la forme des planches 8/9 (`somebody else is
       * rolling`), qui vit déjà sous les tuiles : on n'en fabrique pas une
       * dixième, on y range celle qui prenait tout.
       */
      .dicelayer.compacte {
        inset: auto 0 0 0; place-content: end center;
        background: linear-gradient(to top, rgba(10,8,6,.90), rgba(10,8,6,0));
        padding: 0 0 14px; pointer-events: none; cursor: default; }
      /* Seul le bloc reste saisissable — le reste de la bande laisse passer. */
      .dicelayer.compacte > * { pointer-events: auto; }
      .dicelayer.compacte .dgroup,
      .dicelayer.compacte .dline { gap: 8px; }
      .dicelayer.compacte > div { display: flex; align-items: baseline;
                                  gap: 14px; flex-wrap: wrap;
                                  justify-content: center; }
      .dicelayer.compacte .die { width: 44px; height: 44px; font-size: 26px;
                                 border-width: 1px; box-shadow: none; }
      .dicelayer.compacte .die[data-faces="4"] { font-size: 18px; }
      .dicelayer.compacte .dline .total { font-size: 26px; }
      .dicelayer.compacte .explore-verdict { font-size: 26px; margin-top: 0;
                                             text-shadow: 0 1px 0 var(--ink); }
      .dicelayer.compacte .borne-titre { font-size: 26px;
                                         text-shadow: 0 1px 0 var(--ink); }
      .dicelayer.compacte .borne-siege { font-size: 12px; margin-top: 0; }
      .dicelayer.compacte .borne-cause { font-size: 10px; margin-top: 4px; }
      .dicelayer.compacte .seuil-annonce { font-size: 14px; }
      .dicelayer.compacte .rollverdict { font-size: 14px; margin-top: 0; }
      .dicelayer.compacte .scene-detail,
      .dicelayer.compacte .scene-pli { display: none; }
      /*
       * ⛑ **LA SCÈNE DE SÉRIE AUSSI, ET C'EST UNE MESURE QUI L'A DIT.** Rangée
       * sans cette règle, la scène `PREMIER JOUEUR` — quatre cadres, quatre
       * portraits — tenait encore **306 px sur 1 080**, relevé au banc. Une
       * bande d'un tiers d'écran n'est pas une vue compacte : les portraits
       * tombent, les cadres se serrent, la rangée passe sur une ligne.
       */
      .dicelayer.compacte .scene-portrait { display: none; }
      .dicelayer.compacte .scene-cadres { gap: 10px; flex-wrap: nowrap; }
      .dicelayer.compacte .scene-cadre { flex-direction: row; gap: 8px;
                                         padding: 2px 8px; border-width: 1px; }
      .dicelayer.compacte .scene-nom { font-size: 12px; }
      .dicelayer.compacte .scene-compte { display: none; }
      .dicelayer.compacte .scene-chiffres .total { font-size: 20px; }
      /*
       * Le contrôle. Il est en pied, **en face du « un clic coupe »** : les deux
       * disent ce que l'écran fera d'un geste, ils vont ensemble. ⚠ La position
       * du libellé dans le PDF n'a PAS été mesurable (ni `poppler` ici, ni des
       * matrices d'XObject fiables — `x = 1484` sur une planche de 1 440) :
       * ce placement est le nôtre, et il est déposé en arbitrage plutôt
       * qu'annoncé comme relevé.
       */
      .hide-btn { position: fixed; right: 18px; bottom: 40px; z-index: 902;
                  pointer-events: auto; background: none;
                  /* S1261 · H-T2 (Q-PLAQUE-ICONES) — un outil : le texte seul. */
                  border: 0;
                  padding: 5px 14px; cursor: pointer;
                  font-family: var(--display); font-size: 12px;
                  letter-spacing: .34em; text-transform: uppercase;
                  color: var(--stock-dim); }
      .hide-btn:hover { color: var(--stock); border-color: var(--stock-dim); }
      /* Rangée, la scène n'a plus rien à ranger. */
      .dicelayer.compacte .hide-btn, .dicelayer.compacte .skip { display: none; }
      /*
       * ⛑⛑ S301 — **`--alert`, PAS `--stamp`, ET C'EST LA DIVISION QUE LE GO A
       * ÉCRITE LUI-MÊME.** Le GO du classeur définit deux rouges en une phrase :
       * `--alert = #DC6963` *« séparé de `--stamp`, qui reste la teinte du dé et
       * des GRANDS refus »*. Cette ligne n'est ni un dé ni un grand refus :
       * c'est un AVIS de dix pixels qui doit être LU — *« une place vide qui dit
       * son manque se lit »*, sa propre justification.
       *
       * Mesuré sur HUIT états : elle ne paraît que sur `rgb(21,18,15)`, **jamais
       * sur un fond clair** — la vérification qui manquait au S291 et qui a
       * coûté un `1,70`. `--stamp` y rend **2,62**, `--alert` **5,55**.
       */
      .file-tue { position: fixed; left: 18px; bottom: 16px; z-index: 901;
                  max-width: calc(var(--uvw) * 46); font-size: 10px; letter-spacing: .18em;
                  text-transform: uppercase; color: var(--alert);
                  pointer-events: none; }
      .dicelayer .skip { position: fixed; right: 18px; bottom: 16px; font-size: 10px;
                         letter-spacing: .2em; text-transform: uppercase; color: var(--slate); }
      /*
       * ═══ ⚑ S92 · LA PLANCHE 4 — L'ÉCRAN RÉSULTAT D'UNE RÉSOLUTION ═════════
       *
       * `P1 THE WIZARD — OBTAIN : LOOT CARDS / EFFECT_DESCRIPTION`. Même couche
       * que le jet — c'est le même moment, une beat plus loin — donc **aucun
       * fond, aucun z-index, aucune sortie en propre** : tout est hérité de
       * `.dicelayer`. Ce qui suit ne décrit que le CONTENU.
       *
       * ⚠ **LES CARTES SONT CELLES DE LA RÉVÉLATION** (`.butin-carte`) : une
       * carte se montre d'une seule façon dans ce jeu, et sa taille est déjà
       * réglée là-bas. On borne seulement la RANGÉE, et elle défile chez elle
       * plutôt que de pousser la couche hors de l'écran — la leçon des trois
       * colonnes (`S89`), appliquée à une surface qui prend tout l'écran.
       *
       * ⚠ **AUCUNE COULEUR RÉSERVÉE** — ni ember (Collapse), ni vert jouable :
       * le seul accent est la teinte du SIÈGE qui reçoit, posée en ligne par le
       * rendu, exactement comme partout ailleurs.
       */
      .recap { display: flex; flex-direction: column; align-items: center; gap: 14px;
               max-width: min(1180px, 92vw); }
      .recap-quoi { font-family: var(--display); font-size: 13px; letter-spacing: .2em;
                    text-transform: uppercase; color: var(--stock-dim); text-align: center; }
      .recap-siege { display: flex; align-items: baseline; gap: 10px; }
      .recap-nom { font-family: var(--display); font-weight: 800; font-size: 26px;
                   letter-spacing: .04em; }
      .recap-perso { font-size: 12px; letter-spacing: .16em; color: var(--slate); }
      .recap-verbe { font-size: 12px; letter-spacing: .26em; color: var(--stock-dim); }
      .recap-cartes { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
                      max-height: 62vh; overflow-y: auto; padding: 2px; }
      .recap-note { font-size: 11px; letter-spacing: .08em; color: var(--slate);
                    text-align: center; }
      .recap-inerte { font-style: italic; }
      .recap-muet { font-size: 12px; color: var(--slate); font-style: italic; }
      /* Les trois temps : le titre, puis les cartes, puis les notes. */
      .recap-couche .recap-quoi, .recap-couche .recap-siege,
      .recap-couche .recap-cartes, .recap-couche .recap-note,
      .recap-couche .recap-muet { opacity: 0; }
      .recap-couche.t1 .recap-quoi, .recap-couche.fini .recap-quoi,
      .recap-couche.t1 .recap-siege, .recap-couche.fini .recap-siege,
      .recap-couche.t2 .recap-cartes, .recap-couche.fini .recap-cartes,
      .recap-couche.t3 .recap-note, .recap-couche.fini .recap-note,
      .recap-couche.t3 .recap-muet, .recap-couche.fini .recap-muet {
        opacity: 1; transition: opacity .22s ease; }
      /*
       * ═══ ⚑ S47 · LA SCÈNE DE SÉRIE — LES CADRES CÔTE À CÔTE ═══════════════
       *
       * `PDF UI_CARD_DRAW_AND_ROLL` planches 1 · 2 · 7 : les rouleurs sont
       * NOMMÉS et leurs cadres se posent SUR UNE RANGÉE. La rangée passe à la
       * ligne d'elle-même (`flex-wrap`) : à six sièges on ne veut pas d'un
       * débordement horizontal, et `1920` n'est pas une promesse de largeur.
       *
       * ⚠ **AUCUNE LARGEUR FIXE.** Les cadres se dimensionnent sur leur
       * contenu — un nom court et un nom long ne doivent pas donner deux
       * colonnes de tailles différentes pour la même information.
       */
      .dicelayer.serie .scene { display: flex; flex-direction: column;
                                align-items: center; gap: 10px; max-width: calc(var(--uvw) * 92); }
      .scene-compte { font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
                      color: var(--slate); }
      /*
       * ⛑ S683 — LA SCÈNE DE LA RELANCE (note 82 ③). Deux dés et une flèche :
       * le premier POSÉ (il a déjà eu lieu), le second ROULANT (`habilleLeDé`
       * en mode roulé). Ce n'est pas la mise en page des rouleurs en face à
       * face — une relance n'oppose personne, elle REMPLACE.
       *
       * ⚠ Le premier dé est ATTÉNUÉ, pas grisé au sens de l'encre morte du
       * S679 : ici il ne dit pas « zéro », il dit « périmé ». Deux sens dans
       * une même teinte se confondraient.
       */
      .relance-cadres { align-items: center; gap: 18px; }
      .relance-case { display: flex; flex-direction: column; align-items: center;
                      gap: 6px; }
      .relance-avant { opacity: .48; }
      .relance-fleche { font-family: var(--display); font-size: 26px;
                        opacity: .7; }
      .relance-mot { font-family: var(--display); font-size: 10px;
                     letter-spacing: .14em; text-transform: uppercase;
                     color: var(--stock-dim); }
      .scene-cadres { display: flex; flex-wrap: wrap; justify-content: center;
                      align-items: stretch; gap: 12px; }
      /*
       * ⛑⛑ **S1068 · NOTE 129 ④ — « FAIS L'OVERALL PLUS GROS ».** Le cadre
       * mesurait `142 × 257` px à 1920×1080 (mesuré avant, quatre rouleurs) ;
       * l'écart de Croze est un FACTEUR DEUX, et il porte sur l'ensemble — le
       * portrait, le nom, le dé. La marge et l'espacement suivent, sinon un
       * cadre deux fois plus grand tient le même contenu au milieu du vide.
       */
      .scene-cadre { display: flex; flex-direction: column; align-items: center; gap: 12px;
                     border: 1px solid var(--line); border-radius: 6px; padding: 20px 28px;
                     opacity: 0; transform: translateY(6px); }
      /*
       * ×2 EXACTEMENT, sur les trois : portrait 62 → 124 px, nom 15 → 30 px,
       * et le DÉ 118 → 160 px — *« fais l'overall plus gros »* porte sur
       * l'ensemble, et c'est le dé qui donne sa largeur au cadre.
       */
      .scene-cadre .die { width: 160px; height: 160px; font-size: 94px; }
      .scene-cadre .scene-portrait { width: 124px; height: 124px; }
      .scene-cadre .scene-nom { font-size: 30px; }
      /* Le lanceur porte les N faces : son cadre est le premier, et il se voit. */
      .scene-cadre.lanceur { border-color: var(--slate); }
      /* ⛑ S759 — LE DÉ DU COLLAPSE. Quatre dés de 118 px côte à côte débordent
         d'une ligne : le cadre du Collapse porte un dé plus court. La
         SILHOUETTE et la peau ne changent pas — seule la boîte rétrécit. */
      .collapse-cadre .die { width: 84px; height: 84px; font-size: 40px; }
      .collapse-cadre .die[data-faces="4"] { font-size: 32px; padding-bottom: 6px; }
      .collapse-cadre .die[data-faces="8"],
      .collapse-cadre .die[data-faces="10"] { font-size: 38px; }
      /*
       * ⛑⛑ **S765 — `11 px`, ET C'EST LA LIGNE QUI PORTE LE COUP** (note 91 ④,
       * *« police très fine on voit rien »*). C'est la seule phrase de la scène
       * qui dise ce que le siège ENCAISSE, et elle était la plus petite des
       * trois : `.scene-nom` 22 px · `.rollverdict` 24 px · celle-ci **11**.
       * Portée à 18 px et graissée — la scène du Collapse est une scène de
       * TABLE, lue à distance, et le chiffre du dé fait 40 px juste au-dessus.
       */
      .collapse-suite { font-family: var(--display); font-size: 18px;
                        font-weight: 800;
                        letter-spacing: .1em; text-transform: uppercase;
                        color: var(--ember); }
      /* L'immunisé n'encaisse pas : son mot n'est pas de la couleur d'un coup. */
      .collapse-suite.immunise { color: var(--stock-dim); text-transform: none;
                                 letter-spacing: .04em; }
      /*
       * ═══ ⛑ S1281 · C-T1 bis — LES TROIS TEMPS D'UN SIÈGE, DANS LA MÊME
       *            SCÈNE ══════════════════════════════════════════════════
       *
       * La scène porte désormais toute la salve dès son premier instant :
       * un cadre par siège annoncé par la pioche, même ceux dont le dé n'est
       * pas encore tombé. **Atténué, pas effacé** — une place vide dit qu'on
       * attend quelqu'un ; un cadre absent dirait qu'il n'y a personne.
       */
      .collapse-cadre.collapse-attend { opacity: .45; }
      .collapse-cadre.collapse-roulé  { opacity: .85; }
      .collapse-cadre.collapse-tombé  { opacity: 1; }
      /* La place du dé qui n'est pas encore tombé : le creux, pas un zéro. */
      .die-place-vide { border: 2px dashed var(--stock-dim); background: none;
                        box-shadow: none; opacity: .5; }
      .die-place-vide::after { content: '?'; color: var(--stock-dim); }
      /* Sa carte d'Upkeep, sous son nom — la mienne seule est publiée. */
      .collapse-carte { font-family: var(--display); font-size: 13px;
                        letter-spacing: .06em; color: var(--stock-dim);
                        text-transform: none; margin-bottom: 4px; }
      /*
       * ═══ ⛑⛑ S771 · LA DISTRIBUTION DE DÉBUT DE TOUR — note 91 ⑤ ═══════
       *
       * ⚑ **AUCUNE BOÎTE NEUVE** : le cadre, la rangée, le portrait et le
       * verdict sont ceux du Collapse (`.scene-*`). Il ne manquait que le
       * DOS et la mention de rareté — le reste est la même scène de table.
       *
       * ⚠⚠ **LA BOÎTE DU DOS EST CELLE DE LA CARTE — ET LE PREMIER JET NE
       * LA TENAIT PAS.** Ce commentaire affirmait déjà l'égalité ; mesuré à
       * l'écran, dans le palier même qui l'écrivait : **dos `84 × 126`,
       * carte `84 × 200`.** Un siège dont la carte est secrète et un siège
       * dont elle est visible sont dans la MÊME rangée, et 74 px d'écart
       * font flotter trois cadres sur quatre. *Une égalité écrite dans un
       * commentaire n'est pas une égalité : elle se mesure.*
       *
       * ⚠ `cover`, et pas `contain` : les deux ratios DIFFÈRENT (le dos est
       * `721 × 1081`, soit `0,667` ; la boîte est à `0,42`). Le dos est donc
       * RECADRÉ, jamais étiré — son motif se répète, il n'a pas de sujet à
       * couper. *Ce qui ne doit jamais arriver à une carte, c'est d'être
       * déformée.*
       */
      /*
       * ═══ ⛑⛑ S790 · NOTE 94 ② — LE DOS NE SE FAIT PLUS ROGNER ══════════
       *
       * Croze, verbatim : *« les autres joueurs on voit la carte fermée
       * comme ça mais pas tronquer sur les côtés stp. »*
       *
       * ⚠⚠ **LE COMMENTAIRE QUI VIVAIT ICI DISAIT POURQUOI C'ÉTAIT SANS
       * CONSÉQUENCE, ET IL AVAIT TORT.** Il écrivait : *« le dos est
       * RECADRÉ, jamais étiré — son motif se répète, il n'a pas de sujet à
       * couper. »* Mesuré : le dos est `721 × 1081` (ratio `0,667`), la
       * boîte était `84 × 200` (ratio `0,420`) — `cover` mangeait donc
       * **37 % de sa largeur**, et Croze l'a vu du premier coup d'oeil.
       * *Un motif qu'on croit sans sujet a quand même des bords.*
       *
       * La boîte prend maintenant le ratio de l'objet — `aspect-ratio`,
       * jamais deux nombres qui devront se suivre à la main — et
       * `object-fit: contain` garde le dos ENTIER même si l'asset change
       * de format : *une garde qui dépend d'un calcul juste aujourd'hui
       * n'en est pas une.*
       */
      /*
       * ⛑ **S796 · L'OFFRE POSÉE SUR LA QUESTION** (palier moteur 534, note 83 ①
       * de Croze : *« le joueur target LES VOIT »*). Les cartes sont rendues par
       * la fabrique du jeu (`carteEntièrePortée`), donc `.cz` porte déjà sa
       * taille et son zoom : ici on ne règle que la RANGÉE. Elle défile si
       * l'offre est large — *une offre qui déborde du panneau se lit comme une
       * offre tronquée*, et le S392 a payé pour un rail qu'on avait pris pour
       * un recouvrement.
       */
      .fen-offre { display: flex; flex-wrap: wrap; align-items: flex-end;
                   gap: 6px; margin: 6px 0; }
      .fen-offre-cap { flex: 0 0 100%; font-family: var(--display);
                       font-size: 10px; font-weight: 800; letter-spacing: .14em;
                       text-transform: uppercase; color: var(--stock-dim); }
      .fen-offre .cz { width: 74px; }
      .fen-offre .cz .cz-vignette { width: 74px; height: auto; display: block; }
      /*
       * `note 136 ③` — L'EN-TÊTE DE L'ÉCHANGE. Il porte ce qui est SUR LA
       * TABLE, et il est posé avant la main du joueur : c'est l'ordre de
       * lecture que Croze demande (*« JOUEUR X … vous propose carte A B et
       * C »*), pas une décoration. Aucune unité de FENÊTRE ici — le verrou de
       * 1080 compose en pixels logiques, et une `@media` lirait la fenêtre.
       */
      .troc-tete { margin: 6px 0 8px; padding: 6px 8px;
                   border-left: 3px solid var(--accent, #7FB069);
                   background: rgba(127, 176, 105, .06); }
      .troc-phrase { font-size: 14px; line-height: 1.35; }
      .troc-phrase .p-name { font-weight: 800; }
      .troc-tete .fen-offre { margin: 6px 0 0; }
      .pioche-dos { width: 84px; height: auto; aspect-ratio: 721 / 1081;
                    border-radius: 4px;
                    border: 1px solid var(--line); object-fit: contain;
                    display: block; }
      /* La rareté est PUBLIQUE (`UPKEEP_DRAW.rarity`) : elle se lit sous
         les quatre cadres, couverts comme découvert. */
      .pioche-rarete { font-family: var(--display); font-size: 13px;
                       font-weight: 800; letter-spacing: .14em;
                       text-transform: uppercase; color: var(--stock-dim); }
      /* Pourquoi ce dos est là — sans elle, « secrète » et « art manquant »
         se ressemblent. Discrète : c'est une note, pas un verdict. */
      .pioche-couverte { font-size: 10px; letter-spacing: .04em; }
      /*
       * ═══ ⛑⛑ S790 · NOTE 94 ① — C'EST SA CARTE, PAS SA FICHE ═══════════
       *
       * Croze, verbatim : *« là faut afficher sa carte, pas la description
       * de la carte + son illustration comme c'est le cas actuellement. »*
       *
       * La scène posait `carteRévélée` — le bloc qui COMPOSE (illustration
       * découpée `512 × 428`, nom, jetons, texte du classeur). Elle pose
       * maintenant `carteEntièrePortée`, **la fabrique de carte du jeu**
       * (`/art/cartes/<id>.webp`, `1004 × 1516`), celle qu'il voit déjà
       * en main, au butin et au coffre. *Une seule fabrique, trois
       * emplois ; deux fabriques auraient été deux vérités.*
       *
       * Elle prend la largeur du dos, pour la même raison de ligne de base,
       * et elle est posée `entier` — **donc SANS le zoom au survol**. La
       * scène vit dans une `.dicelayer`, qui est déjà un plein : y ouvrir
       * l'agrandi de la fabrique ferait *deux pleins vivants*, l'interdit
       * `§0`. C'est le paramètre que la fabrique porte pour ça, et il ne
       * se devine pas — il se lit (`if (entier) zoom.classList.add(...)`).
       */
      .pioche-cadre .cz { width: 84px; }
      .pioche-cadre .cz .cz-vignette { width: 84px; height: auto; display: block; }
      .dicelayer.serie.t1 .scene-cadre, .dicelayer.serie.fini .scene-cadre {
        opacity: 1; transform: none; transition: opacity .25s ease, transform .25s ease; }
      /*
       * ⚑ **S59 · LE VISAGE DANS L'ENCADRÉ — « P1 THE_GUARD avec son visage ».**
       *
       * Un disque, et c'est une décision : les cadres sont côte à côte et de
       * hauteurs différentes selon le nombre de faces jetées — *une bannière
       * rectangulaire y aurait imposé sa largeur au cadre le plus étroit.* Le
       * portrait est en 1920×1080, le visage au tiers haut : `cover` +
       * `object-position: 50% 30%` le cadre sans jamais l'étirer.
       *
       * Le liseré reste `--line`. **L'or est au vainqueur** (`cadreWin`) et il
       * ne se partage pas : un portrait cerclé d'or dirait « gagné » avant le
       * dé.
       */
      .scene-portrait { width: 62px; height: 62px; border-radius: 50%;
                        object-fit: cover; object-position: 50% 30%;
                        border: 1px solid var(--line); display: block; }
      .scene-nom { font-family: var(--display); font-size: 15px; }
      /*
       * ═══ ⚑⚑ S620 · LA SCÈNE DE TABLE EST PLUS GROSSE (note 77 ②) ══════════
       *
       * **Croze** : *« Jet qui confronte 4 joueurs : plus gros, sur un layer au
       * fond obscurci, affiché plus longtemps. »*
       *
       * ⚠ **LE FOND OBSCURCI EXISTAIT DÉJÀ** — `.dicelayer` est
       * `position: fixed; inset: 0` avec un scrim `rgba(10, 8, 6, .78)` (il valait `.86`
       * quand cette ligne a été écrite — re-mesuré au S1004, quatre lignes
       * plus haut dans ce même fichier). Je ne le
       * refais pas ; le pas ⓪bis l'a établi avant que j'écrive une ligne.
       * « Plus longtemps » est un FACTEUR de rythme (`FACTEUR_TABLE`,
       * `main.ts`). Il ne reste ici que « plus gros ».
       *
       * ⚠ **CE N'EST PAS UN `scale()` SUR LA COUCHE.** Agrandir en bloc
       * grossirait aussi le liseré d'un pixel, l'arrondi de 6 px et la ligne
       * « un clic coupe » — et sur quatre cadres, ça déborde la fenêtre au lieu
       * de la remplir. **Chaque grandeur monte pour sa propre raison** : le
       * portrait parce qu'on doit reconnaître un visage, le nom parce qu'on lit
       * quatre noms au lieu d'un, l'écart parce que quatre cadres collés se
       * lisent comme un seul bloc.
       *
       * ⚠ **`flex-wrap` RESTE**, et c'est la ceinture : quatre cadres élargis
       * qui ne tiendraient pas passent à la ligne au lieu de sortir de l'écran.
       * *Un agrandissement sans repli est un débordement en attente* — et
       * `balayage_geometrie` le dirait, ce qui est déjà trop tard.
       */
      .dicelayer.table .scene-cadres { gap: 22px; }
      .dicelayer.table .scene-cadre { gap: 10px; padding: 16px 22px; border-radius: 8px; }
      .dicelayer.table .scene-portrait { width: 96px; height: 96px; }
      .dicelayer.table .scene-nom { font-size: 22px; }
      .dicelayer.table .scene-compte { font-size: 13px; }
      .dicelayer.table .scene-duel { font-size: 14px; }
      .dicelayer.table .rollcap { font-size: 15px; }
      /*
       * ═══ ⚑⚑ S1228 · C-T3 — LA SCÈNE DE RÉVÉLATION (note 158 ③) ═════════
       *
       * Cinq temps, cinq états, et **aucune boîte neuve pour les sièges** : les
       * cadres, le portrait, le nom et le verdict sont ceux de la scène du
       * premier joueur (`.scene-*`), celle que Croze nomme en exemple. Ce qui
       * s'ajoute est ce qu'elle n'a pas : **la tuile retournée** du pari,
       * **la main de l'hôte**, et **le clignotement** du gagnant.
       *
       * ⚠ **PAS UNE `@media`, PAS UN `vw`/`vh` NU** — le verrou de 1080
       * (`verrou_1080.js`) les compte tous les deux comme un re-flow par
       * construction. Toutes les tailles sont en px de composition.
       *
       * ⚠ **LES CADRES NE NAISSENT PAS TRANSPARENTS ICI.** `.scene-cadre`
       * ouvre à `opacity: 0` et c'est `.serie.t1` qui les révèle — or cette
       * scène n'a pas de `t1` : son rythme en a cinq. Sans la ligne ci-dessous,
       * la rangée des paris resterait **invisible de bout en bout**.
       */
      .dicelayer.revelation .scene-cadre { opacity: 1; transform: none; }
      .dicelayer.revelation .scene { gap: 18px; }
      .dicelayer.revelation .rev-paris { transition: opacity .35s ease; }
      /* ① LES PARIS — une tuile retournée par siège, elles se retournent
         une par une, de gauche à droite (400 ms, `RÉVÉLATION.PARI`). */
      .rev-tuile { position: relative; width: 104px; height: 140px;
                   border: 1px solid var(--line); border-radius: 8px;
                   background: rgba(255, 255, 255, .04); }
      .rev-dos, .rev-chiffre { position: absolute; inset: 0; display: flex;
                   align-items: center; justify-content: center;
                   font-family: var(--display); transition: opacity .18s ease; }
      .rev-dos { font-size: 48px; color: var(--stock-dim); opacity: 1; }
      .rev-chiffre { font-size: 76px; font-weight: 800; opacity: 0; }
      .rev-pari.montré .rev-dos { opacity: 0; }
      .rev-pari.montré .rev-chiffre { opacity: 1; }
      .rev-gain { font-family: var(--display); font-size: 16px; font-weight: 800;
                  letter-spacing: .1em; color: var(--ember);
                  opacity: 0; transition: opacity .3s ease; }
      /* ② LA TENSION — la lumière se resserre sur l'hôte, les paris reculent. */
      .rev-hote { position: relative; display: flex; flex-direction: column;
                  align-items: center; gap: 10px; padding: 18px 28px;
                  border: 1px solid var(--line); border-radius: 10px;
                  opacity: .2; transform: scale(.9);
                  transition: opacity .35s ease, transform .35s ease; }
      .dicelayer.revelation.tension .rev-hote { opacity: 1; transform: none; }
      .dicelayer.revelation.tension .rev-paris { opacity: .5; }
      /* S1245 — le Casino (Ruins) n'a pas d'hôte : les mises SONT la révélation, elles ne reculent pas. */
      .dicelayer.revelation.casino.tension .rev-paris { opacity: 1; }
      /* S1374 · note 204 ① — l'autel : pas d'hôte non plus ; les signes en glyphes, le LOSER dit au verdict */
      .dicelayer.revelation.autel.tension .rev-paris { opacity: 1; }
      .rps-glyphe { display: inline-block; width: 1.5em; height: 1.5em; vertical-align: middle; }
      .rps-glyphe svg { width: 100%; height: 100%; display: block; overflow: visible; }
      .rps-glyphe.rps-mot { width: auto; height: auto; }
      .rev-chiffre .rps-glyphe { width: 72px; height: 72px; }
      .rps-choix { display: inline-flex; align-items: center; gap: 8px; }
      .rps-choix .rps-glyphe { width: 30px; height: 30px; }
      .autel-glyphes { display: flex; gap: 14px; }
      .autel-glyphes .rps-glyphe { width: 44px; height: 44px; opacity: .55; }
      .rev-perd { font-family: var(--display); font-size: 16px; font-weight: 800; letter-spacing: .1em;
                  color: var(--blood, #a3231d); opacity: 0; transition: opacity .3s ease; }
      .dicelayer.revelation.verdict .rev-faux .rev-perd { opacity: 1; }
      .rev-hote .scene-portrait { width: 124px; height: 124px; }
      .rev-main { display: flex; flex-direction: column; align-items: center; gap: 10px; }
      /* ③ LE REVEAL — la main s'ouvre : N dés tombent, le chiffre s'écrit. */
      .rev-des { display: flex; gap: 8px; height: 30px; align-items: center; }
      .rev-de { width: 26px; height: 26px; border-radius: 5px;
                border: 1px solid var(--line); background: rgba(255, 255, 255, .1);
                opacity: 0; transform: translateY(-18px);
                transition: opacity .22s ease, transform .22s ease; }
      .dicelayer.revelation.reveal .rev-de { opacity: 1; transform: none; }
      .rev-de:nth-child(2) { transition-delay: .06s; }
      .rev-de:nth-child(3) { transition-delay: .12s; }
      .rev-de:nth-child(4) { transition-delay: .18s; }
      .rev-de:nth-child(5) { transition-delay: .24s; }
      .rev-nombre { font-family: var(--display); font-size: 120px; font-weight: 800;
                    line-height: 1; opacity: 0; transform: scale(.4);
                    transition: opacity .3s ease, transform .3s ease; }
      .dicelayer.revelation.reveal .rev-nombre { opacity: 1; transform: none; }
      /* ④ LE VERDICT — juste : cerclé de blanc, trois clignotements, son gain.
         faux : éteint à 40 %, exactement le chiffre de la note. */
      .dicelayer.revelation.verdict .rev-faux { opacity: .4; transition: opacity .3s ease; }
      .dicelayer.revelation.verdict .rev-juste {
        outline: 2px solid #fff; outline-offset: 5px;
        animation: rev-clignote .46s steps(1, end) 3; }
      .dicelayer.revelation.verdict .rev-juste .rev-gain { opacity: 1; }
      @keyframes rev-clignote { 0%, 49% { opacity: 1; } 50%, 99% { opacity: .3; } }
      /* Le verdict écrit ne paraît qu'au ④ : le lire plus tôt le dévoilerait. */
      .dicelayer.revelation .rollverdict { opacity: 0; transition: opacity .3s ease; }
      .dicelayer.revelation.verdict .rollverdict { opacity: 1; }
      .scene-chiffres { display: flex; align-items: center; gap: 6px; }
      .scene-duel { display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
                    font-size: 12px; }
      /* ⛑ S1330 · DE-1 — les N dés du lanceur, et une ligne par épreuve : mon dé
         (face, mod, total) VS le sien, puis le verdict. */
      .scene-des { display: flex; gap: 10px; justify-content: center; }
      .scene-cadre .scene-des .die { width: 96px; height: 96px; font-size: 56px; }
      .scene-duel { font-size: 16px; gap: 12px; }
      .scene-duel .duel-cote { display: inline-flex; align-items: center; gap: 6px; }
      .scene-duel .die { width: 44px; height: 44px; font-size: 24px; }
      .scene-duel .duel-mod { opacity: .75; }
      .scene-detail { display: none; flex-direction: column; gap: 3px; }
      .scene-detail.ouvert { display: flex; }
      .dicelayer.serie .scene-detail, .dicelayer.serie .scene-pli { opacity: 0; }
      .dicelayer.serie.t2 .scene-detail, .dicelayer.serie.fini .scene-detail,
      .dicelayer.serie.t2 .scene-pli, .dicelayer.serie.fini .scene-pli {
        opacity: 1; transition: opacity .22s ease; }
      .scene-pli { font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
                   background: none; border: 1px solid var(--line); border-radius: 4px;
                   color: var(--slate); padding: 3px 8px; cursor: pointer; }
      @media (prefers-reduced-motion: reduce) {
        .dicelayer .die, .dicelayer .mod, .dicelayer .total,
        .dicelayer .totlbl, .dicelayer .verdict-att, .dicelayer .rollverdict,
        .dicelayer .explore-verdict,
        /* ⛑ S237 — le barreau neuf est du CONTENU, pas du mouvement. */
        .dicelayer .ce-neuf,
        .dicelayer.serie .scene-cadre, .dicelayer.serie .scene-detail,
        .dicelayer.serie .scene-pli,
        /* ⚑ S92 — le récap suit la même règle : son contenu EST le fait. */
        .recap-couche .recap-quoi, .recap-couche .recap-siege,
        .recap-couche .recap-cartes, .recap-couche .recap-note,
        .recap-couche .recap-muet {
          opacity: 1 !important; transform: none !important; }
        /*
         * ⚑ S71 — LE ROULÉ EST DU MOUVEMENT, ET RIEN D'AUTRE. Il ne porte
         * aucun fait que la face ne porte pas : on le retire entièrement, et
         * le dé paraît résolu tout de suite — l'écran d'avant S71.
         */
        .dicelayer .die-roule { display: none !important; }
        .dicelayer .die-rendu { opacity: 1 !important; }
      }

      /*
       * ═══ L'IDENTITÉ VISUELLE — dessinée, sans une seule image ══════════
       *
       * `§14.4` met les ASSETS en dernier : les 83 pages Canva. La typographie,
       * les cadres, les pastilles et les silhouettes n'en sont pas — elles se
       * dessinent, et c'est la différence entre une maquette qui se lit et un
       * tableau de chiffres.
       */
      /*
       * ═══ LES TROIS COLONNES — ce sont les trois zones, tournées ════════
       *
       * `ECRANS §2` pose trois zones qui ne bougent pas ; la maquette les pose
       * CÔTE À CÔTE. Ce n'est pas une quatrième disposition, c'est la même d'un
       * quart de tour. L'écran était en UNE colonne et tout y était empilé :
       * adversaires, moi, timer, relevé, tuile.
       *
       * Le centre est le plus large : c'est là que se passe le jeu.
       */
      /*
       * ⚑ **LA COLONNE PRINCIPALE EST ÉLARGIE ×2 — ordre de Croze.**
       *
       * `2.1fr` → **`4.2fr`**, et le plancher `420px` → `840px` : *le double,
       * exactement, sur les deux bornes.* Un facteur appliqué à la part et pas
       * au minimum aurait donné une colonne double sur grand écran et
       * inchangée sur petit — **un rythme se double en entier ou il change de
       * rythme** (`ECRANS §3ter`).
       *
       * `max-width` suit : 1500 → 2100. Sans lui, élargir le centre n'aurait
       * fait que RÉTRÉCIR les deux autres, et la table serait née en volant sa
       * place au relevé — qui est *« ce n'est pas de la décoration : c'est le
       * jeu »* (`§2`).
       */
      /*
       * ⚑ **S119 — LE PLAFOND NE SE LÈVE PLUS À 2 100, IL SUIT LA FENÊTRE.**
       * *« N'enferme rien dans une fenêtre qui ne bougerait jamais de 1920 »*.
       * Mesuré AVANT : à 3 825 px de large, l'écran de jeu s'arrêtait à
       * **2 100 px, soit 54,9 %** — un 4K rendait 45 % de fond noir.
       *
       * `max()` et non `min()`, et c'est ce qui rend le geste GRATUIT : à
       * 1 920, `88vw` vaut 1 690 < 2 100, donc le plafond reste 2 100 **au
       * pixel près** ; il ne se lève qu'au-dessus de 2 386 px de fenêtre, là
       * où il n'y avait que du vide. *Un plafond adaptatif qui rétrécit la
       * cible serait une régression déguisée en règle.*
       */
      .wrap { max-width: max(2100px, calc(var(--uvw) * 88)); }
      /*
       * ═══ ⛑⛑⛑ S1107 — LA PISTE DE GAUCHE EST FIXE, ET C'EST LE CLIGNOTEMENT
       *     DE LA NOTE 135 ① ══════════════════════════════════════════
       *
       * Croze, note 135 ① : *« lorsque c'est un autre joueur qui joue tout
       * notre écran clignote à chaque décision … ça fait sauter l'écran et les
       * cartes. »*
       *
       * **MESURÉ AU S1106, PUIS FALSIFIÉ AU S1107** — la cause n'a pas été
       * supposée, elle a été croisée dans le MÊME échantillon que l'effet, sur
       * 51 relevés ne portant QUE des faits d'autres sièges :
       *
       * ```
       *                         la classe `sans-droite` BASCULE   elle ne bascule pas
       *   ma colonne BOUGE                  5                            0
       *   ma colonne ne bouge pas           1                           45
       * ```
       *
       * **Zéro contre-exemple** : ma colonne de gauche ne bouge JAMAIS sans que
       * la troisième piste n'apparaisse ou ne disparaisse. Le grain, mot pour
       * mot le « ça saute » de Croze : `EQUIPPED` d'un tiers → `.col-gauche`
       * **361,14 → 295,86** (65,28 px), et l'inverse à la fermeture.
       *
       * **L'ARITHMÉTIQUE, ET ELLE SUFFIT À EXPLIQUER LES DEUX CHIFFRES** — la
       * piste de gauche était `1fr` dans une grille dont le TOTAL des `fr`
       * change avec le nombre de pistes :
       *
       * ```
       *   trois pistes   (1920 − 28 de marge − 28 de gouttières) / 6,3 fr = 295,87
       *   deux pistes    (1920 − 28 de marge − 14 de gouttière)  / 5,2 fr = 361,15
       * ```
       *
       * *Une piste exprimée en `fr` est une piste dont la largeur dépend de ses
       * VOISINES* — et la voisine de droite naît d'un fait qui n'est pas de moi.
       *
       * ⛑ **LE REMÈDE EST LA VALEUR AU REPOS, PAS UNE MOYENNE.** L'écran passe
       * la vaste majorité du temps sans moment ouvert : figer à 295,86 aurait
       * rétréci ma colonne de 65 px en permanence pour guérir un saut. La piste
       * vaut donc `--piste-gauche`, **la largeur qu'elle avait déjà au repos**,
       * et c'est le CENTRE qui absorbe la différence — ce qui est sa fonction :
       * il est la piste que le moment prend.
       *
       * ⚠ **LES DEUX MINIMUMS RESTENT TENUS** à trois pistes : il reste
       * 1864 − 361 = 1503 px pour 4,2 + 1,1 fr, soit **1190,7** au centre
       * (plancher 840) et **312,3** à droite (plancher 260).
       *
       * ⚠ **CE BLOC NE TOUCHE PAS LE MODE ADMIN** : les règles de bascule
       * responsive vivent toutes sous `:where(html[data-verrou="non"])`, et
       * elles réécrivent `grid-template-columns` en entier.
       */
      .colonnes { display: grid;
                  --piste-gauche: 361px;
                  grid-template-columns: var(--piste-gauche) minmax(840px, 4.2fr)
                                                       minmax(260px, 1.1fr);
                  gap: 14px; align-items: start; padding: 0 14px 20px; }
      .col-gauche, .col-droite { display: flex; flex-direction: column; gap: 6px; }
      /*
       * ⚑ **S54 — LE BLOC `LES AUTRES` PORTE SON PROPRE EMPILEMENT.** Il a deux
       * parents possibles : la colonne de moment (déjà en `flex column`) et le
       * centre (qui ne l'est pas). *Un bloc qui hérite sa mise en page de son
       * parent se disloque le jour où il change de parent* — et c'est
       * précisément ce que ce palier lui fait faire à chaque rendu.
       */
      .les-autres { display: flex; flex-direction: column; gap: 6px; position: relative; }
      /*
       * ⛑ S289 — LE POP-UP DE CHOIX, PAR-DESSUS LA RANGÉE DES AUTRES
       * (note ㋒ ②). Mesuré avant : il commençait à `y 1079` dans une fenêtre
       * de 1 080 — le bloc auquel on doit RÉPONDRE était sous la ligne de
       * flottaison. Il se pose maintenant là où l'œil est déjà.
       *
       * ⚠ **AUCUNE COULEUR NOUVELLE** : le cadre garde ses bordures d'état
       * (`a-toi` en ember, `attente` en gris). Seule l'ombre le décolle de ce
       * qu'il recouvre, et elle est noire, pas teintée.
       */
      /*
       * ⛑⛑ **S764 — IL NE RECOUVRE PLUS RIEN : IL PREND SA PROPRE RANGÉE**
       * (note 91 ①, verbatim Croze : *« déjà remonté 15 fois peut-être »*).
       *
       * ─── CE QUI A ÉTÉ MESURÉ AVANT DE BOUGER (1920×1080, `?etat=poll-presente-declinable`)
       *
       * ```
       * panneau        x 753  y  95  w 1096  h 672   (absolute, z 6)
       * .autre-bloc J4 x 753  y  67  h 1191   ← recouvert sur 672 px =  56 %
       * .autre-bloc J1 x 1121 y  67  h  573   ← recouvert sur 545 px =  95 %
       * .autre-bloc J2 x 1489 y  67  h  908   ← recouvert sur 672 px =  74 %
       * ```
       *
       * Le S517 avait déjà tenté la seconde branche de sa consigne — *« ou
       * passe sous les en-têtes »* — en posant `--h-bandeau` (28 px) : le
       * panneau commençait bien SOUS la rangée des noms, et **il coupait les
       * portraits en deux quand même.** *Se décaler sous un en-tête n'est pas
       * cesser de recouvrir* : la mesure ci-dessus est prise APRÈS le S517.
       *
       * On prend donc l'autre branche, celle qui ferme la question : le panneau
       * redevient un enfant EN FLUX de `.les-autres` (flex colonne), placé
       * premier par `order`. Il POUSSE la rangée des joueurs au lieu de la
       * couvrir — plus aucun pixel de fiche derrière lui, à aucune hauteur.
       *
       * ⚠ `--h-bandeau` et `poseLaHauteurDuBandeau` n'ont plus de lecteur : ils
       * ne servaient qu'à ce décalage. Retirés dans le même geste — *une
       * variable que plus personne ne lit est un vœu*, et elle aurait fait
       * croire à un calage encore actif.
       *
       * ⚠ La classe `sur-autres` RESTE : elle est aussi portée par
       * `.fiche-calque` (main.ts), qui, lui, recouvre pour de bon — c'est la
       * neuvième dent de `couverts`. Seule cette règle composée change.
       *
       * `max-height` borne la poussée et garde le défilement interne du
       * panneau : sans elle, ses 672 px naturels repoussaient les fiches à
       * `y 739` dans une fenêtre de 1 080.
       */
      .les-choix.sur-autres { order: -1; z-index: 6;
                              margin: 0; overflow: auto;
                              max-height: calc(var(--uvh) * 45);
                              background: var(--ink-2);
                              box-shadow: 0 18px 40px rgba(0, 0, 0, .7); }
      .les-choix.sur-autres.replie { max-height: none;
                                     overflow: visible; min-height: 0;
                                     padding: 4px 10px; }
      /*
       * Replié : la bande dit ce qu'on doit, le corps attend.
       *
       * ⚑ **S344 — `.atj-fin` EST EXEMPTÉ, ET CE N'EST PAS UNE PRÉFÉRENCE.**
       * Depuis le S342 ce bloc porte **le seul bouton qui ferme le tour**. Le
       * cacher au repli gelait la partie — vu au DOM, `0 × 0` — et c'est très
       * exactement ce que le commentaire de ce repli interdit deux blocs plus
       * haut : *« Une fermeture aurait rendu la décision inatteignable —
       * `§0.1 ④`, le gel. »* **Le repli cache le détail, jamais le geste.**
       */
      .les-choix.sur-autres.replie
        > *:not(.choix-replier):not(.choix-titre):not(.atj-fin) { display: none; }
      /* Replié, le fermoir reste sur la bande, à côté du titre. */
      .les-choix.sur-autres.replie > .atj-fin { border-top: none; margin: 0;
                                                padding-top: 4px; }
      /* S1261 · H-T2 (Q-PLAQUE-ICONES) — un outil : le texte seul, rouge au survol. */
      .choix-replier { float: right; margin-left: 10px; background: transparent;
                       border: 0; color: var(--stock);
                       font-family: var(--display); font-weight: 800; font-size: 10px;
                       letter-spacing: .12em; padding: 3px 8px; cursor: pointer; }
      .choix-replier:hover, .choix-replier:focus-visible { color: var(--rouge-vif); background: transparent; }
      /* La zone ③ a rejoint le centre : elle empile comme une colonne le faisait,
         mais elle n'en est plus une. */
      .zone-agir { display: flex; flex-direction: column; gap: 6px;
                   padding: 6px 0 10px; border-bottom: 1px solid var(--rule); }
      /*
       * ⚑ **S18 — LES TROIS PLACEMENTS SONT EXPLICITES, RANGÉE COMPRISE.** Tant
       * que la fenêtre mangeait les colonnes 2 ET 3, l'auto-placement suffisait :
       * il n'y avait jamais trois enfants à la fois. La droite reste maintenant
       * PENDANT le combat, et l'ordre DOM n'est plus l'ordre des colonnes — la
       * droite est peinte AVANT la fenêtre pour passer sous son voile. **Un
       * placement implicite qui dépend de l'ordre DOM casse le jour où l'ordre
       * DOM sert à autre chose**, et c'est exactement ce jour-là.
       *
       * ⚠ **`grid-row: 1` N'EST PAS DÉCORATIF — SANS LUI LA FENÊTRE TOMBE EN
       * RANGÉE 2.** Mesuré : `combat-fenetre` à `y = 2419` sous une colonne
       * gauche haute de 2338. Colonne définie + rangée automatique, et le
       * curseur d'auto-placement était déjà passé en colonne 4 après la droite :
       * la règle de packing « sparse » incrémente alors la rangée. *Une colonne
       * fixée à moitié se lit comme une colonne fixée, et le défaut n'apparaît
       * qu'au troisième enfant.*
       */
      /*
       * ⊕ **S89 — LA DERNIÈRE COLONNE SANS BORNE LA REÇOIT, ET C'ÉTAIT LA
       * SIXIÈME OCCURRENCE.** `.col-droite` est solidaire de la vue depuis le
       * palier 56 ; `.col-gauche` porte exactement le même genre de contenu —
       * de la CONSULTATION à quantité variable (fiche, inventaire, quêtes,
       * registre) — et pesait **2 598 px dans une fenêtre de 1 080**, sans
       * borne, en `static`.
       *
       * *La raison écrite au palier 56 vaut mot pour mot ici : « une colonne
       * qui sort par le bas de la page ne le donne à aucun compte » — et le
       * compte de quêtes, de cartes et de pièces d'équipement n'est pas plus
       * fixe que le compte de sièges.*
       *
       * ⚠ **C'EST CE QUI FAIT TENIR LA PAGE DANS L'ÉCRAN.** Les trois colonnes
       * étant bornées, la page cesse de faire 3,4 à 4,2 hauteurs d'écran : ce
       * qui défile, ce sont les colonnes, chacune chez elle. **`1920×1080
       * adaptatif` est une référence gravée** — une page de 3,6 écrans ne s'y
       * adapte pas, elle la déborde.
       */
      .col-gauche { grid-column: 1; grid-row: 1;
                    align-self: start; position: sticky; top: 8px;
                    max-height: calc(calc(var(--uvh) * 100) - var(--haut-des-bandeaux)); overflow-y: auto;
                    overscroll-behavior: contain; }
      /*
       * ⛑ S486 · `Q-SCENE-FENETRE` — pendant une fenêtre, la colonne passe
       * AU-DESSUS de la couche du jet (900) et SOUS `.bv-couche` (940) et
       * `.plein` (950). Voir `main.ts::colonneGauche` pour le pourquoi et pour
       * la mesure : sans ça, la Signature est peinte, active et INATTEIGNABLE
       * pendant toute la fenêtre de réaction.
       */
      .col-gauche.pendant-fenetre { z-index: 920; }
      /*
       * ⛑⛑ **S504 — ET LE 920 A VOLÉ 90 % DE MON PROPRE BANDEAU, PENDANT
       * DEUX PALIERS, SANS QUE RIEN NE LE DISE.**
       *
       * ─── Ce que la mesure a rendu ────────────────────────────────────────
       *
       * `?seed=55&fait=TRAP_DRAWN`, peau JOUEUR, fenêtre ouverte. Le bandeau de
       * MES capacités (`.main-basse .pli.a-plein`, celui qu'on survole pour
       * ouvrir son kit) est **couvert à 85 % en surface**, et à
       * l'atteignabilité — 21 points sondés sur sa largeur :
       *
       * ```
       * avec `pendant-fenetre` (z 920)    3 / 21 points répondent
       * la classe retirée      (z auto)  21 / 21
       * la classe remise                  3 / 21
       * ```
       *
       * La bande morte va de `x = 14` à `x = 390` sur 420 px de large : ce qui
       * répond dessous, ce sont les cartes et les créneaux de la colonne
       * (`.zoomable`, `.cz`, `.creneau`, `.cz-vignette`).
       *
       * ─── POURQUOI CE N'EST PAS UNE ANNULATION DU S486 ────────────────────
       *
       * Le S486 a monté la colonne pour une raison JUSTE et MESURÉE : sans
       * elle, la Signature est *« peinte, active et INATTEIGNABLE pendant toute
       * la fenêtre de réaction »* — la plainte des trois fois de Croze. Rien de
       * ça ne bouge : **la colonne garde son 920.**
       *
       * Ce que le S486 n'avait pas mesuré, c'est l'AUTRE moitié du même besoin.
       * `.main-basse` porte la main ET le kit ; elle était à `z-index: 40`,
       * donc au-dessus de la colonne tant que celle-ci valait `auto`, et
       * DESSOUS dès qu'elle montait. **Pendant une fenêtre, le joueur doit
       * pouvoir agir depuis les DEUX surfaces** — c'est l'argument du S486, mot
       * pour mot, appliqué à sa seconde moitié.
       *
       * ⚠ **921, ET LE NOMBRE TIENT L'ÉCHELLE DU DÉPÔT** : au-dessus de la
       * colonne (920), **sous `.bv-couche` (940) et `.plein` (950)** — les deux
       * surfaces pleines et volontaires. Un 960 les ferait surgir dessous.
       *
       * ⚠ **ET IL PASSE AUSSI AU-DESSUS DE `.dicelayer` (900), PENDANT LA
       * FENÊTRE SEULEMENT.** C'est voulu et c'est la même raison : une fenêtre
       * de réaction s'ouvre PENDANT le jet, et un bandeau d'action couvert par
       * la couche du jet est exactement le défaut que le S486 a réparé un cran
       * plus haut. Hors fenêtre, la classe n'est pas posée et `.dicelayer`
       * recouvre le bandeau comme avant — le recouvrement VOULU que
       * `couverts` écarte par sa dent ⑥.
       *
       * *Un z-index qui monte pour rendre une chose atteignable en rend une
       * autre inatteignable, et le second effet ne se voit que si on balaie
       * l'état.*
       */
      .main-basse.pendant-fenetre { z-index: 921; }
      @media (max-width: 1199px) {
        /* Empilé, même remède que ses deux sœurs. */
:where(html[data-verrou="non"]) .col-gauche { position: static; max-height: none; overflow-y: visible; }
      }
      /*
       * ═══ ⚑⚑ S344 — « LES TROIS COLONNES ÉTANT BORNÉES » EN BORNAIT DEUX ════
       *
       * Le paragraphe du S89, dix lignes plus haut, écrit noir sur blanc :
       * *« C'EST CE QUI FAIT TENIR LA PAGE DANS L'ÉCRAN. Les trois colonnes
       * étant bornées, la page cesse de faire 3,4 à 4,2 hauteurs d'écran. »*
       * **Deux l'étaient. `.col-centre` ne portait que `grid-column`,
       * `grid-row` et un `padding: 0`.** L'affirmation est fausse depuis le
       * S89, et elle se relit comme une garantie depuis autant de paliers —
       * *une phrase qui déclare un invariant à la place de trois lecteurs est
       * un instrument sans dents.*
       *
       * ─── MESURÉ, MODE JOUEUR, 1920×1080 ────────────────────────────────
       *
       * ```
       * .col-gauche   y=108   h=1064   bottom=1172   ← bornée (calc(100vh-16px))
       * .col-centre   y=108   h=1281   bottom=1389   ← SANS BORNE
       *   .zone-tuile         h=1061                   la consultation
       *   .bloc-combat        h=  82
       *   .zone-agir          h= 108   y=1281        ← OÙ L'ON AGIT, 201 px sous le bord
       * ```
       *
       * ⚠ **ET C'EST LE MÊME DÉFAUT QUI A DÉJÀ ÉTÉ CHASSÉ TROIS FOIS** — S54
       * (`lesAutres` à `y=1196`), S189 (`les-choix` finissant à `y=1132`), S342
       * (`FINIR LE TOUR` à `y=1074`, six pixels visibles). Chaque fois on a
       * REMONTÉ le bloc tombé ; **la colonne, elle, restait sans plafond**, si
       * bien que le suivant retombait. *On déplaçait le symptôme le long d'une
       * colonne qui n'avait pas de fond.*
       *
       * ─── LA RÈGLE EST CELLE DES DEUX SŒURS, PAS UNE NOUVELLE ────────────
       *
       * Ce qui se CONSULTE défile ; ce avec quoi on AGIT ne bouge pas. La
       * colonne est donc bornée à la fenêtre **et devient une pile** : la zone
       * des tuiles (et le bloc de combat) prennent ce qui reste et défilent
       * chez elles ; `.zone-agir` garde sa place, en bas, toujours dans
       * l'écran.
       *
       * ⚠ **`min-height: 0` N'EST PAS DÉCORATIF** : sans lui un enfant flex ne
       * descend pas sous sa taille de contenu, et la borne du parent est
       * simplement débordée — la règle compilerait et ne tiendrait rien.
       */
      /*
       * ⛑⛑ **S922 — LA RÉSERVE SE PREND SUR LA HAUTEUR, PAS DANS LE
       * REMBOURRAGE.** Premier jet : `padding-bottom: 226px`. Mesuré sur pièce,
       * le recouvrement est resté — parce que ce qui couvre est la BOÎTE de la
       * colonne, pas son contenu : `.col-centre` descendait à `bas 1004` quand
       * `.main-basse`, désormais `fixed`, commence à `y 820`. Un rembourrage
       * intérieur ne remonte pas un bas de boîte. *Une réserve qui ne raccourcit
       * rien ne réserve rien.*
       * ⚠ Et `overflow: visible` ici est voulu (S486) : ce qui défile est
       * `.zone-tuile`, en dessous. La colonne raccourcie rend donc son prix en
       * défilement INTERNE, jamais en atteignabilité.
       */
      .col-centre { grid-column: 2; grid-row: 1; padding: 0;
                    align-self: start; position: sticky; top: 8px;
                    max-height: calc(calc(var(--uvh) * 100) - var(--haut-des-bandeaux)
                                     - var(--reserve-de-la-main)); min-height: 0;
                    display: flex; flex-direction: column;
                    overscroll-behavior: contain; }
      /* La consultation prend le reste et défile chez elle. */
      .col-centre > .zone-tuile { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
      .col-centre > .bloc-combat { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
      /* Ce avec quoi on agit ne se comprime pas et ne sort pas de l'écran. */
      .col-centre > .zone-agir { flex: 0 0 auto; }
      @media (max-width: 1199px) {
        /* Empilé, même remède que ses deux sœurs. */
:where(html[data-verrou="non"]) .col-centre { position: static; max-height: none; display: block; }
:where(html[data-verrou="non"]) .col-centre > .zone-tuile,
        :where(html[data-verrou="non"]) .col-centre > .bloc-combat { overflow-y: visible; }
      }
      .col-droite { grid-column: 3; grid-row: 1; }

      /*
       * ═══ ⚑ S54 — HORS MOMENT, LA TROISIÈME PISTE N'EXISTE PAS ══════════════
       *
       * Arbitrage de Croze : la colonne de droite ne s'affiche **que** quand le
       * centre est pris. Le DOM cesse alors de la rendre — mais **une piste de
       * grille vide reste une piste** : `grid-template-columns` en garde trois,
       * et le centre se serait retrouvé bordé d'une bande morte de 260 px
       * pendant tout le jeu normal. *Retirer un enfant ne retire pas sa
       * colonne.*
       *
       * La classe est posée par `render`, sur le même test que le rendu — pas
       * sur un second qui pourrait diverger. Les deux ratios de la piste
       * centrale restent ceux de la grille à trois : le centre s'élargit de ce
       * que la droite lui rend, il ne change pas de rythme.
       */
      .colonnes.sans-droite { grid-template-columns: var(--piste-gauche)
                                                     minmax(840px, 4.2fr); }

      /*
       * ═══ ⚑ LA BASCULE — ARBITRAGE DE CROZE, APPLIQUÉ TEL QUEL ══════════════
       *
       * *« Cible 1920×1080, adaptatif 1200×800 → 4K, bascule 2 colonnes SOUS
       * 1400 px. »* Le point de bascule était à **1100** et il était FAUX par
       * construction : les trois pistes à leur minimum réclament
       * `230 + 840 + 260` + deux gouttières de 14 + deux marges de 14 =
       * **1386 px**. Entre 1101 et 1386 la grille débordait — mesuré à 1185 px
       * de vue : `scrollWidth 1372 > clientWidth 1185`, la droite hors écran.
       * **1400 couvre le plancher réel de 1386**, et c'est pour ça que
       * l'arbitrage tombe juste.
       *
       * ─── DEUX COLONNES, ET LA DROITE PASSE AU-DESSUS DE LA GAUCHE ─────────
       *
       * Le centre garde la largeur — *c'est là que se passe le jeu* — et les
       * DEUX zones de consultation s'empilent à côté. **L'ORDRE S'INVERSE, et
       * c'est mesuré, pas supposé** : premier jet avec `gauche` en tête, la
       * droite tombait à `y = 2074` sous une colonne gauche haute de 1956 —
       * c'est-à-dire **hors écran, à 1366 px, exactement ce que S18 vient de
       * réparer à 1920.**
       *
       * En trois colonnes l'ordre du regard est `moi · le monde · les autres` ;
       * en deux il devient `le monde · les autres · moi`. *Ce qu'on doit voir en
       * agissant, c'est l'action et les PV des autres ; sa propre fiche est ce
       * qu'on connaît déjà, et elle supporte de descendre d'un cran.* Consigne
       * de portée, pas de contenu — rien n'est retiré.
       *
       * ⚠ **LA FENÊTRE DE COMBAT PREND LES DEUX RANGÉES** : sans `span 2`, elle
       * n'occuperait que la hauteur de la droite et la gauche passerait dessous.
       */
      /*
       * ═══ ⛑⛑⛑ S1090 · LA SECONDE FAMILLE DE FUITE DU VERROU — UNE REQUÊTE DE
       * ════     MÉDIA LIT LA FENÊTRE, JAMAIS LA COMPOSITION ════════════════
       *
       * Le S1071 a nommé la première (`vw`/`vh`) et lui a donné son remède
       * (`--uvw`/`--uvh`). **Il n'a pas vu celle-ci**, et elle est plus large :
       * sous le verrou la composition fait TOUJOURS 1920 × 1080, donc toute
       * `@media` sur la TAILLE est un re-flow par construction — il ne dépend
       * pas du contenu, seulement de la fenêtre de Croze.
       *
       * ⚑ **MESURÉ AU S1090, ET C'EST LE BLOC ① QUI A RENDU ZÉRO À CÔTÉ.**
       * À 1280 × 1024, après migration de toutes les unités armées :
       * `verrou_1080` rendait `① RIEN sur 44` **et la page bougeait encore** —
       * `.col-gauche` 361 → 470 unités de large, `.col-centre` 1517 → 1409,
       * parce que ces trois-là changent la GRILLE (trois colonnes deviennent
       * deux). *Un premier bloc qui rend zéro sur une page qui bouge encore
       * mesure la mauvaise famille.*
       *
       * ⚑ **`:where()` PORTE UNE SPÉCIFICITÉ NULLE** — l'ordre des règles ne
       * bouge pas d'un cran, et hors verrou (`?debug=1`, le banc) **rien ne
       * change** : le banc n'est pas un écran de jeu, il garde ses replis.
       *
       * ⚠ **TROIS SUR TREIZE, ET C'EST DÉLIBÉRÉ.** Ce sont les trois que
       * `verrou_1080 ②` a mesurées ARMÉES. Les dix autres sont nommées par
       * l'instrument et attendent la fenêtre qui les arme — *un remplacement
       * en masse sur des surfaces qu'on n'a pas ouvertes rend un vert qui ne
       * mesure rien* (S1071, et la règle tient).
       */
      @media (max-width: 1399px) {
        :where(html[data-verrou="non"]) .colonnes { grid-template-columns: minmax(0, 3fr) minmax(300px, 1fr); }
        :where(html[data-verrou="non"]) .col-centre { grid-column: 1; grid-row: 1 / span 2; }
        :where(html[data-verrou="non"]) .col-droite { grid-column: 2; grid-row: 1; }
        /*
         * ⚠ **AUCUNE COLLE DANS CETTE PISTE — ET LE DÉFAUT TROUVÉ ICI EST PLUS
         * VIEUX QUE CE PALIER.** Sous 1400 px, gauche et droite partagent la
         * MÊME colonne (2), l'une sous l'autre. `.col-droite` y est `sticky`
         * depuis le palier 56 : elle se punaise à `top: 8px` **et la colonne
         * gauche lui passe dessous**.
         *
         * ```
         * 1366×768, etat-Z, chevauchement mesuré
         * scrollY  400   226 px
         * scrollY  900   726 px
         * scrollY 1400   752 px — rectangles identiques
         *
         * TÉMOIN — la colle de la DROITE retirée, tout le reste inchangé :
         * scrollY  900     0 px
         * ```
         *
         * *Le témoin nomme le coupable : ce n'est pas la borne, c'est la colle,
         * et c'est celle de la droite.* Elle est donc retirée **des deux** à
         * cette largeur — *deux blocs collants dans une même piste sont deux
         * blocs qui se marchent dessus, et un seul l'était déjà de trop.*
         *
         * **Les BORNES et le défilement interne restent** : ce sont eux qui
         * divisent la hauteur de page par deux, pas la colle.
         */
        :where(html[data-verrou="non"]) .col-gauche { grid-column: 2; grid-row: 2; }
        /* ⚠ La COLLE de ces deux colonnes se retire plus bas, APRÈS la règle
           qui la pose — sinon l'override perd la cascade. Voir `.col-droite`. */
        /*
         * ⚑ **S54 À DEUX COLONNES — LA GAUCHE REMONTE EN RANGÉE 1.** Sans
         * cette ligne, elle resterait clouée en rangée 2 et laisserait
         * au-dessus d'elle le trou exact de la colonne absente. *Une rangée
         * fixée pour faire de la place à un bloc doit être relâchée quand le
         * bloc n'est pas là.*
         */
        :where(html[data-verrou="non"]) .colonnes.sans-droite .col-gauche { grid-row: 1; }
        /*
         * ⚠ **ET LA GRILLE DOIT ÊTRE RÉÉCRITE ICI, PAS SEULEMENT PLUS HAUT —
         * MESURÉ, PAS SUPPOSÉ.** `.colonnes.sans-droite` pèse deux classes ;
         * le `.colonnes` de ce bloc n'en pèse qu'une. **La règle de base
         * gagnait donc DANS la requête média**, et le relevé à 1366×768 l'a
         * pris en flagrant délit :
         *
         * ```
         * .col-centre  x  14  w  252      ← la piste de 1fr
         * .col-gauche  x 280  w 1057      ← la piste de 4.2fr
         * .zone-tuile  scrollW 566 > clientW 252
         * ```
         *
         * *Le centre avait la largeur de la marge, et la fiche perso occupait
         * l'écran.* C'est **la faute exacte** que `.col-droite .table-autres`
         * avait déjà payée vingt lignes plus bas — *une règle responsive qui
         * ne gagne pas la cascade se lit comme une règle appliquée* — et elle
         * s'est reproduite au premier ajout de classe.
         */
        :where(html[data-verrou="non"]) .colonnes.sans-droite { grid-template-columns: minmax(0, 3fr)
                                                       minmax(300px, 1fr); }
      }
      /*
       * ⚠ **SOUS 1200 px ON EST HORS DE LA PLAGE ARBITRÉE** (« 1200×800 → 4K »).
       * L'empilement d'origine reste comme PLANCHER, pour qu'une fenêtre étroite
       * rende quelque chose de lisible plutôt que de déborder — *une plage non
       * couverte n'est pas une plage interdite.* La rangée redevient automatique :
       * trois `grid-row` fixés sur une grille à une colonne se superposeraient.
       */
      @media (max-width: 1199px) {
:where(html[data-verrou="non"]) .colonnes { grid-template-columns: 1fr; }
:where(html[data-verrou="non"]) .col-gauche,
        :where(html[data-verrou="non"]) .col-centre,
        :where(html[data-verrou="non"]) .col-droite { grid-column: 1; grid-row: auto; }
        /* Même cascade, même remède : sans cette ligne le plancher à une
           colonne en rendrait deux dès que la droite disparaît. */
:where(html[data-verrou="non"]) .colonnes.sans-droite { grid-template-columns: 1fr; }
      }
      /*
       * ═══ LA BANDE DE TIMER — PLEINE LARGEUR, TOUT EN HAUT ══════════════
       *
       * Elle remplace le bandeau d'identité, qui portait ONZE faits. Elle en
       * prend deux — le tour de donjon et le Collapse — et l'ordre des sièges,
       * lu de `turnOrder`/`activePlayerId` et jamais recalculé.
       *
       * L'orange braise est ici CHEZ LUI : c'est la réservation du Collapse
       * (§2). Le siège actif se distingue par la GRAISSE et un liseré, pas par
       * une couleur — les couleurs de siège sont déjà prises, et en ajouter une
       * pour « actif » ferait un sixième sens sur une teinte.
       */
      /*
       * ═══ ⚑⚑ S616 · LA BANNIÈRE « À TON TOUR DE JOUER » (note 76 ①) ════════
       *
       * Croze : *« Bannière : « À TON TOUR DE JOUER » AU-DESSUS de la rangée
       * « Joueur X · Y · Z ». »* Elle surmonte `.bande-timer`, qui porte ce
       * ruban — d'où la parenté visuelle assumée : même fond `--ink-2`, même
       * `--display`, même interlettrage. C'est la MÊME bande, d'un cran plus
       * haut et d'un cran plus fort.
       *
       * ⚠ **AUCUNE COULEUR RÉSERVÉE** (`ECRANS §2`) : ni `--ember`, qui dit ce
       * qui brûle, ni `--activable`, qui dit ce qui se clique. Un énoncé n'est
       * ni l'un ni l'autre — il se distingue par la TAILLE et la GRAISSE.
       * `--stock` est l'encre pleine, celle du `.bt-tour` juste en dessous.
       *
       * ⚠ **PAS DE `position: sticky` ICI.** Le `.wrap` est `position: relative`
       * et l'écran de debug vit SOUS l'écran de jeu : une bande collée au haut
       * recouvrirait le banc qu'on vient chercher en défilant — c'est le
       * raisonnement déjà tenu pour `mainBasse`, dans l'autre sens.
       *
       * ⚠ **ELLE N'EXISTE PAS HORS DE MON TOUR** — le DOM ne la porte pas, elle
       * n'est pas masquée. Une bannière qui garderait sa hauteur à vide
       * pousserait tout l'écran d'un cran à chaque tour d'adversaire.
       */
      .banniere-atj { display: flex; align-items: center; justify-content: center;
                      padding: 10px 14px; background: var(--ink-2);
                      border-bottom: 1px solid var(--rule); }
      .banniere-atj-txt { font-family: var(--display); font-weight: 800; font-size: 26px;
                          letter-spacing: .22em; text-transform: uppercase;
                          color: var(--stock); }
      .bande-timer { display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
                     padding: 7px 14px; border-bottom: 1px solid var(--rule);
                     background: var(--ink-2); }
      /*
       * ═══ ⛑⛑ S1117 · LA BARRE D'ONGLETS SORT DE LA ZONE DES QUÊTES ═══════
       *
       * Croze, note 136 ② : *« décale légèrement les onglets afin qu'ils ne
       * soient pas overlap par les quêtes »*. **Le défaut est reproduit** : au
       * survol d'une quête, `.qt-carte` passe de `opacity: 0` à `1`, couvre
       * `x 259 → 624`, et `elementFromPoint` sur « ← LES COLONNES » rend
       * `qt-carte` — **le bouton n'est plus cliquable**.
       *
       * ⚠ **`margin-left: auto`, ET PAS UN NOMBRE.** Premier jet : déplacer la
       * barre à la fin du DOM de la bande. Mesuré après coup : elle tombe à
       * `x 497`, et la seconde carte de quête va jusqu'à **624** — elle
       * chevauchait encore. *Une place estimée n'est pas une place mesurée ; et
       * retirer un élément de la tête d'une rangée déplace tous les autres.*
       * `auto` la colle au dernier bloc de la bande (le ruban, `x 1031`) : elle
       * ouvre à **808**, donc hors de toute carte, **et le chiffre se recalcule
       * tout seul** le jour où la bande change.
       *
       * ⚠ **NI `z-index`, NI `position` POUR CE DÉFAUT-LÀ** : *un `z-index` ne se
       * compare pas entre contextes d'empilement* et se retournerait au premier
       * parent qui en crée un. Une place hors de la zone des quêtes ne dépend de
       * personne. ⛑⛑ **ET CETTE PHRASE, LUE COMME UNE INTERDICTION GÉNÉRALE, A
       * TENU LE DÉFAUT DU S1166 PENDANT DIX-SEPT PALIERS** — voir le bloc
       * suivant : elle est une DOCTRINE, et une doctrine ne remplace pas la
       * mesure de la chaîne des parents.
       */
      /*
       * ═══ ⛑⛑⛑ S1166 · LA BARRE D'ONGLETS PASSE AU-DESSUS DE LA FILE DE
       *      ══ SCÈNES — ET LE `z-index` EST ICI LÉGITIME, MESURÉ ═══════════
       *
       * **Le défaut, mesuré à l'écran, `?etat=collapse-reaction&siege=Joueur 3`,
       * 148 échantillons sur 75,2 s (cadence médiane 514 ms, aucun étranglement) :**
       *
       * ```
       *   bloqué   77 / 148 échantillons (52 %)   39,4 s sur 75,2
       *   la plus longue plage BLOQUÉE            10 735 ms
       *   les fenêtres LIBRES pendant la file     ~1 020 ms chacune
       *   le couvreur                             DIV.dicelayer (borne · tirage · serie)
       * ```
       *
       * `elementFromPoint` au centre de `DUNGEON TIMER` rend la couche de scène,
       * une fois sur deux, pendant les 45 premières secondes. **Le bouton est
       * peint, il a l'air cliquable, et un clic sur deux ferme une scène au lieu
       * de changer d'onglet** — *un élément couvert se présente exactement comme
       * un élément visible, et il ne se trahit qu'au moment où Croze clique.*
       *
       * ⚑ **POURQUOI LE `z-index` EST LÉGITIME ICI, ET C'EST UNE MESURE, PAS UN
       * AVIS.** La chaîne des parents de `nav.onglets` a été relevée propriété
       * par propriété (transform · filter · opacity · isolation · blend ·
       * will-change · contain · perspective · position+z) :
       *
       * ```
       *   NAV.onglets        static   z auto   aucun contexte
       *   HEADER.bande-timer static   z auto   aucun contexte
       *   DIV.wrap           relative z auto   aucun contexte  (z auto ⇒ aucun)
       *   DIV#app            static   z auto   aucun contexte
       *   DIV#composition    absolute z auto   CONTEXTE (transform)   ⟵ le premier
       * ```
       *
       * **`.dicelayer` (900) et `.porte-rapport` (930) vivent dans CE contexte-là**
       * (`#scenes` est un enfant de `#composition`, `position: static`). Il n'y a
       * donc aucun contexte intermédiaire à traverser : le nombre se compare, et
       * `.porte-rapport` le prouve depuis des paliers — elle est haute *« pour
       * qu'on ait le rapport PENDANT qu'une scène est à l'écran, y compris quand
       * c'est elle qui ne se referme pas »*. **La navigation mérite la même
       * phrase.**
       *
       * ⚠ **905, ET PAS 1 000** : au-dessus de la file de scènes (900) — qui est
       * un TEMPO, et *« rien ne se ferme par un tempo de scène »* (Croze, 0c) —
       * et **sous tous les modaux**, qui sont des DÉCISIONS et doivent bien
       * couvrir la sortie : `.porte-rapport` 930 · `.bv-couche` 940 · `.plein`
       * 950 · `--z-zoom` 960 · ADMIN 999 · `.volet-rapport` 1000.
       *
       * ⚠ **CE QUE ÇA COÛTE À LA SORTIE DE SCÈNE** : un clic sur la couche ferme
       * la scène, et la barre y fait un trou de 107 × 30 px sur 1920 × 1080 —
       * **0,16 % de la surface**. Le reste de l'écran ferme comme avant.
       *
       * ⛑⛑ **ET AUCUN INSTRUMENT NE POUVAIT LE VOIR : `couverts` EXEMPTE LA
       * FAMILLE ENTIÈRE.** Sa dent ⑥ dit *« une `.dicelayer` plein écran couvre
       * TOUT, et c'est VOULU »* — née de 44 fausses alertes, et juste pour du
       * CONTENU. *Un instrument qui exempte une famille est aveugle au membre qui
       * doit en être l'exception.* La dent ㉒ de `couverts.js` porte désormais
       * cette exception, comptée et nommée à part (`sousLaScène`).
       */
      .bande-timer .onglets { display: flex; gap: 8px; margin-left: auto;
                              position: relative; z-index: 905; }
      .bt-tour { font-family: var(--display); font-weight: 800; font-size: 13px;
                 letter-spacing: .18em; text-transform: uppercase; color: var(--stock); }
      .bt-collapse { font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
                     color: var(--ember); }
      /*
       * ⛑⛑ S1232 · V-T1 — le run, le tour et le Collapse sur deux lignes, APRÈS
       * le coin des quêtes : `--fin-des-quetes` est sa fin réelle, posée par
       * `réserverLaPlaceDesQuêtes` (main.ts). La barre a 14 px de marge
       * intérieure : la marge du bloc la retranche, et garde 12 px d'air.
       */
      .bt-etat { display: flex; flex-direction: column; gap: 2px; flex: 0 1 auto; min-width: 0;
                 margin-left: max(0px, calc(var(--fin-des-quetes, 0px) - 14px + 12px)); }
      .bt-sieges { display: flex; align-items: center; gap: 12px; margin-left: auto; }
      .bt-siege { display: flex; align-items: center; gap: 5px; opacity: .55; }
      .bt-siege.actif { opacity: 1; }
      .bt-siege.actif .bt-nom { font-weight: 800; }
      .bt-siege.actif .bt-ico { border-color: var(--stock); }
      .bt-ico { width: 24px; height: 24px; object-fit: cover; border: 1px solid var(--rule);
                background: var(--ink); }
      .bt-nom { font-size: 11px; letter-spacing: .06em; }

      /*
       * ═══ L'ENCADRÉ PERSO — en tête du CENTRE ═══════════════════════════
       *
       * Le NOM, le siège et la tuile, repris au bandeau mort : *« qui je suis
       * et où je suis »* est une seule question, donc une seule ligne.
       */
      .encadre-perso { border-left: 3px solid var(--gold); padding: 8px 0 4px 10px;
                       margin-bottom: 6px; }

      /*
       * ═══ ⛑ S260 · LE COUP ENCAISSÉ SE VOIT SUR MA FICHE — note ⑱ ⑦ ════════
       *
       * Verbatim Croze : *« quand on se prend un coup d'un mob faut qu'on voie
       * notre fiche d'avatar prendre un coup et afficher combien on prend de
       * dégâts. »*
       *
       * ⚠ **LA MARQUE EST UNE COUCHE FIXE, PAS UN ENFANT DE L'ENCADRÉ.**
       * `.encadre-perso` est REBÂTI à chaque `render`, et le fait qui porte le
       * coup en déclenche un — puis la fenêtre de priorité qui le suit en
       * déclenche un autre. Une marque posée DANS le bloc serait donc effacée
       * avant d'avoir été lue. Elle vit sur `body`, comme le canvas des effets :
       * *ce qui doit survivre au rendu ne vit pas dedans.*
       *
       * ⚠ **ET C'EST AUSSI POURQUOI LA SECOUSSE EST CELLE DU CADRE, PAS CELLE
       * DU BLOC.** Poser une classe `.frappe` sur `.encadre-perso` aurait eu le
       * même défaut, à ceci près qu'il ne se serait vu qu'une fois sur deux.
       * *Une animation accrochée à un nœud que le rendu remplace est une
       * animation qui marche jusqu'au jour où elle ne marche plus.*
       *
       * `z-index: 91` — **juste au-dessus du canvas des effets (90) et loin
       * au-dessous des grandes scènes (900)** : le montant se lit par-dessus la
       * gerbe, et il s'efface devant le théâtre qui prend l'écran.
       *
       * L'encre est celle du dé — `--stamp`, la même que `.cm-n` du coup de mob
       * (S258). **Aucune encre neuve** : l'ember reste au Collapse, le vert
       * reste au jouable. Et la durée n'est écrite nulle part ici : `--coup-t`
       * est posé par le module, qui la tient de `BORNE.SORTIE` — *un rythme
       * vit à un seul endroit.*
       */
      .coup-fiche { position: fixed; z-index: 91; pointer-events: none;
                    display: grid; place-items: center;
                    border: 2px solid var(--stamp); border-radius: 4px;
                    background: color-mix(in srgb, var(--stamp) 16%, transparent);
                    opacity: 0;
                    animation: coup-fiche-cadre var(--coup-t) ease-out forwards; }
      /*
       * ⛑⛑ **S573 — LE GROS « −22 » QUI SAUTE SUR LA FICHE ÉTAIT À `2,05`.**
       * Mesuré à l'instant de son apparition (`?seed=3&fait=MOB_DAMAGE`,
       * `t = 16,8 s`) : `--stamp` sur `[9,9,9]`, **2,05** pour un seuil de `3`
       * (grand corps, 800). `--alert` : voir le relevé du palier.
       *
       * ⚠ **IL A FALLU SEIZE PALIERS POUR LE VOIR, ET CE N'EST PAS SA RARETÉ.**
       * Sa règle de base est `opacity: 0` et seule l'animation le montre : volet
       * masqué, l'horloge du compositeur ne tourne pas, et tout instrument qui
       * filtre sur l'opacité composée le rangeait dans « jamais rendue » —
       * c'est-à-dire « état rare, cherche ailleurs ». Il était là, à chaque
       * coup de mob.
       *
       * ⚑ Le `text-shadow` reste : il aide l'œil, il ne compte pas au ratio.
       */
      /* ⛑ S1337 · VF-4 (note 194) — le projectile de l'auteur vers la cible (la
         1re image de la planche de son école), le chiffre sur la cible, et
         l'auteur adverse qui s'allume (deux pulsations + le nom de sa capacité). */
      .vf4-projectile {
        position: fixed; z-index: 92; pointer-events: none; width: 110px; height: 110px;
        background-repeat: no-repeat; background-size: 800% 800%; background-position: 0 0;
        filter: drop-shadow(0 0 10px var(--vf4-teinte, rgb(255 255 255 / .6)));
        will-change: transform, opacity;
      }
