      /*
       * ⛑ **S1067 — LE BADGE PORTE L'ÉTAT DU SIÈGE**, et les trois marques se
       * lisent sans couleur : `✓` prêt · `⌁` prêt par le banc · `●` choisi, pas
       * encore validé. *Une marque qui ne tient qu'à sa teinte ne se lit pas
       * sur un badge de 18 px, et pas du tout pour qui la distingue mal.*
       */
      .cell-pastille-bot { opacity: .72; }
      /*
       * ⚠⚠ **LE SIÈGE RÉTRÉCIT, ET C'EST MESURÉ, PAS ESTHÉTIQUE.** Posé tel
       * quel, le bandeau des sièges faisait `37,4 %` de haut et **mordait le
       * roster de 15,4 %** — deux blocs de la même colonne qui se recouvrent.
       * Sa §6 le dit déjà : *« deux pages A4 côte à côte et un roster large sont
       * antagonistes sur un 16:9 »*. **Ce qui cède est le siège, pas le
       * roster** : les proportions du roster sont CELLES DE LA MAQUETTE, celles
       * du siège sont les miennes. Et la grande fiche vit désormais à gauche :
       * la répéter en grand sur chaque siège était un doublon.
       */
      /* ⑤ CE QUE LA MAQUETTE NE MONTRE PAS, ET QUI NE MEURT PAS POUR AUTANT :
         le pied de la porte et sa notice, sous la fiche, colonne gauche. */
      .ouv-deux-blocs > .ouv-pied { position: absolute; left: 2.4%; bottom: 6.5%;
                                    width: 45%; margin: 0; justify-content: flex-start; }
      .ouv-deux-blocs > .err { position: absolute; left: 2.4%; bottom: 2.6%;
                               width: 45%; text-align: left; }
      /*
       * ═══ ⚑⚑ S577 · LE PRÉ-GAME COMPLET — note 68, ordre de Croze ═════════
       *
       * *« tu peux implémenter l'UI de pré-game complet dans la prochaine passe
       * stp — pour les quêtes, quand tu passes le curseur dessus, plutôt que la
       * description, affiche la carte. »* La réf d'autorité est au dépôt
       * (`docs/refs/ecran_selection_REF.html`, la maquette v12 validée avec
       * lui) : **toutes les valeurs ci-dessous en viennent**, au centième.
       */
      /* ⑥ LE FOND — la fiche survolée, désaturée et floue. Réf : `.bg`. */
      .ouv-fond { position: absolute; inset: 0; width: 100%; height: 100%;
                  object-fit: cover; opacity: .12; z-index: 0;
                  filter: grayscale(1) contrast(1.7) blur(4px);
                  pointer-events: none; }
      /*
       * note 136 - LE FOND DU CHARACTER SELECT. Verbatim Croze : « le background
       * va pas, prefere autre chose genre DUNGEON FLOOR WITH BLOOD dans
       * ECRAN>ASSET>DA ». Le fichier est dans SON dossier, que `.gitignore`
       * cache a tout instrument git : il se trouve par `ls ASSETS/DA`, jamais
       * par l'index. Ingere en webp (6,7 Mo -> 158 Ko, 1920 x 1072).
       *
       * Il se pose DERRIERE le voile, qui ne bouge pas d'une valeur : c'est lui
       * qui garde la colonne de gauche lisible, et le remplacer en meme temps
       * que le fond aurait change deux choses a la fois.
       */
      /* ⛑ S1383 · C-S1 (note 213 ①) — *« le fond n'est pas un mur (reprends le
         fond du HOME, sobre, la Lanterne à 70 %) »* : le sol des panneaux du HOME
         (`/art/titre/ui/floor.webp`, `brightness(.5) contrast(1.15)`) sous son
         voile « deep », et la lueur chaude de la Lanterne à 70 % de sa valeur
         (`--lanterne-chaude` .10 → .07). */
      .ouv-decor { position: absolute; inset: 0; z-index: 0; pointer-events: none;
                   background: #0B0B0B url('art/titre/ui/floor.webp') center / cover no-repeat;
                   filter: brightness(.5) contrast(1.15); }
      .ouv-scrim { position: absolute; inset: 0; z-index: 0; pointer-events: none;
                   background:
                     radial-gradient(ellipse at 28% 46%, rgb(240 208 158 / .07) 0%, transparent 55%),
                     linear-gradient(180deg, rgba(0,0,0,.9) 0%, rgba(0,0,0,.72) 34%, rgba(0,0,0,.92) 100%),
                     radial-gradient(ellipse at 50% 46%, rgba(0,0,0,.42) 12%, rgba(0,0,0,.94) 86%); }
      /*
       * ⑦ LES DEUX ONGLETS DE QUÊTE — réf `.quests` / `.qt`, notes 68-bis et 69 ③.
       *
       * ⛑⛑ **L'INTRO PLEIN ÉCRAN A VÉCU UN PALIER.** Le S577 l'avait bâtie
       * d'après la réf `v12` ; Croze a tranché le lendemain (note 68-bis) :
       * *« au start mets pas les cartes du tout — seulement après, quand on
       * passe le curseur sur nos quêtes. »* `v13` la supprime, `v14` confirme.
       * Il ne reste que les onglets, et ils **glissent** à l'arrivée.
       *
       * ⚠ **LE SURVOL REND LA CARTE, JAMAIS UN TEXTE**, c'est sa phrase exacte.
       * La description reste lisible ailleurs (le panneau « Mes quêtes »), elle
       * ne se réécrit pas ici : *une illustration ne ment pas, un texte imprimé
       * dérive* — le partage déjà tenu par `art/loots/`.
       *
       * ⚠ **`fixed`, ET C'EST CE QUI LUI FAIT TRAVERSER LES DEUX ÉCRANS**
       * (note 69 ③, *« même coin »*). `.ouv-deux-blocs` est en
       * `overflow: hidden` et ne porte aucune `transform` : un enfant `fixed`
       * n'y est donc pas rogné, et l'écran de jeu le place au même endroit sans
       * une seule règle de plus.
       */
      /*
       * ⚑ S609 — note 72 B ⑥ : *« un peu plus à droite »*. `2,4vw → 6,4vw`,
       * soit 77 px de plus en 1920 — le coin se décolle du bord sans quitter
       * le coin. C'est le seul réglage de sa phrase, et il est isolé ici.
       */
      /*
       * ═══ ⛑⛑ S682 · NOTE 82 ⑨ — LE « PARFOIS » AVAIT UN NOM, ET IL EST MESURÉ
       *
       * Croze, verbatim : *« parfois les quêtes ne sont pas affichées sur le
       * dernier layer ce qui les rend difficilement visibles. »* Le remède du
       * S661 (note 80 ①) EST posé, et il tient — mais il ne peut pas se
       * déclencher.
       *
       * ⚠⚠ **MESURÉ, `?fait=MOB_ATTACK_ROLLED&siege=Joueur 1`, peau JOUEUR** :
       *
       * ```
       * .qcoin                z-index 11 · rect (123, 37) 199×50
       * elementFromPoint en son CENTRE → `dicelayer roule-long`
       * cette couche : z-index 900 · pointer-events AUTO
       * ```
       *
       * **Le coin n'est pas seulement DESSOUS : il est INSURVOLABLE.** Et le
       * correctif du S661 monte le coin `:has(.qt:is(:hover, :focus-within))` —
       * *pendant le survol*. Un correctif conditionné à un geste que la couche
       * intercepte ne se déclenche jamais. C'est ça, le « parfois » : il vaut
       * exactement « pendant une scène de dés ».
       *
       * ⚑ **ET LE S661 AVAIT DÉJÀ REFUSÉ LA MAUVAISE RÉPARATION**, avec son
       * argument, qui tient toujours : *« le laisser à `--z-zoom` en permanence
       * mettrait deux onglets de quête au-dessus de la scène de dés ET du plein
       * écran — un correctif qui reste allumé est un défaut qui attend son
       * tour »*. On ne le défait pas : on pose un ÉTAGE, entre les deux.
       *
       * ```
       * 900  .dicelayer     un jet qu'on REGARDE — le coin reste un coin de HUD,
       *                     comme le ruban des sièges, et il passe devant
       * 940  .bv-couche     `pointer-events: none`, décorative
       * 941  .qcoin         ← ICI
       * 950  .plein         un moment PLEIN ÉCRAN : le coin lui cède, et c'est
       *                     l'argument du S661, gardé intact
       * 960  --z-zoom       la carte RÉVÉLÉE, au survol, dernier rang sous ADMIN
       * ```
       *
       * *Un correctif conditionné à un geste que la couche intercepte n'est pas
       * un correctif : c'est une porte derrière un mur.*
       */
      /*
       * ⛑⛑ **S900 — LE COIN DES QUÊTES ÉTAIT POSÉ SUR LE BOUTON `DUNGEON VIEW`,
       * ET IL EN MANGEAIT 60 %.**
       *
       * Trouvé par `couverts` (bloc `centresCouverts`) — *« un élément couvert
       * se présente exactement comme un élément visible, et il ne se trahit
       * qu'au moment où Croze clique »*. Mesure, viewport 1920×1080 :
       *
       * ```
       * BUTTON.bt-bascule « DUNGEON VIEW »   (231, 68) 101x28
       *    part atteignable                  40 %
       * .qcoin  (le conteneur)               (123, 37) 210x50 · z 941
       * ses deux onglets .qt, POSES          (118, 37) 105x50 · (226, 37) 112x50
       * .bande-timer (la barre du haut)      (0, 60) 1905x45
       * ```
       *
       * ⚠⚠ **ET MA PREMIÈRE CAUSE ÉTAIT UN ARTEFACT — L'INSTRUMENT L'AVAIT
       * ANNONCÉ, ET J'AI FAILLI PASSER OUTRE.** Il prévient : *« HORLOGE GELÉE
       * … un “couvert” peut n'être qu'un empilement qui ne s'est jamais
       * déplié »*. J'ai cru le lever en lisant `animation-name: none` **sur le
       * CONTENEUR** — vrai, et hors sujet : l'animation `qt-in .55s both` vit
       * sur les **ONGLETS**, et `fill: both` les figeait sur leur `from`, à
       * `y = -39`, **hors de la fenêtre**. Volet masqué, `elementFromPoint` au
       * centre du bouton rendait donc le VIDE du conteneur, et j'ai écrit un
       * remède `pointer-events` qui ne réparait qu'un premier cadre.
       * *Lever l'avertissement sur le PARENT ne le lève pas sur l'ENFANT — un
       * gel se re-mesure là où l'animation vit.* La classe `qcoin-entre` ôtée,
       * les onglets se posent, et c'est **l'onglet lui-même** qui couvre le
       * bouton.
       *
       * ⚑ **LA PLACE EST LA CAUSE, ET ELLE EST SEULE.** Balayé sur tout ce qui
       * est cliquable hors du coin : le coin ne recouvre **qu'un** élément, ce
       * bouton. Et deux zones voisines sont LIBRES — au-dessus `(118, 10)` et à
       * droite `(350, 37)` ; en dessous se trouve la fiche du perso. On remonte
       * donc le coin **au-dessus de la barre** (`.bande-timer` ouvre à `y = 60`),
       * sans bouger sa colonne : il reste le coin haut-gauche de Croze.
       *
       * ⚠ Le `top` passe en **pixels** à dessein : la barre, elle, n'est pas en
       * `vh`, et deux unités qui ne varient pas ensemble finissent par se
       * croiser. *Une garde exprimée dans une autre unité que ce qu'elle garde
       * n'est pas une garde.*
       *
       * ⚠⚠ **ET LA MARGE EST MINCE, DONC ELLE S'ÉCRIT** : `6 + 50 = 56` contre
       * une barre qui ouvre à `60` — **4 px**. La hauteur d'un onglet vient de
       * son CONTENU (un nom de quête sur deux lignes la ferait grandir), donc
       * ce n'est pas une constante. **Ce qui la garde n'est pas cette ligne,
       * c'est `couverts`** : son bloc `centresCouverts` rend ce bouton à la
       * seconde où l'onglet redescend dessus. *Une marge qu'on ne mesure plus
       * est une collision qui attend son tour* — la faute que ce palier vient
       * de payer.
       *
       * ⛑ **CE QUI A ÉTÉ VÉRIFIÉ APRÈS**, `?seed=3&fait=TURN_BEGAN`, scènes
       * coupées, classe d'entrée ôtée : le bouton rend `LE BOUTON` à son
       * CENTRE et à ses QUATRE coins ; les deux onglets rendent `L ONGLET` à
       * leur centre ; `couverts` rend `0` couvert et `0` centre couvert, ses
       * quinze dents mordues.
       *
       * ⛑ **ON NE TOUCHE PAS AU `z-index` : l'argument du S661 tient** (le
       * laisser bas rendrait les quêtes insurvolables pendant une scène de dés).
       * Le `pointer-events` du conteneur reste, pour lui-même : un `flex` avec
       * un `gap` est surtout du VIDE, et à 941 ce vide n'a aucune raison
       * d'avaler un clic. Les onglets reprennent `auto` — `:hover`,
       * `:focus-within` et `.qt-carte` continuent de répondre, mesuré.
       */
      .qcoin { position: fixed; left: calc(6.4 * var(--uvw)); top: 6px; z-index: 941;
               display: flex; gap: calc(.6 * var(--uvw)); pointer-events: none; }
      .qcoin > .qt { pointer-events: auto; }
      /*
       * ⛑⛑ **S661 — NOTE 80 ①, PRIORITÉ DE CROZE, VERBATIM** : *« CARTE QUÊTES
       * sont pas sur le dernier layer visible du coup ça passe derrière quand on
       * passe la souris dessus, je peux même plus cliquer sur les cartes tant
       * elle s'éloigne. »*
       *
       * ─── Les DEUX moitiés du défaut, et il fallait les deux ────────────────
       *
       * ⓐ **« ça passe derrière »** — `.qcoin` est à `z-index: 11`, sous
       *   `.main-basse` 40, `.dicelayer` 900, `.bv-couche` 940, `.plein` 950.
       *   Le `z-index: 12` de `.qt:hover` **ne sert à rien contre elles** : il
       *   vit DANS le contexte d'empilement du coin. *Un z-index local ne
       *   franchit pas le contexte qui le porte* — c'est l'idiome du S192, et il
       *   se pose sur l'ANCÊTRE.
       *
       * ⓑ **« je peux même plus cliquer »** — `.qt-carte` garde
       *   `pointer-events: none` **même révélée**. Elle n'est donc pas seulement
       *   incliquable : elle ne peut pas être SURVOLÉE, donc descendre le
       *   pointeur vers elle quitte `.qt`, le survol tombe, et elle disparaît.
       *   **C'est ça, « tant elle s'éloigne »** — la carte ne fuit pas, elle
       *   s'éteint sous le pointeur.
       *
       * ⚠ **RÉPARER ⓐ SEUL N'AURAIT RIEN DONNÉ À CROZE** : la carte serait
       *   passée devant, et resterait incliquable. Réparer ⓑ seul non plus :
       *   elle serait cliquable et cachée. *Deux causes, un symptôme.*
       *
       * ⚠ **LE COIN NE MONTE QUE PENDANT LE SURVOL**, par `:has()`. Le laisser à
       * `--z-zoom` en permanence mettrait deux onglets de quête au-dessus de la
       * scène de dés et du plein écran — *un correctif qui reste allumé est un
       * défaut qui attend son tour.*
       */
      .qcoin:has(.qt:is(:hover, :focus-within)) { z-index: var(--z-zoom); }
      .qt { position: relative; border: 2px solid var(--rule);
            background: rgba(0, 0, 0, .72); padding: .5em .9em;
            transform: skewX(-10deg); transition: border-color .12s; }
      .qt > b { display: block; transform: skewX(10deg); font-family: var(--display);
                font-weight: 800; font-size: clamp(7px, calc(.72 * var(--uvw)), 11px);
                letter-spacing: .14em; text-transform: uppercase;
                color: var(--stock-dim); white-space: nowrap; }
      .qt:hover, .qt:focus-within { border-color: var(--stock); z-index: 12; }
      .qt .qt-carte { position: absolute; left: 0; top: 118%;
                      width: clamp(240px, calc(19 * var(--uvw)), 380px); display: block;
                      border: 2px solid var(--stock); box-shadow: 8px 9px 0 rgba(0,0,0,.6);
                      transform: skewX(10deg); transform-origin: 0 0;
                      opacity: 0; pointer-events: none;
                      transition: opacity .14s; }
      /*
       * ⛑ **`transform-origin: 0 0` N'EST PAS UN DÉTAIL : C'EST UN DÉFAUT
       * MESURÉ.** La contre-cisaille de la réf pivote par défaut sur le CENTRE,
       * et sur une carte de 545 px de haut elle repousse le bord gauche de
       * `tan(10°) × 545 / 2 ≈ 48 px`. Relevé à 1920×1080 : la carte ouvrait à
       * **`x = -4`**, donc **coupée**. Origine au coin : `x = 44`, sous la puce
       * qui est à `46`. *Un pourcentage porté sans son conteneur ne porte rien*,
       * et une cisaille sans son origine non plus.
       */
      /*
       * ⛑ S661 — `pointer-events: auto` est la moitié ⓑ de la note 80 ①. La
       * carte est un DESCENDANT de `.qt` : une fois qu'elle prend le pointeur,
       * `.qt:hover` reste vrai et elle ne s'éteint plus sous la souris.
       * ⚠ **Elle ne le prend QUE révélée** — `pointer-events: none` demeure au
       * repos, sinon une carte invisible de 380 px mangerait les clics du
       * plateau. *Une surface transparente qui reçoit les clics est pire qu'une
       * surface visible qui les refuse.*
       */
      .qt:hover .qt-carte, .qt:focus-within .qt-carte {
        opacity: 1; pointer-events: auto;
      }
      /*
       * ⛑⛑ **S661 — LA TROISIÈME MOITIÉ, ET ELLE EST DANS SON VERBATIM.** La
       * carte ouvre à `top: 118%` : entre le bas de l'onglet et son haut il y a
       * **6,3 px MESURÉS** (onglet `bottom 86,97` · carte `top 93,28`, à
       * 1920×1080) où le pointeur n'est **ni sur l'un ni sur l'autre**. Le
       * survol tombe en traversant, et la carte s'éteint — *« tant elle
       * s'éloigne »*, le mot de Croze.
       *
       * Le pont est un `::after` de l'onglet, donc un DESCENDANT : le survoler
       * garde `.qt:hover` vrai. **Il ne peint rien** — aucune couleur, aucune
       * bordure — et il ne prend le pointeur que pendant que la carte est
       * révélée. *Un pont invisible qui reçoit les clics au repos serait le
       * défaut qu'on vient de retirer à la carte.*
       *
       * ⚠ `18%` n'est pas un réglage : c'est `118% − 100%`, la hauteur exacte du
       * creux, écrite comme telle pour qu'un changement de `top` la suive.
       */
      .qt::after { content: ''; position: absolute; left: 0; right: 0;
                   top: 100%; height: 18%; pointer-events: none; }
      .qt:hover::after, .qt:focus-within::after { pointer-events: auto; }
      /*
       * L'entrée est celle de sa réf v14 : `qtIn .55s`, second onglet décalé de
       * `.13 s`.
       *
       * ⛑⛑ **J'AI FAILLI RETIRER SON `both`, ET J'AURAIS EU TORT — LA MESURE
       * QUI TRANCHE TIENT EN UNE LIGNE.** `balayage_geometrie` rend
       * `TROUVÉ — DEHORS` sur les deux libellés (`y = -15`), et j'ai d'abord
       * conclu que `fill: both` les gelait sur leur `from` pour toujours. C'est
       * la bonne famille et le mauvais diagnostic : relevé,
       * `document.timeline.currentTime` vaut **`0`**, les deux animations sont
       * `playState: 'running'` à `currentTime: 0`, et **forcer
       * `anim.currentTime = 1000` rend `opacity 1`, `transform none`,
       * l'onglet à `y = 37`.** L'animation n'est pas gelée par son `fill` :
       * **c'est l'horloge du volet masqué qui ne part pas.** Sur l'écran de
       * Croze, elle tourne.
       *
       * > *Une animation « jamais démarrée » et un `from` gelé rendent le même
       * > octet. Ce qui les sépare est `getAnimations()[0].currentTime`, et ça
       * > coûte une ligne.*
       *
       * Les valeurs restent donc **exactement les siennes** (`both`, `delay`),
       * et c'est `balayage_geometrie` qui a appris à distinguer les deux
       * (sa dent ⑨).
       */
      /*
       * ⚠ **L'ENTRÉE NE SE REJOUE PAS À CHAQUE RENDU** : la classe `qcoin-entre`
       * n'est posée qu'au premier coin d'un TIRAGE donné (voir `coinDesQuêtes`).
       * Sans elle, `render()` refaisait glisser les onglets à chaque clic de la
       * partie — mesuré, `2 nœud(s) EN ENTRÉE` à chaque relevé de l'écran de jeu.
       */
      @keyframes qt-in { from { transform: translateY(-150%) skewX(-10deg); opacity: 0 } }
      /*
       * ═══ ⚑ S609 · L'ÉTAT DE LA QUÊTE, SUR L'ONGLET — note 72 B ⑥ ═════════
       *
       * *« l'état FAITE / PAS FAITE s'affiche dessus. »* Les DEUX états
       * s'écrivent : *un état qui ne se lit qu'à l'absence d'un mot ne se lit
       * pas.* Le contre-cisaillement est celui du nom, à l'identique — sans
       * lui, le texte penche avec l'onglet.
       */
      .qt-etat { display: block; transform: skewX(10deg); margin-top: .25em;
                 font-family: var(--display); font-weight: 800;
                 font-size: clamp(6px, calc(.58 * var(--uvw)), 9px); letter-spacing: .18em;
                 color: var(--stock-dim); }
      /*
       * ⛑ **CE COMMENTAIRE DISAIT « LE VERT JOUABLE », ET C'ÉTAIT FAUX** —
       * corrigé avant d'être commité, en LISANT le jeton plutôt que le runbook.
       * `--activable` vaut `var(--rouge-vif)`, `#EE4B4B` : la maison a viré au
       * rouge sur noir depuis, et le `#7FB069` que le runbook nomme « vert
       * jouable » est devenu `--ec-poison`, une couleur d'ÉCOLE. *Un jeton se
       * lit dans la feuille, jamais dans la phrase qui le cite.*
       *
       * C'est bien la teinte juste : `.fr-score` et `.fr-pts` la portent déjà
       * pour un acquis. Mesurée ici à **5,38** sur le fond du coin.
       */
      .qt-faite { border-color: var(--activable); }
      .qt-faite .qt-etat { color: var(--activable); }
      .qcoin-entre .qt { animation: qt-in .55s cubic-bezier(.2, 1.3, .3, 1) both; }
      .qcoin-entre .qt:nth-child(2) { animation-delay: .13s; }
      /*
       * ⑧ LA DIFFICULTÉ — cinq plots, réf `.info .pips` et ses `--t1 … --t5`.
       * ⚠ **Les cinq teintes sont les SIENNES**, et elles ne sortent pas de cet
       * écran ; `--diff-4` est un orangé voisin de l'ember du Collapse sans lui
       * être égal, et il n'existe qu'AVANT la partie, là où aucun Collapse n'a
       * eu lieu.
       */
      .ouv-deux-blocs { --diff-1: #EFECE3; --diff-2: #4F9E5F; --diff-3: #C9A227;
                        --diff-4: #CF7326; --diff-5: #A3231D;
                        --diff-eteint: #26262B; }
      /*
       * ⛑⛑ **S1202 — LA PHRASE LA PLUS LONGUE DU CORPUS, PAS CELLE QUI ÉTAIT
       * À L'ÉCRAN.** À `22px`, quatre phrases sur cinq tiennent sur UNE ligne
       * (30 px) et j'allais poser la difficulté dessous. **Le `quickRead` du
       * Whiff fait 69 caractères** et en prend DEUX (59 px) : la difficulté
       * passait dessous de 19 px, **sur une fiche que je n'avais pas ouverte**.
       * Mesuré aux 19 fiches de `characters.json`, jamais à celle qui était là.
       * *Un échantillon d'une fiche mesure une fiche.*
       */
      .sel-tier { position: absolute; left: 0; right: 0; top: 122%;
                  display: flex; align-items: center; justify-content: center;
                  gap: 10px; }
      .sel-tier b { font-family: var(--display); font-weight: 800; font-size: 22px;
                    letter-spacing: .2em; text-transform: uppercase;
                    color: var(--stock-dim); }
      .sel-pips { display: flex; gap: 4px; }
      .sel-pips i { width: 18px; height: 18px; display: block;
                    transform: skewX(-14deg); }
      /*
       * ⚑ S590 — LA CASE « DÉS » (`Q-PEAU-QUI-CHOISIT`, reco ⓐ). Elle se range
       * SOUS la difficulté et prend exactement son vocabulaire : même libellé
       * en capitales étroites, même encre atténuée. **Aucune teinte neuve** —
       * une peau de dés n'est pas un signal de jeu.
       *
       * ⚠ `top: 124%` : la difficulté ouvre à `112%` et fait ~14 px. Les deux
       * sont ancrées sous la fiche, pas empilées dans un flux — c'est la mise
       * en page de sa §6, et une rangée de plus n'a pas le droit de pousser la
       * fiche.
       */
      /*
       * ⚑⚑ S671 — L'APERÇU DU DÉ DANS LA CASE (note 81 ⑤, seconde phrase).
       * Le bouton devient une colonne : le dé au-dessus, le nom en dessous.
       * `sel-peau-vue` n'est posée qu'au `onload` — sans image, la case garde
       * exactement la mise en page qu'elle avait avant ce palier.
       */
      .sel-peau-de { width: 34px; height: 34px; object-fit: contain;
                     display: block; margin: 0 auto 2px;
                     filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .7)); }
      .sel-peau.sel-peau-vue { display: flex; flex-direction: column;
                               align-items: center; gap: 1px; line-height: 1.15; }
      .sel-peaux { position: absolute; left: 0; right: 0; top: 124%;
                   display: flex; align-items: center; justify-content: center;
                   gap: 10px; }
      .sel-peaux b { font-family: var(--display); font-weight: 800; font-size: 10px;
                     letter-spacing: .2em; text-transform: uppercase;
                     color: var(--stock-dim); }
      /*
       * ⛑⛑ **S836 — LA RANGÉE DES PEAUX DÉBORDAIT DE SA BOÎTE PAR LA GAUCHE, ET
       * LE DÉFAUT PAR DÉFAUT ÉTAIT DEHORS.**
       *
       * Trouvé par `balayage_geometrie` (dent ② *« le dehors attrapé »*), qui
       * n'avait pas été ouvert de la campagne. Mesuré au viewport 1920 × 1080 :
       *
       * ```
       * .sel-peaux       412 px de large, a x 46
       * .sel-peaux-rang  1 158 px, a x -312     <- pres de 3x sa boite
       * le libelle « Des »        a x -341      <- HORS FENETRE
       * le premier bouton (bones) a x -311      <- HORS FENETRE, et c est le DEFAUT
       * ```
       *
       * **Six peaux sur seize et le libellé étaient peints dehors** —
       * invisibles ET inatteignables. `bones`, la peau par défaut, en faisait
       * partie : *le premier choix de la liste était le premier à sortir de
       * l'écran.*
       *
       * ⚠ **LA CAUSE N'EST PAS LE NOMBRE DE PEAUX**, même si c'est lui qui l'a
       * révélé (le registre en offre seize, Croze en veut trois — note 101 ②,
       * en attente de son mot). C'est `flex` sans `min-width: 0` : **un enfant
       * flex refuse de rétrécir sous son contenu**, alors il pousse son voisin
       * hors de la boîte au lieu de se contenir. *Une mise en page qui dépend du
       * nombre d'éléments casse le jour où il change, et le déblaiement ne
       * l'aurait que MASQUÉE.*
       *
       * ⚑ **`overflow-x: auto` EST LE PRÉCÉDENT DU DÉPÔT**, pas une invention :
       * c'est ce que fait `.rail` (S392), et le S391 a payé de le prendre pour
       * un recouvrement — *un enfant roulé hors d'un ascenseur est COUPÉ, pas
       * couvert.* Ici la barre a de quoi se voir, et rien ne sort de la boîte.
       */
      .sel-peaux-rang { display: flex; gap: 6px; min-width: 0; overflow-x: auto; }
      .sel-peau { background: transparent; border: 1px solid var(--rule);
                  color: var(--stock-dim); font-size: 10px; letter-spacing: .08em;
                  padding: 2px 8px; cursor: pointer; }
      .sel-peau:hover { border-color: var(--stock); color: var(--stock); }
      .sel-peau[aria-pressed="true"] { border-color: var(--stock); color: var(--stock);
                                       background: rgba(239, 236, 227, .09); }
      /*
       * ⑨ LA MORT DES TUILES ÉCARTÉES — les `keyframes` posées au S497 et que
       * PERSONNE ne mettait. Ce qui manquait n'était pas le CSS, c'était le
       * MOMENT ; la réf le nomme (`kill()`, 55 ms de décalage par tuile).
       *
       * ⚠ **UNE TUILE MORTE NE MENT PAS : ELLE EST VRAIMENT ÉCARTÉE.** Le bouton
       * passe à `disabled` dans le même geste — *un bouton qui promet ce que le
       * geste refuse* est la faute payée au S462, et l'inverse (une tuile qui a
       * l'air morte et qui répond) en est l'exacte symétrie.
       */
      .cell.dead { opacity: 1; cursor: default; }
      .cell.dead:hover { transform: skewX(-10deg); border-color: var(--rule); }
      .ouv h2 { font-family: var(--display); font-weight: 800; font-size: 34px;
                letter-spacing: .14em; color: var(--stock); margin: 0 0 6px; }
      .ouv-sous { color: var(--stock-dim); font-size: 12px; line-height: 1.5;
                  max-width: 78ch; margin: 0 auto calc(4 * var(--uvh)); }

      /*
       * Le vert jouable de Croze (`--activable`, `#7FB069`) : un siège qui a
       * validé est un siège qui a AGI. L'ember reste au Collapse.
       */
      /* La fiche imprimée fait 1414 × 2000 : le ratio est le SIEN, 0,7070.
         `contain` et non `cover` — une fiche recadrée perd son titre. */
      /* Un READY du banc n'est pas un READY de joueur : il le dit, en sourdine. */
      .ouv-sel { width: 100%; }
      /*
       * ⛑⛑ **S541 — `--stamp` EN ENCRE, SUR UN PANNEAU SOMBRE : 1,88.** C'est
       * exactement `Q-ROUGE-ENCRE` (S536), sur une surface que le balayage de
       * ce palier-là n'avait pas ouverte : elle n'apparaît qu'à un siège qui a
       * validé SANS école. `--stamp` vaut la valeur exacte de Croze
       * (`#8B0D0D`) et **elle ne vit qu'en APLAT ou sur le carton clair** ; ici
       * c'est du texte à 10 px sur `--ink-2`. `--rouge-vif` est le même rouge,
       * éclairci jusqu'au seuil. *Une réparation branchée sur UNE surface ne
       * l'est pas sur ses voisines* — et `contraste_dom` l'a dit trois paliers
       * plus tard, sur l'écran d'à côté.
       */

      .ouv-pied { margin-top: calc(4 * var(--uvh)); display: flex; gap: 10px;
                  align-items: center; justify-content: center; flex-wrap: wrap; }
      .ouv-reste { color: var(--stock-dim); font-size: 12px; }

      /*
       * §5.1.2bis — **L'ÉCOLE CHOISIE, SOUS L'ÉTOILE.** Elle prend la TEINTE de
       * son école (`--ec-choisie`, posée par le rendu) : c'est la même teinte que
       * sa branche, donc l'œil relie les deux sans légende.
       */
      .etoile-choix { display: block; margin-top: 3px; font-size: 10px;
                      letter-spacing: .1em; font-weight: 800;
                      color: var(--ec-choisie, var(--stock-2)); }
      /*
       * ═══ ⛑⛑ S957 · LA NOUVELLE TABLE — L'INTERRUPTEUR DE LA LANTERNE ═══
       *
       * `docs/VISION_HUD.md` pas ③ : *« l'ancien HUD reste jouable, on compare
       * sur ta machine, on ne casse rien »*. Ces règles ne touchent AUCUN
       * sélecteur de l'ancienne table — elles vivent toutes sous `.nouvelle-table`,
       * qui n'existe que derrière `?table=nouvelle`.
       *
       * ⚠ **AUCUNE COULEUR NEUVE.** Les six teintes de siège viennent de
       * `--siege`, posée en ligne par `mémoireDuTour` depuis `colorOf` — la même
       * table que le fil (S536, note 55 de Croze). L'encre neutre du donjon est
       * `--stock-dim`, celle des libellés atténués : *un point sans siège n'est
       * pas une septième identité, c'est une absence de siège.*
       */
      /*
       * ⛑⛑ S1217 — **`100vh` LISAIT LA FENÊTRE, PAS LA COMPOSITION.** Posé au
       * S957, ce `min-height` a été pris par `verrou_1080` (*« 1 déclaration
       * armée sur 29 à unité de fenêtre »*) : la composition est VERROUILLÉE à
       * 1 920 × 1 080 logiques et mise à l'échelle, donc `vh` — qui lit les
       * pixels RÉELS — rendrait 1 440 sur un 1440p là où la table n'a que
       * 1 080 à remplir. *Une unité de fenêtre dans une composition verrouillée
       * mesure l'écran de celui qui regarde, pas la page qu'on dessine.*
       * `box-sizing` est `border-box` ici : les 80 px de padding sont DEDANS.
       */
      .nouvelle-table {
        min-height: 1080px; box-sizing: border-box; padding: 40px 48px;
        display: flex; flex-direction: column; gap: 22px;
      }
      .nouvelle-table .nt-mot {
        margin: 0; max-width: 62ch;
        font-family: var(--mono); font-size: 12px; line-height: 1.7;
        color: var(--stock-dim);
      }
      .nouvelle-table .nt-retour {
        align-self: flex-start;
        font-family: var(--mono); font-size: 10px; letter-spacing: .16em;
        text-transform: uppercase; text-decoration: none;
        color: var(--stock-dim); background: var(--ink-2);
        border: 1px solid var(--rule); padding: 6px 12px;
        transition: color .12s, border-color .12s;
      }
      .nouvelle-table .nt-retour:hover,
      .nouvelle-table .nt-retour:focus-visible { color: var(--stock); border-color: var(--stock-dim); }
      /*
       * ─── LES PRÉSENCES (tableau 1 v2, rangée du haut) ─── S1215 · P3-T1 ──
       *
       * *« mes adversaires sont des portraits ronds en haut de l'écran — nom,
       * personnage, tuile, un anneau de PV, leur nombre de cartes — et il n'y
       * a plus de colonnes. »*
       *
       * ⚠ **UN BUDGET DE HAUTEUR FIXE, ET C'EST TOUT LE SUJET.** La rangée est
       * bornée : un siège de plus l'élargit, il ne l'allonge JAMAIS. C'est la
       * réponse mécanique au « truc dégueu de scroller » — une colonne qui
       * empile tout dépasse 1080 par construction, une présence ne le peut pas.
       *
       * ⚠ **AUCUNE COULEUR NEUVE** (la règle du bloc au-dessus) : l'identité du
       * siège est `--siege`, posée en ligne depuis `colorOf` ; l'anneau de vie
       * est `--stamp`, le rouge des PV de toute l'interface ; la piste sous lui
       * est `--rule`.
       */
      .nouvelle-table .nt-presences {
        display: flex; gap: 34px; flex-wrap: wrap;
        align-items: flex-start; justify-content: center;
      }
      .nouvelle-table .nt-presence {
        position: relative; width: 132px;
        display: flex; flex-direction: column; align-items: center; gap: 4px;
        text-align: center;
      }
      .nouvelle-table .nt-rond { position: relative; width: 88px; height: 88px; }
      .nouvelle-table .nt-anneau {
        position: absolute; inset: 0; width: 100%; height: 100%;
        transform: rotate(-90deg);   /* l'arc part du HAUT, pas de trois heures */
      }
      .nouvelle-table .nt-anneau circle { fill: none; stroke-width: 6; }
      .nouvelle-table .nt-anneau .nt-piste { stroke: var(--rule); }
      .nouvelle-table .nt-anneau .nt-vie { stroke: var(--stamp); }
      /* Le portrait est DANS l'anneau : 8 px de retrait de chaque côté, soit
         l'épaisseur du trait plus son jeu. Le rond coupe l'image, jamais le
         fichier — les dix-neuf vignettes restent telles que Croze les a déposées. */
      .nouvelle-table .nt-portrait {
        position: absolute; inset: 8px; width: calc(100% - 16px); height: calc(100% - 16px);
        border-radius: 50%; object-fit: cover;
        background: var(--ink-2);
        box-shadow: 0 0 0 1px var(--siege, var(--rule));
      }
      /* Le siège dont le tour est ouvert porte un second anneau, STATIQUE. */
      .nouvelle-table .nt-presence.nt-actif .nt-rond::after {
        content: ""; position: absolute; inset: -5px;
        border-radius: 50%; border: 1px solid var(--siege, var(--stock-dim));
      }
      .nouvelle-table .nt-presence.nt-parti { opacity: .45; }
      /* ⛑ S1291 · LA-5 — la miniature se clique (son plateau) ; la regardée
         porte un second anneau, plein, à la couleur du siège. */
      .nouvelle-table .nt-presence.nt-cliquable { cursor: pointer; }
      /* ⛑ S1291 · LA-4 — deux lignes sous la miniature, coupées en fin de ligne. */
      .nouvelle-table .nt-resume {
        width: 100%; font-family: var(--mono); font-size: 10px; line-height: 13px;
        color: var(--stock-dim);
      }
      .nouvelle-table .nt-resume-l1 { display: flex; justify-content: center; gap: 6px; white-space: nowrap; }
      .nouvelle-table .nt-resume-l2 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--stock); }
      .nouvelle-table .nt-resume-l2.rien { color: var(--stock-dim); opacity: .7; }
      .nouvelle-table .nt-r-combat { color: var(--rouge-vif); font-weight: 700; }
      .nouvelle-table .nt-r-act { color: var(--stock); max-width: 70px; overflow: hidden; text-overflow: ellipsis; }
      .nouvelle-table .nt-r-pv { color: var(--stamp); }
      .nouvelle-table .nt-r-sig { color: var(--stock); }
      .nouvelle-table .nt-r-sig.use { color: var(--stock-dim); text-decoration: line-through; }
      .nouvelle-table .nt-presence.nt-regarde .nt-rond::before {
        content: ""; position: absolute; inset: -9px; border-radius: 50%;
        border: 2px solid var(--siege, var(--stock));
      }
      .nouvelle-table .ntt-pov .ntt-pov-lui { gap: 10px; }
      .nouvelle-table .ntt-pov .fiche-imprimee { width: 100%; }
      .nouvelle-table .ntt-pov .fiche-imprimee img { width: 100%; height: auto; }
      .nouvelle-table .ntt-pov-pv {
        font-family: var(--display); font-weight: 700; font-size: 24px; color: var(--stamp);
      }
      /* colonne, et plus spécifique que la rangée de LA-1 (`.ntt-table:not(.ntt-en-combat) .ntt-axe`). */
      .nouvelle-table .ntt-table.ntt-pov:not(.ntt-en-combat) .ntt-axe.ntt-pov-axe {
        flex-direction: column; align-items: center; justify-content: flex-start; gap: 16px;
      }
      .nouvelle-table .ntt-pov-tete {
        display: flex; align-items: center; justify-content: space-between; gap: 24px;
        width: min(100%, 860px); border-bottom: 1px solid var(--siege, var(--rule)); padding-bottom: 8px;
      }
      /* ⛑ S1321 · SA-1 — ⟵ ⟶ dans la tête du POV. */
      .nouvelle-table .ntt-pov-fleches { display: inline-flex; gap: 6px; }
      .nouvelle-table .ntt-pov-fleche {
        font-family: var(--mono); font-size: 14px; padding: 2px 10px; cursor: pointer;
        color: var(--stock); background: transparent; border: 1px solid var(--stock-dim);
      }
      .nouvelle-table .ntt-pov-fleche:hover { border-color: var(--stock); }
      .nouvelle-table .ntt-pov-combat .ntt-pov-tete { margin-bottom: 6px; }
      /* ⛑ S1322 · CJ-2 — la zone des cartes jouées et des jets : la 3e colonne de la
         table (x 1572 → 1872), bornée au-dessus de la main (y 335 → 875). */
      .nouvelle-table .cj2-zone {
        grid-column: 3; max-height: 540px; overflow: hidden; min-width: 0;
        border: 1px solid var(--rule); background: rgb(0 0 0 / .35); padding: 8px 10px;
        display: flex; flex-direction: column; gap: 6px;
      }
      .nouvelle-table .cj2-zone > .nt-titre { margin: 0; font-size: 12px; letter-spacing: .14em; }
      .nouvelle-table .cj2-liste { display: flex; flex-direction: column; gap: 5px; }
      .nouvelle-table .cj2-ligne {
        display: flex; gap: 8px; align-items: flex-start; font-size: 12px; line-height: 1.35;
        border-left: 2px solid var(--siege, var(--rule)); padding-left: 6px;
      }
      .nouvelle-table .cj2-art { width: 34px; height: auto; flex: none; border: 1px solid var(--rule); }
      .nouvelle-table .cj2-glyphe { flex: none; width: 34px; text-align: center; font-size: 15px; }
      .nouvelle-table .cj2-texte { flex: 1 1 auto; min-width: 0; margin: 0; }
      .nouvelle-table .ntt-pov-titre { font-family: var(--mono); font-size: 14px; letter-spacing: .12em; }
      /* ⛑ S1336 · PO-1 — le POV d'un autre dans MA grille : la bande « TU REGARDES »
         à la place de ma question, sa main en dos à la place de la mienne. */
      .nouvelle-table .ntt-pov-iso .ntt-pov-bande {
        flex-direction: column; align-items: flex-start; gap: 12px; width: 100%;
        padding: 14px 16px; border: 1px solid var(--siege, var(--rule)); background: rgb(0 0 0 / .35);
      }
      .nouvelle-table .main-basse.main-en-dos {
        display: flex; flex-direction: row; justify-content: center; align-items: flex-end;
        pointer-events: none; overflow: hidden; height: 300px;
      }
      .nouvelle-table .main-en-dos .med-rangee { display: flex; align-items: flex-end; padding-bottom: 0; }
      .nouvelle-table .main-en-dos .med-dos {
        width: 170px; height: auto; margin-left: -96px; border-radius: 8px;
        box-shadow: 0 0 0 1px var(--rule), 0 6px 18px rgb(0 0 0 / .6);
        transform: translateY(40px) rotate(calc(var(--i, 0) * 4deg));
        transform-origin: 50% 120%;
      }
      .nouvelle-table .main-en-dos .med-dos:first-child { margin-left: 0; }
      .nouvelle-table .ntt-pov-mot { color: var(--stock-dim); }
      .nouvelle-table .ntt-pov-tuile { display: flex; flex-direction: column; align-items: center; gap: 6px; }
      /* 240 : sa main (les dos) doit finir AU-DESSUS de l’apex de la mienne (y ≈ 733). */
      .nouvelle-table .ntt-table.ntt-pov .ntt-axe .ntt-pov-tuile .tuile-art { height: 240px; width: auto; }
      .nouvelle-table .ntt-pov-ou { font-family: var(--mono); font-size: 12px; color: var(--stock-dim); }
      .nouvelle-table .ntt-pov-main { display: flex; flex-direction: column; align-items: center; gap: 8px; }
      .nouvelle-table .ntt-pov-dos { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
      .nouvelle-table .ntt-pov-carte {
        width: 44px; height: 64px; border: 1px solid var(--rule); background: var(--ink-2);
        box-shadow: inset 0 0 0 3px var(--ink), inset 0 0 0 4px var(--siege, var(--rule));
      }
      .nouvelle-table .nt-cartes {
        display: flex; align-items: center; gap: 1px; height: 14px;
      }
      .nouvelle-table .nt-dos {

      /*

       * ⛑ S1291 · LA-2 (note 180) — **LA MÉMOIRE MONTE EN HAUT À DROITE.**
       * Croze : *« mémoire du tour devient totalement masquée au fur et à

       * (main à partir de y 713). En haut à droite, entre le lien de table
       * (y 12 → 41) et la table (y 221) : 420 px de large — six présences
       * (962 px centrés) finissent à x 1 441, la mémoire commence à 1 452.
       * La rangée de points est bornée et PACKÉE EN BAS (`align-content:

      .nouvelle-table > .nt-memoire {

      .nouvelle-table > .nt-memoire.nt-tour-seul { width: auto; max-width: 420px; }

      .nouvelle-table .nt-tour-seul .bt-tour { font-size: 15px; }
      .nouvelle-table .nt-tour-seul .bt-collapse { font-size: 11px; }

      /* ⛑ S1297 · DT-1 — le tour de donjon, au-dessus de la mémoire du tour. */

      .fp1-mot {

      .nouvelle-table .nt-point.nt-maintenant {

      /*
       * ─── LE COMBAT AU CENTRE ─── S1217 · P3-T2 ──────────────────────────
       *
       * *« je vois au centre une grande carte par combattant (moi, le mob,
       * l'autre joueur) avec ses PV, celui qui agit est marqué À LUI, et
       * l'attaque en cours est écrite dessous. »*
       *
       * ⚠ **UN BUDGET, PAS UN ASCENSEUR.** La fenêtre de combat et le déroulé
       * sont taillés pour l'ancien écran, qui SCROLLE : posés tels quels, ils
       * rendaient la table à **1 881 px** de haut pour 1 080 de fenêtre —
       * mesuré, et c'est exactement le « truc dégueu » que la Lanterne existe
       * pour retirer. Ce bloc-ci ne réécrit AUCUNE de leurs règles : il RETIRE
       * ce que la phrase de Croze ne demande pas, et borne l'image.
       *
       * ⚠ **CE QUI EST RETIRÉ EST NOMMÉ, un par un** — rien n'est caché « pour
       * gagner de la place » sans qu'on puisse dire ce qu'on perd :
       *   `adv-inv`   408 px  « CE QU'IL PORTE » — c'est P2-T2, au clic
       *   `cf-dues`    88 px  les réponses dues — c'est P3-T3, le panneau
       *   `combat-order` 102 px  la rangée d'initiative — elle redit l'ordre
       *                         que `▶ À LUI` porte déjà sur la carte
       */
      .nouvelle-table .nt-centre {
        display: flex; flex-direction: column; gap: 10px;
        min-height: 0;
      }
      /*
       * ─── « ON TE DEMANDE », À DROITE ─── S1218 · P3-T3 ──────────────────
       *
       * *« Quand je dois réagir, un seul panneau à droite me dit combien de
       * dégâts, qui me vise, mes réactions jouables et PASSER. »*
       *

      .nouvelle-table .nt-demande .les-choix { width: 100%; }
      .nouvelle-table .nt-centre .adv-inv { display: none; }
      /* S1353 · P3-T2 quater (note 201 ②) — le duel de deux autres : les deux

      @keyframes ndr-de-gauche { from { translate: -340px 120px; scale: .4; opacity: .2; } 45% { translate: 0 0; scale: 1.15; opacity: 1; } to { translate: 0 0; scale: 1; } }

      .arene-spec .nt-duel-regarde { height: calc(100vh - 220px); }
      .plein-boite:has(.nt-duel-regarde) { max-width: 1760px; width: 1760px; }
      /*
       * ─── LA TABLE, HORS COMBAT ─── S1233 · P3-T1ter ─────────────────────
       *
       * *« …au centre ma tuile en grand avec son exploration et son
       * interaction, la liste de où est chaque joueur et ce qu'il fait, mes
       * quêtes et mes stats ; les actions possibles sont des boutons juste
       * sous ma tuile, je n'ai jamais à regarder à droite pour agir. »*
       *
       * Trois colonnes, et une seule se clique : TOI (lu) · L'AXE (la tuile,
       * ses gestes peints, le panneau JUSTE DESSOUS) · OÙ EST CHACUN (lu).
       * C'est la loi 3 de la Lanterne — *la colonne de droite n'est QUE de
       * l'information*.
       *
       * ⚠ **LA TUILE EST BORNÉE EN HAUTEUR, PAS EN LARGEUR.** Le carton est un
       * portrait 800 × 1 200 et la main est `fixed` au bas de l'écran : ce qui
       * limite la tuile, c'est la hauteur entre les présences et la main.
       * `.tuile-visuel` se resserre sur l'image (`inline-block`) parce que le
       * calque des gestes est posé EN POURCENTAGES du carton : un cadre plus
       * large que l'image décalerait chaque glyphe hors de sa case imprimée.
       *
       * ⚠ **AUCUNE COULEUR NEUVE** : `--siege` en ligne pour l'identité,
       * `--stock` / `--stock-dim` pour le texte, `--rule` pour les filets.
       */
      .nouvelle-table .ntt-table {
        display: grid; grid-template-columns: 300px minmax(0, 1fr) 300px;
        gap: 28px; align-items: start; min-height: 0;
      }
      .nouvelle-table .ntt-toi { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
      /*
       * ⛑ S1234 — **LE BLOC TOI N'A PAS UNE HAUTEUR FIXE, ET IL A FAIT
       * DÉBORDER LA PAGE.** `encadréPerso` empile ce que le siège porte :
       * mesuré sur le Cleric en combat (réactions + Divine Intervention), il
       * fait 693 px et la page montait à 1 155 pour 1 080. La table prend donc
       * la hauteur QUI RESTE (la table est fixée à 1 080 quand elle porte LA
       * TABLE, la rangée de la grille est `minmax(0, 1fr)`), et seul le bloc
       * TOI défile en lui-même quand il est plus long — la tuile, le panneau et
       * « où est chacun » ne bougent pas.
       */
      .nouvelle-table:has(> .ntt-table) { height: 1080px; min-height: 0; }
      .nouvelle-table .ntt-table { flex: 1 1 0; grid-template-rows: minmax(0, 1fr); }
      .nouvelle-table .ntt-toi { align-self: stretch; min-height: 0; overflow: hidden; }
      /* ⛑ S1289 · L-T2 — plus de `overflow-y: auto` : le bloc garde sa hauteur et son
         contenu se RESSERRE pour y tenir (`tiensDansTaBoîte`, main.ts). */
      .nouvelle-table .ntt-points {
        display: flex; align-items: baseline; gap: 10px;
        border-top: 1px solid var(--rule); padding-top: 8px;
        font-family: var(--mono); letter-spacing: .14em; color: var(--stock-dim);
      }
      .nouvelle-table .ntt-pts-nb {
        font-family: var(--display); font-weight: 700; font-size: 30px;
        color: var(--stock); letter-spacing: 0;
      }
      .nouvelle-table .ntt-pts-mot { font-size: 11px; }
      /* ⛑ S1293 · TC-2 — la fenêtre du piège / du coffre, par-dessus l'axe. */
      .nouvelle-table .ntt-axe.avec-moment { position: relative; }
      /* ⛑ S1306 · L-3 — LE TROC FACE À FACE (`05_troc.png`). Mesuré avant : le
         panneau à droite de la tuile, 809 × 479, resserré à 0,62 — la carte
         offerte en vignette de 69 px AU-DESSUS de mes cartes. Il prend l'axe
         (tuile comprise), 452 px, sur trois colonnes : ce qu'il met | ⇄ | ce
         que je donne ; les lignes pleines (titre, interruption, boutons)
         traversent. `dense` range mes cartes sur la ligne de son offre. */
      .nouvelle-table .ntt-axe.ntt-troc { position: relative; }
      .nouvelle-table .ntt-axe.ntt-troc > .ntt-question-cadre {
        position: absolute; left: 0; right: 0; top: 0; z-index: 30;
        height: 504px; flex: none; background: var(--ink-2);   /* la tuile de TU-1 */
        border: 2px solid var(--stock-dim); box-sizing: border-box;
      }
      .nouvelle-table .ntt-axe.ntt-troc > .ntt-question-cadre > .ntt-sous-tuile {
        max-height: 500px; height: 500px;
      }
      .nouvelle-table .ntt-troc .decision {
        display: grid; grid-template-columns: minmax(0, 1fr) 56px minmax(0, 1fr);
        grid-auto-flow: row dense; grid-auto-rows: min-content; column-gap: 12px; row-gap: 6px;
      }
      .nouvelle-table .ntt-troc .decision > * { grid-column: 1 / -1; }
      .nouvelle-table .ntt-troc .decision > .troc-tete { grid-column: 1; position: relative; }
      .nouvelle-table .ntt-troc .decision > .obj-rangee { grid-column: 3; }
      .nouvelle-table .ntt-troc .decision > .troc-tete::after {
        content: "\21C4"; position: absolute; right: -44px; top: 45%;
        font-size: 30px; color: var(--gold);
      }
      .nouvelle-table .ntt-troc .decision > .obj-rangee::before {
        content: "CE QUE TU DONNES \2014  clique une carte";
        display: block; width: 100%; margin-bottom: 4px;
        font-family: var(--mono); font-size: 10px; letter-spacing: .16em; color: var(--stock-dim);
      }
      .nouvelle-table .ntt-troc .fen-offre .cz-vignette { height: 210px; width: auto; }
      .nouvelle-table .ntt-axe > .combat-fenetre.ntt-moment {
        /* Hauteur FIXE, jamais au-delà de l'apex de la main au repos (y ≈ 733,
           S1291) : l'axe commence à y 280, 452 px le laissent au-dessus. Ce qui
           dépasse se resserre (`tiensDansTaBoîte`) — rien ne défile. */
        position: absolute; left: 0; right: 0; top: 0; bottom: auto; z-index: 30;
        height: 452px; max-height: none; overflow: hidden; clip-path: none;
        /* Mesuré : empilée en une colonne, elle demandait 482 px au plancher du
           resserrement (0,6). L'axe est LARGE (1 168) : le moment à gauche, la
           question (`cf-cote`) à droite — à droite de la tuile, comme LA-1. */
        display: grid; grid-template-columns: minmax(0, 1fr) 440px;
        grid-auto-rows: min-content; align-content: start; column-gap: 12px;
      }
      .nouvelle-table .ntt-moment > * { grid-column: 1; }
      /* ⛑ S1300 · P-2 — l'écran de fin de partie. Mesuré sur `etat-departage` :
         le récit de la fin demande ≈ 600 px, le tableau (scores + détail) 928 —
         au-dessus de la main (560 px) il débordait de 435 au plancher 0,6. En
         fin de partie la main et les blocs ne servent plus : il prend toute la
         composition (`fixed`, qui se cale sur `#composition` transformée),
         en deux colonnes — le récit | le tableau. Rien ne défile : il se
         resserre (`tiensDansTaBoîte`). */
      .nouvelle-table .ntt-axe > .ntt-fin {
        position: fixed; left: 48px; right: 48px; top: 62px; bottom: 20px; z-index: 90;
        overflow: hidden; margin: 0; box-sizing: border-box;
        background: var(--ink-2); border: 2px solid var(--stock-dim); padding: 14px 18px;
        box-shadow: 0 0 0 100vmax rgb(10 8 6 / .7);
        display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
        grid-auto-rows: min-content; align-content: start; column-gap: 28px;
      }
      .nouvelle-table .ntt-fin > * { grid-column: 1; }
      .nouvelle-table .ntt-fin > .decision { grid-column: 2; grid-row: 1 / span 60; margin: 0; }
      .nouvelle-table .ntt-moment > .cf-cote { grid-column: 2; grid-row: 1 / span 20; }
      /*
       * ═══ ⛑ S1294 · CJ-1 (note 186) — LA CARTE JOUÉE PAR UN AUTRE ═══
       * Sous son bandeau, `fixed`, posée au rendu : elle ne pousse rien.
       * 3,2 s de vie, 220 ms d'entrée ; le délai NÉGATIF (en ligne) dit où
       * elle en est, un rendu ne la relance pas. Aucune couleur neuve.
       */
      .nouvelle-table .cj-pile {
        position: fixed; left: 0; top: 0; z-index: 60; width: 400px; height: 150px;
        pointer-events: none;
      }
      .nouvelle-table .cj-carte {
        position: absolute; top: 14px; left: calc(var(--rang, 0) * 40px + 6px);
        width: 56px; pointer-events: auto;
        background: var(--ink); border: 1px solid var(--siege, var(--stock-dim));
        box-shadow: 0 6px 18px rgb(0 0 0 / .6);
        transform: rotate(calc((var(--rang, 0) - 2) * 3deg));
      }
      /* S1354 · S-T2 — la neuve s'affiche en grand, puis rejoint la pile. */
      .nouvelle-table .cj-carte.cj-neuve {
        z-index: 3; transform-origin: top left; animation: cj-arrivee 1.6s ease-out both;
      }
      @keyframes cj-arrivee {
        0%   { opacity: 0; scale: 2.4; translate: 0 24px; }
        10%  { opacity: 1; scale: 2.4; translate: 0 24px; }
        65%  { opacity: 1; scale: 2.4; translate: 0 24px; }
        100% { opacity: 1; scale: 1; translate: 0 0; }
      }
      .nouvelle-table .cj-titre {
        position: absolute; left: 6px; top: 0; font-family: var(--mono); font-size: 9px;
        letter-spacing: .14em; color: var(--stock-dim);
      }
      /* ⛑ S1363 · note 204 ④ — sous le rond : la dernière seule, 30 s (le délai,
         en ligne, est ce qui lui reste), puis un fondu de 0,5 s. */
      .nouvelle-table .cj-pile.cj-seule { animation: cj-fin .5s linear both; }
      .nouvelle-table .cj-pile.cj-seule .cj-titre { display: none; }
      @keyframes cj-fin { from { opacity: 1; } to { opacity: 0; visibility: hidden; } }
      .nouvelle-table .cj-carte:not(.cj-neuve) .cj-nom { display: none; }
      .nouvelle-table .cj-coin {
        position: absolute; right: 2px; top: 2px; width: 18px; height: 18px; z-index: 1;
        display: grid; place-items: center; font-size: 12px; line-height: 1;
        background: rgb(0 0 0 / .7); color: var(--stock); cursor: zoom-in;
      }
      .nouvelle-table .cj-carte:has(.cj-coin:hover) { z-index: 4; }
      .nouvelle-table .cj-art { display: block; width: 100%; height: auto; }
      .nouvelle-table .cj-nom {
        font-family: var(--mono); font-size: 9px; letter-spacing: .06em; color: var(--stock);
        padding: 2px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      @keyframes cj-vie {
        0%     { opacity: 0; translate: 0 -14px; scale: .85; visibility: visible; }
        6.9%   { opacity: 1; translate: 0 0; scale: 1; }
        88%    { opacity: 1; translate: 0 0; scale: 1; }
        99.9%  { opacity: 0; translate: 60px -40px; scale: .7; visibility: visible; }
        100%   { opacity: 0; translate: 60px -40px; scale: .7; visibility: hidden; }
      }
      .nouvelle-table .cj-grand {
        position: absolute; left: 0; top: calc(100% + 6px); width: 300px;
        background: var(--ink-2); border: 1px solid var(--rule); padding: 6px;
        visibility: hidden; opacity: 0; pointer-events: none; transition: opacity .12s;
      }
      .nouvelle-table .cj-carte:has(.cj-coin:hover) > .cj-grand { visibility: visible; opacity: 1; }
      /* S1354 · S-T2 — le curseur fantôme d'un bot, et son clic. */
      .fantome-curseur {
        position: fixed; z-index: 970; width: 32px; height: 32px; opacity: .55;
        pointer-events: none; image-rendering: auto;
      }
      .fantome-curseur.clic { scale: .85; opacity: .8; }
      .fantome-clic {
        position: fixed; z-index: 969; width: 10px; height: 10px; margin: -5px 0 0 -5px;
        border: 2px solid var(--stock); border-radius: 50%; pointer-events: none;
        animation: fantome-onde .45s ease-out both;
      }
      @keyframes fantome-onde { to { scale: 5; opacity: 0; } }
      .nouvelle-table .cj-grand img { display: block; width: 100%; height: auto; }
      .nouvelle-table .cj-grand-nom {
        font-family: var(--mono); font-size: 12px; letter-spacing: .08em; color: var(--stock);
        padding-top: 4px;
      }
      .nouvelle-table .ntt-axe {
        display: flex; flex-direction: column; align-items: center; gap: 12px;
        min-width: 0;
      }
      .nouvelle-table .ntt-axe .ma-tuile {
        display: flex; flex-direction: column; align-items: center; gap: 6px;
      }
      .nouvelle-table .ntt-axe .tuile-visuel { display: inline-block; }
      .nouvelle-table .ntt-axe .tuile-art {
        height: 360px; width: auto; max-width: none;
      }
      .nouvelle-table .ntt-axe .ntt-sous-tuile { width: min(100%, 640px); }
      /*
       * ⚠ **MESURÉ À 1920 × 1080 : LE PANNEAU PASSAIT SOUS LA MAIN.** Tuile à
       * 440 px, panneau 683 → 932, cartes de la main à partir de y ≈ 842.
       * Deux gestes, et aucun n'enlève un fait : les trois lignes ACTIONS ·
       * SIGNATURE · TA MAIN tiennent sur UNE ligne ici (−23 px), et la tuile
       * rend 80 px (360). L’ancien écran n'en reçoit pas un pixel : sélecteur
       * `.ntt-sous-tuile`, posé par `centreDeLaTable` seul.
       */
      /*
       * ⚠ **ET SUR LE CHEMIN DE CROZE IL EST PLUS LONG** : `JOUER.bat` ouvre en
       * `?debug=1`, et le panneau y porte en plus `Decision.kind`, le délai et
       * la liste des refus de TRADE — mesuré en partie jouée depuis le menu, il
       * descendait à y ≈ 1 000. Borné à la place libre au-dessus de la main :
       * le titre, les Actions et FINIR LE TOUR viennent en tête et restent
       * toujours visibles ; ce qui dépasse (le débogage) défile DANS le panneau.
       * 210 px et pas plus : en `?debug=1` le bandeau du haut descend toute la
       * table de 22 px, et la main commence à y ≈ 847.
       */
      .nouvelle-table .ntt-axe .ntt-sous-tuile {
        max-height: 210px; overflow: hidden;   /* ⛑ S1289 · L-T2 — resserré, jamais défilé */
      }
      /*
       * ⛑ S1237 — **L'APEX DE LA MAIN EST À y ≈ 733, PAS À 842.** L'éventail
       * lève sa carte du milieu (mesuré : 733 sur `designation-plurielle`, 735
       * sur `offrande-pit`) ; 842 est le bord des cartes latérales. Une QUESTION
       * sur LA TABLE replie donc la tuile à 150 px et reçoit 330 px (≈ 393 →
       * 723) ; en combat, 220 px (≈ 512 → 732).
       */
      .nouvelle-table .ntt-table:not(.ntt-en-combat) .ntt-axe.avec-question .tuile-art { height: 150px; }
      .nouvelle-table .ntt-table:not(.ntt-en-combat) .ntt-axe.avec-question .ntt-sous-tuile { max-height: 330px; }
      /* Quatre bannières de cible (188 px) sur UNE rangée : mesuré à 640 px, la
         quatrième passait dessous et défilait. */
      .nouvelle-table .ntt-axe.avec-question .ntt-sous-tuile { width: min(100%, 860px); }
      /*
       * ═══ ⛑⛑ S1291 · LA-1 (note 180) — LA QUESTION À DROITE DE LA TUILE ═══
       * *« Quand on me demande quelque chose, la question est à droite de la
       * tuile, je lis tout et je réponds sans rien scroller, et ma main ne la
       * cache jamais. »* Sur LA TABLE seule (le combat a sa propre place).
       * L'axe devient une RANGÉE : la tuile (360, elle ne se replie plus) puis
       * le panneau, qui part du haut de la tuile et s'arrête AU-DESSUS de
       * l'apex de l'éventail (y ≈ 733, mesuré S1237) : 490 px depuis le haut
       * de la table (221, ou 243 sous le bandeau debug). Ce qui ne tient pas
       * se resserre (`tiensDansTaBoîte`) et se lit en entier au ⤢.
       */
      .nouvelle-table .ntt-table:not(.ntt-en-combat) .ntt-axe {
        flex-direction: row; align-items: flex-start; justify-content: center; gap: 28px;
      }
      /* ⛑ S1295 · TU-1 (note 184) — *« Ma tuile est grande, je lis son texte sans
         l'ouvrir. »* 360 → 504 (+40 %), sur la table seulement (le combat a son
         centre). Mesuré avant : tuile 416,280 240 × 360 ; après : 336 × 504,
         bas à y 784 — la main réduite (MA-1) repasse dessous. */
      .nouvelle-table .ntt-table:not(.ntt-en-combat) .ntt-axe .tuile-art,
      .nouvelle-table .ntt-table:not(.ntt-en-combat) .ntt-axe.avec-question .tuile-art { height: 504px; }
      .nouvelle-table .ntt-question-cadre { position: relative; flex: 0 1 820px; min-width: 0; }
      .nouvelle-table .ntt-table:not(.ntt-en-combat) .ntt-axe .ntt-question-cadre .ntt-sous-tuile {
        width: 100%; max-height: 470px; overflow: hidden;   /* S1291 · LA-4 : la table part de 251 (résumés sous les miniatures) → 721 < 733 */
      }
      .nouvelle-table .ntt-question-loupe {
        position: absolute; top: 6px; right: 6px; z-index: 2;
      }
      .plein .question-en-grand { width: auto; max-width: 100%; max-height: none; box-sizing: border-box; }
      /*
       * ═══ ⛑⛑ S1319 · SC-1 (note 190) — UNE FENÊTRE DÉFILE, SANS AUCUNE BARRE ═══
       * `défileSansBarre` pose `sc-fenetre` quand le resserrement ne suffit pas :
       * molette et glisser, aucune barre, la page derrière ne bouge pas. Les
       * deux bords (`sc-bord`, collés par `sticky`, hauts de zéro) portent
       * l'ombre et le chevron — visibles seulement s'il y a une suite de ce côté.
       */
      .sc-fenetre { overflow-y: auto !important; overscroll-behavior: contain; scrollbar-width: none; }
      .sc-fenetre::-webkit-scrollbar { display: none; width: 0; height: 0; }
      .sc-fenetre > .sc-bord { position: sticky; left: 0; right: 0; height: 0; z-index: 5; zoom: 1; }
      .sc-fenetre > .sc-bord-haut { top: 0; }
      .sc-fenetre > .sc-bord-bas { bottom: 0; }
      .sc-bord::before {
        content: ''; position: absolute; left: 0; right: 0; height: 46px; pointer-events: none;
        opacity: 0; transition: opacity 160ms ease-out;
      }
      .sc-bord-haut::before { top: 0; background: linear-gradient(to bottom, rgb(0 0 0 / .78), transparent); }
      .sc-bord-bas::before { bottom: 0; background: linear-gradient(to top, rgb(0 0 0 / .85), transparent); }
      .sc-bord > .sc-chevron {
        position: absolute; left: 50%; transform: translateX(-50%);
        width: 44px; height: 22px; padding: 0; line-height: 20px; font-size: 18px;
        color: var(--stock); background: rgb(0 0 0 / .55); border: 1px solid var(--stock-dim);
        border-radius: 11px; cursor: pointer; opacity: 0; pointer-events: none;
        transition: opacity 160ms ease-out;
      }
      .sc-bord-haut > .sc-chevron { top: 4px; }
      .sc-bord-bas > .sc-chevron { bottom: 4px; }
      .sc-bord > .sc-chevron:hover { border-color: var(--stock); }
      .sc-suite-haut > .sc-bord-haut::before, .sc-suite-bas > .sc-bord-bas::before { opacity: 1; }
      .sc-suite-haut > .sc-bord-haut > .sc-chevron,
      .sc-suite-bas > .sc-bord-bas > .sc-chevron { opacity: 1; pointer-events: auto; }
      /* D'abord faire tenir : sur la Lanterne, la rangée de cartes à décider
         rapetisse (216 → 150) et la carte s'ouvre en grand au survol
         (`.obj-zoom`, par `#zoom-coin`) ; le zoom laisse passer la souris, sinon
         il couvrirait la carte qu'on veut cliquer. */
      .nouvelle-table .ntt-sous-tuile .obj-rangee.grandes .obj-cible { width: 150px; padding: 6px; font-size: 13px; }
      .obj-cible > .obj-zoom { display: none; }
      #zoom-coin > .obj-zoom.zc-ouvert { display: flex; pointer-events: none; }
      .nouvelle-table .ntt-sous-tuile .choix-corps.atj {
        display: flex; flex-wrap: wrap; column-gap: 26px; row-gap: 3px;
      }
      /*
       * ⚠ **LE LIEN DE RETOUR QUITTE LE FLUX** : sous la table, il poussait la
       * mémoire du tour à y = 1 015 → 1 081, hors des 1 080 de la composition.
       * En haut à droite, il ne prend la place de rien — les présences sont
       * centrées et le coin des quêtes est à gauche.
       */
      /*
       * ─── LES DEUX ONGLETS ─── S1234 · P3-T2bis ──────────────────────────
       * *« …un onglet COMBAT rouge apparaît à côté de LA TABLE ; je passe de
       * l'un à l'autre d'un clic… »* Contour = l'onglet qu'on ne regarde pas,
       * plein = celui qu'on regarde (la loi des plaques de la DA, en attendant
       * les plaques peintes de H-T2). COMBAT est en sang, allumé ou non : c'est
       * ce qui le fait voir dès qu'il apparaît.
       */
      .nouvelle-table .ntt-onglets { display: flex; gap: 10px; margin: -8px 0 -6px; }
      .nouvelle-table .ntt-onglet {
        font-family: var(--mono); font-size: 12px; letter-spacing: .14em;
        padding: 7px 16px; cursor: pointer;
        color: var(--stock); background: transparent;
        border: 1px solid var(--stock-dim);
      }
      .nouvelle-table .ntt-onglet.on { background: var(--stock); color: var(--ink); border-color: var(--stock); }
      .nouvelle-table .ntt-onglet.ntt-combat { color: var(--rouge-vif); border-color: var(--rouge-vif); }
      .nouvelle-table .ntt-onglet.ntt-combat.on { background: var(--rouge); border-color: var(--rouge-vif); color: var(--stock); }
      /* ⛑ S1267 · H-T2 étape 12 (note 170 ① ⓐ) — les onglets deviennent des
         PLAQUES. Les règles du dessus posent `border` (le raccourci remet
         `border-image` à rien) et un fond : on les reprend ici, plus
         spécifiques, sinon la plaque peinte disparaît sous elles. COMBAT garde
         le sang dans son texte. */
      .nouvelle-table .ntt-onglets button.ntt-onglet.plaque {
        border: 0; border-style: solid; background: none; color: var(--ink);

        height: 44px; min-width: 142px; padding: 0 22px;

      }

      }

      /* ⛑ S1324 · CO-1 — un seul bouton, en haut à droite ; le bandeau des ronds
         s'efface (220 ms) au rendu où le combat le gobe. */
      /* sur la ligne de JOURNAL et SUIVRE L'ACTION, à leur gauche (JOURNAL finit à right 268 + 106) */
      .nouvelle-table .ntt-onglets.ntt-bascule {
        position: absolute; top: 2px; right: 386px; z-index: 48; margin: 0;

      .nouvelle-table .nt-presences.nt-s-efface {

      /*
       * ─── QUAND JE ME BATS ─── S1235 · P3-T2 (loi 5bis) ──────────────────
       * La même grille que LA TABLE : TOI · l'axe (les autres, la bande) · le
       * journal du combat. Le journal prend TOUTE la hauteur de sa colonne et
       * défile en lui-même (`col-journal` est `sticky` sur l'ancien écran,
       * ici la cellule est bornée). `adv-inv` reste replié, comme dans
       * l'ancien centre (S1217 : 408 px, c'est P2-T2 au clic).
       */
      .nouvelle-table .ntt-en-combat .col-journal {
        position: static; align-self: stretch; min-height: 0; overflow: hidden;
      }
      /* ⛑ S1289 · L-T2 — le journal ne défile plus : le plus RÉCENT est en haut
         (`renderFil` lit le journal à rebours), ce qui ne tient pas est le plus
         ANCIEN, et le journal entier s'ouvre par-dessus (Dungeon View). */
      /* ⛑ S1290 · L-T1 (Duel Final) — ET LE FIL LUI-MÊME. La règle du dessus
         bornait la COLONNE ; le fil dedans gardait l'`overflow-y: auto` de
         `.fil.fil-siege` et défilait seul. Invisible sur les combats courts que
         S1289 a mesurés ; au Duel Final, mesuré : 2 256 px pour 660. */
      .nouvelle-table .ntt-en-combat .col-journal > .fil.fil-siege { overflow: hidden; }
      .nouvelle-table .ntt-en-combat .adv-inv { display: none; }
      /* `.cf-dues` est `sticky` en bas dans la fenêtre de combat (S87) ; ici il
         se peignait AU MILIEU de la carte du mob (mesuré : 466 → 540 dans une
         carte 297 → 767). La bande est déjà sous les combattants : elle suit. */
      .nouvelle-table .ntt-en-combat .cf-dues { position: static; }
      .nouvelle-table .ntt-en-combat .ntt-axe { align-items: stretch; }
      .nouvelle-table .ntt-en-combat .mob-rail { justify-content: center; }
      /*
       * ⚠ **MESURÉ : SANS LARGEUR, LA CARTE DU MOB PRENAIT TOUT L'AXE** —
       * 1 166 px, et la barre de vie peinte (dont la hauteur suit la largeur,
       * H-T1 : on rogne, on n'étire jamais) montait à 117 px ; la carte
       * faisait 642 px et la page 1 107. « En gros » = une grande carte, pas
       * une bannière : 440 px seul, 340 px dès qu'il y en a plusieurs.
       */
      .nouvelle-table .ntt-en-combat .ntt-rang-mobs > .mobcard { flex: 0 0 440px; width: 440px; }
      .nouvelle-table .ntt-en-combat .ntt-rang-mobs > .mobcard:not(:only-child) { flex-basis: 340px; width: 340px; }
      .nouvelle-table .ntt-en-combat .ntt-rang-mobs .mc-img { max-height: 150px; width: auto; }
      /*
       * ⚠ **UNE QUESTION M'EST POSÉE** : mob (≈ 365 px) + panneau (≤ 210) ne
       * tiennent pas au-dessus de la main (y ≈ 842). L'image du mob se replie —
       * le panneau montre déjà le mob du coup (`leMobDuCoup`) — et le panneau
       * reçoit 220 px : ≈ 297 → 500 la carte, 512 → 732 la question (S1237 :
       * l'apex de la main est à 733, pas à 842).
       */
      .nouvelle-table .ntt-en-combat .ntt-axe.avec-question .ntt-rang-mobs .mc-art { display: none; }
      /*
       * ⛑ S1313 · L-4 — **LE RANG DES JOUEURS N'AVAIT PAS DE LARGEUR** (la même
       * faute que celle du mob, juste au-dessus) : au Duel Final, mesuré, la
       * carte adverse prenait 1 166 px, son art 559 px, la carte 822 px, et le
       * panneau ON TE DEMANDE tombait à y 1 198 — HORS de l'écran. Même borne
       * que le mob (440 seul, 340 à plusieurs) et même repli quand on me demande.
       */
      .nouvelle-table .ntt-en-combat .ntt-rang-joueurs > .advcard { flex: 0 0 440px; width: 440px; }
      .nouvelle-table .ntt-en-combat .ntt-rang-joueurs > .advcard:not(:only-child) { flex-basis: 340px; width: 340px; }
      .nouvelle-table .ntt-en-combat .ntt-axe.avec-question .ntt-rang-joueurs .mc-art { display: none; }
      /*
       * ⛑ S1314 · L-6 — **À CINQ ET PLUS, MES BOUTONS TOMBAIENT HORS DE L'ÉCRAN.**
       * Mesuré (6 engagés : 2 mobs + 3 autres joueurs + moi, mon tour) : cartes
       * de joueurs 340 × 651 (l'art de fiche entier, 455 px), mobs 352, l'axe
       * 1 137 px, **les actions dues à y 1 389–1 451** — et la page ne défile
       * pas. Comme le tableau 04 : l'art d'un joueur engagé se lit en BANDEAU
       * (90 px, le haut de la fiche), et l'image du mob se resserre à 90 px
       * quand des joueurs sont aussi au combat.
       */
      .nouvelle-table .ntt-en-combat .ntt-rang-joueurs .mc-art { max-height: 90px; overflow: hidden; }
      /* Mobs ET joueurs : deux rangées — l'art des joueurs se replie (nom, PV,
         faits restent), l'image du mob tient en 60 px. Mesuré : PASSER LA MAIN
         à y 1 115 avec le seul bandeau de 90 px. */
      .nouvelle-table .ntt-en-combat .ntt-axe:has(> .ntt-rang-mobs) .ntt-rang-joueurs .mc-art { display: none; }
      .nouvelle-table .ntt-en-combat .ntt-axe:has(> .ntt-rang-joueurs) .ntt-rang-mobs .mc-img { max-height: 60px; }
      .nouvelle-table .ntt-duel .ntt-rang-joueurs { align-items: center; gap: 28px; }
      .nouvelle-table .ntt-duel .ntt-duel-milieu {
        flex: 0 0 auto; font-family: var(--display); font-size: 40px; line-height: 44px;

      .nouvelle-table .nt-presence .nt-ou.nt-gradin { color: var(--stock-dim); }
      .nouvelle-table .ntt-en-combat .ntt-axe.avec-question .ntt-sous-tuile { max-height: 220px; }
      .nouvelle-table .ntt-toi.allume .encadre-perso { border-left-color: var(--stock); }
      /* ⛑ S1291 · CB-1 (note 180) — en combat, MA FICHE CLIQUABLE ouvre mon bloc
         (`centreDuCombat`) : le carton porte déjà mon art, le portrait de
         l'encadré s'efface pour lui laisser la place. */
      /* ⛑ S1291 · LA-3 — et sur LA TABLE aussi : `blocToi` la pose partout. */
      .nouvelle-table .ntt-toi.avec-fiche .ep-portrait { display: none; }
      .nouvelle-table .ntt-toi > .ntt-ma-fiche { flex: 0 0 auto; }

      /*

       * gauche, cliquable, en entier ; la tuile du mob à droite, ses PV au

      .nouvelle-table .ntt-table.ntt-cb2 { grid-template-columns: 400px minmax(0, 1fr) 400px; }

      /* ⛑ S1325 · CO-2 — contre un joueur : la cible à droite, plus large que le mob ;
         le bloc joueur (BJ-1) agrandi, un seul cœur (celui de la tête). */
      .nouvelle-table .ntt-table.ntt-cb2.ntt-cb2-pvp { grid-template-columns: 400px minmax(0, 1fr) 520px; }
      .nouvelle-table .bj-autre.ntt-cb2-joueur {

      /* ⚑ S1379 · P3-T3 quinquies (note 209 ④) — l'adversaire comme moi : sa fiche, son inventaire. */
      .nouvelle-table .ntt-cb2-comme-moi { justify-content: flex-start; }

      .nouvelle-table .ntt-cb2-etats { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--siege, var(--stock)); }
      .nouvelle-table .ntt-onglet-cible .noc-pastille { transform: scale(.72); transform-origin: left center; margin: -4px 0 -4px 0; }
      /* ⛑ S1328 · PV-1 — contre plusieurs joueurs : un onglet par cible, la tuile de l'ouvert. */
      .nouvelle-table .ntt-cibles { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
      .nouvelle-table .ntt-onglets-cible { flex: 0 0 auto; display: flex; gap: 6px; }

        padding: 6px 8px; background: rgba(0,0,0,.45); color: var(--stock);

      .nouvelle-table .ntt-cibles > .ntt-cb2-mob { flex: 1 1 0; min-height: 0; }
