       * Le S932 avait chiffré l'écart DANS la fenêtre — `452 × 639` contre
       * `594 × 751`, soit 76 % en largeur et 85 % en hauteur — et n'avait
       * pas bâti, de peur de pousser sur `Q-HAUTEUR-1080`. **Mesuré ici :
       * la peur portait sur le mauvais nombre.**
       *
       * ```
       * cf-cote   68 -> 813      <- la colonne du JOUEUR (banniere de halte otee)
       * mob-rail 130 -> 889      <- la colonne du MOB, deja la PLUS PROFONDE
       * ```
       *
       * La carte descend **76 px plus bas que la fiche** : monter la fiche
       * de `639` a `750` ne coûte donc pas `111 px` de défilement interne,
       * **il en coûte `11`** (caché `323` → `334`, bannière de halte ôtée).
       * *Ce qui borne une grille est sa colonne la plus profonde, pas celle
       * qu'on est en train de regarder.*
       *
       * Résultat à 1920×1080, peau JOUEUR, `?seed=5&fait=COMBAT_OPENED` :
       * `531 × 750` contre `594 × 751` — **même hauteur au pixel de rondeur
       * près**, et surtout **les deux cartons sont coupés sur la MÊME ligne :
       * `73 %` visibles l'un comme l'autre** (avant : la fiche montrait
       * `85 %` d'elle-même en étant la plus petite des deux). Débordement de
       * PAGE : `0 px` — `Q-HAUTEUR-1080` tient, mesuré, pas supposé.
       *
       * ⚠⚠ **ET LA SECONDE BORNE AURAIT AVALÉ LE GESTE EN SILENCE.** Elle
       * valait `100vh - 425px`, soit `463 px` à 1080 : **plus BASSE que les
       * `531` visés**, donc `min()` l'aurait choisie et la fiche serait
       * restée à `463 × 655` sans qu'une seule règle ne le dise. *Deux
       * plafonds qui se compensent rendent un vert qui ne mesure rien.*
       * Le `329` n'est pas choisi, il se lit : **`1080 - 751`**, la hauteur
       * de référence moins le plafond — donc la borne **ne mord pas à la
       * référence** et continue de rogner en dessous. Éprouvée à 1600×900 :
       * la fiche tombe à `404 × 570`, elle mord.
       *
       * ⚠ **ET À 900 LA FICHE NE COÛTE RIEN DU TOUT** : le caché y vaut `503`
       * dans les TROIS essais (plafond d'avant, plafond neuf avec borne,
       * plafond neuf sans borne) — la carte du mob, haute de `751` à toute
       * largeur, borne seule. La borne `vh` est donc une garde qui ne coûte
       * rien et qu'on garde à ce titre, **pas** ce qui tenait la fenêtre.
       *
       * ⚠ **CE QUI N'A PAS BOUGÉ, ET POURQUOI.** `max-height` de la fenêtre
       * (`100vh - 140px - reserve`) a été sondée et **laissée intacte** : ses
       * `140px` ne doublent PAS la réserve, ils paient le décalage du HAUT
       * (`--haut-des-bandeaux`, `121px`). Ici la fenêtre ouvre à `y = 45`
       * (bannière absente de cet état) et il semblait rester `95 px` d'air ;
       * les rendre ferait passer `FINIR LE TOUR` **sous la ligne de réserve
       * `820`** dans un état qui porte la bannière. *Un instant pris pour une
       * structure* — sondé dans les deux sens avant de renoncer.
       *
       * ⚠ Le ratio `1414 / 2000` ne bouge pas : les dix-huit bandes du calque
       * sont en `%` de cette boîte (le S270 l'a déjà payé trente lignes plus
       * haut). On ne touche qu'aux plafonds, la boîte garde sa forme.
       */
      .cf-cote .fc-boite {
        max-width: min(calc(751px * 1414 / 2000),
                       calc((var(--uvh) * 100 - 329px) * 1414 / 2000));
      }
      .fc-art { display: block; width: 100%; height: auto;
                border: 1px solid var(--rule); border-radius: 3px; }
      .fc-calque { position: absolute; inset: 0; pointer-events: none; }
      /*
       * ⛑⛑ S266 — **LE MÊME STYLE QUE LES ZONES DE TUILE, ET C'EST LE POINT.**
       * Croze a écrit *« les encadrés »* au pluriel : ce sont deux familles —
       * les zones sur le carton de tuile et les bandes sur la fiche imprimée —
       * et elles portaient la **même recette cheap**, à un pixel près. Les
       * quatre décisions sont écrites une fois, au-dessus de `.tz` ; l'anneau
       * de survol est LITTÉRALEMENT partagé (`.tz::after, .fcz.ok::after`).
       * *Deux surfaces qui se ressemblent et qu'on retouche séparément
       * divergent au premier ajustement.*
       *
       * ⚠ **`.no` GARDE SON TRAIT TIRETÉ ET SON ENCRE DE REFUS.** Le tireté
       * n'est pas une économie de style : il dit *« ce n'est pas cliquable »*
       * sans employer le gris, qui est réservé à l'ÉPUISÉ (S254). Il reçoit
       * l'angle doux et la contre-ligne comme les autres — le style change, la
       * SIGNIFICATION ne bouge pas.
       */
      /* ⛑ S293 — le calque de la fiche suit celui de la tuile, au trait près. */
      .fcz { position: absolute; left: 3.5%; width: 93%;
             pointer-events: auto; padding: 0; background: transparent;
             border-radius: 10px; box-shadow: 0 1px 4px rgba(0, 0, 0, .45); }
      .fcz.ok { cursor: pointer;
             /* ⛑ S307 — même geste que `.tz` : le trait au repos devient
                transparent, le scintillement le remplace. */
             border: 1px solid transparent; }
      .fcz.ok:hover, .fcz.ok:focus-visible, .fcz.ok:focus-within { outline: none; }
      .fcz.no { cursor: not-allowed; border: 1px dashed var(--stamp); opacity: .5; }

      /*
       * ═══ ⛑ S490 · LES STATS VIVANTES DANS LES BOÎTES VIDES DU CARTON ═══════
       * Note ㊼ ② de Croze. Le détail est au-dessus de `calqueDesStats`.
       *
       * ⚠ **L'ENCRE EST SOMBRE, ET CE N'EST PAS LE THÈME QUI DÉCIDE.** Tout
       * l'écran est sur fond `--ink` ; ici la surface est **le carton imprimé
       * de Croze**, crème et blanc, et il ne change pas avec le thème. Un
       * `var(--stock)` clair écrirait du blanc sur du blanc. Les couleurs sont
       * donc celles de l'IMPRIMÉ — c'est la même raison qui fait vivre les
       * zones de `.fcz` en transparence par-dessus lui.
       *
       * ⚠ **LA TAILLE SUIT LE CARTON, ELLE N'EST PAS EN PIXELS.** La boîte est
       * plafonnée à `560px` de haut (S270) mais rétrécit avec la colonne : un
       * `font-size` fixe déborderait des cases au premier écran étroit. Le
       * calque est donc un CONTENEUR de requête, et les chiffres se mesurent en
       * `cqw` — *un nombre posé dans une case qu'on redimensionne doit se
       * redimensionner avec elle*, la leçon du plafond de la fiche au S270.
       */
      .fs-calque { position: absolute; inset: 0; pointer-events: none;
                   container-type: inline-size; }
      .fs-case { position: absolute; display: flex; flex-direction: column;
                 align-items: center; justify-content: center; gap: .5cqw;
                 line-height: 1; }
      /*
       * ⚠⚠ **CETTE ENCRE N'EST PAS CELLE DU THÈME, ET LE S520 A FAILLI LA
       * PRENDRE POUR TELLE.** Elle est posée sur **le carton imprimé de
       * Croze** — crème et blanc —, pas sur `--ink` : c'est la décision du
       * S490, écrite au-dessus de `calqueDesStats`. Quand la DA est passée au
       * neutre sombre, `palette.py ③b` l'a signalée à `1.00` de contraste **sur
       * un fond qu'elle ne touche jamais** — la limite que l'outil déclare
       * lui-même (*« le fond hérité n'est pas lisible dans le CSS »*).
       *
       * Sa valeur coïncidait avec l'ancien `--ink` ; ce n'était qu'une
       * coïncidence, et elle est levée ici pour que personne ne la « corrige ».
       * *Une couleur qui a la même valeur qu'un jeton n'est pas ce jeton.*
       */
      .fs-n { font-family: var(--display); font-weight: 700; font-size: 8.5cqw;
              color: #15120F; letter-spacing: .01em;
              /* la boîte HP laisse passer l'illustration : un halo, pas un fond */
              text-shadow: 0 0 4px rgba(255, 255, 255, .95),
                           0 0 9px rgba(255, 255, 255, .8); }
      .fs-plus, .fs-moins, .fs-planche {
              font-family: var(--display); font-weight: 700; font-size: 3.4cqw;
              letter-spacing: .04em;
              text-shadow: 0 0 4px rgba(255, 255, 255, .95); }
      .fs-plus   { color: var(--activable); }
      .fs-moins  { color: var(--stamp); }
      .fs-planche { color: var(--stamp); font-size: 3cqw; text-transform: uppercase; }

      /*
       * ═══ ⛑⛑ S679 · LES TROIS ENCRES DE LA NOTE 82 ⑩ ═════════════════════
       *
       * Croze : *« gris si = 0 · l'encadré HP en ROUGE, et il clignote si
       * inférieur à 15 · une stat à 20+ : un VFX autour. »*
       *
       * ⚠ **ELLES VIVENT SUR LE CARTON IMPRIMÉ, PAS SUR LE THÈME** — c'est la
       * décision du S490, écrite au-dessus, et l'avertissement juste avant
       * `.fs-n` le répète : cette encre-là ne suit pas `--ink`. Le gris est donc
       * un gris QUI TIENT SUR DU CRÈME, pas `--muted`.
       *
       * ⚠ **LE HALO NE PEINT PAS UN FOND.** La boîte HP laisse passer
       * l'illustration (`.fs-n` ne pose qu'un `text-shadow`) : peindre un aplat
       * rouge cacherait le carton de Croze. Le rouge est donc l'ENCRE, et le
       * signal d'alerte est le halo qui l'entoure.
       *
       * ⚠ **`transform`/`opacity` ONLY** (`RELANCE ①`) : le clignotement est une
       * `opacity`, jamais une couleur qui s'anime — et il s'arrête sous
       * `prefers-reduced-motion`, où le ROUGE tient seul. *Un signal qui
       * n'existe que dans le mouvement disparaît pour qui l'a coupé.*
       */
      .fs-zero .fs-n { color: #6E6A63; text-shadow: 0 0 4px rgba(255,255,255,.9); }
      .fs-hp .fs-n, .fs-hp-bas .fs-n { color: var(--rouge); }
      .fs-hp-bas .fs-n { animation: fs-hp-bat 1.1s ease-in-out infinite; }
      @keyframes fs-hp-bat { 0%, 100% { opacity: 1; } 50% { opacity: .34; } }
      /*
       * ⛑⛑ **LE VFX DE LA STAT HAUTE N'EST PAS UNE COULEUR, ET C'EST UNE
       * CORRECTION PRISE AVANT DE LIVRER.**
       *
       * Premier jet : un halo `var(--activable)`, avec ce commentaire — *« un
       * halo doux, PAS d'ember, il est réservé au Collapse »*. **Mesuré au
       * navigateur sur une classe plantée, le halo sortait en `rgb(238,75,75)`
       * — c'est-à-dire `--rouge-vif`, c'est-à-dire `--ember` lui-même.** Les
       * trois jetons partagent UNE valeur (`--ember: var(--rouge-vif)` ligne
       * 105, `--activable: var(--rouge-vif)` ligne 194). J'avais écrit la règle
       * juste au-dessus de la ligne qui la viole. *Un jeton dont le NOM dit
       * « jouable » peut porter la VALEUR d'un jeton réservé — c'est la valeur
       * calculée qui tranche, jamais le nom.*
       *
       * ⚠ **ET LES TROIS RÉSERVATIONS FERMENT LA PORTE DE COULEUR** (§2, « les
       * signaux réservés ») : l'orange braise au Collapse, le rouge tampon au
       * refus, l'or au portail. Une teinte d'école dirait un ÉLÉMENT, ce qu'une
       * stat n'est pas. Et l'encre vit sur le CARTON CRÈME de Croze : un halo
       * blanc y serait invisible.
       *
       * ⚑ **DONC : PAS DE TEINTE. Le VFX est un RELIEF** — l'encre du carton
       * redoublée en anneau, et une respiration en `scale`. `transform` et
       * `opacity` only (`RELANCE ①`), aucun signal réservé emprunté, et ça se
       * lit sur du crème parce que c'est plus SOMBRE, pas plus coloré.
       */
      .fs-haut .fs-n { color: #15120F;
                       text-shadow: 0 0 3px rgba(255,255,255,.95),
                                    0 0 7px rgba(21,18,15,.55),
                                    0 0 14px rgba(21,18,15,.35); }
      .fs-haut .fs-n { animation: fs-haut-bat 2.2s ease-in-out infinite;
                       will-change: transform; }
      @keyframes fs-haut-bat {
        0%, 100% { transform: scale(1); opacity: 1; }
        50%      { transform: scale(1.07); opacity: .92; }
      }
      @media (prefers-reduced-motion: reduce) {
        /* Les deux faits restent LISIBLES sans mouvement : l'encre tient seule. */
        .fs-hp-bas .fs-n, .fs-haut .fs-n { animation: none; }
      }

      /*
       * ⚠ **ET IL N'Y A QU'UNE FICHE À L'ÉCRAN.** La colonne gauche reste
       * visible pendant un combat — c'est la décision de portée du S212 — et
       * elle porte déjà le MÊME carton imprimé, en vignette `184 × 260`. Deux
       * exemplaires de la même carte, c'est exactement ce que le S212 a retiré
       * de cette fenêtre (*« la re-parenter en faisait une COPIE, pas un
       * déménagement »*).
       *
       * Le carton passe donc à l'endroit que Croze nomme — la fenêtre de
       * combat, en grand et cliquable — et **la vignette s'efface le temps du
       * combat**. C'est un déménagement, pas une copie : la source disparaît
       * (`§0.1 ⑤`), et elle revient dès que la fenêtre se ferme.
       */
      body:has(.combat-fenetre) .fi-carte { display: none; }
      .mc-buffs { display: flex; gap: 5px; flex-wrap: wrap; align-items: baseline;
                  padding: 0 8px 6px; }
      /*
       * ═══ ⚑ S79 · LA CARTE DE L'ADVERSAIRE HUMAIN ════════════════════════
       *
       * Spec Croze (`LOT #7 ②`) : *« afficher l'image du joueur que l'on
       * combat et ses infos dynamiques, ainsi que son bandeau et son
       * inventaire. »* C'est **la même carte que le mob** — `.mobcard` porte
       * tout —, `.advcard` n'ajoute que ce qu'un joueur a et qu'un mob n'a
       * pas : son inventaire.
       *
       * ⚠ **AUCUNE TEINTE RÉSERVÉE, ET SURTOUT PAS L'ÉPAISSEUR DU TIER.**
       * `data-tier` vaut `JOUEUR` ici : il ne tombe donc sur aucune des trois
       * règles `NORMAL` / `SUBBOSS` / `BOSS`, et la carte garde le liseré de
       * base. *Un joueur n'est pas un boss, et lui prêter l'épaisseur d'un
       * boss ferait lire un fait de catalogue là où il n'y en a pas.*
       */
      /*
       * ⚑ **S93 — LE PORTRAIT EST UN 16/9 DANS UN CADRE 2/3, ET IL FLOTTAIT.**
       *
       * `.mc-img` est taillé pour l'art d'un MOB : `aspect-ratio: 2/3` et
       * `object-fit: contain`, exact pour une carte au format carte. Les 18
       * portraits de personnages, eux, sont livrés en **1920×1080** — un 16/9.
       * Mesuré dans le cadre de l'adversaire : rendu **260×390**, image posée
       * **260×146**, donc **244 px de vide, 62 % du cadre**, et un fichier 20
       * fois plus lourd que la place utile.
       *
       * ⚑ **HUIT FOYERS SUR NEUF UTILISAIENT DÉJÀ `cover`** — les pastilles de
       * siège (24×24), celles du bandeau sous-tuile (20×20), l'encadré de la
       * scène centrale (296×130, `object-position: 50% 32%`). **Celui-ci était
       * le seul en `contain`**, parce qu'il n'a pas été dessiné pour un
       * portrait : `S79` a routé l'image du joueur dans le cadre du mob sans
       * toucher au cadrage. *Un foyer qui hérite d'un autre hérite aussi de ses
       * hypothèses, et celle-là portait sur le RATIO de la source.*
       *
       * Le point de visée n'est pas choisi ici : c'est **celui de
       * `.ep-portrait`**, arbitré à `S59` pour ces mêmes 18 fichiers. *Deux
       * cadrages pour un même corpus divergeraient au premier portrait recadré.*
       *
       * ⚠ **Portée `.advcard` seulement.** Les mobs gardent `contain` : leur art
       * EST au format du cadre, et le rogner couperait une carte entière.
       */
      /*
       * ⛑ **S491 — LA RÈGLE CI-DESSUS EST MORTE AVEC LE PORTRAIT, ET ON DIT OÙ
       * ELLE VIVAIT** (note ㊹ ②, *« dis où il vivait en le retirant »*). Elle
       * s'écrivait `.advcard .mc-img { max-width: 260px; object-fit: cover;
       * object-position: 50% 32% }` et n'avait qu'un sujet : le grand portrait
       * de la carte d'adversaire. Ce portrait est parti (note ㊼ ③), et **aucun
       * `.mc-img` n'entre plus dans une `.advcard`** — ni par le carton, ni par
       * son repli d'art manquant, qui est un texte. Le commentaire de S93
       * ci-dessus reste : il date la mesure, et le cadrage `50% 32%` sert
       * toujours `.ep-portrait` sur le même corpus. *Une règle sans sujet n'est
       * pas une règle inoffensive : c'est un piège pour qui la relira.*
       */
      /*
       * ⛑⛑ S491 — **LE CADRE DE L'ADVERSAIRE PORTE SON CARTON, PAS SA PHOTO**
       * (note ㊼ ③). Le détail est au-dessus de `cartonDuSiège`.
       *
       * ⚠ **ET IL FAUT DÉSARMER LE CADRE VIDE, SINON LE CARTON ARRIVE ENCADRÉ
       * DE POINTILLÉS.** `.mc-art:not(:has(.mc-img))` pose un liseré tireté et
       * `8px` de marge : c'est le style de l'emplacement d'art VIDE, et un
       * carton n'est pas un vide — il n'a simplement pas la classe `.mc-img`,
       * qui est taillée pour un portrait. *Un sélecteur écrit comme « pas
       * d'image » signifie en réalité « pas CETTE image ».*
       *
       * Le carton est un `1414 × 2000` : il occupe la largeur du cadre et sa
       * hauteur suit.
       *
       * ⚠⚠ **ET LA SPÉCIFICITÉ SE MESURE, ELLE NE SE SUPPOSE PAS.** Premier
       * jet : `.mc-art-fiche { border: none }`, poids `0,1,0`. Le liseré tireté
       * est déclaré par `.mc-art:not(:has(.mc-img))`, et `:has()` prend le poids
       * de son argument le plus fort — donc `0,2,0`. Relevé sur le nœud réel :
       * `borderStyle « dashed »`, `padding « 8px »`, **la contre-règle n'avait
       * aucun effet.** On égalise le poids (`.mc-art.mc-art-fiche`) et l'ordre
       * tranche, comme au S483 : *deux règles de poids inégal ne se départagent
       * pas à l'ordre, et une contre-règle qu'on n'a pas relue sur le nœud est
       * une intention.*
       *
       * ⚠ **ET LE CARTON N'EST PAS PLAFONNÉ À `260px`.** C'était la borne de
       * `.advcard .mc-img`, taillée pour un PORTRAIT dans une carte étroite ;
       * la carte de duel mesure `589` px. Le carton garde donc le seul plafond
       * qui le concerne — celui de `.fc-boite`, arbitré par Croze à `560px` de
       * haut (S270) — et il reste `width: 100%` en dessous. *Une borne héritée
       * d'un autre contenu borne un autre contenu.*
       */
      .mc-art.mc-art-fiche { padding: 0; border: none; }
      .advcard .mc-faits { display: flex; gap: 4px; flex-wrap: wrap;
                           padding: 0 8px 6px; }
      /* Le bandeau de jets vient du même lecteur que le sous-tuile : il garde
         sa matière, il perd seulement sa marge de colonne. */
      .advcard .siege-des { margin: 0 8px 6px; }
      .adv-inv { border-top: 1px solid var(--rule); margin: 0 8px; padding-top: 5px; }
      .adv-inv .corps { max-width: none; margin: 3px 0 4px; }
      /* Neuf créneaux dans une carte de 260 px : deux colonnes, pas trois. */
      .adv-inv .corps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      /*
       * ⛑ **S1101 — LA MARQUE DE LA FILE, SUR LE CARTON.** `Q-FIL-HORS-MOMENT`,
       * tranché : *« la petite marque sur la carte cliquée (⏳ / ⊘), pas une
       * colonne de plus »*. Elle vit dans `cz-bandeau`, la surface qui porte
       * déjà « ce que le carton n'imprime pas » — aucune géométrie nouvelle,
       * aucun sélecteur de position : le bandeau la place.
       */
      .cz-en-file { color: var(--stamp); }
      .cz-file-tombee { color: var(--alert); }
      .mc-atk { border-top: 1px solid var(--rule); margin: 2px 8px 0; }
      .mc-row { display: flex; gap: 8px; align-items: baseline;
                padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
      .mc-row:last-child { border-bottom: none; }
      /* L'intervalle du d6 : c'est LUI qui désigne la ligne, il se lit en premier. */
      .mc-d { flex: 0 0 34px; text-align: center; font-family: var(--display);
              font-weight: 800; font-size: 13px; color: var(--stock);
              border: 1px solid var(--rule); }
      .mc-t { display: flex; flex-direction: column; gap: 1px; }
      .mc-atknom { font-weight: 800; font-size: 12px; }
      .mc-atkfx { font-size: 10px; color: var(--stock-dim); letter-spacing: .04em; }
      .mc-atktx { font-size: 10px; color: var(--slate); }
      .mob-absent { border: 1px dashed var(--rule); padding: 8px 10px; margin-bottom: 8px; }

      .bc-deroule { padding: 6px 0 4px; }
      .bc-deroule .fil { max-height: 260px; overflow-y: auto; }
      /*
       * L'INERTE AVEC SA RAISON — barré, jamais absent. *Une commande qui
       * disparaît se lit comme une panne ; une commande barrée qui dit
       * pourquoi se lit comme une règle.* Le barré n'est PAS le gris du
       * passif : ce sont deux états différents.
       */
      .bc-fuite { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
                  border-top: 1px solid var(--rule); padding-top: 6px; }
      .bc-fuite.barree .bc-sous { text-decoration: line-through; color: var(--slate); }
      .bc-fuite.barree .rien { color: var(--stock-dim); }
      .bc-cause { display: flex; flex-direction: column; gap: 3px; }
      .bc-causenom { font-family: var(--display); font-weight: 800; font-size: 15px;
                     letter-spacing: .1em; }
      .bloc-combat.clos { border-style: dashed; }

      /*
       * ═══ LE PASSIF — GRIS, ET IL DIT CE QU'IL FAIT ═════════════════════
       *
       * Ordre de Croze. Le gris n'emprunte NI l'orange braise NI le rouge :
       * un passif n'est ni une menace ni un refus, il s'applique, c'est tout.
       *
       * ⚠ **Le gris du passif et le barré de l'inerte sont DEUX états.**
       * « ça s'applique tout seul » n'est pas « ça ne peut pas être joué ici ».
       * Le passif garde son texte lisible ; l'inerte est rayé.
       */
      .passif { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px;
                border: 1px dashed var(--rule); background: rgba(90,100,112,.07);
                padding: 4px 7px; margin: 2px 8px 6px; color: var(--stock-dim); }
      .passif-tag { font-size: 8px; letter-spacing: .22em; text-transform: uppercase;
                    color: var(--slate); border: 1px solid var(--slate); padding: 0 4px; }
      .passif-auto { font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
                     color: var(--slate); font-style: italic; }
      /* Le texte IMPRIMÉ, en entier : c'est « ce qu'il fait ». Jamais tronqué. */
      .passif-tx { flex-basis: 100%; font-size: 11px; line-height: 1.45;
                   color: var(--stock-2); }
      /* La couche debug seulement — additive, et elle ne teint pas la peau. */
      .passif-debug { flex-basis: 100%; font-size: 9px; letter-spacing: .06em;
                      color: var(--slate); font-style: italic; }
      .auto-item.passif { border-style: dashed; }

      /*
       * ═══ LES MARQUEURS DE RÉPONSE — position, JAMAIS durée ═════════════
       *
       * Pas de barre qui se remplit : `deadlineMs` vaut toujours `null` par
       * conception, et une barre sans horloge se lirait comme un compte à
       * rebours. Un marqueur, et il dit ce qu'il sait.
       */
      .rep { display: inline-flex; gap: 4px; }
      .rep-m { font-size: 8px; letter-spacing: .14em; text-transform: uppercase;
               border: 1px solid var(--rule); padding: 0 4px; }
      .rep-m.attendu { color: var(--stock); border-color: var(--stock); font-weight: 800; }
      /* Le manque se DIT : une place vide qui s'explique, jamais une place absente. */
      .rep-m.inconnu { color: var(--slate); border-style: dashed; cursor: help; }

      /* Le dé NU du mob : la face EST le total, il n'y a pas d'addition à montrer. */
      .dline .total.nu { font-size: 30px; letter-spacing: .04em; }

      /*
       * ═══ LA TUILE, AU HAUT DU CENTRE, AVEC SON ART ═════════════════════
       *
       * 90 fichiers étaient montés, nommés juste, et **personne ne les
       * demandait**. L'image est un BANDEAU au-dessus de la tuile, jamais un
       * fond derrière le texte : une table d'exploration se lit, elle ne se
       * devine pas sur une illustration.
       *
       * `onerror` retire l'image — la tuile se lit entièrement sans art, ce
       * qui est la condition pour que les assets restent en dernier (§14.4).
       */
      /*
       * ═══ LA TUILE — ENTIÈRE, ET RIEN NE PASSE AU-DESSUS ════════════════
       *
       * **L'art est en 800×1200, PORTRAIT.** Il était rogné en bannière
       * (`max-height: 190px; object-fit: cover`) : Croze en voyait **10 %**.
       * `object-fit: contain` + `aspect-ratio` préservent le ratio et montrent
       * la carte en entier — c'est la pièce maîtresse du centre.
       *
       * `max-height: 62vh` borne la hauteur pour que LES CHOIX, juste dessous,
       * restent atteignables sans défiler sur un écran court. La borne est en
       * unités de VUE, pas en pixels : elle suit l'écran au lieu de le supposer.
       */
      .zone-tuile { margin-bottom: 10px; }
      /*
       * ⚑ **RECENSÉ AVEC S12, ET BORNÉE AUSSI.** Quatre surfaces se
       * dimensionnaient sur la colonne — `.mc-img`, `.tuile-art`, `.tuile-dos`
       * (qui suit la précédente) et `.tv-art` (déjà bornée par sa grille
       * `minmax(180px, 1fr)`). Croze dit *« les tailles sont bien »* pour les
       * tuiles, **et `max-height: 62vh` les bornait déjà par la hauteur** :
       * la borne de largeur est donc posée LARGE, pour que rien ne change à sa
       * lecture actuelle et que le prochain élargissement de colonne ne les
       * emporte pas.
       */
      /*
       * ⚑ **S120 — `860` ÉTAIT AU-DESSUS DE LA SOURCE, ET C'EST MESURÉ.** Les
       * **90** arts de tuile font TOUS `800 × 1200` (relevé fichier par
       * fichier, une seule taille sur 90). Avec `object-fit: contain`, une
       * boîte de 860 px de large **étire le fichier de 7,5 %**.
       *
       * Le cas ne se voit qu'en HAUT écran : `max-height: 62vh` borne la
       * largeur à `62vh × 2/3`, soit 447 px sur un 1080 — le plafond de
       * largeur n'entre en jeu qu'au-dessus de ~1 740 px de hauteur de
       * fenêtre, c'est-à-dire précisément sur le 4K que la règle vise.
       *
       * **Le plafond est donc la largeur du fichier, pas un chiffre rond** —
       * même geste qu'au zoom de carte (`1516`), même raison : *on ne montre
       * pas plus de pixels qu'on n'en a.*
       */
      /*
       * ⛑ **S199 — −40 %, ET C'EST L'ORDRE DE CROZE** (note ⑨ ①) : *« la tile
       * est affichée trop grande, faut la réduire de 40 % environ »*.
       *
       * ⚠ **MESURÉ POSÉ, PAS EN COURS DE ROUTE.** Relevé à 1920×1080, la tuile
       * une fois l'art chargé : **446 × 670**. Un premier relevé, pris pendant
       * que l'image montait, rendait `225 × 338` — *un chiffre lu avant que la
       * boîte n'ait sa taille n'est pas un petit chiffre, c'est un autre
       * chiffre.* La cible est donc **402 px de haut**, pas 203.
       *
       * ⚠ **LES DEUX PLAFONDS BAISSENT ENSEMBLE, ET IL LE FAUT.** C'est
       * `max-height: 62vh` qui borne sur un 1080 (la largeur en découle par le
       * ratio) ; `max-width` ne mord qu'au-dessus de ~1 740 px de hauteur de
       * fenêtre — le 4K. N'en baisser qu'un rendrait la consigne vraie sur un
       * écran et fausse sur l'autre : `62 → 37,2vh` et `800 → 480px` sont le
       * MÊME −40 %.
       *
       * La raison du `800` d'origine survit dans le `480` : les 90 arts font
       * tous `800 × 1200`, et 480 reste **sous** la largeur du fichier — *on ne
       * montre pas plus de pixels qu'on n'en a.*
       */
      /*
       * ⛑ **S208 — LE −40 % A DÉBORDÉ, IL REDESCEND À −20 %.** Note ⑫ ②,
       * verbatim Croze : *« la tile du joueur actif ainsi que la carte mob ont
       * été trop réduites (c'est la même chose pour trap et chest). »*
       *
       * **UN SEUL FACTEUR POUR LES QUATRE SURFACES, et c'est l'argument du
       * S202 tenu une seconde fois** : *« une seconde grammaire de réduction
       * ferait deux tailles pour une seule consigne. »* La demande d'hier
       * valait −40 % ; celle d'aujourd'hui dit « trop ». On rend la MOITIÉ du
       * geste — `×1,333` — partout où il a porté, sans rouvrir la question du
       * combien : `62 × 0,8 = 49,6vh` et `800 × 0,8 = 640px`.
       *
       * Les deux bornes bougent ENSEMBLE, pour la raison du S199 : sur un 1080
       * c'est la hauteur qui mord, `max-width` ne mord qu'au-delà de ~1 740 px
       * de fenêtre. N'en remonter qu'une rendrait la consigne vraie sur un
       * écran et fausse sur l'autre. `640 < 800` = la largeur du fichier : la
       * raison du `800` d'origine survit encore.
       */
      .tuile-art { display: block; width: 100%; max-width: 640px;
                   aspect-ratio: 2 / 3; max-height: calc(var(--uvh) * 49.6);
                   object-fit: contain; object-position: center top;
                   border: 1px solid var(--rule); border-bottom: none;
                   background: var(--ink); }

      /*
       * ═══ LE « i » DE LA TUILE — ordre de Croze ═════════════════════════════
       *
       * *« la description sort de la colonne centrale, un i sur l'image la
       * porte. »* Le cadre porte le bouton ; l'image peut disparaître sous lui
       * (`onerror`, §14.5) sans emporter la commande.
       *
       * **Aucune teinte réservée.** Les quatre sont prises — orange braise le
       * Collapse, rouge tampon le refus, or la sortie, liseré or le gear. Un
       * bouton de consultation n'est aucune des quatre : il prend l'encre et le
       * papier, et il se distingue par sa FORME — un rond, seule pastille ronde
       * de tout l'écran.
       */
      /*
       * ═══ C · LE DOS DE CARTE — « une carte disparaît, une autre apparaît » ═
       *
       * **Le dos et la face ont le MÊME ratio, mesuré** : `lick_floor.webp` est
       * 721×1081 (0,6670), les arts de tuile 800×1200 (0,6667). Le dos se pose
       * donc exactement sur la face — `inset: 0` et le même `object-fit`.
       *
       * Il ENTRE vite et SORT lentement : la carte qu'on quitte se couvre d'un
       * geste, celle qu'on découvre se dévoile. Les deux moitiés ne durent pas
       * pareil parce qu'elles ne racontent pas la même chose.
       *
       * ⚠ **AUCUNE TEINTE RÉSERVÉE** — c'est un carton peint, pas un signal.
       */
      @keyframes dos-passe {
        0%   { opacity: 0; transform: translateY(-6px) scale(1.02); }
        22%  { opacity: 1; transform: none; }
        58%  { opacity: 1; transform: none; }
        100% { opacity: 0; transform: scale(1.01); }
      }
      .tuile-dos { position: absolute; inset: 0; width: 100%; height: 100%;
                   object-fit: contain; object-position: center top;
                   background: var(--ink); pointer-events: none;
                   animation: dos-passe .9s ease-in-out 1 forwards; }

      .tuile-visuel { position: relative; display: block; }
      /*
       * ⛑ S114 — `.tuile-i` et `.tuile-desc` sont MORTES avec le « i » des
       * tuiles (ordre de Croze). Leurs règles partent avec elles : *une règle
       * qui ne peint plus rien se relit comme une surface encore vivante.*
       */
      /* Une tuile sans art garde son CADRE : il ne s'effondre pas. */
      .tuile-visuel:not(:has(.tuile-art)) { min-height: 42px;
                 border: 1px solid var(--rule); border-bottom: none; }
      /*
       * ⛑ S114 — la loupe du carton. Même géométrie que l'ancien « i » (le
       * coin haut-droit du cadre est la place d'un outil de tuile), et
       * **aucune teinte réservée** : les quatre sont prises (`ECRANS §2`).
       */
      .tuile-loupe { position: absolute; top: 8px; right: 8px;
                 width: 26px; height: 26px; border-radius: 50%;
                 /* S1262 · H-T2 — le disque reste (lisible sur l'art), le cadre part. */
                 border: 0; background: var(--ink-2);
                 color: var(--stock); font: 700 13px/1 system-ui, sans-serif;
                 cursor: pointer; padding: 0; opacity: .85; }
      .tuile-loupe:hover { opacity: 1; }
      .tuile-plein-boite { display: flex; justify-content: center; }
      .tuile-plein { max-width: 100%; max-height: 88vh; height: auto;
                 image-rendering: auto; }

      /*
       * CE QUE LA CARTE FAIT DE LA FACE — posé À CÔTÉ du verdict du moteur,
       * jamais à sa place. Aucune teinte réservée : c'est du texte de carton.
       */
      .branche-prise { margin-left: 8px; font-size: 10px; color: var(--stock);
                       border-left: 2px solid var(--stock-dim); padding-left: 6px; }
      /*
       * ⛑ S188 — **CE QUE LA CARTE DEMANDAIT ET N'A PAS EU.** Même matière que
       * la prise : c'est la même phrase, dans l'autre sens. Elle est atténuée,
       * pas alarmée — un raté de branche est un fait de partie, pas un refus,
       * et `--stamp` est réservé aux refus. **Aucune teinte neuve** : les quatre
       * sont prises (`ECRANS §2`).
       */
      .branche-ratee { margin-left: 8px; font-size: 10px; color: var(--stock-dim);
                       border-left: 2px solid var(--rule); padding-left: 6px; }

      /*
       * ═══ E · LE SEUIL, ANNONCÉ AVANT QUE LA FACE NE TOMBE ════════════════
       *
       * Il est GROS et il est EN HAUT : c'est l'enjeu, pas un commentaire.
       * ⚠ **Aucune teinte réservée** — les quatre sont prises (`ECRANS §2`).
       * Il prend le carton, et se distingue par la GRAISSE et l'espacement.
       */
      .seuil-annonce { font-family: var(--display); font-weight: 800;
                       font-size: 22px; letter-spacing: .2em; color: var(--stock);
                       margin: 2px 0 10px; }

      /*
       * ═══ F · LES DEUX CAMPS D'UN JET OPPOSÉ, CÔTE À CÔTE ════════════════
       *
       * `MOMENT 3` : *« les deux dés côte à côte, le VS entre eux »*. La couche
       * les rendait à un seul camp — le fil les avait tous les deux depuis
       * toujours.
       */
      .vs-ligne { display: flex; align-items: center; justify-content: center;
                  gap: 10px; flex-wrap: wrap; margin: 6px 0; }
      .vs-nom { font-size: 11px; letter-spacing: .1em; color: var(--stock-dim);
                text-transform: uppercase; }

      /*
       * S2 · LA LIGNE DE TÊTE — ce qui survit au masquage. Une seule ligne,
       * et elle porte les deux faits qu'on ne peut pas se permettre de perdre.
       */

      /*
       * ═══ ⚑ S55 · LE RUBAN DES QUATRE TEMPS — L'ENTRÉE EN COMBAT ═══════════
       *
       * Il remplace `.rencontre-cause`, qui ne portait que le temps ⓪ et dont
       * la surface — le panneau de rencontre — est retirée sur ordre de Croze
       * (*« plus besoin du message le combat commence, appuyez sur OK »*).
       * **La règle CSS ne survit pas à sa surface** : la garder aurait laissé
       * une seconde grammaire de cadre en sommeil, prête à se réveiller sur le
       * premier bloc qui aurait repris le nom.
       *
       * Aucune teinte réservée : c'est un compte rendu de faits, pas un fait de
       * jeu. Le numéro du temps est en pastille pour que la SÉQUENCE se voie
       * sans être lue — *quatre lignes numérotées se comptent d'un regard, une
       * liste à puces se relit.*
       */
      .ruban-entree { border: 1px solid var(--rule); background: var(--ink-2);
                      padding: 6px 10px; margin-bottom: 8px;
                      display: flex; flex-direction: column; gap: 3px; }
      .ruban-entree .temps { display: flex; align-items: baseline; gap: 8px; }
      .temps-n { flex: 0 0 auto; min-width: 18px; text-align: center;
                 border: 1px solid var(--rule); padding: 0 4px;
                 font-size: 11px; opacity: .8; }
      .temps-txt { flex: 1 1 auto; min-width: 0; }
      /* Un temps dont le fait n'est pas tombé se dit, en gris : il ne s'invente
         pas, et il ne disparaît pas non plus — la place reste comptée. */
      .ruban-entree .temps.rien .temps-txt { opacity: .55; font-style: italic; }

      /*
       * ═══ ⚑ §10 · LA FERMETURE — note ㉚ ② ═════════════════════════════════
       *
       * *« LA FIN DE PARTIE EST LA PLUS GRANDE SCÈNE DU JEU […] c'est le climax,
       * pas un écran d'admin. »* Les temps tombent l'un après l'autre et
       * RESTENT : la scène s'écrit vers le bas, elle ne se remplace pas — on
       * doit pouvoir relire d'où le vainqueur sort.
       *
       * ⚠ **AUCUNE TEINTE RÉSERVÉE N'EST PRISE.** L'ember est au Collapse et le
       * vert jouable à ce qui est jouable ; la fin de partie n'est ni l'un ni
       * l'autre. Ce qui la distingue est la TAILLE et le cadre, pas la couleur
       * — et `--stamp` est déjà la teinte des PV et des pertes dans cet écran,
       * donc pas une encre neuve.
       *
       * ⚠ **`transform` / `opacity` SEULS** (référence gravée) : le temps qui
       * paraît monte de 6 px et s'allume, rien d'autre ne bouge. Aucune
       * hauteur animée — un `height` qui s'anime repousse tout ce qui suit.
       */
      .fin-scene { display: flex; flex-direction: column; gap: 4px; }
      .fin-temps { display: flex; align-items: baseline; gap: 10px;
                   border-left: 2px solid var(--rule); padding: 2px 0 2px 10px;
                   animation: fin-parait 260ms ease-out both; }
      .fin-titre { flex: 0 0 auto; min-width: 190px; font-size: 11px;
                   letter-spacing: .06em; opacity: .75; }
      .fin-txt   { flex: 1 1 auto; min-width: 0; }
      .fin-temps.grand { border-left-color: var(--stamp); padding: 6px 0 6px 10px; }
      /*
       * ⛑⛑ **S568 — LES TROIS GRANDS TITRES DE FIN DE RUN ÉTAIENT À `1,88`.**
       * `?seed=11&jalon=GAME_END` : `LE RUN EST FINI`, `LE DUEL FINAL`,
       * `VAINQUEUR` — `--stamp` à 13 px sur `[21,21,21]`, seuil `4,5`.
       * `--alert` : **4,99**. Exactement le couple du S556 (`.fr-pts-perte`),
       * et la même frontière : **le LISÉRÉ de `.fin-temps.grand` reste en
       * `--stamp`** — c'est un APLAT, et la maison lui garde cette teinte.
       *
       * ⚠⚠ **ET SI ELLE A MIS DOUZE PALIERS À SE VOIR, C'EST L'INSTRUMENT, PAS
       * L'ÉTAT.** `.fin-temps` porte `animation: fin-parait … BOTH` : volet
       * Navigateur masqué, l'horloge du compositeur ne tourne pas, le nœud
       * reste figé sur son image de DÉPART (`opacity: 0`), et `encres_stamp`
       * le rangeait dans *« JAMAIS RENDUE »* — c'est-à-dire *« état rare, va
       * chercher ailleurs »*. Il était là, sept fois, sur l'écran même.
       */
      .fin-temps.grand .fin-titre { font-size: 13px; opacity: 1; color: var(--alert); }
      .fin-temps.grand .fin-txt { font-size: 20px; }
      @keyframes fin-parait {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: none; }
      }
      /* Le mouvement se coupe avec le réglage système, la phrase reste. */
      @media (prefers-reduced-motion: reduce) {
        .fin-temps { animation: none; }
      }

      /*
       * ═══ LE REGISTRE DES GESTES — « ce que j'ai envoyé » ══════════════════
       *
       * Une ligne par geste, la plus récente en haut. Elle se lit en une
       * saccade : le rang, le verdict, le siège, la phrase du moteur, et ce
       * que le geste a fait naître.
       *
       * ⚠ **LE ROUGE TAMPON EST ICI À SA PLACE** — c'est la teinte réservée du
       * refus (`ECRANS §2`), et un `REFUSÉ` EST un refus. Rien d'autre dans ce
       * panneau ne l'emprunte.
       */
      .registre { font: 11px/1.5 var(--mono, monospace); max-height: 40vh;
                  overflow-y: auto; border: 1px solid var(--rule);
                  background: var(--ink-2); padding: 4px 6px; }
      .geste { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap;
               padding: 2px 0; border-bottom: 1px solid var(--ink-3); }
      .geste-n { color: var(--stock-dim); min-width: 34px; }
      .geste-v { font-weight: 800; letter-spacing: .08em; min-width: 52px; }
      .v-ok { color: var(--stock-dim); }
      .v-no { color: var(--stamp); }
      .geste-no { background: rgba(163, 44, 37, .10); }
      .geste-siege { font-weight: 700; }
      .geste-txt { color: var(--stock-2); }
      .geste-faits { color: var(--stock-dim); opacity: .8; }
      /* Un geste qui ne produit RIEN est le symptôme même de Croze : il se voit. */
      .geste-rien { color: var(--ember); }

      /*
       * ═══ LA TABLE — les autres sièges, à 1/3, dans l'ordre de tour ═══════
       *
       * *« afficher à échelle 1/3 les tuiles des autres, PAR ORDRE DE TOUR,
       * mais toujours le joueur actif au centre, en grand. »*
       *
       * **Le 1/3 est une vraie fraction, pas une approximation** : la tuile du
       * centre tient `2/3` de la colonne élargie, une vignette en tient le
       * tiers. `repeat(auto-fit, …)` les range côte à côte et retombe en
       * plusieurs lignes à cinq sièges — la table monte à SIX (`§3bis.13`).
       *
       * ⚠ **AUCUNE TEINTE RÉSERVÉE POUR DIRE L'ACTIF.** Les quatre sont prises.
       * Il se dit par la BORDURE et le POIDS, comme le siège actif du ruban —
       * une lecture apprise une fois sert aux deux.
       */
      /*
       * ═══ ⚑ S13 · LES AUTRES À CÔTÉ DE LA MIENNE, PAS EN DESSOUS ══════════
       *
       * Croze : *« j'ai ma tuile c'est parfait et aussi celle des adversaires,
       * mais j'aimerais qu'elles soient à côté de la mienne, pas en dessous.
       * LES TAILLES SONT BIEN. »*
       *
       * **On ne touche donc à AUCUNE taille — seulement au FLUX.** La zone
       * passe en rangée : ma tuile en tête, les autres à sa suite. C'est
       * `§2.1` rendu littéral — *le donjon vu depuis mon siège*, et l'ordre du
       * regard va de moi vers les autres.
       *
       * ⚠ **LA RANGÉE DOIT TENIR SIX TUILES, PAS QUATRE.** La table monte à six
       * (`§3bis.13`), et sa capture est à quatre. Les vignettes gardent leur
       * largeur (`minmax` inchangé, 180px de plancher) et la rangée DÉFILE
       * horizontalement plutôt que de les écraser : *une vignette rétrécie
       * jusqu'à l'illisible ne montre plus rien, et c'était la moitié du
       * problème qu'on vient de corriger sur la carte de mob.*
       */
      .zone-tuile { display: flex; align-items: flex-start; gap: 10px;
                    overflow-x: auto; margin-bottom: 10px; }
      /* Ma tuile est un BLOC : l'art et son pavé s'empilent ENTRE EUX. */
      .ma-tuile { flex: 0 1 auto; min-width: 0; }
      .table-autres { display: flex; gap: 8px; margin-top: 0;
                      flex: 0 0 auto; align-items: flex-start; }
      .table-autres > .tv { flex: 0 0 180px; }
      /*
       * ═══ ⛑ S169 · UN BLOC PAR JOUEUR — INFO ET TUILE ENSEMBLE ═════════════
       *
       * Spec Croze : *« là y a 3 blocs d'info puis 3 tiles pas disposés dans le
       * même sens, c'est confus. 1 bloc pour les 2, info + tile. »* Relevé
       * avant, à 1920×1080 : les infos formaient trois pavés COUCHÉS de
       * 1 058 px empilés à `y = 177 · 356 · 508`, et les tuiles trois cartes
       * DEBOUT de 180 px à `y = 624`. Deux listes, deux sens, trois mêmes
       * joueurs.
       *
       * ⚑ **LE BLOC EST L'UNITÉ, ET IL SE PARTAGE LA RANGÉE.** `1fr` chacun
       * plutôt que 180 px gravés : la tuile grandit de ce que la rangée lui
       * donne, et **les trois blocs gardent la même largeur quoi qu'ils
       * portent** — un bloc dont le log est plus long ne pousse pas ses
       * voisins. `min-width: 0` est ce qui l'y oblige : sans lui, un contenu
       * insécable (un nom de tuile, une ligne de fil) impose son intrinsèque et
       * la rangée déborde.
       */
      .table-autres > .autre-bloc { flex: 1 1 0; min-width: 0; max-width: 360px;
                      display: flex; flex-direction: column; gap: 6px; }
      .autre-bloc > .tv { flex: 0 0 auto; width: 100%; }
      .autre-infos { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
      /*
       * ⚠ **ET L'ART SE BORNE, SINON LE REGROUPEMENT REFAIT LE DÉFAUT DU S78.**
       * Le bloc étant devenu large (437 px mesurés contre 180 avant), un
       * `.tv-art { width: 100% }` a rendu **435 × 652** — trois fois, soit
       * 1 956 px d'illustration dans une fenêtre de 1 080. C'est mot pour mot
       * la faute que S78 a payée (*« le coupable est un seul nombre : `.tv-art`
       * mesurait 481 px des 593 de la carte, trois fois »*), refaite par
       * l'autre bout : *élargir un contenant élargit tout ce qui dit `100 %`.*
       *
       * On borne la LARGEUR, jamais la hauteur : `aspect-ratio` fait le reste,
       * donc **l'art rétrécit sans se recadrer** — la décision de S78, intacte.
       * `20vh` de large vaut `30vh` de haut sur ce ratio : trois tuiles tiennent
       * dans la page, et chacune reste plus grande qu'avant (216 px contre 180).
       * *Rien n'est enfermé en 1920* — c'est une part de fenêtre, pas un nombre.
       */
      /*
       * ⚠ **⛑ S189 — LE SÉLECTEUR SUIT LE BLOC, SINON LA BORNE TOMBE AVEC LUI.**
       * Il disait `.zone-tuile .autre-bloc .tv-art` : le jour où `LES AUTRES`
       * quitte la rangée de la tuile (note ⑥ ② de Croze), la borne cesse de
       * s'appliquer **sans un mot**, et `.tv-art { width: 100% }` refait la
       * faute de S78 — 435 × 652 d'illustration, trois fois. *Une règle nommée
       * d'après le PARENT d'un bloc est une règle qui meurt au premier
       * re-parentage, et celui-ci était annoncé dans le commentaire d'à côté.*
       *
       * Elle est donc nommée d'après le BLOC : `.les-autres`, où qu'il vive.
       * `.col-droite` garde ses règles propres, plus spécifiques, et la forme
       * couchée du moment n'est pas touchée.
       */
      .les-autres .autre-bloc .tv-art { width: min(100%, calc(var(--uvh) * 20)); }
      /*
       * ⛑ S189 — **LA CONSULTATION PREND LA PLACE, ET ELLE PREND LA LARGEUR.**
       * `.les-choix` était en flux, pleine largeur du centre ; dans la rangée
       * elle est un enfant flex, et sans `flex: 1 1 0` elle se réduirait à son
       * intrinsèque — un bloc de réponse qui rétrécit selon ce qu'il porte se
       * cherche à chaque rendu. `min-width: 0` l'oblige à céder plutôt qu'à
       * pousser la rangée : c'est la même garde que `.autre-bloc`.
       */
      .zone-tuile > .les-choix { flex: 1 1 0; min-width: 0; align-self: stretch; }
      /*
       * ⚑ **S46 — DANS LA COLONNE DROITE, ELLE S'EMPILE.** Trois vignettes de
       * 180 px ne tiennent pas côte à côte dans une piste de 260 px : la rangée
       * devient une colonne, et chaque vignette prend la largeur disponible.
       * *La relation demandée par Croze est verticale — le bandeau reste SOUS
       * sa tuile — et c'est elle qui doit survivre, pas l'axe de la rangée.*
       */
      .col-droite .table-autres { flex-direction: column; }
      /* S169 — la vignette n'est plus toujours un enfant DIRECT de la rangee :
         elle vit dans son .autre-bloc. Le combinateur descendant couvre les
         deux formes ; sans lui, la colonne de moment perdait toutes ses
         regles de compactage d'un coup, en silence. */
      .col-droite .table-autres > .autre-bloc { flex: 0 0 auto; width: 100%; }
      .col-droite .table-autres .tv { flex: 0 0 auto; width: 100%; }
      /*
       * ⚠ **À UNE COLONNE, ELLE REDEVIENT UNE RANGÉE — et cet override est ICI,
       * pas dans le bloc des colonnes.** Écrit là-bas d'abord, il perdait la
       * cascade : même spécificité, et la règle de base est 1 200 lignes plus
       * bas. Mesuré à 1100 px : `flex-direction` rendait toujours `column`, et
       * **1057 px pour une carte de tuile**. *Une règle responsive qui ne gagne
       * pas la cascade se lit comme une règle appliquée.*
       */
      @media (max-width: 1199px) {
:where(html[data-verrou="non"]) .col-droite .table-autres { flex-direction: row; }
:where(html[data-verrou="non"]) .col-droite .table-autres > .autre-bloc { width: auto; flex: 1 1 0; }
:where(html[data-verrou="non"]) .col-droite .table-autres .tv { width: auto; flex: 0 0 180px; }
      }
      /*
       * ═══ ⚑ S78 · DANS LA COLONNE DE MOMENT, LA TUILE SE COUCHE ═══════════
       *
       * Spec Croze (`LOT #7 ①`), verbatim : *« pendant un combat, la colonne de
       * moment GARDE les infos joueurs en version réduite/minimisée — fais en
       * sorte de réduire les tailles, les minimiser. »*
       *
       * ⚠ **CE N'ÉTAIT PAS UNE PRÉFÉRENCE, C'ÉTAIT UNE PROMESSE CASSÉE, ET
       * ELLE SE MESURE.** Relevé à 1920×1080, un combat ouvert : la colonne
       * faisait **2 533 px de haut** dans une fenêtre de 1 080, et les tuiles
       * des adversaires commençaient à `y = 869`, `1 470`, `2 070`. **Deux des
       * trois adversaires étaient entièrement sous le pli** — c'est-à-dire que
       * S18 (*« en combat il faut qu'on ait toujours accès à la colonne où l'on
       * voit les joueurs et leurs PV »*) n'était pas tenue au moment précis
       * qu'elle nomme. Le coupable est un seul nombre : **`.tv-art` mesurait
       * 481 px** des 593 de la carte, trois fois.
       *
       * ⚠ **ET ÇA NE TOUCHE PAS LES PLANCHES 8-9, PARCE QU'ELLES ONT UN AUTRE
       * PARENT.** Le bandeau sous-tuile qui les rend est le même bloc, mais
       * **hors moment il vit au CENTRE** ; la colonne n'est son parent que
       * pendant un moment. Compacter `.col-droite .tv` ne peut donc pas
       * dégrader ce qui est VU — la vue spectateur n'y passe jamais.
       *
       * La tuile se COUCHE : l'art à gauche en 58 px, ses trois pavés à droite.
       * *L'art reste ENTIER, ratio préservé (`aspect-ratio` intact) — il
       * rétrécit, il ne se recadre pas*, et c'est la décision de la rangée du
       * centre qui continue de valoir ici.
       */
      .col-droite .table-autres .tv {
        display: grid; grid-template-columns: 58px minmax(0, 1fr);
        grid-template-areas: "art bandeau" "art pied" "art jet" "art bascule" "art reste";
        align-content: start; }
      /*
       * Tout enfant NON nommé tombe dans la dernière rangée plutôt que de
       * s'auto-placer dans la colonne de l'art, qu'il écraserait. Les règles
       * qui suivent sont plus spécifiques et le reprennent chacune.
       *
       * ⛑⛑ **S901 — ET `.tv-bascule` N'Y ÉTAIT PAS : NÉE AU S892, APRÈS QUE
       * CETTE PHRASE A ÉTÉ ÉCRITE.**
       *
       * Elle tombait donc dans `reste`, **la même cellule que `.autre-infos`**,
       * et l'autre, plus loin dans le DOM, peignait par-dessus. Mesuré sur
       * `?seed=5&fait=COMBAT_OPENED`, viewport 1920×1080 :
       *
       * ```
       * BUTTON.tv-bascule   (1628, 157) 248x331   <- toute la cellule `reste`
       * DIV.autre-infos     (1627, 156) 248x333   <- la MEME, et elle gagne
       * son libelle « ▾ REPLIER » a (1633, 316) : elementFromPoint rend `fiche`
       * grid-template-rows lu : 27px 20.5px 62px 332.8px  (QUATRE rangees)
       * ```
       *
       * ⚑ **ET LA MÊME ADRESSE QUE LE S892 RESTE JUSTE** — `?seed=3&fait=
       * TURN_BEGAN` : la bascule y fait `358x16` et son libellé rend `LE
       * BOUTON`, sur les TROIS colonnes. *Le défaut n'était pas dans la
       * bascule : il était dans la MISE EN PAGE de l'autre vue*, celle du
       * combat, et une adresse ne le voit pas pour l'autre.
       *
       * ⚠ **C'est la faute que ce fichier NOMME trois lignes plus haut** : le
       * catch-all existe précisément pour les enfants non nommés, et il n'est
       * juste que tant que la liste des nommés suit. *Une leçon écrite pour une
       * famille ne s'applique pas d'elle-même aux membres nés ensuite.*
       */
      .col-droite .tv > *           { grid-area: reste; }
      .col-droite .tv > .tv-bascule { grid-area: bascule; }
      .col-droite .tv > .tv-bandeau { grid-area: bandeau; min-height: 22px; }
      .col-droite .tv > .tv-art     { grid-area: art; align-self: start; }
      .col-droite .tv > .tv-vide    { grid-area: art; min-height: 0; padding: 6px 3px; }
      .col-droite .tv > .tv-pied    { grid-area: pied; }
      .col-droite .tv > .tv-jet     { grid-area: jet; }
      /*
       * ⛑ S152 — **LA SCÈNE PREND LA PLACE DE L'ART**, littéralement : même
       * `grid-area`. Le bloc ne change pas de forme quand le siège agit — il
       * change de CONTENU. *Un bloc qui se redimensionne à chaque geste fait
       * sauter les deux autres, et c'est le « c'est confus » qu'on répare.*
       */
      .col-droite .tv > .tv-scene   { grid-area: art; align-self: start; }
      /*
       * Le pavé de dés et le pli suivent : ce sont les deux autres postes de la
       * hauteur. On réduit ce qui se RÉPÈTE (l'intitulé du log, sur trois
       * sièges), jamais ce qui porte un fait.
       */
      .col-droite .siege-des { margin-bottom: 5px; padding: 3px 0 3px 7px; gap: 2px; }
      .col-droite .siege-fil { max-height: 46px; }
      .col-droite .pli-tete  { padding: 3px 9px; gap: 8px; }
      /*
       * L'intitulé du log passait à la ligne — 41 px de titre pour 27 px de
       * contenu, **trois fois**. Il tient sur une ligne ici. *Ce qu'on
       * compacte est ce qui se répète ; le fait, lui, garde sa taille.*
       */
      .col-droite .siege-lbl { font-size: 8px; letter-spacing: .1em; }
      /*
       * ⚑ **ET LA COMPACTION SEULE NE SUFFISAIT PAS — mesuré, pas supposé.**
       * Couchée, la colonne tombe de 2 533 px à 983 dans une fenêtre de 1 080 :
       * il RESTAIT 33 px sous le pli, et surtout **le compte d'adversaires
       * n'est pas fixe** — la table monte à 6 sièges, soit cinq adversaires.
       * Grignoter trente pixels aurait tenu pour trois et cassé pour cinq.
       *
       * La colonne devient donc **solidaire de la fenêtre, pas de la page** :
       * elle colle en haut, elle est bornée à la hauteur visible, et c'est
       * ELLE qui défile quand il y a trop de monde. *S18 demande qu'on ait
       * TOUJOURS accès aux joueurs et à leurs PV : une colonne qui sort par le
       * bas de la page ne le donne à aucun compte de sièges, une colonne qui
       * défile chez elle le donne à tous.*
       */
      .col-droite { align-self: start; position: sticky; top: 8px;
                    max-height: calc(calc(var(--uvh) * 100) - var(--haut-des-bandeaux)); overflow-y: auto;
                    overscroll-behavior: contain; }
      /*
       * ⚑ **S90 — SOUS 1400 px, LA COLLE FAIT SE CHEVAUCHER LES DEUX COLONNES,
       * ET LE DÉFAUT EST PLUS VIEUX QUE LE PALIER QUI LE TROUVE.**
       *
       * À cette largeur, gauche et droite partagent la MÊME piste (colonne 2),
       * l'une sous l'autre. `.col-droite` s'y punaise à `top: 8px` depuis le
       * palier 56 — **et la colonne gauche lui passe dessous.**
       *
       * ```
       * 1366×768, etat-Z, chevauchement mesuré
       * scrollY  400   226 px
       * scrollY  900   726 px
       * scrollY 1400   752 px — rectangles identiques
       *
       * TÉMOIN — la colle de la DROITE retirée, tout le reste inchangé :
       * scrollY  900     0 px
       * ```
       *
       * *Le témoin nomme le coupable : ce n'est pas la borne, c'est la colle.*
       * Elle part donc pour LES DEUX à cette largeur — *deux blocs collants
       * dans une même piste sont deux blocs qui se marchent dessus, et un seul
       * l'était déjà de trop.* **Les BORNES et le défilement interne restent** :
       * ce sont eux qui divisent la hauteur de page, pas la colle.
       *
       * ⚠ **ET CE BLOC EST ICI, PAS DANS LE `@media` DU HAUT — payé sur
       * l'instant.** Posé là-bas, `position: static` perdait la cascade contre
       * la règle de base (même spécificité, écrite plus bas), et **le
       * chevauchement mesuré ne bougeait pas d'un pixel après le correctif**.
       * *C'est la troisième fois dans ce fichier qu'une règle responsive qui ne
       * gagne pas la cascade se lit comme une règle appliquée* — les deux
       * premières sont écrites vingt lignes sous `.colonnes.sans-droite`.
       */
      @media (max-width: 1399px) {
        :where(html[data-verrou="non"]) .col-droite,
        :where(html[data-verrou="non"]) .col-gauche { position: static; }
      }
      @media (max-width: 1199px) {
        /* À une colonne, tout est empilé : coller la rendrait collante par
           rapport à elle-même et bornerait un bloc qui n'a plus de voisin. */
:where(html[data-verrou="non"]) .col-droite { position: static; max-height: none; overflow-y: visible; }
      }
      .tv { border: 1px solid var(--rule); background: var(--ink-2);
            display: flex; flex-direction: column; opacity: .85; }
      .tv.actif { opacity: 1; border-color: var(--stock); border-width: 2px; }
      .tv.moi { border-style: dashed; }
      .tv-bandeau { display: flex; align-items: center; gap: 5px; padding: 3px 5px;
                    border-bottom: 1px solid var(--rule); background: var(--ink-3);
                    min-height: 26px; }
      .tv-ico { width: 20px; height: 20px; object-fit: cover; border: 1px solid var(--rule); }
      /*
       * ⛑⛑ S892 — LA BASCULE DE COLONNE (note écran 118 ②). Elle est sur sa
       * propre ligne, sous le bandeau, parce que le bandeau est RECOUVERT par
       * son pop-out de fiche dès qu'on le survole (`poseLeVoletAuGeste` place
       * le volet sur les coordonnées de l'ancre) : un bouton posé dedans ne
       * serait pas atteignable au moment où on le regarde. **Aucun `:hover`
       * n'ouvre ni ne ferme quoi que ce soit ici — c'est la règle du clic.**
       */
      .tv-bascule { width: 100%; border: 0; border-bottom: 1px solid var(--rule);
                    background: var(--ink-3); color: var(--slate);
                    font-family: var(--display); font-weight: 700; font-size: 8px;
                    letter-spacing: .14em; padding: 2px 5px; text-align: left;
                    cursor: pointer; }
      .tv-bascule:hover { color: var(--stock); }
      .tv-replie { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px;
                   padding: 4px 5px; font-size: 9px; }
      .tvr-pv   { font-variant-numeric: tabular-nums; font-weight: 700;
                  color: var(--stock); }
      .tvr-main { font-variant-numeric: tabular-nums; letter-spacing: .08em;
                  color: var(--slate); }
      /* ⛑ S1206 · P2-T1 — les quatre stats du replié. Même encre atténuée que
         `MAIN · n`, mêmes chiffres tabulaires : c'est une LECTURE, pas un
         signal de jeu, et elle ne doit pas tirer l'œil avant les PV. */
      .tvr-stats { font-variant-numeric: tabular-nums; letter-spacing: .06em;
                   color: var(--slate); white-space: nowrap; }
      .tvr-lieu { color: var(--slate); font-style: italic;
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                  max-width: 100%; }
      .tv-nom { font-family: var(--display); font-weight: 800; font-size: 10px;
                letter-spacing: .08em; }
      /* ⛑ S291 — même raison qu'à `.creneau-nom` : 8 px, `4,25` → `4,55`. */
      .tv-perso { font-size: 8px; color: var(--slate); letter-spacing: .06em; }
      .tv-joue { font-size: 8px; font-weight: 800; letter-spacing: .12em;
                 color: var(--stock); border: 1px solid var(--stock-dim);
                 padding: 0 3px; margin-left: auto; }
      .tv.actif .tv-nom { font-size: 11px; }
      /* L'image manquante se NOMME — jamais un blanc (§14.5). */
      .tv-manque { font-size: 8px; color: var(--stock-dim); font-style: italic; }
      .tv-art { display: block; width: 100%; aspect-ratio: 2 / 3;
                object-fit: contain; object-position: center top; background: var(--ink); }
      .tv-vide { padding: 14px 8px; text-align: center; min-height: 90px;
                 display: flex; align-items: center; justify-content: center; }
      .tv-pied { display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
                 padding: 3px 5px; border-top: 1px solid var(--rule); }
      .tv-tuile-nom { font-size: 9px; color: var(--stock-2); }
      .tv-occ { font-size: 8px; color: var(--stock-dim); border: 1px solid var(--rule);
                padding: 0 3px; }

      /*
       * ⚑ **S45 · PLANCHES 8-9 — LE JET, SOUS LA TUILE DU SIÈGE.**
       *
       * Spec Croze : *« les infos s'affichent SOUS SA TILE »*. Le bandeau est
       * donc DANS la vignette, sous le pied, jamais à côté.
       *
       * ⚠ **AUCUNE TEINTE RÉSERVÉE.** Ember est au Collapse, tampon au refus,
       * or à la sortie — un bandeau de consultation n'en prend aucune. Le seul
       * accent est la couleur du SIÈGE, portée par le dé (`--teinte-siege`),
       * et elle IDENTIFIE, elle ne dit aucun état (`§2`).
       *
       * ⚠ **`min-height` PLUTÔT QU'UNE HAUTEUR FIXE.** Les vignettes sont en
       * `align-items: flex-start` : une ligne de plus sous l'une ne doit pas
       * déplacer les autres d'un pixel. La réserve tient la case vide — *une
       * rangée qui saute à chaque jet se lit comme un rechargement.*
       */
      .tv-jet { border-top: 1px solid var(--rule); padding: 4px 5px 5px;
                display: flex; flex-direction: column; gap: 2px; min-height: 62px; }
      .tv-jet-tete { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
      .tv-jet-quoi { font-family: var(--display); font-weight: 700; font-size: 11px;
                     letter-spacing: .06em; color: var(--stock-2); }
      .tv-jet-ligne { display: flex; align-items: baseline; gap: 5px; }
      .tv-jet-lbl { flex: 0 0 54px; font-size: 8px; letter-spacing: .16em;
                    color: var(--stock-dim); }
      .tv-jet-val { font-size: 10px; color: var(--stock-2); min-width: 0;
                    overflow-wrap: anywhere; }
      .tv-jet .rien { font-size: 9px; }
      /*
       * ⛑ S297 — **LA DATE DU DÉ, note ㉕.** Le bandeau ne montre que le
       * DERNIER jet du siège ; sans date, un dé du tour 9 se lit comme celui
       * de l'interaction qu'on vient de faire au tour 10. La ligne passe donc
       * en tête et le libellé du tour s'atténue quand le jet n'est pas de ce
       * tour-ci.
       *
       * ⚠ **ET LA DIFFÉRENCE EST UN MOT, PAS UNE COULEUR.** Un premier jet
       * peignait le libellé en `--stamp` : c'est l'encre du REFUS (§2), et un
       * jet d'un tour passé n'est pas un refus. La phrase — « PAS DE CE
       * TOUR-CI » — porte l'information seule ; *le gris n'emprunte rien.*
       */
      .tv-jet-date { margin-bottom: 2px; }

      /*
       * ═══ LA FEUILLE D'ÉQUIPEMENT — LES CRÉNEAUX PORTÉS, ET RIEN D'AUTRE ═
       *
       * Plus de grille 3×3 en dur : elle était fausse pour quatre des dix-huit
       * personnages. On aligne ce qui PORTE quelque chose ; les créneaux libres
       * ne sont pas dessinables tant que le moteur ne publie pas ceux de ce
       * personnage-ci, et la note le dit.
       */
      /*
       * ═══ UNE SEULE PRÉSENTATION, TOUJOURS LA MÊME — LA GRILLE 3×3 ════════
       *
       * Croze, sur ses captures : un personnage à 9 créneaux rendait une grille
       * 3×3, le Tamarin **trois cases empilées en colonne**. Les deux étaient
       * justes au fond et différentes à l'œil — *« j'aimerais qu'on ait toujours
       * la même présentation »*.
       *
       * La cause était `flex-wrap` + `flex: 1 1 130px` : le nombre de colonnes
       * SUIVAIT le nombre de cases. **`grid` à trois colonnes fixes** le rend
       * indépendant : les huit familles occupent toujours les mêmes places, et
       * une fiche à trois créneaux se lit au même endroit qu'une fiche à neuf.
       *
       * ⚠ **Les familles refusées restent NOMMÉES ET BARRÉES à leur place** —
       * elles ne sont pas retirées de la grille. *Une place absente se lit
       * comme « ce personnage n'a pas cette famille » ; une place barrée dit la
       * vérité.* C'est la règle du créneau refusé, appliquée à la mise en page.
       */
      /*
       * ⛑⛑ **S1100 — `1fr` NE MAIGRIT PAS, ET LA PROSE D'À CÔTÉ PROMETTAIT
       * QU'IL LE FASSE.** Le commentaire sous cette ligne dit, mot pour mot :
       * *« Les cases maigrissent, la disposition ne bouge pas »*. `1fr` est un
       * `minmax(AUTO, 1fr)` : la piste refuse de descendre sous le `min-content`
       * de son contenu, donc la grille pousse sa carte et le rail DÉBORDE À
       * L'HORIZONTALE (631 pour 594, mesuré). *Une intention écrite dans le
       * commentaire n'est pas une déclaration.*
       * ⚑ Le remède est DÉJÀ appliqué à sa sœur trois lignes plus haut —
       * `.adv-inv .corps { grid-template-columns: repeat(2, minmax(0, 1fr)) }` :
       * une leçon appliquée à une seule des surfaces qui la partagent n'est pas
       * apprise (S977).
       */
      .corps-libre { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
                     gap: 6px; padding: 6px 0; }
      /*
       * ⚑ **TROIS COLONNES, TOUJOURS — LA POSITION PORTE LE SENS.** Cette
       * grille était repliée à 2 colonnes sous 900 px. Depuis la spec 3×3 de
       * Croze, `WEAPON` est en haut à gauche et les DEUX bagues tiennent la
       * colonne de gauche : un repli à 2 colonnes ne rétrécit pas la grille, il
       * la DÉMENT. Les cases maigrissent, la disposition ne bouge pas.
       */
      .creneau-note { padding: 5px 0 2px; display: flex; flex-direction: column; gap: 3px; }
      .creneau-note .rien { font-size: 10px; color: var(--slate); font-style: italic; }

      /*
       * ═══ LA FICHE IMPRIMÉE — DU CARTON, ET DES ONGLETS ═════════════════
       *
       * Ni orange braise, ni rouge, ni or `--portail` : la fiche n'est ni une
       * menace, ni un refus, ni une sortie. L'onglet actif se distingue par la
       * GRAISSE et un liseré, comme le siège actif de la bande de timer.
       */
      /*
       * ═══ LA FICHE SANS ONGLETS — LA COUPURE EST NETTE ══════════════════
       *
       * Croze : *« juste le nom encadré, et au survol ça affiche ce que ça
       * fait »*. Et la règle fermée dit : *« un refus se lit SANS passer la
       * souris »*. **Les deux tiennent ensemble une fois qu'on sépare décrire
       * de refuser** :
       *
       *   · l'EFFET (le texte imprimé) → replié, il se déplie au survol ;
       *   · le REFUS et sa raison (`.motif-lu`) → **permanents** ;
       *   · le NOM encadré → toujours lisible.
       *
       * On replie ce qui informe, jamais ce qui interdit.
       */
      .fi-fam { font-size: 8px; letter-spacing: .22em; text-transform: uppercase;
                color: var(--slate); border-bottom: 1px solid var(--rule);
                padding: 6px 0 2px; margin-top: 4px; }
      .fi-ligne { border-left: 2px solid var(--gold); padding: 3px 0 4px 7px; }
      .fi-tete { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
      /* L'EFFET est replié — et le clavier le déplie aussi, pas seulement la souris. */
      .fi-ligne .fi-tx { display: none; }
      .fi-ligne:hover .fi-tx, .fi-ligne:focus-within .fi-tx { display: block; }
      .fi-ligne.barree { border-left-color: var(--rule); }
      .fi-ligne.barree .fi-nom { text-decoration: line-through; color: var(--slate); }
      .fiche-corps { border: 1px solid var(--rule); margin: 0 6px 6px; padding: 6px;
                     background: var(--ink); display: flex; flex-direction: column; gap: 6px; }
      .fi-sig { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px;
                border-left: 2px solid var(--gold); padding: 3px 0 4px 7px; }
      .fi-nom { font-family: var(--display); font-weight: 800; font-size: 13px;
                text-transform: uppercase; letter-spacing: .04em; }
      .fi-tag { font-size: 8px; letter-spacing: .14em; text-transform: uppercase;
                color: var(--stock-dim); border: 1px solid var(--rule); padding: 0 4px; }
      /* Le verbatim imprimé, EN ENTIER — jamais tronqué : c'est ce qu'on lit. */
      .fi-tx { flex-basis: 100%; font-size: 11px; line-height: 1.45; color: var(--stock-2); }
      .fi-etat { font-size: 9px; letter-spacing: .16em; text-transform: uppercase;
                 color: var(--stock-dim); }
      /* Le barré de l'inerte, distinct du gris du passif : DEUX états. */
      .fi-sig.barree { border-left-color: var(--rule); }
      .fi-sig.barree .fi-nom { text-decoration: line-through; color: var(--slate); }
      /* Dans la fiche, le passif garde SA matière : gris, pointillés, pas de liseré or. */
      .fiche-corps .passif { margin: 0; }
      .fiche-corps .passif .fi-nom { flex-basis: 100%; color: var(--stock-2); }

      /* Un verbe qui ne peut pas partir reste VISIBLE et BARRÉ, avec sa raison. */
      button.inerte { text-decoration: line-through; opacity: .6; }

      /*
       * ═══ LA FENÊTRE DE COMBAT ══════════════════════════════════════════
       *
       * ⚑ **S18 — ELLE NE PREND PLUS QUE LA COLONNE 2.** Croze : *« en combat
       * il faut qu'on ait toujours accès à la colonne de droite où l'on voit
       * les joueurs et leurs PV. »* Elle prenait `2 / 4`, donc le centre ET la
       * droite ; elle prend le centre. Pas de `position: fixed`, pas de
       * décalage calculé — c'est toujours une PLACE DE GRILLE.
       *
       * Les DEUX colonnes de consultation restent donc visibles **par
       * construction** : à gauche moi et ma fiche, à droite les trois autres
       * avec leurs PV, le relevé et le registre des pertes.
       *
       * ⚠ **LE VOILE VAUT POUR LES DEUX CÔTÉS, ET IL N'A PAS BOUGÉ D'UN
       * PIXEL.** `box-shadow` de 100vmax + `clip-path: inset(0 -100vmax)` : une
       * bande sombre à 35 %, à la hauteur exacte de la fenêtre, qui déborde à
       * gauche et à droite. Elle couvre ce qui est peint AVANT la fenêtre —
       * d'où l'ordre DOM `gauche · droite · fenêtre` dans `render()`. *Voiler un
       * côté et pas l'autre aurait dit « celui-ci compte moins » sans qu'aucune
       * décision ne l'ait jamais énoncé.* Un `box-shadow` ne capte aucun
       * pointeur : les plis de la droite restent cliquables sous le voile.
       *
       * **Aucune des trois teintes réservées** : ni braise (Collapse), ni or
       * (portail). Le cadre et la graisse suffisent.
       */
      /*
       * ⊕ **S89 — LA FENÊTRE EST SOLIDAIRE DE LA VUE, PLUS DE LA PAGE.**
       *
       * *La recette n'est pas neuve : c'est mot pour mot celle de
       * `.col-droite`, posée au palier 56 et validée par Croze.* Elle n'avait
       * jamais traversé jusqu'ici — **cinquième fois qu'une leçon n'atteint
       * qu'une des deux surfaces qui la partagent.**
       *
       * ⚠ **CE QU'ELLE RÉPARE EST UNE RÈGLE DU JEU, PAS UN CONFORT.** Mesuré
       * sur les douze états livrés, à 1920×1080 et `scrollY 0` :
       *
       * ```
       * fenêtre BUTIN ouverte  A · B · C · D · H · I
       *   « SIGNATURE PRÊTE »   y  912                        à l'écran
       *   la signature          y 1237                        325 px plus bas
       *   la main du siège      y 1274 … 1307                 sous le pli
       * fenêtre de COMBAT      E · F · G · X · Z
       *   .cf-deroule           y 1467 … 1636                 sous le pli
       * ```
       *
       * *Piège n°1 : « signatures et cartes en main sont jouables à tout
       * instant, par n'importe qui ».* Une modale de 1 495 à 1 969 px dans une
       * fenêtre de 1 080 **voile le reste de l'écran ET met hors de vue ce
       * qu'elle contient** : le droit reste, sa visibilité non.
       *
       * ⚠ **LE VOILE NE CHANGE PAS DE NATURE, IL CHANGE DE HAUTEUR — et c'est
       * plus juste.** `box-shadow` de 100vmax + `clip-path` couvrait la hauteur
       * de la fenêtre, donc 1 969 px dont 889 hors écran. Il couvre désormais
       * la hauteur VISIBLE, qui est la seule qu'un voile puisse voiler.
       *
       * ⚠ **ET `.cf-dues` GAGNE À LA MANŒUVRE** : son `sticky` (S87) se cale
       * désormais sur le haut de la FENÊTRE au lieu du haut de la page. *La
       * bande d'obligations est ce qu'un centre défilant emporterait s'il était
       * bâti sans elle — elle a été posée un palier avant, exprès.*
       */
      .combat-fenetre { grid-column: 2; grid-row: 1; border: 2px solid var(--stock-dim);
                        background: var(--ink-2); box-shadow: 0 0 0 100vmax rgba(21,18,15,.35);
                        clip-path: inset(0 -100vmax);
                        align-self: start; position: sticky; top: 8px;
                        /*
                         * ⛑⛑ S669 — « REMONTE-LE », note 81 ⑦. Verbatim :
                         * *« le fin de tour en combat est si bas qu'il est
                         * presque incliquable. »* MESURÉ à 1920×1080 sur
                         * `?etat=Z-combat`, avant :
                         *
                         *   .cf-dues     y 1008 → bottom 1083
                         *   le bouton    y 1041 → bottom 1070
                         *
                         * — le bord bas de la bande est **3 px SOUS** la
                         * ligne de flottaison, et le bouton à **10 px** du
                         * bord. C'est la mesure de `Q-72C-ECRAN-COURT`, vue
                         * du bon côté.
                         *
                         * ⚠ **LA BANDE NE REMONTE PAS DANS L'ORDRE DE
                         * LECTURE**, et c'est délibéré : le S638 l'a mise
                         * SOUS les fiches sur ordre de Croze (note 72 C,
                         * *« les boutons EN DESSOUS des fiches »*). Ce qui
                         * remonte est le BORD BAS DE LA FENÊTRE — 72 px
                         * d'air rendus au geste, l'ordre intact. *Deux
                         * consignes de Croze ne se départagent pas, elles se
                         * tiennent toutes les deux quand on touche la bonne
                         * mesure.*
                         */
                        /*
                         * ⛑⛑ **S922 — ET C'EST ICI QUE LA MAIN `fixed`
                         * S'ASSEYAIT SUR LE BOUTON, PAS DANS LES COLONNES.**
                         * `Q-HAUTEUR-1080` geste ② : ma première réserve a été
                         * posée sur `.col-centre`, et le signalement n'a pas
                         * bougé. Mesuré sur pièce, `?seed=8&fait=COMBAT_OPENED`,
                         * scènes coupées — **en combat les colonnes ne portent
                         * rien** : la chaîne réelle du bouton est
                         * `BUTTON ← DIV.rail ← DIV.cf-dues ← SECTION.combat-fenetre`,
                         * qui descendait à `bas 985` quand `.main-basse`
                         * commence à `y 820`.
                         * *Une réserve posée sur le conteneur qu'on croit est
                         * une réserve posée nulle part.*
                         *
                         * ⚠ **LE `140px` DU S669 RESTE, ET ON N'ÉCRASE PAS SON
                         * ARBITRAGE** — il tenait la bande d'obligations juste
                         * au-dessus du pli. La réserve s'y AJOUTE, parce que le
                         * pli utile n'est plus `100vh` : la main `fixed` en
                         * prend les derniers `--reserve-de-la-main`.
                         */
                        max-height: calc(var(--uvh) * 100 - 140px - var(--reserve-de-la-main));
                        overflow-y: auto;
                        overscroll-behavior: contain; }
      /*
       * ⚑ **DEUX COLONNES SOUS 1400 px** — la fenêtre prend la colonne large ET
       * LES DEUX RANGÉES, pour que gauche et droite s'empilent à côté d'elle.
       */
      @media (max-width: 1399px) {
        :where(html[data-verrou="non"]) .combat-fenetre { grid-column: 1; grid-row: 1 / span 2; }
      }
      /*
       * Empilé, l'ordre DOM ferait remonter la droite AU-DESSUS de la fenêtre :
       * `order` la remet dessous. La lecture reste `moi · le moment · les
       * autres`, comme en trois colonnes.
       */
      @media (max-width: 1199px) {
        /* Hors de la plage arbitrée, tout est empilé — même remède que
           `.col-droite` : coller la fenêtre la rendrait collante par rapport à
           elle-même et bornerait un bloc qui n'a plus de voisin. */
:where(html[data-verrou="non"]) .combat-fenetre { grid-column: 1; grid-row: auto; order: 0;
                          position: static; max-height: none; overflow-y: visible; }
:where(html[data-verrou="non"]) .col-gauche { order: -1; }
:where(html[data-verrou="non"]) .col-droite { order: 1; }
      }
      .cf-tete { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
                 padding: 8px 12px; background: var(--ink-3);
                 border-bottom: 1px solid var(--rule); }
      /*
       * ═══ ⛑ S202 · LES DEUX COLONNES SONT INTERVERTIES ═════════════════════
       *
       * Croze, note ⑨ ③, verbatim : *« la colonne "on te demande" et la colonne
       * présentant le mob et ses PV doivent être interverties. »*
       *
       * **Mesuré avant l'échange, 1920×1080, un combat contre `Mummy` :**
       *
       * ```
       * .cf-corps  grid  676,5px  501,1px
       *   colonne 1  x=335   ruban · mob-rail (777 h) · initiative · déroulé
       *   colonne 2  x=1024  .cf-cote — « CIBLE DE VOTRE PROCHAIN GESTE » + choix
       * ```
       *
       * Ce qu'on DOIT faire était à droite, à 1 024 px du bord ; ce qu'on
       * REGARDE occupait la gauche. L'échange met la demande là où l'œil part.
       *
       * ⚠ **LE GABARIT NE BOUGE PAS — SEUL LE CONTENU CHANGE DE CASE.** La
       * large (`1.35fr`) reste à gauche et la étroite (`1fr`) à droite ; c'est
       * « on te demande » qui prend la large, et le mob l'étroite. **Les deux
       * moitiés de la consigne se servent du même geste** : la demande passe
       * devant ET s'élargit, la fiche du mob passe derrière ET se réduit —
       * *« sa fiche, qui doit être réduite »*, sans qu'un pixel soit décidé à
       * la main.
       *
       * ```
       * AVANT   mob 677 (x=335)   ·  on te demande 501 (x=1024)
       * APRÈS   on te demande 677 (x=335)  ·  mob 501 (x=1024)
       * ```
       *
       * ⚠ **ET LE FILET CHANGE DE CÔTÉ.** `border-left` séparait la colonne 2
       * de la 1 ; en colonne 1 il deviendrait un bord de fenêtre. Il passe à
       * droite — *un filet marque une frontière entre deux blocs, jamais un
       * bord.*
       *
       * ⚠ **CETTE RÈGLE SERT AUSSI LA FENÊTRE DE MOMENT** (piège, coffre) :
       * `.cf-corps` est la même grille pour les deux surfaces — c'est le choix
       * du S54, *« une seule surface, donc une seule bande à tenir juste »*.
       * L'échange vaut donc là aussi. Croze n'a nommé que le combat ; **je ne
       * fabrique pas une seconde grammaire pour un seul mot non dit** — et un
       * mot de lui la sépare en trois lignes. Journalisé.
       */
      /*
       * ═══ ⛑ S225 · LE MOB MONTE À MOITIÉ D'ÉCRAN — note ⑬ ③ ═══════════════
       *
       * Verbatim Croze : *« Le mob à droite comme on a dit mais plus gros,
       * genre 50 %, et sa barre de vie PLUS LARGE qu'aujourd'hui, toujours
       * au-dessus de lui, tout à droite. »*
       *
       * **Mesuré avant de toucher, 1920×1080, combat contre `Goblin Thug` :**
       *
       * ```
       * .cf-corps   1229        .cf-cote 685 (x 335)   .mob-rail 508 (x 1033)
       * part du mob : 508 / 1229 = 41,3 %              ← il en demande ~50
       * .bar.mob    490 × 5 px                         ← un cheveu
       * .mc-img     252 × 378   (plafond max-width 252px)
       * ```
       *
       * ⚠ **LE `1,35fr` N'ÉTAIT PAS UN CHIFFRE DÉCORATIF** : le S202 l'a posé
       * pour que *« on te demande »* passe devant la fiche du mob, sur une
       * consigne signée. **Cette consigne-ci ne l'annule pas** — la demande
       * reste à GAUCHE, elle rend seulement du terrain. `1fr 1fr` donne la
       * moitié au mob et laisse la place de l'œil là où elle était.
       */
      .cf-corps { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                  gap: 12px; padding: 10px 12px 14px; align-items: start; }
      .cf-corps > * { grid-column: 2; }
      .cf-cote { grid-column: 1; grid-row: 1 / 5; display: flex; flex-direction: column; gap: 8px;
                 border-right: 1px solid var(--rule); padding-right: 12px; }
      /*
       * ⛑ **S210 — LES SORTS PRENNENT LA PLACE VIDE DE LA COLONNE GAUCHE, ET
       * C'EST UNE MESURE QUI L'A DÉCIDÉ.** Relevé à 1 920×1 080, combat ouvert :
       *
       * ```
       * colonne 1  .cf-cote     677 × 492   → 760 px de vide dessous
       * colonne 2  .mob-rail    501 × 650   → l'encadré de la cible, plein
       * ```
       *
       * Posé sous le mob par simple flux, le panneau tombait à **y = 962** —
