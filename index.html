      .vf4-projectile.vf4-trait {
        width: 90px; height: 6px; border-radius: 3px;
        background: linear-gradient(90deg, transparent, var(--stock));
        filter: drop-shadow(0 0 8px var(--stock));
      }
      .vf4-chiffre {
        position: fixed; z-index: 93; pointer-events: none;
        font-family: var(--display); font-weight: 800; font-size: 64px; line-height: 1;
        color: var(--stock); text-shadow: 0 3px 0 var(--ink), 0 10px 24px rgba(0,0,0,.8);
        transform: translate(-50%, -50%); opacity: 0;
        animation: vf4-chiffre var(--vf4-duree, 800ms) ease-out forwards;
      }
      @keyframes vf4-chiffre {
        0%   { opacity: 0; transform: translate(-50%, -30%) scale(.7); }
        15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        70%  { opacity: 1; transform: translate(-50%, -80%) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -110%) scale(1); }
      }
      .vf4-lance { animation: vf4-pulse 600ms ease-in-out 2; }
      @keyframes vf4-pulse {
        0%, 100% { box-shadow: 0 0 0 0 transparent; }
        50%      { box-shadow: 0 0 0 3px var(--stock), 0 0 22px 4px var(--rouge-vif); }
      }
      .vf4-nom {
        position: fixed; z-index: 93; pointer-events: none; transform: translate(-50%, 0);
        font-family: var(--mono); font-size: 14px; letter-spacing: .12em; text-transform: uppercase;
        color: var(--stock); background: rgb(0 0 0 / .75); padding: 3px 10px;
        border: 1px solid var(--rouge-vif); white-space: nowrap;
        animation: vf4-nom 1400ms ease-out forwards;
      }
      @keyframes vf4-nom { 0% { opacity: 0; } 12% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
      .coup-fiche-n { font-family: var(--display); font-weight: 800;
                      font-size: clamp(40px, 5vh, 72px); line-height: 1;
                      color: var(--alert);
                      text-shadow: 0 3px 0 var(--ink), 0 10px 24px rgba(0,0,0,.7);
                      opacity: 0;
                      animation: coup-fiche-n var(--coup-t) var(--pop) forwards; }
      @keyframes coup-fiche-cadre {
        0%   { opacity: 0; transform: translate3d(0, 0, 0); }
        6%   { opacity: 1; transform: translate3d(-7px, 0, 0); }
        13%  { opacity: 1; transform: translate3d(6px, 0, 0); }
        20%  { opacity: 1; transform: translate3d(-3px, 0, 0); }
        27%  { opacity: 1; transform: translate3d(0, 0, 0); }
        72%  { opacity: 1; transform: translate3d(0, 0, 0); }
        100% { opacity: 0; transform: translate3d(0, 0, 0); }
      }
      @keyframes coup-fiche-n {
        0%   { opacity: 0; transform: scale(.7); }
        12%  { opacity: 1; transform: scale(1.14); }
        24%  { opacity: 1; transform: scale(1); }
        72%  { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(1.04); }
      }
      /*
       * Le mouvement est un ORNEMENT ici : le montant et l'encre disent tout.
       * Qui refuse le mouvement garde donc les deux, sans la secousse.
       */
      @media (prefers-reduced-motion: reduce) {
        .coup-fiche   { animation: coup-fiche-fondu var(--coup-t) ease-out forwards; }
        .coup-fiche-n { animation: coup-fiche-fondu var(--coup-t) ease-out forwards; }
      }
      @keyframes coup-fiche-fondu {
        0% { opacity: 0; } 9% { opacity: 1; } 72% { opacity: 1; } 100% { opacity: 0; }
      }

      /*
       * ═══ ⛑ S254 · L'ENCADRÉ SIGNATURE — note ⑳ de Croze ═══════════════════
       *
       * *« un encadré signature cliquable pour pouvoir la déclencher quand on
       * le peut, sinon c'est épuisé et ça s'affiche grisée. »*
       *
       * ⚠ **LE VERT `--activable` EST LE MÊME QUE PARTOUT**, et c'est la
       * réserve de `ECRANS §2` : `#7FB069` dit JOUABLE, jamais autre chose.
       * L'ember reste au Collapse. On ne pose donc AUCUNE encre neuve — un
       * sixième rouge ou un second vert serait une réserve cassée.
       *
       * ⚠ **ET LE GRIS EST UN ÉTAT, PAS UN REFUS.** `.epuisee` baisse
       * l'opacité du contenu et retire le cadre : elle ne prend pas l'encre du
       * refus (`--stamp`), parce qu'une Signature dépensée n'est pas refusée —
       * elle a été JOUÉE. *Deux états qui se ressemblent ne prennent pas la
       * même couleur.*
       *
       * `transform`/`opacity` seulement : la règle d'animation du projet.
       */
      .ep-signature { margin: 6px 10px 4px 0; }
      .eps-tete { display: flex; align-items: baseline; gap: 8px; }
      .eps-titre { font-size: 10px; letter-spacing: .14em; color: var(--stock-dim); }
      /* ⛑ S1267 · H-T2 étape 12 (note 170 ① ⓑ) — la réaction et la Signature
         restent des CARTES, pas des boutons : le bord gris de 1 px qui les
         cernait au repos part (transparent). Le vert JOUABLE (.ok) reste. */
      .eps-btn { display: flex; flex-direction: column; align-items: flex-start;
                 gap: 2px; width: 100%; margin-top: 3px; padding: 6px 8px;
                 text-align: left; border: 1px solid transparent;
                 border-radius: 4px; background: transparent; color: inherit;
                 cursor: pointer; transition: transform .12s, opacity .12s; }
      .eps-btn.ok { border-color: var(--activable);
                    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--activable) 30%, transparent); }
      .eps-btn.ok:hover { transform: translateY(-1px); }
      .eps-btn.no { opacity: .72; cursor: default; }
      /* S1267 — `button:disabled` lui rendait un bord gris (--rule) : la carte
         au repos n'a pas de bord. L'ember de `.lit.no` (refus lisible) reste. */
      .eps-btn.no:not(.lit) { border-color: transparent; }
      .eps-btn.epuisee { opacity: .42; border-color: transparent; cursor: default; }
      .eps-nom { font-size: 13px; font-weight: 600; letter-spacing: .01em; }
      .eps-cout { font-size: 9px; letter-spacing: .06em; color: var(--stock-dim); }
      /*
       * ⛑ **S833 · `Q-DOUBLON-REACTION` — LE COÛT SUR LE BOUTON DE LA FENÊTRE.**
       * Il vient de la colonne gauche, qui se tait maintenant ; il prend donc
       * la MÊME encre et la MÊME taille qu'elle — *deux surfaces qui écrivent
       * le même coût de deux façons finissent par en dire deux.* Le
       * `margin-left` n'est pas un goût : sans lui le rendu collait le prix au
       * nom (« Shadow Dodgerien à payer », mesuré au navigateur).
       */
      .reac-cout { font-size: 9px; letter-spacing: .06em; color: var(--stock-dim);
                   margin-left: 10px; }
      /*
       * ⚑ S314 — `M-S295` servie : ce n'est plus un MANQUE nommé, c'est le
       * SECOND PRIX. Même encre atténuée que le premier — jamais l'ember ni le
       * vert jouable : ce n'est ni un danger ni une offre, c'est le tarif de
       * l'autre branche, et il se lit dans la même famille que le premier.
       */
      .eps-cout-options { font-size: 9px; color: var(--stock-dim);
                          opacity: .85; text-transform: none; }
      .eps-etat { font-size: 10px; letter-spacing: .06em; color: var(--stock-dim); }
      .eps-etat.on { color: var(--activable); }
      /*
       * ═══ ⚑ S58 · LE PORTRAIT DE MON PERSONNAGE ════════════════════════════
       *
       * Les portraits livrés sont en **1920×1080, paysage** ; la colonne fait
       * ~300 px. Rogner en bannière est ici le bon geste et non celui qui a
       * ruiné la tuile : *la tuile est un PORTRAIT 800×1200 dont le rognage
       * mangeait 90 % de l'art* — celui-ci est déjà un paysage, et le visage y
       * est au tiers haut. `object-position: 50% 32%` cadre la tête, sans
       * étirement (`cover` ne déforme jamais).
       *
       * Aucune teinte réservée : un liseré `--rule`, comme tout ce qui est du
       * carton.
       */
      .ep-portrait { width: 100%; aspect-ratio: 16 / 7; object-fit: cover;
                     object-position: 50% 32%; display: block;
                     border: 1px solid var(--rule); margin-bottom: 6px; }
      /*
       * ⛑ S417 — **LA BANNIÈRE DE LA COLONNE-CIBLE, note ㊳ ③** : *« l'image
       * du perso en bannière au-dessus. »* Même source que `.ep-portrait`
       * (S58/S59, les 18 mêmes fichiers) — **et une géométrie à elle**, parce
       * qu'une colonne d'adversaire est trois fois plus étroite que mon
       * encadré : à `16/7` elle prendrait la moitié de sa hauteur utile.
       * `16/5` la garde à sa place de rappel. *Un cadeau de Croze qui mange
       * l'information qu'il annonce n'est plus un rappel.*
       */
      /*
       * ⛑ S418 — **LE DÉTAIL DES POINTS (note ㊳ ④).** Le total est ce qu'on
       * lit d'abord, les sources ce qu'on lit ensuite : la hiérarchie est dans
       * la TAILLE, pas dans un cadre de plus. Rien d'`--ember` ni de `#7FB069`
       * ici — ce ne sont ni un moment ni un jouable, ce sont des faits acquis.
       */
      /*
       * ⛑ S419 — **LE CURSEUR DE VOLUME (note ㊳ ⑤).** `accent-color` suffit :
       * un curseur redessiné à la main perdrait le clavier et le tactile, que
       * le natif porte déjà. Ni `--ember` ni `#7FB069` — ce n'est ni un moment
       * ni un jouable, c'est un réglage.
       */
      .opt-vol { display: inline-flex; align-items: center; gap: 8px; }
      .opt-vol input[type="range"] { width: 132px; accent-color: var(--stock-2);
                                     cursor: pointer; }
      .opt-vol-n { font-variant-numeric: tabular-nums; font-size: 11px;
                   color: var(--stock-dim); min-width: 38px; text-align: right; }
      /* S1163 — POURQUOI la partie s'est arretee, au-dessus des vainqueurs :
         sur une EGALITE, la ligne du dessous dit « AUCUN VAINQUEUR » et se lit
         comme une panne quand rien ne la precede. Pas d'unite de FENETRE ici
         (verrou 1080, S1090) : la taille suit le corps. */
      .fin-cause { font-family: var(--display); font-size: 14px;
                   letter-spacing: .04em; color: var(--stock-2);
                   margin: 2px 0 6px; }
      .fin-scores { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
      .fs-ligne { border-left: 2px solid var(--rule); padding: 4px 0 4px 10px; }
      .fs-tete { display: flex; align-items: baseline; gap: 10px; }
      .fs-perso { font-family: var(--display); font-size: 15px; letter-spacing: .03em; }
      .fs-total { margin-left: auto; font-family: var(--display); font-weight: 800;
                  font-size: 22px; color: var(--stock); }
      .fs-detail { margin-top: 3px; display: flex; flex-direction: column; gap: 1px; }
      .fs-src { display: flex; gap: 8px; font-size: 11px; color: var(--stock-dim); }
      .fs-src-nom { flex: 1; }
      .fs-src-pts { font-variant-numeric: tabular-nums; color: var(--stock-2); }
      .col-banniere { width: 100%; aspect-ratio: 16 / 5; object-fit: cover;
                      object-position: 50% 30%; display: block;
                      border: 1px solid var(--rule); margin-bottom: 5px; }
      .ep-tete { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
      .ep-nom { font-family: var(--display); font-weight: 800; font-size: 21px;
                text-transform: uppercase; letter-spacing: .04em; }
      .ep-ou { font-size: 11px; color: var(--stock-dim); letter-spacing: .04em; }
      .ep-etats { display: flex; gap: 6px; flex-wrap: wrap; padding-top: 4px; }
      /*
       * ═══ ⚑ S306 · LE BANDEAU DÉPLOIE LA FICHE — note ㉖ ① ═══════════════
       *
       * ⓐ **`position: relative` SUR LE BLOC, `absolute` SUR LE VOLET.** Le
       *    volet ne pousse alors RIEN : sans ça, chaque passage de souris
       *    déplacerait l'équipement, les quêtes et le journal de plusieurs
       *    centaines de pixels, et la colonne danserait sous le curseur.
       * ⓑ **`:hover` ET `:focus-within`, et le second n'est pas de la
       *    politesse** : un onglet masqué ne produit aucun `:hover`, si bien
       *    que sans le focus cette surface serait invérifiable en exécution
       *    planifiée. Le bloc porte `tabIndex = 0`.
       * ⓒ **`visibility` en plus d'`opacity`** : une opacité à zéro laisse la
       *    surface CLIQUABLE et le balayage la compterait montrée. Les deux
       *    basculent ensemble, et la transition ne porte que sur l'opacité —
       *    `visibility` n'a pas d'états intermédiaires.
       * ⓓ **Elle ne prend jamais l'ember ni le vert jouable** : c'est une
       *    consultation, pas un moment et pas un geste.
       */
      .encadre-perso { position: relative; }
      .ep-boules { display: flex; align-items: center; gap: 8px; padding-top: 6px; }
      .ep-boules-lbl { font-family: var(--mono); font-size: 9px; letter-spacing: .16em;
                       color: var(--stock-dim); }
      /*
       * ⚑⚑ **S441 — ELLE S'OUVRAIT HORS DE LA BANDE VISIBLE, ET C'EST LE MOT
       * DE CROZE QUI L'A TROUVÉE** (note ㊸ ⑥, verbatim : *« quand je passe mon
       * curseur sur le bandeau de mon perso, je n'ai pas sa character sheet qui
       * pop »*).
       *
       * **La règle marchait.** Mesuré, transition GELÉE (`transition: none`,
       * sans quoi on lit un instant de fondu et pas la cible déclarée) :
       * `opacity 0 → 1`, `visibility hidden → visible` au `:focus-within`.
       * Ce n'était pas le déclencheur, c'était la PLACE.
       *
       * `left: 100%` posait le volet à **x 365 → 603**, et son ancêtre
       * `.col-gauche` est un ascenseur (`overflow: auto`) dont la bande visible
       * s'arrête à **x 372** : **231 des 238 px tombaient dans le coupé.** Croze
       * survolait, le volet s'ouvrait, et il voyait sept pixels.
       *
       * ⚠ **AUCUN DES DEUX BALAYAGES NE POUVAIT LE VOIR**, et les deux ont
       * raison de ne pas le voir : les deux exemptent l'enfant roulé hors d'un
       * ascenseur depuis le S391 — *un enfant roulé est COUPÉ, pas couvert*, et
       * il reste atteignable en faisant défiler. **Sauf qu'on ne fait pas
       * défiler en survolant** : un volet qui n'existe que sous le curseur n'a
       * pas de seconde chance. C'est l'angle mort que cette exemption laisse,
       * et il a fallu le mot d'un joueur pour l'atteindre.
       *
       * **Le remède garde les quatre acquis du S306** — il ne pousse rien
       * (`absolute`), il bascule `visibility` avec l'opacité, il ne prend ni
       * l'ember ni le vert jouable. Il s'ouvre DANS la colonne, sous le bloc :
       * mesuré, 539 px de bande visible sous lui pour un volet de 385.
       */
      .ep-fiche {
        position: absolute; left: 0; right: 0; top: 0; z-index: 60;
        width: auto;
        /*
         * ⚠⚠ **L'ANCRE EST LE HAUT DU BLOC, ET `top: 100%` A ÉTÉ ESSAYÉ PUIS
         * MESURÉ FAUX.** Posée SOUS le bloc, la fiche dépend de la hauteur de
         * ce bloc — qui VARIE : mesuré 525 px (graine 3, The Whiff) contre
         * 603 px (graine 7, The Wizard). À 525 elle tenait à 3 px près ; à 603
         * elle **dépassait de 21 px**. *Une place qui tient sur un échantillon
         * ne tient pas : elle attend le suivant.*
         *
         * Ancrée au HAUT, elle part du bandeau — le point même qu'on survole,
         * donc nécessairement dans la bande visible — et sa hauteur est bornée
         * juste dessous. Elle recouvre le bloc pendant la consultation, ce qui
         * est son rôle : c'est la MÊME information en plus grand, et le
         * survol reste vivant puisque le volet est un ENFANT du bloc.
         */
        /*
         * ⚠ **LA BORNE N'EST PAS DÉCORATIVE — MESURÉE À 3 PX DU BORD.** Posé
         * sous le bloc, le volet finissait à `y 1169` pour une bande visible
         * qui s'arrête à `1172` : il tenait, par trois pixels. Un bloc plus
         * haut d'un cheveu (un combat en cours, une capacité de plus) le
         * repoussait dehors, et le défaut serait revenu sans rien annoncer —
         * *exactement la forme qu'on vient de réparer.* Bornée, la fiche
         * défile en elle-même au lieu de sortir de la colonne.
         */
        max-height: calc(var(--uvh) * 44); overflow-y: auto;
        background: var(--ink-2); border: 1px solid var(--rule);
        padding: 8px 10px;
        opacity: 0; visibility: hidden; transition: opacity .12s;
        pointer-events: none;
      }
      /*
       * ⛑⛑ **S934 · LE `:hover` PART — note 121 ②.** Croze : *« PLUS AUCUN
       * SURVOL QUI FAIT SURGIR UNE FICHE … retire les survols ; ne répare pas
       * le pop-up, supprime-le. »* La bascule est `.volet-ouvert`, posée par
       * `main.ts::voletAuClic`. `:focus-within` RESTE : ① le clavier doit
       * ouvrir ce que la souris ouvre ; ② un onglet MASQUÉ ne produit aucun
       * `:hover` — sans lui cette surface serait invérifiable en exécution
       * planifiée, et *« bâti et non vu » n’est pas livré*. Un focus est un
       * geste ; un passage de souris n’en est pas un.
       */
      .encadre-perso.volet-ouvert .ep-fiche,
      .encadre-perso:focus-within .ep-fiche {
        opacity: 1; visibility: visible; pointer-events: auto;
      }
      /*
       * ═══ ⚑⚑ S462 · ELLE NE SE DÉPLOIE QU'AU CENTRE — note ㊹ ③ ═══════════
       *
       * Croze, verbatim : *« quand je survole la fiche, elle s'affiche au
       * milieu de l'écran c'est très bien, MAIS elle se déploie aussi à
       * l'endroit où elle est et bloque la vision des stats et la possibilité
       * de cliquer sur la Signature. Elle doit seulement se déployer middle
       * screen et rester en mode bannière sur son encart. »*
       *
       * **CE QUI SE PASSAIT, MESURÉ AVANT D'ÉCRIRE** — les quatre règles de
       * survol qui mordent sur ce bloc, relevées dans la feuille au S462 :
       *
       * ```
       *   .encadre-perso:hover .ep-fiche   → le volet s'ouvre SUR le bloc
       *                                      (absolute, top/left/right: 0)
       *   .fi-carte:hover .cz-zoom         → et la fiche paraît AU CENTRE
       * ```
       *
       * Les deux à la fois : c'est la phrase de Croze, mot pour mot. Le volet
       * couvrait `.ep-signature` — donc **le clic Signature**, pas seulement
       * la vue des stats : une surface `pointer-events: auto` posée par-dessus
       * un bouton le rend inatteignable sans rien changer à son apparence.
       * *C'est la question de `couverts`, et elle se posait ici depuis le S441
       * sans que l'instrument puisse la voir — il ne mesure pas un état de
       * SURVOL.*
       *
       * **LE REMÈDE PREND LA PLACE, PAS LA BASCULE.** Le volet ne change ni de
       * fabrique ni de déclencheur : il cesse d'être ancré DANS le bloc pour
       * se poser contre la FENÊTRE, au centre. L'encart, lui, ne bouge plus
       * d'un pixel au survol — *il reste bannière*, le mot de Croze.
       *
       * ⚠ **ET LE ZOOM IMBRIQUÉ MEURT AVEC LE DÉPLACEMENT.** `.cz-zoom` était
       * la moitié qu'il trouvait « très bien » ; le volet étant DÉSORMAIS la
       * surface centrée, le garder ferait paraître **une seconde copie centrée
       * de la même fiche** par-dessus la première, au premier passage du
       * curseur sur la carte. *Deux surfaces centrées pour un seul fait, c'est
       * la faute des deux verbes sur un clic, en géométrie.*
       *
       * ⚠ **PORTÉE : SON ENCART, PAS LES BANDEAUX DE SIÈGE.** Les volets
       * tierces portent `.tv-fiche` et reçoivent leur place de
       * `poseLeVoletAuGeste`, mesurée au S442 contre la fenêtre. La note ㊹ ③
       * nomme les stats et la Signature — les siennes. Étendre le centrage aux
       * tiers est une question posée au classeur (`Q-FICHE-TIERS`), pas une
       * déduction à prendre ici.
       */
      .encadre-perso > .ep-fiche {
        position: fixed; left: 50%; top: 50%; right: auto;
        transform: translate(-50%, -50%);
        width: min(560px, calc(var(--uvw) * 92)); max-height: calc(var(--uvh) * 86);
        z-index: var(--z-zoom);
      }
      .encadre-perso > .ep-fiche .cz-zoom { display: none; }
      /*
       * ⚑⚑ **S442 — LA MOITIÉ TIERCE DE ㊸ ⑥ : LE MÊME VOLET SUR UN BANDEAU DE
       * SIÈGE.** Même fabrique, même style, même bascule — seule la PLACE
       * change, et elle change parce que l'ancre change de nature.
       *
       * Le volet du bloc perso s'ancre au haut de son bloc, et ça tient parce
       * que ce bloc est le PREMIER enfant de sa colonne. Les bandeaux de siège
       * sont empilés dans un ascenseur : mesuré à la graine 3, les trois se
       * rangent tantôt en rangée (`.zone-tuile`, `y 131` toutes les trois),
       * tantôt en pile dans `.col-droite` — **la troisième à `y 1612` pour une
       * fenêtre de 1080.** Un `absolute` ancré là retomberait dans le coupé,
       * *exactement la forme du défaut que le S441 vient de réparer.*
       *
       * D'où la répartition : **le CSS donne la place par défaut** — celle du
       * S441, sous le bandeau, dans le repère de la carte — et
       * `poseLeVoletAuGeste` la RE-POSE contre la fenêtre au moment du geste,
       * `position: fixed` en ligne, parce que c'est là, et seulement là, qu'on
       * sait où le bandeau se trouve.
       *
       * ⚠ **ET C'EST POUR ÇA QUE LE `fixed` N'EST PAS ÉCRIT ICI.** Il l'a été,
       * une première fois, avec le `left`/`top` laissés au JS — et mesuré : un
       * volet dont le placement n'avait pas tourné s'ouvrait quand même, à
       * `0,0`, **1 451 px de large**. Une règle CSS qui MONTRE ce qu'une ligne
       * de JS doit encore PLACER affiche le mauvais état chaque fois que les
       * deux se désynchronisent. *La place par défaut doit être une place
       * juste, jamais un emplacement d'attente.*
       */
      .tv-bandeau { position: relative; }
      /*
       * ⚠⚠ **ET LE VOLET SORTAIT DE SA CARTE SANS SORTIR DE SON EMPILEMENT —
       * MESURÉ, PAS CRAINT.** `elementsFromPoint` au centre du volet ouvert
       * rendait, de haut en bas : `.dicelayer` (z 900, voulu), `.muted`,
       * `.decision prompt`, `.les-choix` (**z 6**) — puis SEULEMENT le volet,
       * qui porte pourtant `z-index: 60`.
       *
       * La cause n'est pas un nombre, c'est un CONTEXTE : `.tv` porte
       * `opacity: .85`, et une opacité inférieure à 1 **crée un contexte
       * d'empilement**. Le `60` du volet ne vaut donc que DANS la carte, et la
       * carte, elle, est à `auto`. *Un z-index ne se compare qu'à ses frères ;
       * il ne franchit pas le contexte où il est né.*
       *
       * Le remède prend la carte, pas le volet — pendant la consultation elle
       * cesse d'être en retrait (`opacity: 1`, ce qui est juste : on la
       * regarde) et elle passe au-dessus des couches de choix. `:has()` est
       * déjà l'idiome de ce fichier.
       *
       * ⚠ **`.dicelayer` RESTE DEVANT, ET C'EST VOULU** — c'est la sixième dent
       * de `couverts` : une couche de scène plein écran couvre TOUT pendant son
       * moment, et le survol n'a rien à réclamer là.
       */
      /* ⛑⛑ S934 — même geste, même règle : le CLIC ouvre (note 121 ②). */
      .tv:has(> .tv-bandeau.volet-ouvert),
      .tv:has(> .tv-bandeau:focus-within) { opacity: 1; position: relative; z-index: 70; }
      .tv-bandeau.volet-ouvert > .tv-fiche,
      .tv-bandeau:focus-within > .tv-fiche {
        opacity: 1; visibility: visible; pointer-events: auto;
      }
      .ep-fiche-tete { display: flex; align-items: baseline;
                       justify-content: space-between; gap: 8px; padding-bottom: 4px; }
      .ep-fiche .fi-carte .cz-vignette { width: 100%; max-width: none; }
      /*
       * Le plancher : il DIT qu'un 0 n'est pas naturel. Il n'emprunte ni
       * l'orange braise ni le rouge — ce n'est ni une menace ni un refus, c'est
       * une note de lecture. Le gris ardoise, et le détail au survol.
       */
      .stat-planche { font-size: 8px; letter-spacing: .1em; text-transform: uppercase;
                      color: var(--slate); cursor: help; }

      /* Mes vitales : en tête du centre, ce sont MES grandeurs. */
      .mes-vitales { display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
                     padding: 10px 0 4px; }
      /* c) LA DEMANDE — une demande n'est pas une nouvelle. */
      .demande { border: 2px solid var(--ember); background: var(--ink-2);
                 margin: 10px 0 0; padding: 8px 10px; }
      .demande-titre { font-family: var(--display); font-weight: 800; font-size: 15px;
                       letter-spacing: .2em; text-transform: uppercase; color: var(--ember); }
      .demande-titre.attente { color: var(--stock-dim); }
      .demande:has(.vide) { border-color: var(--rule); }
      .demande-titre.vide { color: var(--slate); font-family: var(--mono); font-size: 11px;
                            font-weight: 400; letter-spacing: .08em; text-transform: none; }
      .demande .prompt { border: none; background: none; padding: 4px 0 0; margin: 0; }
      /* a) L'ONGLET DE FICHE — vertical dans la maquette, en tête ici. */
      .fiche-onglet { display: flex; align-items: baseline; gap: 10px;
                      border-left: 3px solid var(--gold); background: var(--ink-2);
                      padding: 6px 10px; }
      .onglet-titre { font-size: 9px; letter-spacing: .22em; text-transform: uppercase;
                      color: var(--stock-dim); }
      .onglet-nom { font-family: var(--display); font-weight: 800; font-size: 19px;
                    text-transform: uppercase; margin-left: auto; }
      /*
       * ═══ LA COLONNE DROITE — trois blocs, et ils sont ZOOMABLES ════════
       *
       * Le bouton ⤢ passe par `ouvrirPlein`, la surface pleine qui existe déjà
       * et qu'`Échap` referme. Pas de second mécanisme d'ouverture.
       */
      .zoomable { border: 1px solid var(--rule); margin-bottom: 8px; }
      .zoom-tete { display: flex; align-items: center; justify-content: space-between;
                   gap: 8px; padding: 3px 6px 3px 8px; background: var(--ink-2);
                   border-bottom: 1px solid var(--rule); }
      .zoom-titre { font-size: 9px; letter-spacing: .2em; text-transform: uppercase;
                    color: var(--stock-dim); }
      .zoom-tete button { font-size: 12px; line-height: 1; padding: 2px 6px; }
      /*
       * L'EMPLACEMENT DE LA FICHE IMPRIMÉE — vide, et NOMMÉ.
       *
       * Pointillé, comme un créneau vide : c'est la même grammaire de matière,
       * « il manque quelque chose ici ». **Aucun dessin qui puisse se lire comme
       * la carte** — pas de cadre avec le nom et les stats dedans, qui ferait
       * une fausse carte réussie, plus trompeuse qu'un trou.
       */
      .fiche-vide { display: flex; align-items: center; justify-content: center;
                    min-height: 96px; padding: 12px; text-align: center;
                    border: 1px dashed var(--rule); margin: 6px; }

      /* d) LES CARRÉS DE QUÊTE — on compte des jetons, on ne lit pas un nombre. */
      .quete-carre { display: inline-block; width: 8px; height: 8px; margin-left: 3px;
                     background: var(--gold); border: 1px solid var(--ink); }

      /*
       * ═══ ⛑ S420 · LE CALQUE DE COMBAT SUR LA ZONE DE STATS (note ㊴) ══════
       *
       * **La fiche reste dans le flux**, c'est elle qui donne sa hauteur à la
       * pile : un calque en `position: absolute` sur un parent vide se serait
       * effondré, et *« les stats reviennent »* aurait rendu un saut de mise en
       * page à chaque fermeture de combat.
       *
       * ⚠ **`--ink` OPAQUE, PAS UN VOILE.** Un calque translucide laisserait
       * lire les PV DESSOUS pendant qu'on lit ceux du combat : deux jeux de
       * chiffres superposés, et c'est exactement la confusion que le bloc doit
       * lever. `.sur-autres` est déjà la classe des recouvrements VOULUS —
       * `couverts` la connaît (sa neuvième dent), donc ce calque ne réveillera
       * pas une fausse alerte.
       */
      .fiche-pile { position: relative; }
      .fiche-dessous { visibility: hidden; }
      .fiche-calque { position: absolute; inset: 0; overflow: auto;
                      background: var(--ink); border: 1px solid var(--stamp);
                      padding: 6px 8px; }
      .fiche { display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
               padding: 8px 0 10px; }
      /* b) LES PV EN PASTILLE — la proportion se lit avant le chiffre. */
      .pv-pastille { position: relative; display: flex; align-items: baseline; gap: 5px;
                     border: 2px solid var(--stamp); border-radius: 999px;
                     padding: 5px 14px; background: var(--ink);
                     overflow: hidden; }
      .pv-pastille::before { content: ""; position: absolute; inset: 0; width: var(--part, 0%);
                             background: rgba(163, 44, 37, .28); }
      .pv-pastille > * { position: relative; }
      /*
       * ⛑⛑ **S548 — LE ♥ DES PV ÉTAIT À `2,03` SUR TOUS LES ÉCRANS.**
       *
       * Trouvé par `encres_stamp`, l'outil qui ÉNUMÈRE les règles portant une
       * encre au lieu d'attendre qu'un balayage en attrape une : **14 états sur
       * 14**, fond composé `rgb(11,11,11)`. C'est le sixième site de la famille
       * du S536 (`--stamp` est le rouge des APLATS et du carton CLAIR).
       *
       * ⚠ **LE SEUIL D'UN GLYPHE EST `3`, PAS `4,5`** — critère NON-TEXTE de
       * WCAG : ce ♥ ne se lit pas, il se reconnaît. `2,03` échoue quand même,
       * et il porte du sens (c'est le repère des points de vie sur chaque
       * bandeau).
       *
       * ⚑ **ET C'EST LUI QUE `main.ts` CITAIT POUR JUSTIFIER LA BULLE DU
       * S545** — *« --stamp est DÉJÀ la teinte des PV dans cet écran »*.
       * L'argument tenait par un site qui était lui-même sous le seuil : *une
       * grammaire se justifie par ses emplois, et il faut donc que les emplois
       * soient justes.*
       */
      .pv-coeur { color: var(--rouge-vif); font-size: 15px; }
      .pv-n { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; }
      .pv-max { font-size: 11px; color: var(--stock-dim); }
      /*
       * a) LES QUATRE STATS — LE CHIFFRE ET LE SIGLE, RIEN D'AUTRE.
       *
       * **Ordre de Croze, littéral.** Sont partis : la silhouette de dé
       * (`.stat-de`, un polygone SVG par stat), l'aplat (`background`), le cadre
       * (`border`) et la ligne d'écart (`.stat-ecart`). Aucune forme
       * géométrique, aucun aplat décoratif, rien derrière le chiffre.
       *
       * L'espacement reste — `gap` sépare, il ne décore pas. C'est la seule
       * chose qui distingue encore les quatre, et retirer AUSSI la respiration
       * rendrait la ligne illisible : ce serait obéir au mot contre l'intention.
       */
      .stats { display: flex; gap: 18px; }
      .stat-carte { display: flex; flex-direction: column; align-items: center; gap: 1px; }
      .stat-n { font-family: var(--display); font-weight: 800; font-size: 26px;
                line-height: 1; color: var(--stock); }
      .stat-nom { font-size: 9px; letter-spacing: .18em; color: var(--stock-dim); }
      /*
       * ═══ ⛑ S1182 · NOTE 143 ③ — LE CHIFFRE QUI MONTE SE VOIT MONTER ══════
       *
       * Croze, verbatim : *« quand le moteur publie “+1 STR (Opportunistic
       * Feeder)”, la fiche le montre monter — le chiffre STR de la colonne, un
       * battement. »*
       *
       * ⚠ **AUCUNE ENCRE, PAS MÊME UNE EXISTANTE.** Le premier jet posait
       * `color: var(--gold)` — l'encre de `.stat-ecart`, la ligne qui vit sous
       * ce chiffre. **Mesuré à l'écran, c'était un contresens** : `--gold` vaut
       * `#909090` dans cette palette et `.stat-n` porte `--stock` (`#F2F2F2`),
       * donc le battement faisait **PÂLIR** de 242 à 144 un chiffre qui MONTE.
       * *Une encre choisie par son NOM peut dire l'inverse de ce qu'elle
       * nomme ; c'est sa VALEUR qui parle à l'œil.* Le signal est donc le
       * MOUVEMENT seul — transform/opacity, la règle du dépôt —, et la CAUSE
       * reste écrite juste dessous, en permanence, par `.stat-ecart`.
       *
       * ⚠ La durée n'est pas écrite ici — `--bat-t` est posé par le module,
       * qui la tient de `DURÉE_DE_L_ALLUMAGE` (les 800 ms de la note 130 ⑦).
       */
      .stat-carte[data-bat] .stat-n { animation: stat-bat var(--bat-t) var(--pop) 1; }
      @keyframes stat-bat {
        0%   { transform: scale(1); }
        22%  { transform: scale(1.34); }
        55%  { transform: scale(.96); }
        100% { transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        /*
         * Qui refuse le mouvement garde le SIGNAL, sans la secousse — le même
         * arbitrage que `.coup-fiche` : un fondu n'est pas un déplacement.
         */
        .stat-carte[data-bat] .stat-n { animation: stat-bat-fondu var(--bat-t) ease-out 1; }
      }
      @keyframes stat-bat-fondu {
        0% { opacity: 1; } 30% { opacity: .25; } 100% { opacity: 1; }
      }
      /*
       * L'ÉCART REVIENT, EN TEXTE. La consigne de dépouillement visait les
       * formes — silhouette, aplat, cadre — pas l'information : `+2 · base 3`
       * est le seul endroit de l'écran qui dit ce que le gear a donné. Il est
       * en or parce que c'est la matière du gear (§2), et discret parce que le
       * chiffre au-dessus reste ce qu'on lit d'abord.
       */
      .stat-ecart { font-size: 9px; color: var(--gold); letter-spacing: .04em; }
      /*
       * ⛑⛑ S405 — **LE TEMPORAIRE EST POINTILLÉ, ET LA GRAMMAIRE EXISTAIT
       * DÉJÀ.** La grille d'équipement dit, depuis longtemps : *« pointillé =
       * vide, plein = porté — la même grammaire de matière que le rang, donc
       * aucune légende. »* **Ce qui n'est pas plein ne tient pas** : c'est
       * exactement ce qu'un modificateur à durée est. Aucune teinte réservée
       * n'est touchée — l'or reste au gear, la braise au Collapse, le rouge au
       * refus —, et le signal est une FORME, donc lisible sans légende et sans
       * couleur (la peau sobre le garde intact).
       */
      .stat-temp { color: var(--slate); border-bottom: 1px dashed var(--slate); }
      /*
       * La retombée CONSTATÉE — elle sort seule à `DÉ.SORTIE` (la
       * famille ratifiée par Croze). Elle est en braise ? **Non** : la braise
       * est au Collapse. Elle est atténuée, parce qu'elle raconte ce qui vient
       * de PARTIR — un fait au passé ne doit pas peser plus que l'état présent.
       */
      .stat-retombe { color: var(--stock-dim); font-style: italic; }
      /* La durée, écrite en clair sous l'étoile — la bande a la place. */
      .ec-duree { color: var(--stock-dim); }
      /* c) L'ÉTOILE DES ÉCOLES — six valeurs d'un coup d'œil. */
      .etoile { display: flex; flex-direction: column; align-items: center; gap: 2px; }
      .etoile svg { width: 96px; height: 96px; }
      .etoile .br { stroke-width: 4; stroke-linecap: round; }
      .etoile .br.off { opacity: .18; }
      .etoile text { font-family: var(--mono); font-size: 11px; font-weight: 700; }
      .etoile-lbl { font-size: 8px; letter-spacing: .18em; color: var(--stock-dim); }
      /*
       * ⛑ S402 — **L'ÉCART DES ÉCOLES, ET IL N'EST PAS EN OR.** Les quatre
       * axes disent le leur en `--gold` parce que c'est la matière du gear.
       * Une école, elle, peut avoir bougé par le gear OU par un modificateur
       * temporaire, et **rien de publié ne les sépare** (`M-S402`) : l'or
       * affirmerait une source. La puce prend donc la TEINTE DE SON ÉCOLE —
       * la même que sa branche, donc l'œil relie les deux sans légende, et la
       * couleur ne dit que « quelle école », ce que je sais.
       */
      .etoile-ecarts { display: flex; flex-wrap: wrap; gap: 2px 8px;
                       justify-content: center; margin-top: 2px; max-width: 130px; }
      .ec-ecart { font-size: 9px; letter-spacing: .04em;
                  color: var(--ec-teinte, var(--stock-2)); }

      /*
       * d) LA GRILLE D'ÉQUIPEMENT — 3×3, ET L'ART PASSE DERRIÈRE.
       *
       *      WEAPON │ HEAD  │ BACK
       *      RING   │ CHEST │ HANDS
       *      RING   │ LEGS  │ FEET
       *
       * Neuf cases, aucun trou, DEUX bagues. Elle était en 4×3 avec trois cases
       * fantômes et un seul RING.
       *
       * Pointillé = vide, plein = porté — **la même grammaire de matière que le
       * rang**, donc aucune légende. Le liseré or est celui du gear, réutilisé.
       *
       * L'art du personnage est un FOND, posé par `--art` et dérivé du
       * `character_id` (`ECRANS §14.5`). **Le voile est là même sans image** :
       * la grille se lit identiquement avec ou sans art, ce qui est la condition
       * pour que les assets restent en dernier (§14.4). Une image absente ne
       * laisse donc pas un trou — elle laisse le fond sombre, qui est l'état
       * normal. C'est un DÉCOR, pas un contenu : la règle du « cadre gris avec
       * son nom » vaut pour les cartes de tuile et de mob, où l'image EST le
       * contenu.
       */
      .corps { position: relative; display: grid;
               grid-template-columns: repeat(3, minmax(96px, 1fr));
               gap: 5px; max-width: 340px; margin: 4px 0 10px; padding: 5px;
               background-image: var(--art); background-size: cover;
               background-position: center top; }
      .corps::before { content: ""; position: absolute; inset: 0;
                       background: rgba(20, 17, 13, .82); pointer-events: none; }
      .corps > * { position: relative; }
      .creneau { border: 1px dashed var(--rule); padding: 5px 7px; min-height: 46px;
                 display: flex; flex-direction: column-reverse; justify-content: flex-end;
                 align-items: flex-start; gap: 2px; }
      .creneau.porte { border-style: solid; border-left: 3px solid var(--gold);
                       background: rgba(31, 27, 22, .86); }
      /* L'étiquette est EN BAS À GAUCHE : `column-reverse` la fait tomber sous
         la carte sans la sortir de l'ordre du DOM, donc sans la sortir de
         l'ordre de lecture d'un lecteur d'écran. */
      /*
       * ⛑ S291 — `--stock-dim` rend `4,25` sur `--ink-3` : **sous le seuil de
       * 4,5** à ce corps. `--slate`, la seconde ligne du GO de Croze, rend
       * `4,55` — il passe, et il reste une légende.
       */
      .creneau-nom { font-size: 8px; letter-spacing: .18em; color: var(--slate); }
      .creneau-vide { color: var(--rule); }
      .creneau-carte { font-size: 11px; color: var(--stock); line-height: 1.2; }
      /*
       * ═══ NOM · STATS · EFFET — l'équipement est la SOURCE UNIQUE ════════
       *
       * Demande de Croze. Les trois se distinguent par la MATIÈRE, pas par une
       * teinte réservée : le nom porte la graisse, les stats le monospace — ce
       * sont des nombres, ils s'alignent —, l'effet le gris de lecture.
       *
       * L'effet est TRONQUÉ ici et entier au `⤢` : une case de grille ne peut
       * pas porter un texte de carte sans écraser les huit autres.
       */
      /*
       * ═══ LE HALO — « CE QUI EST JOUABLE S'ALLUME » ══════════════════════
       *
       * Demande de Croze. Posé ici sur la grille d'équipement parce que **le
       * verdict y existe déjà** : `EQUIPPED_CARD` est 36/36 réveillées, donc
       * « elle est dans l'offre » EST le signal demandé. Ailleurs — la tuile,
       * le donjon — la liste reste, tant que le fait 22a laisse des objets
       * sans verdict : *éteindre sans pouvoir dire pourquoi, c'est mentir.*
       *
       * ⚠ **AUCUNE TEINTE RÉSERVÉE.** L'or est la sortie, l'orange le
       * Collapse, le rouge le refus, le liseré or le gear. Le halo est une
       * LUEUR — une ombre portée claire —, pas une couleur : il s'ajoute à ce
       * que la case porte déjà au lieu de le remplacer.
       */
      .creneau[data-halo] { border-color: var(--stock);
                            box-shadow: 0 0 0 1px var(--stock),
                                        0 0 14px -2px var(--stock);
                            animation: halo-bat 1.9s ease-in-out infinite; }
      @keyframes halo-bat {
        0%, 100% { box-shadow: 0 0 0 1px var(--stock), 0 0 14px -2px var(--stock); }
        50%      { box-shadow: 0 0 0 1px var(--stock), 0 0 22px 0 var(--stock); }
      }
      @media (prefers-reduced-motion: reduce) {
        /* Le fait reste LISIBLE sans mouvement : le liseré tient seul. */
        .creneau[data-halo] { animation: none; }
      }
      .creneau-carte .cr-nom   { display: block; font-weight: 700; }
      .creneau-carte .cr-stats { display: block; font-family: var(--mono);
                                 font-size: 9px; letter-spacing: .04em;
                                 color: var(--stock-2); }
      .creneau-carte .cr-effet { display: block; font-size: 9px; line-height: 1.35;
                                 color: var(--stock-dim); }
      /*
       * ═══ ⛑⛑ S1072 · NOTE 130 ② — LA PRISE POUR DÉSÉQUIPER, ET ELLE NE
       * ════    COÛTE PAS UN PIXEL DE HAUTEUR ══════════════════════════════
       *
       * Croze : *« déséquiper : une prise cliquable sur chaque emplacement
       * occupé (rien ne l'est aujourd'hui). »*
       *
       * ⚠⚠ **PREMIER JET : UN BOUTON EN RANG, ET IL POUSSAIT LE BLOC SOUS LE
       * BORD.** Mesuré à 1920 × 1080 avec un témoin connu-bon (la prise cachée
       * par une règle, puis remise, dans le même aller-retour) :
       *
       * ```
       *                      bloc ÉQUIPEMENT   débordement de .col-gauche
       *   sans la prise          407 px                  89 px
       *   avec le bouton en rang 456 px                 153 px
       * ```
       *
       * ⚑ **LE DÉBORDEMENT EXISTAIT AVANT MOI — 89 px** : `.col-gauche` est un
       * ascenseur voulu (`overflow-y: auto`, `sticky`), et la capture 1080 le
       * montre coupé parce qu'une image ne défile pas. Ce n'est donc pas une
       * régression de ce palier ; **ce qui l'était, ce sont les 64 px que mon
       * bouton ajoutait.** *On ne répare pas un débordement qu'on n'a pas fait,
       * et on ne l'aggrave pas non plus.*
       *
       * La prise est donc posée EN SURIMPRESSION dans le coin bas-droit de la
       * case : elle ne participe pas au flux, elle ne coûte aucune hauteur, et
       * elle reste atteignable (`couverts` le mesure).
       */
      .creneau { position: relative; }
      /*
       * ═══ ⛑⛑⛑ S1074 · NOTE 130 ⑦ — **LA SOURCE QUI S'ALLUME** ═════════════
       *
       * Croze : *« quand un passif, une pièce portée ou un dé de la table
       * déclenche un effet, sa carte s'allume dans l'inventaire (halo,
       * 800 ms). »*
       *
       * ⚠⚠ **CE HALO N'EST PAS UNE ANIMATION, ET C'EST STRUCTUREL.** Volet
       * masqué, l'horloge du compositeur ne tourne pas : une règle qui
       * lèverait la case depuis `opacity: 0` la laisserait **invisible pour
       * toujours** — le piège du ⓪quinquies-ter, seize paliers de fausse liste
       * chez `encres_stamp`. La marque est donc un ÉTAT POSÉ (`data-allume`,
       * retiré par un `setTimeout`), et son encre est celle du repos, montée.
       * **Gelée, la case reste parfaitement lisible** ; c'est mot pour mot
       * l'argument de `.cell-cachee`, à un autre site.
       *
       * ⚠ **IL NE PORTE PAS L'ENCRE DU HALO D'OFFRE.** `[data-halo]` dit *« tu
       * PEUX jouer ça »* ; celui-ci dit *« ça VIENT DE JOUER »*. Deux signaux
       * sur la même case doivent se distinguer à l'œil, sinon le second
       * annule le premier.
       */
      .creneau[data-allume] {
        border-color: var(--activable);
        box-shadow: 0 0 0 2px var(--activable), 0 0 14px 2px rgba(127, 176, 105, .45);
        background: rgba(127, 176, 105, .10);
      }
      .cr-retirer { position: absolute; right: 3px; bottom: 3px; z-index: 2;
                    font-family: var(--display); font-weight: 800; font-size: 9px;
                    letter-spacing: .1em; padding: 2px 6px; line-height: 1;
                    color: var(--ink); background: var(--stock-2);
                    border: 0; border-radius: 2px; cursor: pointer; }
      .cr-retirer:hover, .cr-retirer:focus-visible { background: var(--activable); }
      .cr-retirer:disabled { background: var(--rule); color: var(--slate);
                             cursor: default; }
      /*
       * FAIT 40 — les cases LIBRES et REFUSÉES se dessinent enfin, parce que
       * `slotCapacity` est publié. **Le refusé reste, barré** : une case qui
       * disparaît se lit comme une panne, une case barrée qui dit pourquoi se
       * lit comme une règle. Le rouge tampon est ici à sa place — c'est un refus.
       */
      .creneau-carte.vide { color: var(--stock-dim); font-size: 9px;
                            letter-spacing: .14em; }
      /*
       * ⛑ **S548 — LE `⊘` DU REFUS ÉTAIT À `1,88`** (6 états sur 14, fonds
       * composés `rgb(21,21,21)` et `rgb(11,11,11)`). Même famille, même
       * critère non-texte : un marqueur de refus qu'on ne distingue pas du fond
       * ne refuse rien. Adresse : `?seed=4&fait=COMBAT_OPENED&automates=UNIFORM`.
       */
      .creneau-carte.no   { color: var(--rouge-vif); font-weight: bold; }
      /*
       * ═══ LA GRILLE DES CRÉNEAUX — FAIT 40 FERMÉ ══════════════════════
       *
       * Une famille par rang, une case par unité de `slotCapacity`. **Le
       * refusé reste dessiné, barré** : une case qui disparaît se lit comme
       * une panne, une case barrée qui dit pourquoi se lit comme une règle.
       *
       * ⛑⛑ **S557 — CETTE PHRASE COMMENTAIT UNE FAMILLE MORTE.** Elle vivait
       * sur `.creneaux / .cren-rang / .cren / .cren-nom`, **treize règles que
       * rien ne bâtit** : la grille a été réécrite en `.creneau*` (au-dessus) et
       * l'ancienne graphie est restée dans la feuille. Trouvé par
       * `outils/sites_encres.mjs`, qui cherche le SITE de chaque encre dans
       * `main.ts` : **deux des onze encres « jamais rendues » n'avaient aucun
       * site du tout.** *Une règle qu'aucun nœud ne porte n'est pas une règle
       * jamais vue — c'est une règle MORTE, et les deux se lisent pareil dans
       * une liste de manques.* Le bloc est retiré, la phrase remonte ici.
       */
      .creneau.refuse { border-style: solid; border-left: 3px solid var(--stamp); }
      /*
       * ⛑ S291 — `--stamp` à 8 px sur `--ink` rend `2,62` : c'est la même
       * faute qu'au tampon, sur un fond SOMBRE cette fois — et là, `--alert`
       * est bien le remède de Croze (`5,55`). Le barré, lui, ne bouge pas :
       * c'est lui qui dit le refus, la couleur ne fait que l'appuyer.
       */
      .creneau.refuse .creneau-nom { color: var(--alert); text-decoration: line-through; }
      .creneau-motif { font-size: 9px; color: var(--stock-dim); line-height: 1.25; }
      /*
       * `WEAPON` n'est JAMAIS vide (règle de Croze) — mais l'arme de fiche
       * n'est pas publiée (fait 45). La case est donc NOMMÉE ET MANQUANTE, et
       * pas « LIBRE » : elle ne l'est pas.
       */
      /*
       * L'ARME DE FICHE est le SOCLE, pas une carte : une weapon card la
       * RECOUVRE, et quand la carte part on repasse dessus. La dessiner comme
       * une carte ferait croire qu'on peut la defausser — elle ne peut etre ni
       * perdue, ni volee, ni defaussee.
       */
      .creneau-carte.socle { color: var(--stock-dim); font-size: 10px;
                             font-style: italic; }

      /*
       * ═══ ⚑ S77 · LA CARTE ENTIÈRE SUR LA PIÈCE PORTÉE, ZOOM AU SURVOL ═══
       *
       * Spec Croze : *« pour les loots GEAR, les faire apparaître sur la fiche
       * d'inventaire lorsqu'équipés ; au survol, possibilité de zoomer ; les
       * stats affichées au survol. »*
       *
       * ⚠ **AUCUNE TEINTE RÉSERVÉE N'EST TOUCHÉE.** L'or reste la sortie,
       * l'ember le Collapse, le vert `#7FB069` le jouable. Le zoom est du
       * carton sur un voile sombre — la matière de la fiche.
       *
       * ⚠ **`transform` ET `opacity` SEULEMENT**, règle gravée : le panneau est
       * posé, à sa taille finale, et il n'apparaît qu'en opacité. Rien ne
       * relayoute au survol.
       */
      .cz { position: relative; display: block; margin-bottom: 3px; }
      /* `height: auto` ANNULE l'attribut `height` du HTML, qui n'est là que
         pour donner le RATIO avant l'octet — sans ça la vignette ferait
         1516 px de haut le temps du chargement. */
      /*
       * ⛑ S115 — LA MAIN EST DU PAPIER, ET ELLE EN A MAINTENANT LA TAILLE.
       * `38px` est la mesure d'un CRÉNEAU d'équipement, où la carte n'est
       * qu'une pastille. Dans la main, la carte est l'objet qu'on regarde
       * avant de le jouer : elle prend `104px`, et le zoom au survol reste
       * le même mécanisme qu'ailleurs.
       */
      /*
       * ⛑ S164 — **L'IMAGE PREND TOUTE LA BOÎTE, PARCE QUE LA BOÎTE EST
       * L'IMAGE.** `208px` était une largeur GRAVÉE dans un châssis de 300 :
       * c'est ce couple qui fabriquait le gris de Croze. `100 %` de `.card`,
       * dont la largeur est `--carte-l` — une seule mesure, et elle vit dans
       * `renderHandPlays`. `height: auto` laisse le ratio 1004×1516 décider de
       * la hauteur : la boîte n'a plus de plancher, elle a la taille du carton.
       */
      .hand .cz-vignette { width: 100%; height: auto; }
      /* Les 3 px sous la vignette montraient le châssis ; il n'y en a plus. */
      .hand .cz { margin-bottom: 0; }
      /*
       * ⛑ S129 — **PAS DE POP AU CENTRE : LE SURVOL DE LA MAIN, C'EST LE LEVER.**
       *
       * Retour de test Croze : *« l'animation de survol = MTG Arena (la carte
       * se LÈVE depuis l'éventail, fluide, transform 120/220 ms — pas un pop au
       * centre). »* Le lever existe depuis le S117 (`translateY` + `scale`, les
       * voisines qui s'écartent) — **et le panneau fixe centré s'ouvrait
       * PAR-DESSUS lui**, au même survol. Deux réponses au même geste, dont une
       * que Croze nomme et refuse.
       *
       * ⚑ **C'EST AUSSI LA RÉPONSE À LA QUESTION LAISSÉE OUVERTE AU S117** —
       * *« le grand zoom au survol de la main : un temps plutôt qu'un survol ? »*
       * La réponse est : **ni l'un ni l'autre au survol**. La carte est
       * désormais rendue à 208 px dans la main ; c'est elle qu'on lit, pas une
       * copie centrée. La règle de survol est donc RETIRÉE, pas neutralisée —
       * un `.cz-zoom` invisible mais vivant serait resté une surface prête à
       * se rouvrir au premier ajustement de sélecteur.
       *
       * Le zoom reste entier partout ailleurs : créneaux d'équipement, QTC,
       * fiche imprimée. C'est la MAIN qui n'en veut plus.
       */
      /*
       * ⚑ Le vert `#7FB069` de `ECRANS §2` — réservé au JOUABLE, et c'est
       * ici son emploi propre. Liseré statique : rien n'est animé.
       */
      .card.jouable { border-color: var(--activable);
        box-shadow: 0 0 0 1px var(--activable); }
      /*
       * ⛑ S124 — `object-fit: contain` SUR LES DEUX, ET C'EST LA FAMILLE DU
       * S120 QUI SE REFERME.
       *
       * **Mesuré, pas supposé**, viewport 1920×1080, boîte de CONTENU
       * (`clientWidth/clientHeight`, la bordure exclue — c'est la seule qui dise
       * si l'image est déformée) :
       *
       * ```
       * source (les 33 QTC comme les 300 cartes)   0.6667
       * vignette de quête        56 × 84    0.6667   écart  0,00 %
       * zoom `.cz-grande`       527 × 797   0.6612   écart −0,82 %
       * témoin carte de butin   102 × 154   0.6623   écart −0,65 %   ← PRÉEXISTANT
       * ```
       *
       * ⚑ **LE TÉMOIN EST CE QUI TRANCHE.** L'écart n'est pas né de mes 33
       * images : il vit sur `art/cartes/` depuis que le zoom existe. `border-box`
       * + une hauteur contrainte (`74vh`) laissent la largeur auto se calculer
       * sur la boîte de BORDURE, et `object-fit: fill` — le défaut CSS — étire
       * l'image pour combler l'écart au lieu de le laisser paraître.
       *
       * −0,8 % ne se voit pas ; **7,5 % se voyait**, et c'était l'art de tuile du
       * S120. *Même mécanique, deux amplitudes* — on ne corrige donc pas un
       * pixel, on retire la permission d'étirer. `contain` rend au pire deux
       * bandes de moins d'un pixel sur un panneau presque noir ; `fill` rend au
       * mieux une image fausse qu'on ne mesure pas.
       */
      .cz-vignette, .cz-grande { object-fit: contain; }
      /*
       * ⚑ **ET VOICI D'OÙ VENAIT LE −0,82 % — LA RACINE, PAS LE SYMPTÔME.**
       * `.cz-grande` porte `aspect-ratio: 1004 / 1516`, qui est la mesure des
       * **300 cartes de butin**. Réemployer le zoom maison, c'était donc aussi
       * hériter du RATIO d'un autre corpus : les 33 QTC font 1024 × 1536, et
       * la boîte leur imposait 0,6623 au lieu de 0,6667.
       *
       * `object-fit: contain` empêchait déjà l'image de MENTIR — elle se
       * serait posée en boîte avec deux bandes de 3 px. Mais une boîte fausse
       * reste une boîte fausse : *on ne laisse pas une mesure d'un corpus
       * gouverner un autre.* Chaque corpus déclare la sienne.
       *
       * Le plafond suit : `1536px`, la hauteur RÉELLE du pack — le S119 avait
       * gravé `1516` pour la même raison, sur l'autre corpus.
       */
      .qtc .cz-grande { aspect-ratio: 1024 / 1536; height: min(37vh, 768px); }
      /*
       * ═══ ⛑ S195 · LES TUILES CANDIDATES — LE MOTIF DE LA PLANCHE 6, EN TUILE
       *
       * Reco déposée au S186 et appliquée ici : *« les N cartons côte à côte, à
       * la taille du zoom maison, le survol qui agrandit, un clic qui
       * choisit »*. **Aucune règle de zoom neuve** — `.qtc` porte déjà les
       * quatre (vignette, panneau fixe, 140 ms, repli sur le nom) ; ce bloc ne
       * pose que la RANGÉE et le châssis du bouton.
       *
       * ⚠ **LA VIGNETTE EST GRANDE ICI, ET C'EST LE POINT.** Croze veut les
       * tuiles *« display à l'écran »*, pas des pouces à survoler : la vignette
       * prend 26 vh, le survol la porte à 37 vh comme les 33 QTC. *Une part de
       * fenêtre, jamais un nombre gravé.*
       *
       * ⚠ **LA RANGÉE DÉFILE PLUTÔT QUE D'ÉCRASER.** Le tirage peut en poser
       * plusieurs ; trois cartons rétrécis jusqu'à l'illisible ne montrent plus
       * rien — c'est la décision déjà prise pour la rangée des tuiles voisines.
       */
      .tuiles-tirees { display: flex; gap: 12px; align-items: flex-start;
                       overflow-x: auto; padding: 6px 0 2px; }
      .tuile-tiree { flex: 0 0 auto; display: flex; flex-direction: column;
                     align-items: center; gap: 4px;
                     background: none; border: 1px solid transparent; padding: 4px;
                     cursor: pointer; font-family: var(--mono);
                     text-transform: none; letter-spacing: normal;
                     transition: transform .12s, border-color .12s; }
      .tuile-tiree:hover, .tuile-tiree:focus-visible {
        transform: translateY(-4px); border-color: var(--activable); }
      .tuile-tiree .cz-vignette { width: auto; height: min(26vh, 540px);
                                  aspect-ratio: 1024 / 1536; border-radius: 2px; }
      .tuile-tiree-nom { font-family: var(--display); font-weight: 700; font-size: 14px;
                         letter-spacing: .06em; text-transform: uppercase;
                         color: var(--stock); max-width: 22ch; text-align: center; }
      /*
       * ⚑⚑ C-T2 — **QUI EST DÉJÀ SUR LA TUILE QU'ON ME PROPOSE**, note 158 ②.
       *
       * Croze : *« qu'on voie superposé dans un coin […] le perso qui est
       * dessus »*. **En bas à gauche**, par-dessus l'art, jamais à côté : une
       * pastille posée sous le carton se lirait comme une légende, et la
       * question est *« sur cette tuile-là »*.
       *
       * ⚠ **LE CARTON DEVIENT LE REPÈRE DE POSITION** (`position: relative`) —
       * il ne l'était pas, et sans ça la pastille irait se coller au premier
       * ancêtre positionné, c'est-à-dire à la fenêtre de question.
       *
       * ⚠ **LES DEUX CERCLES, ET AUCUNE TEINTE NEUVE** : blanc peint
       * (`--stock`) pour le siège humain, SANG (`--rouge`) pour un automate —
       * la DA « peinture blanche » (`docs/HUD_PEINTURE_BLANCHE.md`) ne
       * connaît que le noir, le blanc et le sang. Un cadavre garde le cercle
       * sang et perd ses couleurs.
       */
      .tuile-tiree { position: relative; }
      .tuile-occupants { position: absolute; left: 8px; bottom: 30px;
                         display: flex; gap: 4px; pointer-events: none; }
      .tuile-occ { width: 34px; height: 34px; border-radius: 50%;
                   overflow: hidden; display: grid; place-items: center;
                   background: var(--ink); border: 2px solid var(--rouge);
                   box-shadow: 0 1px 4px rgba(0, 0, 0, .65); }
      .tuile-occ.moi { border-color: var(--stock); }
      .tuile-occ.mort { filter: grayscale(1); opacity: .72; }
      .tuile-occ-ico { width: 100%; height: 100%; object-fit: cover; }
      .tuile-occ-nu { font-family: var(--display); font-weight: 700;
                      font-size: 15px; color: var(--stock); }
      /*
       * ⛑ S129 — **LE CADRE GRIS EST SUPPRIMÉ.** Retour de test Croze, verbatim :
       * *« cadre gris supprimé »*. C'était `border: 1px solid var(--rule)`.
       *
       * ⚑ **RETIRÉ POUR TOUS LES CORPUS, ET C'EST LA QUESTION « QUI D'AUTRE
       * PORTE CE PATRON ? »** La consigne est écrite sous « CARTES », mais le
       * cadre venait de `.cz-vignette`, que partagent les 300 cartes, les 33
       * QTC et les 18 fiches. Le garder ailleurs aurait fait une quête encadrée
       * à côté d'une carte qui ne l'est pas — *et l'argument de Croze vaut pour
       * les quatre : chacun de ces cartons porte DÉJÀ son propre cadre, imprimé
       * dans l'image. Le nôtre en était un second.*
       */
      .cz-vignette { display: block; width: 38px; height: auto;
                     border-radius: 2px; }
      .cz-absente { display: block; font-size: 8px; line-height: 1.2; }
      /*
       * Le panneau est FIXE et centré : la grille d'équipement vit en colonne
       * gauche, un panneau ancré à la case sortirait de l'écran sur la moitié
       * des cases. Centré, il est au même endroit pour les neuf — *un zoom qui
       * se déplace selon la case oblige à chercher ce qu'on vient d'ouvrir.*
       */
      /*
       * ═══ ⛑ S192 · LA COUCHE DU ZOOM — UN SEUL NOMBRE, ET L'ANCÊTRE MONTE AVEC
       *
       * Croze, note ⑧, verbatim : *« quand on zoome sur quête ou sur fiche
       * imprimée, l'image n'est pas sur le dernier layer visible — **en partie
       * masquée**. »* Et sa consigne : *« une seule règle de z-index pour toute
       * la famille zoom. »*
       *
       * ─── MESURÉ AVANT DE CHANGER UN NOMBRE, ET LE COUPABLE N'EST PAS LUI ──
       *
       * ```
       * .cz-zoom      z-index 60      rect [807, 328, 292, 423]
       * .col-gauche   position sticky · z-index AUTO      ← son parent
       * .main-basse   z-index 40  rect [0, 602, 1905, 478]   chevauche : OUI
       * .combat-fenetre  sticky · auto · [321, 130, 1233, 1064]  chevauche : OUI
       * ```
       *
       * **`position: sticky` CRÉE UN CONTEXTE D'EMPILEMENT.** Le `60` du zoom
       * est donc **local à `.col-gauche`**, et `.col-gauche` n'a AUCUN z-index :
       * elle vaut `auto` face au reste de la page. Le zoom ne monte pas à 60
       * dans l'écran — il monte à 60 **dans une colonne qui vaut zéro**.
       *
       * ⚑ **ET « EN PARTIE » EST LE MOT EXACT :** le zoom finit à `y = 751`, la
       * main commence à `y = 602`. **149 px du bas du zoom passent sous la
       * main**, à chaque fois. La fenêtre de moment, elle, le couvre en entier.
       *
       * ⚠ **MON PREMIER INSTRUMENT A DIT « RIEN NE LE MASQUE ».** Il cherchait
       * les éléments positionnés de z-index **> 60** : `.main-basse` vaut 40, il
       * l'a écartée. *Comparer un z-index local à des z-index de racine est une
       * mesure qui blanchit* — c'est la faute qu'elle mesurait, refaite par
       * l'instrument. Le second compare au niveau de la RACINE, et il trouve
       * deux masques.
       *
       * ─── LE REMÈDE : UN NUMÉRO, ET IL EST DONNÉ À DEUX CHOSES ─────────────
       *
       * Monter le zoom ne suffit pas : **c'est l'ancêtre qui l'emprisonne.**
       * `--z-zoom` sert donc au zoom **et** à l'ancêtre qui le porte, le TEMPS
       * du zoom seulement (`:has()`, déjà l'idiome de ce fichier pour la
       * voisine de la main). Hors zoom, aucune colonne ne change de rang — *une
       * colonne définitivement au-dessus serait un second défaut, pas un
       * remède.*
       *
       * `960` : au-dessus de `.plein` (950), de `.bv-couche` (940) et de
       * `.dicelayer` (900) — **sous le bandeau ADMIN (999)**, qui est un
       * avertissement de 22 px et doit rester lisible.
       */
      .cz-zoom { position: fixed; left: 50%; top: 50%; z-index: var(--z-zoom);
                 transform: translate(-50%, -50%) scale(.985);
                 display: flex; gap: 14px; align-items: flex-start;
                 /*
                  * ⚑ S119 — le panneau suit son image : un plafond de 900 px
                  * gravé aurait ré-enfermé le zoom qu'on vient de libérer.
                  */
                 padding: 14px; max-width: min(calc(var(--uvw) * 92), 1600px);
                 background: rgba(16, 14, 11, .97);
                 border: 1px solid var(--gold); border-radius: 4px;
                 box-shadow: 0 18px 60px -12px #000;
                 opacity: 0; pointer-events: none;
                 transition: opacity 140ms ease-out, transform 140ms ease-out; }
      .creneau:hover .cz-zoom, .cz:focus-within .cz-zoom {
        opacity: 1; transform: translate(-50%, -50%) scale(1); }
      /*
       * ⛑ S124 — LES 33 VISUELS QUÊTES / PIÈGES / COFFRES.
       *
       * ⚑ **UNE RÈGLE DE SURVOL AJOUTÉE, ZÉRO PANNEAU NEUF.** `.qtc` porte les
       * mêmes `cz-*` que la carte de butin : le zoom fixe, centré, à 140 ms,
       * est LE zoom maison. Ce qui change d'un emploi à l'autre est la
       * VIGNETTE, jamais le panneau — c'est ce qui a évité un second zoom à
       * dériver au premier ajustement.
       */
      .qtc:hover .cz-zoom { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      /*
       * ⛑ S192 — **L'ANCÊTRE QUI EMPRISONNE LE ZOOM MONTE AVEC LUI.** Une seule
       * règle, un seul nombre, et les quatre parents possibles de la famille
       * zoom : les deux colonnes, la fenêtre de moment, la main. Les trois
       * déclencheurs sont ceux qui ouvrent déjà le panneau — `.cz`, `.qtc`,
       * `.creneau` — et le `:focus-within` est là pour que le clavier ouvre la
       * même chose que la souris.
       *
       * ⚠ **`.main-basse` GARDE SON 40 HORS ZOOM** : c'est le rang qui la met
       * au-dessus du plateau sans passer devant les moments. Elle ne monte que
       * le temps où l'on regarde une carte, et elle redescend seule.
       */
      /*
       * ⛑⛑ **S753 — CETTE RÈGLE EST GARDÉE, ET ELLE N'EST PLUS LA RÉPARATION.**
       * Depuis la note 86 ③ le remède est `#zoom-coin`, plus bas : le volet
       * QUITTE sa colonne au survol, donc plus aucun ancêtre ne l'emprisonne.
       * Elle reste comme FILET pour l'instant où le volet est encore chez lui
       * (la toute première image du survol, avant que l'écouteur ne passe) —
       * et **elle n'a plus à être complétée** : c'est justement l'entretien
       * qu'elle exigeait, et qu'on a oublié pour la fiche, qui l'a condamnée.
       * ⚠ Ne pas y AJOUTER de déclencheur : la bonne porte est la table
       * `ANCRES_DE_ZOOM` de `main.ts`, une seule, et déléguée.
       */
      .col-gauche:has(:is(.cz, .qtc, .creneau):is(:hover, :focus-within)),
      .col-droite:has(:is(.cz, .qtc, .creneau):is(:hover, :focus-within)),
      .combat-fenetre:has(:is(.cz, .qtc, .creneau):is(:hover, :focus-within)),
      .main-basse:has(:is(.cz, .qtc, .creneau):is(:hover, :focus-within)) {
        z-index: var(--z-zoom);
      }
      /*
       * ═══ ⛑⛑ S753 · L'HÔTE DE ZOOM À LA RACINE — note 86 ③ ════════════════
       *
       * Croze, verbatim : *« un seul hôte de zoom à la racine du document
       * (`#zoom-coin`, comme `#quetes-coin`), `z-index: var(--z-zoom)`, et tout
       * pop-out s'y téléporte au survol au lieu de vivre dans sa colonne. Plus
       * aucun contexte d'empilement ne peut le prendre. »*
       *
       * ⚠ **`inset: 0` ET `pointer-events: none` : C'EST UN PLAN, PAS UNE
       * BOÎTE.** L'hôte couvre l'écran pour que les volets `position: fixed`
       * gardent leur repère, et il ne doit RIEN intercepter — sinon il avalerait
       * tous les clics de la page. Chaque volet reprend `pointer-events: auto`
       * pour lui seul, par la règle `.zc-ouvert` juste dessous.
       *
       * ⚠ **AUCUN `z-index` SUR LES ENFANTS ICI** : ils portent déjà le leur
       * (`--z-zoom`), et il redevient enfin ce qu'il annonce — un rang de
       * RACINE, plus un rang local à une colonne qui vaut zéro.
       */
      #zoom-coin { position: fixed; inset: 0; z-index: var(--z-zoom);
                   pointer-events: none; }
      /*
       * ⚠⚠ **LA CLASSE PORTE L'OUVERTURE PARCE QUE LA DESCENDANCE NE LE PEUT
       * PLUS.** Les règles d'ouverture d'origine sont des sélecteurs de
       * DESCENDANCE (`.encadre-perso:hover .ep-fiche`, `.creneau:hover
       * .cz-zoom`) : une fois téléporté, le volet n'est plus descendant de son
       * ancre et elles cessent de mordre. `zc-ouvert` est posée par le MÊME
       * geste que le déplacement — *l'ouverture et la place ne peuvent pas
       * diverger si un seul geste les écrit toutes les deux.*
       */
      /* ⛑ S1311 · IN-2 — un item porté se déséquipe au clic : la main le dit. */
      .creneau.cr-clic { cursor: pointer; }
      /* ⛑ S1309 · IN-1 — survol de l'inventaire : la carte seule, sans le texte qui la redit. */
      #zoom-coin > .cz-zoom.zc-carte-seule > .cz-cote { display: none; }
      #zoom-coin > .zc-ouvert {
        opacity: 1; visibility: visible; pointer-events: auto;
        transform: translate(-50%, -50%) scale(1);
      }
      /* La fiche imprimée garde sa largeur et son plafond hors de sa colonne. */
      #zoom-coin > .ep-fiche.zc-ouvert {
        position: fixed; left: 50%; top: 50%; right: auto;
        width: min(560px, calc(var(--uvw) * 92)); max-height: calc(var(--uvh) * 86); overflow-y: auto;
      }
      /*
       * ⚠⚠ **LA SUPPRESSION DU ZOOM IMBRIQUÉ SUIT LE VOLET — SANS CETTE LIGNE,
       * LE S462 SE DÉFAIT AU PREMIER SURVOL.** Sa règle est
       * `.encadre-perso > .ep-fiche .cz-zoom { display: none }`, un sélecteur de
       * DESCENDANCE : téléporté, le volet n'est plus sous `.encadre-perso` et la
       * suppression tombe. Reviendrait alors ce que le S462 avait justement tué
       * — *« une seconde copie centrée de la même fiche par-dessus la
       * première »*. **Une règle qui protège d'un défaut doit déménager avec ce
       * qu'elle protège**, sinon le déménagement ressuscite le défaut.
       */
      #zoom-coin > .ep-fiche .cz-zoom { display: none; }
      /* ⛑ S130 — le bandeau du banc. L'ember est RÉSERVÉ au Collapse : on prend
         le rouge d'erreur, qui dit « ceci n'est pas la partie » sans lui voler
         sa couleur. */
      .banc-faux { font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
                   color: var(--err, #C0524A); border: 1px dashed var(--err, #C0524A);
                   padding: 4px 10px; margin-bottom: 8px; text-align: center; }
      /*
       * ⛑ S127bis — LA BANDE D'ÉTAT DE MA TUILE. Ce qui reste du bloc mort :
       * une ligne, pas un tableau. Elle se replie sur elle-même en étroit —
       * *rien d'enfermé en 1920*, et un état qui déborde ne se lit pas.
       */
      .tuile-etat { display: flex; flex-wrap: wrap; gap: 4px 8px;
                    align-items: baseline; margin-top: 3px; font-size: 10px; }
      /*
       * ⛑ S126 — LA FICHE IMPRIMÉE : même zoom, ratio PROPRE.
       *
       * ⚑ **1414 × 2000 — MESURÉ SUR LES 18, PAS SUPPOSÉ.** C'est le troisième
       * corpus et le plus éloigné des deux autres (0,7070 contre 0,6667 et
       * 0,6623). Sans cette ligne il aurait hérité de l'`aspect-ratio` des
       * cartes de butin — **6,7 % d'écart**, soit neuf fois ce que le S124 a
       * corrigé sur les QTC. La leçon est appliquée AVANT d'être repayée.
       *
       * Le plafond suit la source : `2000px`, la hauteur réelle du pack. Elle
       * dépasse enfin le besoin 4K (1 598 px) — *ce pack-ci ne manque de rien*,
       * contrairement aux cartes de butin (`S119`, −5 %).
       */
      /*
       * ⛑ S170 — **`74vh` ICI EST UNE DÉCISION, PLUS UN OUBLI.**
       *
       * La consigne (c) du S129 — *« ×2 plus PETITES zoomées »* — a été
       * appliquée au zoom maison : `74vh → 37vh`, et les créneaux comme les 33
       * QTC en héritent (mesuré ce jour : `399,6 px` chacun sur un 1080). **La
       * fiche est restée à `74vh`, seule, et rien ne disait pourquoi** — une
       * divergence muette se fait « corriger » un jour par quelqu'un qui la
       * prend pour un oubli. Elle est donc écrite.
       *
       * **L'argument de Croze porte sur la PART D'ÉCRAN au regard de ce qu'on
       * peut lire AU REPOS**, pas sur le corpus : *« une carte qui remplit les
       * trois quarts de la hauteur n'est plus un zoom, c'est une
       * interruption »* — et le S129 le justifiait par *« depuis le S129 elle
       * est lisible à 208 px dans la main »*. **La fiche n'a pas ce repos-là** :
       * sa vignette vaut `clamp(160px, 17vh, 300px)`, soit **184 px de large**
       * sur un 1080, pour une planche de personnage — rang, six capacités,
       * stats et texte. Un loot à 208 px se lit ; une fiche à 184 px, non.
       *
       * *Deux corpus, deux repos, deux zooms — c'est la même règle appliquée,
       * pas une exception.* Le jour où la fiche se lit au repos, ce `74vh`
       * tombe avec le S129.
       */
      .fi-carte .cz-grande { aspect-ratio: 1414 / 2000; height: min(calc(var(--uvh) * 74), 2000px); }
      .fi-carte:hover .cz-zoom { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      /* La carte EST le bloc : elle prend la largeur de la colonne, pas 38 px. */
      .fi-carte { position: relative; display: block; margin-bottom: 6px; }
      .fi-carte .cz-vignette { width: 100%; max-width: clamp(160px, calc(var(--uvh) * 17), 300px);
                               margin: 0 auto; }
      /*
       * Trois emplois, trois tailles, et chacune est celle de son voisinage :
       *  · la quête vit dans une liste de texte  → une carte à côté du nom ;
       *  · le piège vit dans une MODALE qui n'a rien d'autre à montrer, donc
       *    il prend la place (`clamp` : jamais enfermé en 1920, règle Croze) ;
       *  · le coffre s'ouvre au-dessus de ses dés, qu'il ne doit pas chasser.
       */
      .quete .qtc { float: left; margin: 0 8px 4px 0; }
      /*
       * ⚠ **58 px GRAVÉS : LA RÈGLE PERMANENTE, PRISE EN DÉFAUT PAR SA PROPRE
       * MESURE.** Premier jet. Relevé à 3840×2160 : la vignette rendait
       * `56×84` — **exactement la même qu'en 1080**, quand ses deux sœurs
       * (piège, coffre) avaient suivi l'écran. *« N'enferme rien dans une
       * fenêtre qui ne bougerait jamais de 1920 »* — et j'y avais enfermé la
       * première des trois, en 1080 cette fois. `5.4vh` vaut 58 px à 1080 : la
       * taille voulue est conservée, elle cesse seulement d'être gravée.
       */
      .quete .qtc .cz-vignette { width: clamp(48px, 5.4vh, 110px); }
      .moment-piege .qtc { margin: 0 auto 8px; }
      /*
       * ⛑ **S208 — TRAP ET CHEST : « c'est la même chose », et ce qu'ils
       * n'avaient PAS.** Note ⑫ ②. Mesuré avant de toucher : ni le S199 ni le
       * S202 n'ont jamais touché ces deux règles — **elles n'ont pas subi le
       * −40 %, elles étaient nées petites** (172 px de piège, 76 px de coffre à
       * 1080, contre 266 de tuile). Il n'y a donc pas d'« avant » où viser.
       *
       * Reco unique, journalisée dans `QUESTIONS_CLASSEUR.md` : **le MÊME
       * `×1,333` que les deux autres surfaces.** Une seule consigne, un seul
       * facteur — inventer ici un second nombre ferait deux grammaires pour une
       * phrase. `16 → 21,3vh` et `7 → 9,3vh`, bornes basse et haute suivies.
       */
      .moment-piege .qtc .cz-vignette { width: clamp(186px, 21.3vh, 346px); }
      /*
       * ═══ ⚑ S305 · LA SCÈNE DE PIÈGE DÉPOUILLÉE — note ㉗ ② ══════════════
       *
       * ⓐ **LE REPLI EST CACHÉ, PAS ABSENT.** Le nom et le texte imprimé sont
       *    DANS le DOM et n'apparaissent que si l'image manque (`.du`, posé par
       *    l'écouteur d'erreur). `display: none` plutôt qu'une absence : c'est
       *    ce qui permet de le découvrir sans re-rendre.
       *    ⚠ Et c'est l'exception nommée à la garde du S279 (*« une ligne pas
       *    encore due n'est pas dessinée, elle n'est pas cachée »*) : là il
       *    s'agissait d'un TEMPS à venir, que l'instrument de balayage
       *    compterait comme montré ; ici il s'agit d'un REPLI dont l'arrivée
       *    dépend d'un événement du navigateur, pas de l'horloge.
       */
      .piege-repli { display: none; }
      .piege-repli.du { display: block; }
      /*
       * ⓑ **« EN GROS » NE VAUT QUE PENDANT LE PREMIER TEMPS.** Seule sur
       *    l'écran, la carte monte à `34vh` (≈ 367 px de large à 1080) ; dès
       *    que le dé entre, elle retombe à la taille du S208 pour que le
       *    roulis, le résultat et l'effet tiennent sous elle. Le rapport
       *    1024×1536 est celui du carton : la hauteur suit, on ne la fixe pas.
       */
      .moment-piege.carte-seule .qtc .cz-vignette { width: clamp(240px, 34vh, 470px); }
      /* ⛑ S1394 · L-T2 bis (note 215 ③) — la carte du piege une fois, en grand du debut
         a la fin ; le degat sous chaque de, en sang. */
      .moment-piege .piege-carte { display: block; margin: 0 auto 14px; height: clamp(220px, 36vh, 440px);
                                   width: auto; border-radius: 12px; box-shadow: 0 14px 40px rgba(0,0,0,.7); }
      .moment-piege .piege-des .butin-face { font-size: 34px; }
      .moment-piege .piege-des .piege-dmg { font-family: var(--display); font-weight: 800; font-size: 24px;
                                            letter-spacing: .08em; color: var(--stamp); }
      /*
       * ⓒ **LE HIDE RANGE LA SCÈNE, IL NE LA COUPE PAS.** `.compacte` n'existait
       *    que sous `.dicelayer` ; la règle du piège est la sienne, avec le même
       *    sens : la carte redevient une vignette, le déroulé reste lisible, et
       *    le jeu continue dessous.
       */
      .moment-piege.compacte .qtc .cz-vignette { width: clamp(72px, 8vh, 120px); }
      .moment-piege.compacte .mc-atktx,
      .moment-piege.compacte .butin-des { font-size: 11px; }
      .moment-piege .hide-btn { margin-top: 6px; }
      /* Le coffre vit dans le panneau de BUTIN, pas dans la scène de dés. */
      .butin .qtc, .moment-coffre .qtc { float: left; margin: 0 10px 4px 0; }
      .butin .qtc .cz-vignette, .moment-coffre .qtc .cz-vignette {
        width: clamp(150px, 24vh, 300px); }
      /* S1389 · L-T2 ① — la carte du coffre EN GRAND, dès la scène des dés. */
      .qtc.scene-coffre { margin: 0 auto 10px; }
      /* ⛑ S1397 · L-T3 (note 212 ②) — l'annonce du butin fixe, en un mot, qui s'efface avec le vol */
      .bv-annonce { position: fixed; transform: translateX(-50%); z-index: 1; white-space: nowrap;
                    font-family: var(--display); font-weight: 800; font-size: 34px; letter-spacing: .12em;
                    color: var(--stock); text-shadow: 0 2px 12px rgb(0 0 0 / .9);
                    animation: bv-annonce 1.6s ease-out forwards; pointer-events: none; }
      .bv-annonce[data-rar="common"]    { color: var(--rar-common); }
      .bv-annonce[data-rar="uncommon"]  { color: var(--rar-uncommon); }
      .bv-annonce[data-rar="rare"]      { color: var(--rar-rare); }
      .bv-annonce[data-rar="epic"]      { color: var(--rar-epic); }
      .bv-annonce[data-rar="legendary"] { color: var(--rar-legendary); }
      @keyframes bv-annonce { 0% { opacity: 0; } 15% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
      /* ⛑ S1395 · S-T5 (note 215 ④) — la volee expliquee : qui lance, la table des issues AVANT le de, l'issue en clair. */
      .scene.volee-expliquee .volee-titre { font-size: 30px; letter-spacing: .1em; }
      .scene.volee-expliquee .volee-qui { font-size: 18px; margin: 4px 0 12px; }
      .dicelayer .aj-issues { display: grid; gap: 6px; justify-content: center; margin: 8px auto 14px;
                              padding: 8px 16px; border: 1px solid var(--rule); background: rgb(0 0 0 / .45); }
      .dicelayer .aj-issues .volee-issue { display: flex; gap: 14px; align-items: baseline; font-size: 18px; }
      .dicelayer .aj-issues .volee-quand { font-family: var(--display); font-weight: 800; color: var(--stock); min-width: 7em; text-align: right; }
      .dicelayer .aj-issues .volee-quoi { color: var(--stock-dim); }
      .scene.volee-expliquee .volee-issues { display: grid; gap: 6px; justify-content: center; margin: 0 auto 16px;
                                             padding: 10px 18px; border: 1px solid var(--rule); background: rgba(0,0,0,.45); }
      .scene.volee-expliquee .volee-issue { display: flex; gap: 14px; align-items: baseline; font-size: 20px; }
      .scene.volee-expliquee .volee-quand { font-family: var(--display); font-weight: 800; color: var(--stock); min-width: 7em; text-align: right; }
      .scene.volee-expliquee .volee-quoi { color: var(--stock-dim); }
      .scene.volee-expliquee .volee-issue-dite { font-size: 22px; }
      /* ⛑ S1394 · L-T2 bis (note 215 ③) — la carte du coffre une fois, en grand ;
         la rarete sous chaque de, dans sa couleur, une fois le de pose. */
      .dicelayer .scene-coffre-carte { display: block; margin: 0 auto 2vh; height: clamp(220px, 38vh, 460px);
                                       width: auto; border-radius: 12px; box-shadow: 0 14px 40px rgba(0,0,0,.7); }
      .dicelayer .dgroup.coffre-rangee { gap: 34px; margin-bottom: 5vh; }
      .dicelayer .rar-sous-de { position: absolute; left: 50%; top: calc(100% + 12px); transform: translateX(-50%);
                                font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: .12em;
                                white-space: nowrap; color: var(--stock-dim); transition: opacity .25s; }
      .dicelayer:not(.t2) .rar-sous-de { opacity: 0; }
      .dicelayer .rar-sous-de[data-rar="common"]    { color: var(--rar-common); }
      .dicelayer .rar-sous-de[data-rar="uncommon"]  { color: var(--rar-uncommon); }
      .dicelayer .rar-sous-de[data-rar="rare"]      { color: var(--rar-rare); }
      .dicelayer .rar-sous-de[data-rar="epic"]      { color: var(--rar-epic); }
      .dicelayer .rar-sous-de[data-rar="legendary"] { color: var(--rar-legendary); }
      .qtc.scene-coffre .cz-vignette { width: clamp(150px, 24vh, 300px); }
      /* Le `⤢` est DÉJÀ une surface pleine — deux pleins vivants sont interdits. */
      .cz-zoom.cz-sans { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .cz-zoom { transition: opacity 140ms ease-out; }
        .creneau:hover .cz-zoom { transform: translate(-50%, -50%) scale(1); }
      }
      /* `min(...)` : la carte fait 1004×1516, elle se montre ENTIÈRE, ratio
         préservé — jamais d'étirement, consigne de poids de Croze. */
      /*
       * ⚑ **S119 — LE ZOOM MONTE JUSQU'À LA RÉSOLUTION DE SA SOURCE, ET PAS
       * D'UN PIXEL DE PLUS.** `760px` était un plafond gravé : sur un 4K,
       * `74vh` vaut 1 598 px et l'image restait à 760 — *la moitié de ce que
       * le fichier contient*.
       *
       * **Le nouveau plafond est une MESURE, pas un choix** : les 299 cartes
       * de `art/cartes/` font toutes **1 004 × 1 516** (relevé sur les 299
