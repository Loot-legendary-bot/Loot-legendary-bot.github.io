    <style>
      /*
       * ═══ LA PEAU EST CELLE DU BANC v3, ET C'EST LE SEUL RENDU ═══════════
       *
       * **Décision de Croze, close : v3 est LA PEAU, pas une seconde UI.** Un
       * seul rendu, pas deux onglets, pas de mode qui remplace la disposition —
       * ce seraient deux lectures du même état, et `ECRANS.md §0` interdit
       * exactement ça. La couche `?debug=1` AJOUTE des lignes sous l'écran
       * joueur ; elle n'en déplace aucune.
       *
       * Les jetons viennent de `packages/debug-ui/design/priority-bench-v3.html`
       * tels quels. **Le banc n'est pas repris comme code** — il est simulé de
       * bout en bout ; ce qui traverse, c'est la matière : encre, carton, tampon.
       *
       * ⚠ La direction visuelle N'EST PAS FIGÉE — elle se juge en jouant
       * (`ECRANS.md §15`). Ce fichier est donc un état, pas une décision.
       */
      /*
       * ═══ ⛑⛑ S520 · LA DA PLUS SOMBRE — note 54 ⑥, ET LA PALETTE EST MESURÉE
       * DANS SES PROPRES RÉFÉRENCES, PAS CHOISIE ═══════════════════════════════
       *
       * Croze, verbatim : *« fais un truc plus sombre et désaturé, plus donjon,
       * dans l'atmosphère de mes inputs »*, et il dépose seize fichiers dans
       * `ASSETS/DA` — *« elles ont des noms, amuse-toi avec pour le style »*.
       *
       * **Échantillonné, 199 360 pixels sur ses treize images fixes :**
       *
       * ```
       * luminance   p25  0,0 %   ·  p50  2,0 %  ·  p75  20,8 %  ·  p95  93,1 %
       * saturation  p25  0,0 %   ·  p50  2,0 %  ·  p75  31,9 %
       * dominantes  #080808 · #480808 · #E8E8D8 · #F8F8E8 · #181818 · #282828
       * ```
       *
       * **Deux faits, et ils tranchent :** ⓐ son monde est **NEUTRE**
       * (`R = G = B` sur toutes les dominantes sombres) quand mes encres sont
       * BRUNES (`#15120F` : `R > G > B`) — *« désaturé »* est donc littéral, pas
       * une impression ; ⓑ il est **plus sombre d'un cran** : médiane à 2 %
       * quand `--ink` est à 7 %.
       *
       * ⚑ **ET SES QUATRE PALIERS DE GRIS TOMBENT SUR MES QUATRE ENCRES.**
       * `#080808 · #181818 · #282828 · #383838` contre `ink · ink-2 · ink-3 ·
       * rule` : **le même escalier**, à la teinte près. On ne refait donc pas la
       * gamme — *on lui retire sa chaleur et on descend d'une marche.* Rien de
       * la STRUCTURE ne bouge, et c'est ce qui rend le geste réversible.
       *
       * ⚠⚠ **CE QUI NE BOUGE PAS, ET CE N'EST PAS UN OUBLI.** `--activable`
       * (`#7FB069`, le vert jouable) et `--ember` (réservé au Collapse) sont
       * **GRAVÉS** par le runbook ; `--stamp`, `--gold`, `--slate` portent une
       * SIGNIFICATION (refus · gear · atténué) et non une ambiance. *Assombrir
       * une ambiance ne donne pas le droit de repeindre un signal.*
       *
       * ⚠ Le carton, lui, garde une pointe de chaud : ses blancs sont des
       * **os**, pas du papier machine (`#E8E8D8`, bleu en retrait). Il monte
       * légèrement — le fond descendant, l'encre doit suivre pour que le
       * contraste ne se paie pas.
       */
      :root {
        --ink:       #0B0B0B;  /* l'encre : le fond, c'est un jeu imprimé      */
        --ink-2:     #151515;
        --ink-3:     #1F1F1F;
        --stock:     #F2F2F2;  /* le carton : texte courant                    */
        --stock-2:   #DDDDDD;
        --stock-dim: #A1A1A1;  /* atténué — les raisons, les libellés          */
        /*
         * ═══ ⛑⛑ S536 · SON ROUGE EN A DEUX, ET C'EST UNE MESURE ═════════
         *
         * Note 55 : `#8B0D0D`, *« accent, danger, sélection, éléments actifs »*,
         * 10 % de la surface, sur son noir `#0B0B0B`. **Mesuré :**
         *
         * ```
         * #8B0D0D en ENCRE sur #0B0B0B  2,03    sur #151515  1,88   sur #1F1F1F  1,70
         * #8B0D0D en APLAT, son blanc dessus                              8,68
         * ```
         *
         * **Son rouge sur ses noirs ne passe AUCUN seuil** — ni 4,5 (texte), ni
         * 3,0 (objet graphique). Il est magnifique en APLAT sous du blanc, et
         * illisible en encre. *Une couleur n'a pas un contraste, elle en a un
         * PAR FOND* (S244) : la note donne un couple, elle ne donne pas les
         * trois emplois.
         *
         * Deux jetons, donc, et **le second est DÉRIVÉ du premier, pas choisi** :
         * même teinte (`0°`), même saturation (`0,829`), **clarté montée
         * jusqu'à ce qu'il passe 4,5 sur les TROIS gris de panneau** —
         * `L = 0,615`, soit `5,40 / 5,01 / 4,52`.
         *
         *   `--rouge`      l'APLAT et le carton clair — SA valeur, intacte
         *   `--rouge-vif`  l'ENCRE et le LISERÉ, sur ses noirs
         *
         * ⚠ Déposé en `Q-ROUGE-ENCRE` : s'il veut UNE seule valeur, la seule
         * route est de peindre les accents en APLAT (fond rouge, texte blanc)
         * au lieu de les écrire en rouge. C'est un chantier de FORMES, pas de
         * couleurs, et il coûte plus qu'une ligne.
         */
        --rouge:     #8B0D0D;  /* SA valeur — aplat, ou carton clair          */
        --rouge-vif: #EE4B4B;  /* la même, éclaircie jusqu'au seuil (dérivée)  */
        --stamp:     var(--rouge);  /* le tampon de refus — il vit sur le carton CLAIR */
        --ember:     var(--rouge-vif);  /* ce qui brûle : le moment, le total           */
        /*
         * ⛑ **S244 — L'ARDOISE MONTE EN CLARTÉ, ET SEULEMENT EN CLARTÉ.**
         *
         * GO signé du classeur (note ⑰ ②) : `#838E9B`. *Même teinte, même
         * saturation, seule la clarté monte* — ce n'est donc pas un jeton neuf,
         * c'est le même, lisible. Elle porte à elle seule **la plus grosse
         * famille sous le seuil** : mesuré au banc avant, `.cap` ×8, `.src` ×5,
         * `.rien` ×4, `.passif-auto` ×3, `.passif-tag` ×2, plus `.ruban-borne`,
         * `.choix-titre`, `.fi-fam`, `.tampon-build`, `.skip` — toutes entre
         * **2,85 et 3,23** là où leur corps en exige 4,5.
         */
        --slate:     #8D8D8D;
        --gold:      #909090;  /* liseré or : donné par le gear (§2)           */
        /*
         * §2 « les signaux réservés » — **LE PORTAIL A SON PROPRE NOM.**
         *
         * Il vaut la même teinte que `--gold` aujourd'hui, et ce n'est PAS la
         * même chose : `--gold` est une MATIÈRE (le châssis du gear), celui-ci
         * est un SIGNAL D'ÉVÉNEMENT (une sortie vient d'apparaître). Les fondre
         * ferait bouger le portail le jour où le liseré du gear change de ton —
         * et `--gold` porte déjà cinq sens à lui seul.
         *
         * *Un jeton par FAIT, pas par teinte.* C'est la leçon de `--ink`, prise
         * un cran plus tôt : là, deux sens sur un nom se sont découverts à
         * l'écran ; ici, on les sépare avant.
         */
        /*
         * ⛑⛑ **S611 — LE PORTAIL PASSE AU BLEU, ET C'EST LE MOT DE CROZE.**
         * Note 72 D : *« un portail bleu, esprit Dark and Darker. »*
         *
         * ⚠ **Le commentaire vingt lignes plus bas disait « l'or du portail »**
         * (la réservation de `§2`) et refusait, au S27, de repeindre ce jeton
         * faute d'un ordre littéral — *« si la lecture était littérale, un mot
         * suffit et la ligne bouge. »* **Le mot est arrivé.** C'est exactement
         * pour ça que ce jeton existe : un jeton par FAIT, nommé, pour que la
         * teinte reste remappable sans toucher à ses lecteurs.
         *
         * ⚠ **LA VALEUR N'EST PAS INVENTÉE** — règle numéro un. C'est le bleu
         * que la maison porte déjà (`--ec-frost`), recopié ici en VALEUR et non
         * par `var()` : lier le portail à une école ferait bouger l'un quand
         * l'autre change, et *un jeton par FAIT* l'interdit.
         */
        --portail:   #6FB6D9;
        /*
         * `PDF UI_CARD_DRAW_AND_ROLL`, planche 3 — **LE CADRE DORÉ DU VAINQUEUR
         * A SON PROPRE NOM, TROISIÈME PORTEUR DE CETTE VALEUR.**
         *
         * Même doctrine qu'au-dessus, appliquée une fois de plus : *un jeton par
         * FAIT, pas par teinte.* `--gold` est une MATIÈRE (le châssis du gear),
         * `--portail` un ÉVÉNEMENT (une sortie apparaît), `--win` une ISSUE
         * (ce camp a gagné le jet). Trois faits, trois noms — et le jour où le
         * liseré du gear change de ton, le vainqueur ne bouge pas avec lui.
         */
        --win:       var(--rouge-vif);
        /*
         * §2 « les signaux réservés » — **L'ACTIVABLE, ET IL A SON PROPRE NOM.**
         *
         * Spec S27 de Croze, mot pour mot : *« encadrés VERT quand
         * utilisables »*. ⚑ **Le verdict était déjà calculé et n'avait aucun
         * signal** : mesuré en combat, `.abil` et `.abil.no` rendaient la MÊME
         * bordure (`rgb(58,50,42)`, `1px`), et seule l'opacité les séparait.
         * *Une distinction calculée que rien ne montre n'existe pas à l'écran.*
         *
         * ⚠ **Il ne marche sur aucune des trois réservations** : ni l'orange
         * braise du Collapse, ni le rouge tampon du refus, ni l'or du portail.
         * C'est le pendant POSITIF du tampon — l'un dit *pourquoi non*, l'autre
         * dit *oui, celui-ci* — et un vert d'encre, pas un vert d'écran : le
         * châssis est un jeu imprimé.
         *
         * ─── LA TEINTE EST CELLE DE CROZE, ET ELLE N'EST PLUS PROVISOIRE ────
         *
         * `#7FB069` **patiné**, donné en salve et confirmé : *« le vert est
         * confirmé, plus un placeholder »*. Mon `#4E7A45` d'essai est retiré.
         *
         * ⚑ **LA CONSIGNE DISAIT « sur le jeton `--portail` », ET JE NE L'AI PAS
         * FAIT — c'est signalé, pas contourné.** Repeindre `--portail` en vert
         * déplacerait **le portail ouvert**, dont `§2` réserve l'or, et le
         * portail perdrait le seul signal qui dise *« une SORTIE vient
         * d'apparaître »*. La dictée disait à mon sens *à la manière de*
         * `--portail` — un jeton par FAIT, nommé, pour que la teinte reste
         * remappable. C'est ce qui est fait. **Si la lecture était littérale, un
         * mot suffit et la ligne bouge.**
         *
         * ⚠ **`patiné` est un TRAITEMENT, pas une autre valeur.** La teinte
         * livrée est posée telle quelle — corriger un hex reçu serait inventer
         * une valeur (règle numéro un). Le patinage est dans le rendu : liseré
         * interne à 34 %, jamais un aplat.
         */
        --activable: var(--rouge-vif);
        /*
         * §2 « les signaux réservés » — **LES SIX ÉCOLES, TEINTES NEUVES.**
         *
         * Une par école, et **aucune ne marche sur les trois réservations** :
         * l'orange braise reste au Collapse, le rouge tampon au refus, l'or au
         * portail. Le feu est donc un ROUGE-ORANGÉ CLAIR, distinct des deux
         * précédents — une école n'est ni une menace ni un refus.
         *
         * Elles sont ici et dans `ECRANS §2` : une couleur qui n'est pas nommée
         * dans le document est une couleur qu'on remappera.
         */
        --ec-arcane:    #9B7BD4;
        --ec-chaos:     #C06CA8;
        --ec-fire:      #E2703A;
        --ec-frost:     #6FB6D9;
        --ec-lightning: #D9C15E;
        --ec-poison:    #7FB069;
        --rule:      #2F2F2F;
        --display:   "Big Shoulders Display", "Haettenschweiler", "Arial Narrow", sans-serif;
        --mono:      "Courier Prime", "Courier New", monospace;
        --pop:       cubic-bezier(.2, 1.5, .35, 1);
        /*
         * ⛑ S192 — **LA COUCHE DU ZOOM, UN SEUL NOMBRE POUR TOUTE LA FAMILLE.**
         * Consigne de Croze, note ⑧ : *« l'agrandi vit sur LA couche au-dessus
         * de tout, une seule règle de z-index pour toute la famille zoom »*. Il
         * sert au panneau ET à l'ancêtre qui l'emprisonne — voir `.cz-zoom`.
         * Au-dessus de `.plein` (950), `.bv-couche` (940), `.dicelayer` (900) ;
         * sous le bandeau ADMIN (999), qui est un avertissement.
         */
        --z-zoom: 960;
        /* Les noms de l'ancienne couche, remappés : un seul jeu de jetons. */
        --bg: var(--ink); --panel: var(--ink-2); --raised: var(--ink-3);
        --dim: var(--stock-dim); --line: var(--rule); --edge: var(--rule);
        /*
         * ⛑ **S244 — `--alert` CESSE D'ÊTRE UN ALIAS DE `--stamp`.**
         *
         * GO signé du classeur (note ⑰ ②) : `#DC6963`, *« séparé de `--stamp`,
         * qui reste la teinte du dé et des grands refus »*.
         *
         * ⚠ **CE N'EST PAS UN SEPTIÈME ROUGE, C'EST LE MÊME, ÉCLAIRCI POUR LE
         * PETIT CORPS.** `--stamp` (#A32C25) rend **2,40** sous 11 px sur le
         * fond du jeu — mesuré, `.perte-montant` ×12 — et il rend **4,77** sur
         * le carton clair du dé, où il est justifié depuis des paliers. *Une
         * encre n'a pas un contraste, elle en a un PAR FOND* : les deux emplois
         * se séparent parce que leurs fonds les séparaient déjà.
         */
        --alert: var(--rouge-vif);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      /*
       * ═══ ⛑⛑ S1069 · NOTE 129 ⑤ — 1080 VERROUILLÉ ═══════════════════════
       *
       * Croze : *« l'écran est responsive, mais quand est-ce qu'on lock un truc
       * précis ? »* — tranché dans la note : **composition à 1920 × 1080
       * logiques, mise à l'échelle UNIFORME, letterbox si le ratio diffère,
       * JAMAIS de re-flow. Ce que tu mesures en 1080 vaut partout.**
       *
       * ⚑ **LE FACTEUR EST POSÉ PAR JS, ET C'EST LA SEULE FAÇON.** `scale()`
       * veut un NOMBRE ; `calc(100vw / 1920)` rend une LONGUEUR, pas un nombre.
       * `verrouilleLaComposition` écrit `--echelle` au chargement et à chaque
       * redimensionnement — une ligne, un écouteur.
       *
       * ⚠ **`transform` PLUTÔT QUE `zoom`, ET C'EST MESURÉ PAR SES EFFETS** :
       * `zoom` change le viewport de mise en page, donc `innerWidth`, donc le
       * facteur qu'on vient de calculer — *une boucle qui se mord la queue.*
       * `transform` ne touche à aucune longueur lue.
       *
       * ⚑ **ET IL FAIT DE `#composition` LE CONTENANT DES `position: fixed`**,
       * ce qui est exactement ce qu'on veut : la couche des scènes, le vol du
       * butin, les voiles — tous `inset: 0` — se calent sur les 1920 × 1080,
       * pas sur la fenêtre. *Sans ce contenant, ils resteraient à l'échelle 1
       * par-dessus une composition réduite, et on ne le verrait qu'en 4K.*
       */
      html, body { width: 100%; height: 100%; overflow: hidden; background: var(--ink); }
      #composition {
        width: 1920px; height: 1080px;
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%) scale(var(--echelle, 1));
        transform-origin: center center;
      }
      /*
       * ⚠ **LE BANC GARDE SON ASCENSEUR.** Le mode admin vit SOUS l'écran de
       * jeu — *« on scrolle SOUS l'écran de jeu et on tombe dessus »*, décision
       * de Croze — et un verrou à 1080 le rendrait inatteignable. Sous
       * `?debug=1` la composition n'est donc pas verrouillée : `main.ts` pose
       * `data-verrou="non"` sur la racine, et la règle se retire. *Le verrou
       * est l'écran du JOUEUR ; le banc n'est pas un écran de jeu.*
       */
      html[data-verrou="non"], html[data-verrou="non"] body {
        width: auto; height: auto; overflow: visible;
      }
      /* ⛑ S1289 · L-T2 — la composition ROGNE à 1920 × 1080 : l'éventail de la
         main plonge sous le bord (voulu), et sans ce rognage la page mesurait
         1 306 px — rien ne la faisait défiler (`overflow: hidden`), mais un
         focus clavier le pouvait, et en letterbox l'éventail débordait sur la
         bande noire. `clip` n'offre AUCUN défilement, même programmé. */
      html:not([data-verrou="non"]) #composition { overflow: clip; }
      html[data-verrou="non"] #composition {
        width: auto; height: auto; position: static; transform: none;
      }
      /*
       * ═══ ⛑⛑⛑ S1071 · LE VERROU FUYAIT PAR `vw`/`vh`, ET C'EST CE QUE
       * ════    CROZE A PHOTOGRAPHIÉ (note 130 ①, capture 03) ═══════════════
       *
       * Sa phrase : *« la grille est tronquée en 1080 »* — la 4ᵉ rangée du
       * roster coupée par le bas de la fenêtre. **Mesuré, et ce n'est pas la
       * grille** : à 1920 × 1080 exactement, la dernière rangée finit à
       * `y 1030`, rien ne dépasse. À **2533 × 1150** — sa fenêtre —, elle finit
       * à `y 1169` et **cinq tuiles passent sous le bord**.
       *
       * ⚠⚠ **LA CAUSE EST QUE `vw`/`vh` NE CONNAISSENT PAS LA COMPOSITION.**
       * `#composition` fait 1920 × 1080 et se met à l'échelle par `transform` ;
       * mais `100vh` à l'intérieur résout **sur la FENÊTRE RÉELLE**, jamais sur
       * le conteneur. Relevé à 2533 × 1150 : l'échelle vaut `1,0648` (juste, la
       * boîte scalée fait `2044 × 1150`, letterbox exact) **et le contenu, lui,
       * s'est re-composé à 2533 de large** — `.ouv-deux-blocs` mesurait
       * `1 128 px` de haut en unités de composition au lieu de `1 080`.
       * *Le verrou tenait la BOÎTE ; il ne tenait pas la MISE EN PAGE.* C'est
       * exactement la clause « **jamais de re-flow** » de la note 129 ⑤, et
       * elle était fausse.
       *
       * ⚑ **`--uvw` / `--uvh` SONT LE `vw`/`vh` DE LA COMPOSITION** — `19.2px`
       * et `10.8px`, c'est-à-dire le centième de 1920 et de 1080. Hors verrou
       * (`?debug=1`, le banc), ils redeviennent les vraies unités de fenêtre et
       * **rien ne change** : la substitution est neutre là où le verrou l'est.
       *
       * ⚠ **CE N'EST PAS UN REMPLACEMENT GLOBAL, ET ÇA NE DOIT PAS L'ÊTRE.**
       * Mesuré à la source : **71 déclarations** du style portent une unité de
       * fenêtre, et **douze** mordent sur l'écran de sélection. Ce palier migre
       * ces douze-là, sous capture. Les autres se migreront écran par écran,
       * chacun avec sa preuve — *un remplacement en masse sur des surfaces
       * qu'on n'a pas ouvertes rend un vert qui ne mesure rien.*
       */
      :root { --uvw: 1vw; --uvh: 1vh; }
      #composition { --uvw: 19.2px; --uvh: 10.8px; }
      html[data-verrou="non"] #composition { --uvw: 1vw; --uvh: 1vh; }
      /* ─── LES TROIS ZONES (§2) ─────────────────────────────────────────── */
      .wrap { position: relative; display: flex; flex-direction: column;
              max-width: 1200px; margin: 0 auto; }
      /* ① CE QUI ME MENACE — en haut, jamais déplacé. */
      .strip { border-bottom: 2px solid var(--rule); background: var(--ink-2);
               padding: 10px 18px; display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
      .who { display: flex; align-items: baseline; gap: 10px; }
      .who .name { font-family: var(--display); font-weight: 800; font-size: 30px;
                   letter-spacing: .02em; text-transform: uppercase; line-height: 1; }
      .who .tag { font-size: 11px; color: var(--stock-dim); letter-spacing: .14em; text-transform: uppercase; }
      .vitals { display: flex; gap: 20px; align-items: center; margin-left: auto; flex-wrap: wrap; }
      .vital { display: flex; flex-direction: column; gap: 3px; min-width: 118px; }
      .vital .lbl { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--stock-dim); }
      .vital .val { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1; }
      .bar { height: 5px; background: var(--ink-3); border: 1px solid var(--rule); overflow: hidden; }
      .bar > i { display: block; height: 100%; background: var(--stock-2); }
      .bar.collapse > i { background: var(--ember); }
      /*
       * ⛑ S190 — **LES PV D'UN JOUEUR, MÊME TEINTE QUE CEUX D'UN MOB.** La règle
       * est déjà écrite au bloc de combat : *« donner une autre teinte aux PV du
       * mob qu'aux PV du joueur ferait lire deux grandeurs différentes là où il
       * n'y en a qu'une »*. `--stamp` ne dit pas « refus » ici, il dit les
       * points de vie — l'emploi qu'il a déjà sur `.pv-pastille` et `.bar.mob`.
       */
      .bar.pv > i { background: var(--stamp); }

      /*
       * ═══ ⚑⚑ H-T1 · LA BARRE DE VIE PEINTE — note 156 ④, kit `hud/healthbar` ═
       *
       * Croze : *« Mes PV, ceux des mobs et des autres joueurs sont une barre
       * peinte : du sang dans un cadre blanc ; quand je prends un coup le sang
       * saute tout de suite et une traînée blanche se rétracte derrière ; la
       * barre n'est jamais étirée ni coupée net. »*
       *
       * ⚠ **AUCUN DE CES POURCENTAGES N'EST CHOISI À L'ŒIL.** Ils sortent tous
       * de `art/hud/healthbar/healthbar.json`, livré avec le kit :
       *
       *   canvas       2860 × 293            -> aspect-ratio
       *   inner_box    74,79 → 2785,213      -> le rognage du sang
       *   slice3       left 135 · right 135  -> 135/2860 = 4,7203 %
       *   tip_fitted   297 × 162             -> 10,385 % × 55,29 %
       *
       * *Une géométrie recopiée d'une capture est une seconde vérité ; celle-ci
       * se relit dans le fichier que Croze a livré avec les images.*
       *
       * ⚠ **« JAMAIS ÉTIRÉE NI COUPÉE NET » EST DEUX RÈGLES, ET ELLES VONT EN
       * SENS CONTRAIRE.** Le CADRE ne doit pas s'étirer : ses deux bouts au
       * pinceau gardent leur largeur (les trois tranches, `frame_left` /
       * `frame_mid` / `frame_right`, et seul le milieu s'étire — c'est la
       * SEULE règle de géométrie que le `LISEZMOI.txt` du kit énonce). Le
       * REMPLISSAGE, lui, ne doit pas être coupé net : il est ROGNÉ, et la
       * `tip_blood_fitted` se pose sur l'arête du rognage pour que la coupe
       * soit une pointe de pinceau et non un bord droit.
       */
      .bar.peinte { height: auto; aspect-ratio: 2860 / 293; background: none;
                    border: 0; overflow: visible; position: relative;
                    min-height: 12px; }
      .bar.peinte > i, .bar.peinte > b { position: absolute; inset: 0;
                    height: auto; background-color: transparent;
                    background-repeat: no-repeat; }
      /* Les deux remplissages partagent le canevas ENTIER (le `LISEZMOI` du kit :
         « MEME canevas (2860x293), a empiler a la meme origine ») : ils se posent
         donc à `inset: 0`, et c'est le ROGNAGE qui dit où ils s'arrêtent. */
      .bar.peinte .hpk-blanc,
      .bar.peinte .hpk-sang { background-size: 100% 100%; }
      .bar.peinte .hpk-blanc {
          background-image: url(art/hud/healthbar/fill_damage_white_stacked.png); }
      .bar.peinte .hpk-sang {
          background-image: url(art/hud/healthbar/fill_blood_stacked.png); }
      /*
       * ⚑ LA TRAÎNÉE — et c'est la SEULE animation de cette barre. Le sang
       * saute (rien à animer), le blanc se rétracte. Sa durée est une constante
       * NOMMÉE côté code (`RETRAIT_DE_LA_TRAINEE_MS`), pour qu'un mot de Croze
       * la change sans fouiller une feuille de style.
       *
       * ⛑⛑ **C'EST UNE ANIMATION ET PAS UNE TRANSITION, ET C'EST UNE MESURE QUI
       * L'A IMPOSÉ.** Une transition a besoin d'un style de DÉPART calculé sur
       * un nœud ATTACHÉ ; `jauge()` rebâtit le sien à chaque rendu, donc il
       * fallait un `requestAnimationFrame` pour repousser la seconde écriture —
       * et dans une exécution PLANIFIÉE le volet est masqué, **rAF ne bat pas**
       * (sondé : 0 battement en 700 ms). La traînée n'était alors ni jouée, ni
       * VÉRIFIABLE. Une animation, elle, s'arme au rattachement : elle n'a pas
       * de style de départ à retrouver, et `getAnimations()` la NOMME même
       * quand le compositeur ne tourne pas. *On ne choisit pas un mécanisme
       * qu'aucun instrument ne peut interroger.*
       */
      @keyframes hpk-retrait {
        from { clip-path: inset(0 var(--hpk-de) 0 0); }
        to   { clip-path: inset(0 var(--hpk-a) 0 0); }
      }
      .bar.peinte .hpk-blanc.retrait {
          animation: hpk-retrait var(--hpk-retrait, .45s)
                     cubic-bezier(.2, .7, .3, 1) both; }
      /* La pointe est plus HAUTE que la boîte intérieure (162 px contre 134) —
         c'est voulu, ses gouttes débordent. D'où `overflow: visible` plus haut. */
      .bar.peinte .hpk-pointe {
          background-image: url(art/hud/healthbar/tip_blood_fitted.png);
          background-size: contain; background-position: center;
          top: 22.355%; bottom: 22.355%; left: 0; right: auto;
          width: 10.385%; transform: translateX(-50%); }
      /* LE CADRE EN TROIS TRANCHES. `auto 100%` sur les deux bouts leur garde
         leur rapport 135:293 — soit exactement 4,7203 % de la largeur, puisque
         la barre porte le rapport du canevas. Le milieu prend ce qui reste. */
      .bar.peinte .hpk-cadre {
          background-image: url(art/hud/healthbar/frame_left.png),
                            url(art/hud/healthbar/frame_right.png),
                            url(art/hud/healthbar/frame_mid.png);
          background-size: auto 100%, auto 100%, calc(100% - 9.4406%) 100%;
          background-position: left center, right center, center center; }
      /*
       * ⛑ S190 — **LE COMBAT D'UN AUTRE, DANS SA COLONNE.** Même matière que son
       * bloc de dés et de log, juste au-dessus d'eux : c'est la même colonne qui
       * raconte, pas un encadré de plus. Les barres s'empilent — deux camps se
       * lisent l'un sous l'autre, jamais côte à côte dans une piste de 300 px.
       */
      .siege-combat { display: flex; flex-direction: column; gap: 4px;
                      padding: 4px 0 6px; border-bottom: 1px solid var(--rule); }
      .siege-combat .vital { min-width: 0; }
      .states { display: flex; gap: 6px; flex-wrap: wrap; }
      .state { font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
               border: 1px solid var(--rule); padding: 2px 7px; color: var(--stock-dim); }
      /*
       * ⛑⛑ S300 — **L'EMBER SORT D'ICI, ET C'EST §2 QUI LE DIT, PAS LE
       * CONTRASTE.** `--ember` est *« ce qui brûle : le moment, le total »* et
       * `ECRANS §2` le réserve au **Collapse** — *« l'ember est au Collapse »*.
       * « absorbe 5 », « protégé au spawn », « extrait du donjon » ne brûlent
       * rien : le signal servait de mise en valeur, exactement la faute que le
       * S293 a retirée au vert jouable des calques. *Un signal qui décore ne
       * signale plus.*
       *
       * Il passe à `--stock`, l'encre du texte courant — **le contraste suit
       * sans avoir été le motif** : `3,92` et `3,60` (sous le seuil de 4,5 à
       * 10 px) contre **12,5** pour `--stock` sur `--ink-2`. Le cadre, lui,
       * garde son trait allumé en `--stock-2` : c'est la FORME qui dit
       * « actif », plus une couleur réservée.
       */
      .state.on { color: var(--stock); border-color: var(--stock-2); }
      /* ② CE QUI SE PASSE — le relevé, et le moment vit dedans. */
      main { display: flex; flex-direction: column; padding: 0 18px; }
      /*
       * ⚑ **S48 — `.record-head` EST RETIRÉE AVEC SON BLOC.** Ses deux faits —
       * le run et le tour — sont dans la bande de timer (`.bt-tour`). *Trois
       * règles CSS qui attendent un bloc mort se relisent comme un bloc vivant*
       * — c'est la leçon de `sectionRepliable` au palier 13, appliquée le jour
       * même du retrait plutôt qu'un palier plus tard.
       */
      /*
       * ⚑ **S48 — LE PLI DU PALIER DANS LA BANDE.** Il prend sa propre ligne :
       * la bande est un `flex-wrap`, et un pli déplié à six lignes ne tient pas
       * à côté du ruban des sièges. `flex-basis: 100%` le pose SOUS eux sans
       * toucher à la première ligne.
       */
      .bt-palier { flex-basis: 100%; }
      /* ③ CE QUE JE PEUX FAIRE — deux rangs, deux matières. */
      .cap-head { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 18px 5px; }
      .cap-head h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 14px;
                     letter-spacing: .2em; text-transform: uppercase; color: var(--stock-dim); border: none; }
      .cap-head .cap { font-size: 11px; color: var(--slate); }

      /*
       * ─── ③ LE RANG : GRAVÉ DANS LE CHÂSSIS ──────────────────────────────
       *
       * Trois matières, et chacune dit une règle sans une ligne de légende :
       *   · **tuile pleine** — tu décides, c'est cliquable ;
       *   · **liseré or** — donné par le gear, donc ça change à l'équipement ;
       *   · **pointillés** — ça part tout seul, on ne te le demandera jamais.
       *
       * `ECRANS.md §2` : *« sans cette distinction, tu aurais 23 boutons dont 16
       * ne se cliquent jamais »*.
       */
      /*
       * ⛑ S416 — **LE `8px` DU HAUT EST LA PLACE DE LA MONTÉE, ET IL EST
       * MESURÉ.** `overflow-x: auto` force `overflow-y: auto` : le rail COUPE
       * ce qui dépasse en haut. Relevé avec la montée posée, `Ice Block` :
       * `COUPE_EN_HAUT: true` — le bloc s'élevait de 7,7 px hors de son rail,
       * donc rogné. *Une élévation sans place au-dessus n'est pas une
       * élévation : c'est une coupe.*
       */
      .rail { display: flex; gap: 7px; padding: 8px 18px 4px; overflow-x: auto; align-items: stretch; }
      .abil { position: relative; flex: 0 0 138px; min-height: 88px; background: var(--ink-2);
              color: var(--stock); border: 1px solid var(--rule); padding: 7px 8px;
              display: flex; flex-direction: column; gap: 3px; cursor: pointer; text-align: left;
              font-family: var(--mono); text-transform: none; letter-spacing: normal;
              transition: border-color .12s, background .12s; }
      .abil:hover:not(:disabled) { background: var(--ink-3); }
      .abil .src { font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--slate); }
      .abil .nm { font-family: var(--display); font-weight: 700; font-size: 16px; line-height: 1;
                  text-transform: uppercase; }
      .abil .tx { font-size: 10px; line-height: 1.3; color: var(--stock-dim); flex: 1; }
      /*
       * ⛑ S300 — **MÊME RÉSERVE, MÊME SORTIE.** « 0/1 par tour de donjon » est
       * un compteur d'usage : il ne brûle pas davantage. Il prend `--stock-2`,
       * qui le distingue du libellé atténué sans emprunter un signal.
       */
      .abil .cost { font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--stock-2); }
      .abil[data-src="GEAR"] { border-left: 3px solid var(--gold); }
      .abil[data-src="GEAR"] .src { color: var(--gold); }
      /*
       * ② S27 — **L'ACTIVABLE S'ENCADRE. Le verdict existait, le signal non.**
       *
       * Croze : *« skills / Signature / gear activables en colonne GAUCHE,
       * encadrés VERT quand utilisables »*. `.abil` sans `.no` EST le verdict de
       * jouabilité — il est calculé et posé depuis longtemps, et il ne se voyait
       * qu'à l'opacité du VOISIN. On n'ajoute donc aucune règle et aucun calcul :
       * on donne sa bordure à une classe qui existait déjà.
       *
       * ⚠ **`:not(.no)` et pas `.oui`** — inventer une seconde classe ferait deux
       * écritures du même verdict, et c'est la famille qu'on chasse partout
       * ailleurs. La négation lit la SEULE classe que le rendu pose.
       */
      .abil:not(.no) { border-color: var(--activable);
                       box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--activable) 34%, transparent); }
      /*
       * `lit` = dans l'offre de CE moment. Le moteur l'a dit, l'écran l'allume.
       *
       * ═══ ⚑ J'AVAIS TRANCHÉ L'INVERSE, ET LA MESURE M'A DONNÉ TORT ═════════
       *
       * J'écrivais ici : *« un `lit` est forcément activable, les deux faits
       * sont vrais, et c'est le plus PRÉCIS qui prend la bordure. »* Relevé sur
       * le moment que la campagne 5 vient éprouver — la Réaction qui sauve la
       * vie, fenêtre `ON_WOULD_DIE` ouverte, `Grab & Scam` du Tamarin :
       *
       * ```
       * .abil lit   ·   border rgb(199, 74, 18)
       * ```
       *
       * ⚠ **`rgb(199,74,18)` EST `--ember`, LA TEINTE RÉSERVÉE AU COLLAPSE**
       * (`§2`). Au moment décisif du jeu, une Réaction jouable n'affichait donc
       * pas « activable » : **elle empruntait le signal de la pince**. Et le
       * `#7FB069` que Croze a demandé deux fois pour l'activable ne sortait
       * jamais là où il compte le plus.
       *
       * ─── DEUX FAITS VRAIS, DEUX PLACES — et plus une seule disputée ───────
       *
       * Les deux restent dits, ils cessent de se battre pour le même pixel :
       *   · **la BORDURE porte l'ACTIVABLE** — vert, la demande de Croze ;
       *   · **le LISERÉ INTERNE porte « dans l'offre de CE moment »** — ember.
       *
       * *Ma règle « le plus précis gagne » supposait qu'un seul des deux pouvait
       * s'afficher. C'était une contrainte que je m'étais donnée, pas une
       * contrainte du support.*
       *
       * ⚠ **`.card.lit` NE BOUGE PAS** : une carte de main n'a pas de verdict
       * d'activabilité vert à côté — rien ne lui dispute sa bordure.
       */
      .card.lit { border-color: var(--ember); box-shadow: inset 0 0 0 1px var(--ember); }
      /*
       * ═══ ⚑⚑ S416 · LA RÉACTION ÉLIGIBLE REJOINT LE LANGAGE UNIQUE — ㊳ ② ══
       *
       * **Croze, verbatim** : *« une réaction doit toujours être mise en
       * évidence et laisser un peu de temps pour cliquer dessus. »*
       *
       * ⚑ **CE QU'IL DEMANDE EXISTE DEPUIS LE S307, ET PAS ICI.** Le
       * scintillement est sa propre règle — *« plutôt que des carrés tout
       * moches montrant où l'on peut cliquer, fais des zones qui scintillent »*,
       * *« jamais l'ember, jamais le vert jouable »*. Il est posé sur `.tz`,
       * `.fcz.ok`, `.obj-cible` et `.cible-legale`. **Le rang de capacités, lui,
       * portait exactement le carré interdit** : `inset 0 0 0 2px var(--ember)`.
       *
       * *Une leçon appliquée à une seule des surfaces qui la partagent n'est pas
       * apprise* — c'est le troisième cas de cette famille dans ce fichier.
       *
       * ─── LA MONTÉE EST UN ÉTAT, PAS UNE ENTRÉE, ET C'EST MESURÉ ──────────
       *
       * Croze demande aussi *« une montée visuelle »*. Sonde posée avant
       * d'écrire une ligne, deux rendus de suite :
       *
       * ```
       * .abil  n=5 → n=5      MÊMES NŒUDS : false
       * ```
       *
       * **Le rang est refabriqué à chaque rendu.** Une animation d'entrée y
       * repartirait de zéro à chaque tic — un TREMBLEMENT, pas une montée : la
       * faute du S166, où re-parenter une couche rejouait ses animations. La
       * montée est donc un `transform` STATIQUE, qui survit à la refabrication
       * parce qu'il ne dépend pas du temps.
       *
       * ─── CE QUI GARDE L'EMBER, ET POURQUOI ──────────────────────────────
       *
       * `.abil.lit.no` — **offerte et REFUSÉE**. Elle n'est pas cliquable : la
       * faire scintiller serait mentir dans le langage même qui dit « clique ».
       * Elle garde donc le trait, et l'ember avec.
       */
      /*
       * ⛑ S488 — `.eps-btn.lit` rejoint ce sélecteur : les RÉACTIONS ont leur
       * bloc (㊳ ①) et doivent s'ALLUMER comme le rang (㊺ ①). **Le signal est
       * ÉTENDU, jamais recopié** — deux définitions d'un même scintillement
       * finissent par diverger, et l'instrument lit le nom d'animation réel.
       */
      /*
       * ⛑⛑ S492 — `.opt-carte.lit` REJOINT LE SÉLECTEUR : LA TROISIÈME FAMILLE
       * DE ㊻ ①, LES CONSOMMABLES DE MAIN.
       *
       * Croze, ㊻ ① : *« pendant « un mob m'attaque », Signature · réactions
       * éligibles · CONSOMMABLES de main s'allument sur le calque de combat. »*
       * Mesuré au S492, fenêtre ouverte, l'état posé par
       * `etat_consommable_fenetre` :
       *
       * ```
       * First Strike Potion   1 surface · y883 · SANS SCROLLER · NE BRILLE PAS
       * scintillants sur TOUTE la page                                       0
       * ```
       *
       * Sa surface de MAIN (`.handslot .card.jouable.lit`) est bâtie et marquée
       * — et `display: none` pendant la fenêtre de combat
       * (`body:has(.combat-fenetre) .fi-carte`). La seule surface qui lui reste
       * est **l'option du bloc de demande**, qui est bien sur le calque et bien
       * au-dessus de la ligne de flottaison : il ne lui manquait que la lampe.
       *
       * ⚠ **AUCUN SECOND BLOC, ET C'EST DÉLIBÉRÉ.** La Réaction a reçu le sien
       * au S488 parce qu'elle n'avait AUCUNE surface ; la consommable en a une,
       * visible, cliquable. Lui en fabriquer une seconde ferait *deux lectures
       * d'un même fait* (`§0.1 ⑤`) — on allume celle qui existe.
       *
       * ⚠ **`:not(.no)` N'A RIEN À GARDER ICI** : le bloc de demande ne pose
       * une option QUE lorsqu'elle est jouable — une option refusée n'y entre
       * pas. Le sélecteur reste écrit avec, pour que la règle continue de dire
       * la même chose sur les trois familles.
       */
      .abil.lit:not(.no), .eps-btn.lit:not(.no), .opt-carte.lit:not(.no) {
        overflow: hidden;
        /*
         * ⚠ **TRANSLATION PURE, PAS DE `scale` — ET C'EST LA MESURE QUI L'A
         * DÉCIDÉ.** Un `scale(1.03)` fait monter le HAUT de `h × 1,5 %` en
         * plus : le dépassement dépend alors de la hauteur du bloc, qui va de
         * 88 px à 207 px selon la capacité. La place à réserver au-dessus
         * n'aurait plus été un nombre. Une translation est BORNÉE — 6 px,
         * toujours —, donc `8 px` de place suffisent pour toutes.
         */
        transform: translateY(-6px);
        box-shadow: 0 6px 16px rgba(0,0,0,.45);
      }
      .abil.lit:not(.no)::before, .eps-btn.lit:not(.no)::before,
      .opt-carte.lit:not(.no)::before {
        content: ''; position: absolute; top: -50%; bottom: -50%; left: 0;
        width: 42%; pointer-events: none; z-index: 0;
        background: linear-gradient(100deg,
          transparent 0%,
          color-mix(in srgb, var(--stock) 16%, transparent) 50%,
          transparent 100%);
        transform: translateX(-140%);
        animation: scintille 2.8s var(--scint-retard, 0s) infinite ease-in-out;
      }
      .abil.lit:not(.no) > *, .eps-btn.lit:not(.no) > *,
      .opt-carte.lit:not(.no) > * { position: relative; z-index: 1; }
      /*
       * ⚠⚠ **SANS MOUVEMENT, LE TRAIT REVIENT** — la borne du S307, mot pour
       * mot : *un signal porté par le seul mouvement n'existe pas pour qui a
       * coupé le mouvement.* La montée, elle, n'est pas du mouvement : elle
       * reste.
       */
      @media (prefers-reduced-motion: reduce) {
        .abil.lit:not(.no)::before,
        .eps-btn.lit:not(.no)::before,
        .opt-carte.lit:not(.no)::before { animation: none; opacity: 0; }
        .abil.lit:not(.no),
        .eps-btn.lit:not(.no),
        .opt-carte.lit:not(.no) { box-shadow: inset 0 0 0 2px var(--ember); }
      }
      /* Un `lit` INJOUABLE n'a pas de vert à garder : l'ember reprend la bordure. */
      .abil.lit.no, .eps-btn.lit.no { border-color: var(--ember);
                                       box-shadow: inset 0 0 0 2px var(--ember); }
      .abil.no { opacity: .42; cursor: not-allowed; }
      .abil.no:hover { background: var(--ink-2); }
      .woke { font-size: 9px; letter-spacing: .06em; text-transform: uppercase; color: var(--gold); }
      /* Ce qui part tout seul : pointillés, pas de curseur, pas de clic. */
      .auto-item { position: relative; flex: 0 0 138px; min-height: 88px; background: transparent;
                   border: 1px dashed var(--rule); padding: 7px 8px; display: flex;
                   flex-direction: column; gap: 3px; color: var(--slate); font-size: 10px; line-height: 1.3; }
      .auto-item .src { font-size: 9px; letter-spacing: .16em; text-transform: uppercase; }
      .auto-item .nm { font-family: var(--display); font-weight: 700; font-size: 15px; line-height: 1;
                       text-transform: uppercase; color: var(--stock-dim); }
      .auto-item[data-src="GEAR"] { border-left: 3px dashed var(--gold); }

      /*
       * ─── ③ LA MAIN : DU PAPIER ──────────────────────────────────────────
       *
       * Fond carton, encre sombre : une carte est une CARTE. C'est la matière
       * qui dit que la main change à chaque tour et que le rang, lui, tient tout
       * le run — sans une ligne de légende pour l'expliquer.
       */
      /*
       * ─── LA MAIN EN ÉVENTAIL, DEPUIS LE BAS DROIT ────────────────────────
       *
       * Pliée, les cartes se CHEVAUCHENT et s'inclinent — c'est une main tenue.
       * Au survol elles s'écartent et se redressent. Rien ne disparaît : pliée,
       * la main montre déjà les tranches, donc on sait ce qu'on tient sans
       * déployer.
       *
       * Le décalage est en `margin-left` négatif et non en `transform` : un
       * `transform` ne réserve pas de place, et les cartes écartées se seraient
       * superposées au lieu de pousser la rangée.
       */
      /*
       * ═══ ⛑ S117 — LA MAIN EST UNE COUCHE ANCRÉE AU BORD BAS ══════════════
       *
       * `sticky` et non `fixed` : le banc de debug vit SOUS l'écran de jeu et
       * on l'atteint en scrollant. Une couche `fixed` serait restée sur le bas
       * de la fenêtre à recouvrir ses boutons ; `sticky` tient le bord bas tant
       * que l'écran de jeu est là, puis s'efface tout seul — **sans un seul
       * écouteur de scroll.**
       *
       * `pointer-events: none` sur la couche, `auto` sur ce qui se clique : la
       * bande fait toute la largeur, et sans ça elle avalerait les clics de
       * l'écran de jeu sur toute sa hauteur, cartes ou pas.
       *
       * ═══ ⛑ S201 · LE DÉGRADÉ MEURT, ET AVEC LUI L'AVALEUR DE CLICS ═══════
       *
       * Croze, note ⑨ ④, verbatim : *« tu as choisi de masquer par un dégradé
       * la fenêtre pour qu'on voie mieux les cartes — ne le fais pas, ça
       * empêche trop de cliquer. »*
       *
       * ⚠ **DEUX DÉFAUTS DANS UNE PHRASE, ET LE SECOND ÉTAIT LE VRAI.** Le
       * dégradé VOILE ; ce qui EMPÊCHE de cliquer est ailleurs — et le
       * commentaire ci-dessus l'avait vu juste sans aller au bout. La garde
       * posait `auto` sur les ENFANTS DIRECTS de la couche, et il n'y en a
       * qu'un : `.mb-rangee`. **Mesuré au banc, 1920×1080 :**
       *
       * ```
       * .main-basse   1905 × 497   pointer-events: none   ← la garde tenait
       * .mb-rangee    1905 × 471   pointer-events: auto   ← et elle avalait tout
       *
       * elementFromPoint, 6 points du bas de l'écran :
       *   (200,700) (200,900) (1700,700) (1700,1000) (500,1050) → .mb-rangee
       *   (960,650)                                             → .cz-vignette
       * ```
       *
       * **Cinq points sur six tombaient sur une rangée VIDE**, pas sur ce
       * qu'elle recouvre. *Une garde posée au bon endroit mais un cran trop
       * haut ne garde rien : elle déplace le problème d'un niveau.*
       *
       * `auto` descend donc d'un cran, sur les **trois cases** — mesurées
       * `.mb-capacites` 420×45, `.mb-milieu` 308×471, `.mb-tiroir` 420×45 :

       *  une mesure d'hier, on la date.)
       * elles ne couvrent que ce qu'elles peignent.
       */
      /*
       * ═══ ⛑⛑ S922 · `Q-HAUTEUR-1080` — LES TROIS PIÈCES, EN UN SEUL GESTE ═══

       * Tranché par le CLASSEUR (relance du 07/09, geste ②) : **`B1` + `A` +

       * réserve casse `FINIR LE TOUR` et que ⓐ sans `A` laisse le
       * défilement »*. La référence gravée dit `1920×1080 adaptatif` ; l'écran
       * mesurait de **1196 à 1647 px** selon le moment (S903).
       *
       * **`--haut-des-bandeaux` (B1).** `max-height: calc(100vh - 16px)` ne
       * soustrayait que la colle du haut (`top: 8px`) et **pas ce qui est
       * AU-DESSUS** : les colonnes commencent à `y = 105` (bannière 60 +
       * bande-timer 45), donc leur bas tombait 89 px sous le pli. *Un `100vh`
       * dans un corps rembourré déborde de son rembourrage.*
       * ⚠ **AUCUNE VALEUR N'EST JUSTE DANS LES DEUX ÉTATS**, et c'est
       * l'arbitrage qui a été tranché : `121px` est juste AU REPOS, et la

       * Le prix est payé en défilement INTERNE, jamais en atteignabilité —
       * `B2` (mesurer sa propre mise en page en JS) a été écarté.
       *
       * **`--reserve-de-la-main` (A + la réserve).** `.main-basse` passe de
       * `sticky` à `fixed` : elle était **déjà collée au bas** (`bottom: 0`,

       * coûter sa hauteur au FLUX, et personne ne lisait ce coût.
       * ⚠⚠ **ET LE RISQUE DE `A` N'EST PAS UNE HYPOTHÈSE : IL A ÉTÉ MESURÉ

       * une main `fixed` ne pousse plus rien, elle **s'assoit** dessus, et
       * c'est `FINIR LE TOUR` qui passait dessous, *le bouton même que le
       * S342 avait déjà dû remonter*. D'où la réserve au bas de
       * `.col-centre` : ce que la main ne pousse plus, la colonne le garde.
       * ⚠ **C'EST UN PLAFOND, PAS UNE MESURE** — la hauteur relevée de
       * `.main-basse` est `226 px` ; la réserve ne s'adapte pas, et si une
       * main plus haute apparaît, `couverts` le dira sur les 14 états.

      /*
       * ⛑⛑ ═══ S947 · 121 → 125 — LES 20 px DE `.colonnes` N'ÉTAIENT PAS COMPTÉS ══
       *
       * `Q-HAUTEUR-1080` a été mesurée au S922 sur **14 états d'une seule ancre**

       * et sur ces 14 états **la bannière « À TON TOUR DE JOUER » n'était pas là**.

       *
       *     .banniere-atj    60   ← n'existe QUE pendant mon tour
       *     .bande-timer     45
       *     .colonnes       979   = 959 (max-height 100vh - 121px) + 20 de

       *     ─────────────────────
       *     total          1084   sur 1080  →  4 px

       * `121` valait `60 + 45 + 16` — les deux bandeaux, plus la colle du haut.
       * **Le rembourrage BAS de `.colonnes` n'entrait pas dans le compte**, et il

       *
       * ⚠ **LE DÉFAUT NE SE VOIT QUE PENDANT LE TOUR DE CROZE**, puisque la

       * ⚠⚠ **ET JE L'AI VU DISPARAÎTRE SOUS L'INSTRUMENT.** Re-mesuré dans
       * l'onglet principal, trente secondes après le chargement : `trop = 0`,

       * **4 px aux six**. *Un écran qui a une horloge rend un verdict différent

      :root { --haut-des-bandeaux: 125px; --reserve-de-la-main: 260px; }

                    z-index: 40; pointer-events: none;
                    display: flex; flex-direction: column; align-items: center;
                    padding-top: 26px; margin-top: 6px; }

      .main-basse > * > * { pointer-events: auto; }
      /*
       * ⛑ **S122 — TROIS CASES, ET LA MAIN GARDE LE MILIEU.** Verdict F de
       * Croze : capacités à gauche, main au centre, tiroir fourre-tout à
       * droite.
       *
       * `1fr auto 1fr` — les deux flancs pèsent le MÊME poids, donc la main
       * reste centrée quoi qu'ils portent. *Une grille `auto 1fr auto` aurait
       * décalé la main dès qu'un flanc grossit*, et l'éventail centré du S117
       * ne serait plus centré sur rien.
       *
       * `align-items: end` : les trois cases s'alignent sur le bord bas, comme
       * une main qu'on tient.
       */
      .mb-rangee { display: grid; grid-template-columns: 1fr auto 1fr;
                   align-items: end; gap: 12px; width: 100%; padding: 0 14px; }

       * ⛑⛑ **S750 — `.mb-capacites` N'EXISTE PLUS** (note 86 ④ de Croze,
       * second verdict : *« vire totalement cet encadré »*). Ce qui reste est
       * une case VIDE, `.mb-flanc`, et elle n'est pas décorative : la grille
       * `1fr auto 1fr` ne garde la main centrée que si le flanc gauche pèse
       * autant que le tiroir de droite. Elle ne porte AUCUNE autre règle —
       * ni `max-width`, ni corps défilant : il n'y a plus de corps.

      .mb-tiroir    { justify-self: end;   max-width: min(30vw, 420px); }

       * Les deux flancs sont des PLIS : repliés ils ne pèsent qu'une tête,
       * dépliés ils ne doivent pas pousser la main. Le corps défile chez lui.

      /*
       * ⚠ **`overflow: auto` SUR LES DEUX AXES, ET C'EST MESURÉ.** Avec le seul
       * `overflow-y`, le contenu s'échappait EN LARGEUR : relevé à 1 265 px,
       * `scrollWidth` 1 319 — les tables de tuile (317, 367 px) et le rail de
       * défausse (des boutons jusqu'à `x = 1 503`) sortaient de la fenêtre et
       * ouvraient une barre de défilement horizontale sur toute la page.
       * *Un flanc qui déborde ne pousse pas la main : il pousse l'écran.*

      .mb-tiroir .pli-corps {

      /* Le rail de défausse revient à la ligne au lieu de filer hors champ. */

      /*
       * ⛑ S208 — `.mb-compteur` / `.mb-titre` SUPPRIMÉS avec leur seul émetteur
       * (note ⑫ ① : *« aucun texte »* au-dessus de la main). Une règle dont le
       * producteur meurt et qui reste est un piège pour la fenêtre suivante :
       * elle se lit comme une surface vivante et n'en est plus une.
       */
      /*
       * ─── L'ÉVENTAIL — patron MTG Arena, spec Croze ───────────────────────
       *
       * CENTRÉ (`justify-content: center`), et non plus aligné à droite : un
       * éventail qui pousse d'un bord n'est pas un éventail, c'est une pile.
       *
       * Les trois nombres de la géométrie — `--rot`, `--dy`, `--ml` — sont
       * POSÉS PAR LE JS, un par carte, et **animés ici**. Le décalage reste en
       * `margin-left` : un `transform` ne réserve pas de place, et les cartes
       * écartées se superposeraient au lieu de pousser la rangée.
       */
      /*
       * ═══ ⛑⛑ S565 — **UNE SEULE DÉCLARATION FAIT LES DEUX MOITIÉS, ET MON
       * PREMIER JET EN A ÉCRIT DEUX** ════════════════════════════════════════
       *
       * `--plonge` est POSÉE PAR LE JS (voir `PLONGE`, `main.ts`). La marge
       * NÉGATIVE fait tout le travail, parce que `.main-basse` est
       * `position: sticky; bottom: 0` et que `.mb-rangee` aligne ses trois
       * cases sur le BORD BAS : rétrécir la boîte de `--plonge` colle ce bord
       * au bas de la fenêtre **et laisse la rangée déborder d'autant en
       * dessous**. La place réservée descend et les cartes descendent, d'un
       * seul geste.
       *
       * ⚠⚠ **MON PREMIER JET AJOUTAIT EN PLUS UN `translateY(+--plonge)` SUR
       * `.handslot`, ET LES DEUX SE SONT ADDITIONNÉS.** Relevé, 8 cartes,
       * 1920 × 1080 : `--plonge = 226px`, et le haut de la première carte
       * tombait à **y = 1107** — soit **27 px SOUS le bord bas** de la fenêtre.
       * Toute la main était invisible. *Deux mécaniques qui décrivent le même
       * déplacement ne se cumulent pas : elles se comptent deux fois.* La
       * marge négative EST la plongée ; le `transform` de base ne la connaît
       * plus.
       *
       * ⚑ Le repli `0px` rend l'écran d'avant le S565 si la variable manque —
       * c'est aussi le témoin AVANT/APRÈS de la mesure, posé par une feuille de
       * style et non en ligne (un rendu de la main efface un style en ligne).
       * Il ne fait autorité nulle part.
       */
      .hand { display: flex; gap: 0; padding: 0 18px 14px; align-items: flex-end;
              justify-content: center;
              margin-bottom: calc(-1 * var(--plonge, 0px)); }
      /*
       * ═══ ⛑⛑ S514 — LA GARDE DU S122 S'ARRÊTAIT UN CRAN TROP HAUT, ET C'EST
       * EXACTEMENT LA FAUTE QUE SON PROPRE COMMENTAIRE DÉCRIT ════════════════
       *
       * Le S122 a fait descendre `pointer-events: auto` de `.main-basse` à ses
       * trois CASES, en écrivant : *« une garde posée au bon endroit mais un
       * cran trop haut ne garde rien : elle déplace le problème d'un niveau »*.
       * La règle `.main-basse > * > *` rend `auto` aux trois CASES, dont
       * **`.mb-milieu`** — et `.mb-milieu` ne peint rien : c'est une colonne
       * flex qui ne contient que `.hand`, laquelle ne contient que des
       * `.handslot`. Le problème a été déplacé d'un niveau, une fois de plus.
       *
       * ⚠ **ET LA PREMIÈRE RÉPARATION S'EST TROMPÉE DE NŒUD, CE QUI L'A PROUVÉ
       * DEUX FOIS.** Posée sur `.hand` seule, le relevé n'a pas bougé d'un
       * point : `pointer-events` est HÉRITÉ, et c'est `.mb-milieu` — même boîte
       * exactement, `308 × 426` — qui reprenait le clic un cran au-dessus.
       * *Éteindre le nœud qu'on accuse ne suffit pas quand la propriété
       * descend : il faut l'éteindre là où elle est ALLUMÉE.*
       *
       * **Mesuré (S514, `?seed=3&fait=COMBAT_OPENED`, 1 carte en main)** : la
       * boîte de `.hand` fait `308 × 426` pour une carte de `272` de large.
       * Ses **18 px de marge intérieure de chaque côté avalent les clics sans
       * rien peindre**, et ils tombent sur le bord droit des bandes cliquables
       * de la fiche imprimée en combat (`.fcz.ok`, x 440→808) :
       *
       * ```
       * sans cette règle   2 lignes de Skill JOUABLES sur 3 : 4 % mort — DIV.hand
       * avec cette règle   RIEN — les 3 répondent sur TOUTE leur surface
       * ```
       *
       * ⚠ **CE N'EST QUE LA MOITIÉ VIDE DU DÉFAUT, ET LA MOITIÉ PLEINE RESTE :**
       * dès **5 cartes en main**, c'est l'ART DES CARTES (`IMG.cz-vignette`) qui
       * couvre **100 %** des trois lignes, et aucune règle de `pointer-events`

       * en page, déposé en `Q-SKILL-SOUS-MAIN`.**
       *
       * *Une garde s'arrête à ce qu'elle PEINT, jamais à ce qui le contient.*
       */
      /*
       * ⛑⛑ **S522 · ㊼ ① — LE BANDEAU DE CE QUE L'ÉQUIPEMENT A ÉTEINT.**
       *
       * Il vit dans `.main-basse`, qui est `pointer-events: none` depuis le
       * S122 : il lui faut donc `auto` EXPLICITE, sans quoi sa croix de
       * fermeture serait une croix qu'on ne peut pas cliquer.
       *
       * ⚠ **L'ENCRE EST CELLE DU REFUS, LE FOND NE L'EST PAS.** `--stamp` dit
       * *« ceci ne peut pas se faire »* ; ici la chose EST faite, et le bandeau
       * ne fait qu'en dire le prix. Il prend donc le carton et le liseré du

      .equip-eteint { pointer-events: auto; align-self: center;
                      display: flex; align-items: baseline; gap: 10px;
                      flex-wrap: wrap; max-width: min(92vw, 900px);

                      background: var(--ink-2);
                      border: 1px solid var(--stamp); border-radius: 4px;

      .ee-l      { display: flex; align-items: baseline; gap: 8px; }
      .ee-nom    { font-family: var(--display); font-weight: 800; font-size: 14px;

      .ee-raison { font-size: 11px; color: var(--stock-dim); }
      .ee-fermer { margin-left: auto; background: transparent; border: 0;
                   color: var(--stock-dim); cursor: pointer; font-size: 13px; }
      .ee-fermer:hover { color: var(--stock); }
      .mb-milieu, .hand { pointer-events: none; }
      .handslot { pointer-events: auto; }
      /*
       * ⚑ **LE CRÉNEAU A LA LARGEUR DE SA CARTE, ET C'EST UNE MESURE.** Sans
       * `width`, il prenait celle de son contenu le plus large — le bouton
       * « équiper », le motif de refus — et les créneaux mesuraient 157, 171,
       * 188 px là où le pas était calculé sur 150. **Relevé : la rangée cessait
       * de tenir son budget dès la 11ᵉ carte (1 133 → 1 327 px).** Un
       * chevauchement calculé sur une largeur supposée décale tout l'éventail.
       */
      /* ⛑ S129 — ×2 (Croze) : `LARGEUR_CARTE` de `main.ts` vaut 300, ici aussi.
         Les deux valeurs sont UNE mesure écrite à deux endroits — voir le
         commentaire de `LARGEUR_CARTE`, qui dit ce qu'un désaccord coûte. */
      /*
       * ⛑ S164 — **LA MESURE N'EST PLUS ÉCRITE QUATRE FOIS : ELLE EST CALCULÉE
       * UNE FOIS ET POSÉE ICI.** Le commentaire ci-dessus disait *« UNE mesure
       * écrite à deux endroits »* et s'en remettait à la vigilance ; `.card`,
       * `PAS_MAX` et `.hand .cz-vignette` en faisaient quatre. `--carte-l` est
       * écrite par `renderHandPlays` sur `.hand` (voir `LARGEUR_CARTE`) : les
       * quatre lecteurs lisent désormais la même variable, et un désaccord
       * n'est plus possible. Le repli `300px` sert au cas où la variable
       * manque — il ne fait autorité nulle part.
       */
      .handslot { display: flex; flex-direction: column; gap: 4px;
                  flex: 0 0 var(--carte-l, 300px);
                  width: var(--carte-l, 300px);
                  margin-left: var(--ml, 0px); transform-origin: bottom center;
                  transform: translateX(var(--pousse, 0px)) translateY(var(--dy, 0px))
                             rotate(var(--rot, 0deg));
                  transition: margin-left .22s var(--pop), transform .22s var(--pop); }
      /*
       * **AU SURVOL, LA CARTE SE LÈVE** — `translateY` + léger `scale`, et elle
       * se redresse (`rotate(0)`) : on la lit à plat, comme on la lirait en
       * main. `z-index` au sommet, sinon on en lit une tranche.
       */
      /* Le lever suit l'échelle : sur une carte deux fois plus haute, −34 px
         ne se voyait plus comme un lever mais comme un tressaillement. */
      /*
       * ⛑ S565 — **LE LEVER REMONTE LA PLONGÉE, PUIS LÈVE.** Croze : *« elles
       * pop vers le haut quand on passe la souris dessus. »* La carte au repos
       * est descendue de `--plonge` : un survol à `-68px` seul l'aurait laissée
       * coupée par le bord bas. `-68px - var(--plonge)` la ramène ENTIÈRE, puis
       * la lève des mêmes 68 px qu'avant — *le survol rend la carte, il ne la
       * remonte pas à moitié*.
       *
       * ⚠ **`scale` NE POUSSE PAS LE BAS** : `transform-origin: bottom center`,
       * et le `scale` s'applique AVANT le `translateY` (les transformations se
       * lisent de droite à gauche). Le bord bas après survol vaut donc
       * exactement `bord bas de la rangée − 68 px`, quelle que soit l'échelle.
       */
      /*
       * ═══ ⚑⚑ S617 · LE SURVOL AMÈNE LA CARTE À MI-HAUTEUR (note 76 ②) ══════
       *
       * **Croze, verbatim** : *« Cartes en main au survol : elles montent TROP —
       * le pop reste près du bord bas de l'écran, pas à mi-hauteur. »*
       *
       * ⚠ **LA PHRASE PORTE DEUX MOITIÉS QUI TIRENT EN SENS INVERSE**, et c'est
       * la seconde qui NOMME une cible : *« pas à mi-hauteur »*. C'est elle que
       * j'applique. **Mesuré avant** (1920×1080, `?seed=16&jalon=TIER_10`) : la
       * carte survolée tenait `y 440 → 998`, **centre 719** pour un milieu de
       * fenêtre à **540** — 179 px trop bas, et son bord bas à 82 px du bord de
       * l'écran. *« Près du bord bas », c'est mesuré, pas ressenti.*
       * Le désaccord est déposé en `Q-76-SURVOL-MONTE-TROP` : ma lecture est que
       * `montent TROP` vise le GESTE (un long glissement) et `mi-hauteur` vise
       * le RÉSULTAT, et qu'entre les deux c'est la cible nommée qui tranche.
       *
       * ─── LE LEVER EST CALCULÉ, PLUS CHOISI ──────────────────────────────────
       *
       * `transform-origin: bottom center`, donc le `scale` **ne bouge pas le
       * bas** : après `translateY(L) scale(s)`, le centre vaut
       * `bas_de_mise_en_page + L − s·h/2`. On veut ce centre à `50vh` :
       *
       *     L = 50vh − bas_de_mise_en_page + s·h/2
       *       = 50vh − (100vh + plonge) + s·h/2        (la main est collée au bas,
       *                                                 et débordée de `--plonge`)
       *       = 55% − 50vh − var(--plonge)             avec s = 1,1
       *
       * **`55%` dans un `translateY` se résout sur la hauteur PROPRE du nœud**
       * — pas sur celle du parent, et **pas** sur la hauteur mise à l'échelle :
       * c'est exactement le `s·h/2` qu'il faut, sans qu'aucune hauteur de carte
       * n'ait à être écrite ici. *La règle porte la géométrie, pas un nombre.*
       *
       * ⚑ **RIEN D'ENFERMÉ EN 1920** (règle permanente de Croze) : `vh`, `%` et
       * `--plonge` viennent tous les trois de la fenêtre. Le `-68px` gravé
       * qu'elle remplace, lui, ne bougeait pas d'un écran à l'autre.
       *
       * ⚠ **IL RESTE UN ÉCART D'UNE VINGTAINE DE PIXELS, ET IL EST VOULU** :
       * l'éventail décale chaque carte de `0,4` à `19,6 px` vers le bas
       * (`translateY` de la carte au repos, qui croît vers les bords). La cible
       * `50vh` est donc atteinte à l'éventail près — la carte du milieu tombe
       * juste, celles des bords sont ~20 px plus bas. Corriger ça demanderait de
       * relire le décalage de chaque carte dans le sélecteur, ce qui grave huit
       * cas là où il y a une règle.
       */
      /*
       * ═══ ⛑⛑ S661 · NOTE 80 ② — ET ELLE REMPLACE LA NOTE 76 ② EN ENTIER ════
       *
       * **Croze, verbatim** : *« UXUI HAND CARDS : maintenant les cartes vont
       * encore plus haut qu'avant c'est ingérable, garde leur position de départ
       * et au max elle dépasse de 0 pixel, elle est juste totalement affichée,
       * exception si faut afficher un target et que pas d'autres façons. »*
       *
       * ⛑⛑ **LA FAUTE EST À LA NOTE 76 ②, PAS À CE QUI L'A APPLIQUÉE, ET IL
       * FAUT LE DIRE.** Sa phrase d'alors portait deux moitiés qui tiraient en
       * sens inverse — *« elles montent TROP »* et *« pas à mi-hauteur »* — et le
       * S617 a tranché pour la seconde, en le DÉPOSANT (`Q-76-SURVOL-MONTE-TROP`)
       * plutôt qu'en le taisant. **C'était la mauvaise moitié**, et le dépôt est
       * exactement ce qui permet de le savoir aujourd'hui : la question est
       * FERMÉE par ce verbatim. *Un désaccord qu'on écrit se referme ; un
       * désaccord qu'on tranche en silence se repaye.*
       *
       * ─── CE QUE LA CIBLE DEVIENT, ET ELLE N'A PLUS DE NOMBRE ──────────────
       *
       * *« au max elle dépasse de 0 pixel »* + *« garde leur position de
       * départ »* : le lever est **l'annulation EXACTE de la plongée**, rien de
       * plus. `translateY(calc(-1 * var(--plonge)))` remet le bas de la carte au
       * bord bas de la fenêtre — **débordement 0**, carte entière.
       *
       * ⚠ **PLUS DE `scale(1.1)`.** L'agrandissement était la moitié du
       * « ingérable » : à `transform-origin: bottom center` il ne poussait pas
       * le bas, mais il poussait le HAUT de 10 % d'une carte de 560 px, soit
       * 56 px de plus vers le ciel. *Ce qu'on ne monte pas n'a pas à redescendre.*
       * Le `rotate(0deg)` reste : redresser une carte n'est pas la monter.
       *
       * ⚠ **LA VARIANTE `prefers-reduced-motion` PREND LA MÊME CIBLE**, et elle
       * n'a plus de raison de différer : le demi-facteur qu'elle corrigeait
       * n'existait que sous l'échelle.
       *
       * ⚠ **L'EXCEPTION DE SA PHRASE EST LAISSÉE INTACTE ET NON GRAVÉE** :
       * *« exception si faut afficher un target et que pas d'autres façons »*.
       * Le S310 a mesuré que la carte **quitte la main** quand la cible se
       * désigne — l'exception est donc probablement sans objet, et *on ne grave
       * pas une exception qu'on n'a pas vue.*
       */
      .handslot:hover, .handslot:focus-within {
        z-index: 50 !important;
        transform: translateY(calc(-1 * var(--plonge, 0px))) rotate(0deg); }
      /*
       * **ET LES VOISINES S'ÉCARTENT D'UN SOUFFLE.** `:has()` sert la voisine
       * de GAUCHE, que le combinateur `+` ne peut pas atteindre. Un souffle,
       * pas un déploiement : la main entière ne s'ouvre plus au survol — c'est
       * la carte pointée qui prend la place, pas la rangée.
       */
      .handslot:hover + .handslot, .handslot:focus-within + .handslot { --pousse: 32px; }
      .handslot:has(+ .handslot:hover), .handslot:has(+ .handslot:focus-within) { --pousse: -32px; }
      /*
       * Un mouvement doit pouvoir être refusé. `transform/opacity only` reste
       * vrai ici : on ne remplace pas l'animation, on la coupe.
       */
      @media (prefers-reduced-motion: reduce) {
        .handslot { transition: none; }
        /* ⚑ S661 — **LA MÊME CIBLE, AU MOT PRÈS.** Elle différait du S617 parce
           que le `scale` déplaçait le demi-facteur ; sans `scale`, la variante
           n'a plus rien à corriger. *Deux règles qui disent la même chose
           divergent au premier réglage qu'on ne reporte pas sur les deux.* */
        .handslot:hover, .handslot:focus-within {
          transform: translateY(calc(-1 * var(--plonge, 0px))) rotate(0deg); }
      }
      /*
       * ═══ ⛑ S164 — LA CARTE EN MAIN **EST** SON IMAGE ═══════════════════════
       *
       * Retour de test Croze, **deuxième fois sur la même chose**, verbatim :
       * *« toujours un grand encadré gris autour de l'image de la carte, ça n'a
       * pas lieu d'être. »*
       *
       * ⚠ **LE S129 AVAIT RÉPONDU À CÔTÉ, ET C'EST MESURÉ.** Il avait lu
       * *« cadre gris supprimé »* comme le `border: 1px solid var(--rule)` de
       * `.cz-vignette`, et l'avait retiré. Le cadre que Croze voit n'a jamais
       * été ce trait d'un pixel : c'est **le châssis de `.card` lui-même** —
       * `background: var(--stock)` (rgb 198,191,172, un beige gris),
       * `padding: 9px` et surtout `min-height: 372px` autour d'une vignette de
       * 208 px. **Relevé au navigateur avant de toucher une ligne**, viewport
       * 1920×1080, `Caltrops` en main :
       *
       * ```
       * .card   300 × 372   fond rgb(198,191,172)
       * image   208 × 312   posée à (10,12) dans la boîte
       *         → 83 px de gris à droite, 51 px sous l'image
       * ```
       *
       * *Un fond de carton derrière une image qui imprime DÉJÀ son propre
       * carton est un second carton* — l'argument que le S129 avait écrit pour
       * la bordure, et qu'il n'avait pas appliqué au fond.
       *
       * **La boîte épouse donc l'image, et rien d'autre** : ni fond, ni marge
       * intérieure, ni hauteur plancher. Ce qui n'est pas l'image (le prix, le
       * réveil, le motif de refus) part dans `.cz-bandeau`, un bandeau posé
       * SUR le bas de l'illustration — rien ne meurt, rien ne pousse la boîte.
       *
       * **Les quatre règles de texte qui suivaient sont MORTES depuis le
       * S115** — `.card .rar`, `.card .nm`, `.card .tx` et leurs variantes de
       * rareté : ce jour-là le nom, la rareté, le slot et le texte ont quitté
       * la main (*« ce qui PART est ce que le carton imprime »*) et plus aucun
       * `el(…, 'rar'|'nm'|'tx')` ne naît sous un `.card` (vérifié au grep :
       * les seuls producteurs vivants sont sous `.abil` et les tuiles). Elles
       * partent avec le châssis qu'elles habillaient.
       */
      .card { position: relative; flex: 0 0 var(--carte-l, 300px);
              width: var(--carte-l, 300px);
              background: none; color: var(--ink); border: 1px solid transparent;
              padding: 0; display: block; cursor: pointer;
              text-align: left; font-family: var(--mono); text-transform: none; letter-spacing: normal;
              box-shadow: 0 3px 12px rgba(0,0,0,.55); transition: transform .12s, box-shadow .12s; }
      .card:hover:not(:disabled) { transform: translateY(-5px); box-shadow: 0 10px 22px rgba(0,0,0,.62); }
      /*
       * ⛑ S368 — LA CARTE RETENUE POUR LA DÉFAUSSE (note ㉞ ①). Elle se lève
       * comme au survol, mais **elle y reste** : c'est un état, pas un
       * pointage. Le lever est plus haut que celui du survol pour qu'une main
       * mi-retenue se lise d'un coup d'œil, et il reste un `transform` seul.
       * Le vert jouable `--activable` marque le choix ; ni ember, ni rouge.
       */
      .card.retenue { transform: translateY(-14px); box-shadow: 0 14px 26px rgba(0,0,0,.66);
                      border-color: var(--activable); }
      .card.retenue:hover:not(:disabled) { transform: translateY(-16px); }
      .cz-retenue { color: var(--activable); font-weight: 800; letter-spacing: .04em; }
      .cz-a-retenir { color: var(--slate); }
      .card .woke { color: var(--ember); }
      /*
       * **GRISER, JAMAIS CACHER** — la consigne de Croze tient, seule sa
       * matière change : le carton terni n'existe plus, c'est l'illustration
       * qui se ternit. Un `filter` statique, jamais animé : la règle
       * `transform/opacity only` porte sur le MOUVEMENT.
       */
      .card.no { cursor: not-allowed; }
      /*
       * ═══ ⚑ S309 · LES CARTES DE L'OFFRE — note ㉘ ② ═════════════════════
       *
       * ⚠ **UNE RANGÉE QUI DÉFILE, PAS UNE COLONNE.** Six cartes posées à la
       *    suite dans le flux auraient poussé la décision hors de l'écran —
       *    c'est mot pour mot la faute du S301 (*« six cibles = 1 230 px dans
       *    un écran de 1 080 »*). La rangée défile sur son propre axe et le
       *    reste du panneau ne bouge pas.
       * ⚠ **ELLES HÉRITENT DE `.card`**, donc du soulèvement au survol, du
       *    liseré de rareté et du zoom : *un seul mécanisme de carte*, la
       *    consigne de Croze depuis le S115.
       * ⚠ **LE VERBE SOUS L'ART, EN `--activable`.** C'est le seul endroit où
       *    le vert jouable est juste ici : il ne décore pas la carte, il dit
       *    le GESTE — `§2`, *« ça, TU peux le jouer »*.
       */
      .opt-cartes { display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden;
                    padding: 6px 0 8px; align-items: flex-end; }
      /* ⛑ S1271 · P-T1 — la carte qui pose la question, en tête de la fenêtre :
         sa vignette (survol = la carte en grand, comme partout) et son nom. */
      .poll-source { display: flex; align-items: center; gap: 14px; margin: 0 0 8px; }
      .poll-source-carte { flex: 0 0 auto; width: 84px; position: relative; }
      .poll-source-carte .cz-vignette { width: 100%; height: auto; display: block; }
      .poll-source-nom { font-family: var(--display); font-weight: 700; font-size: 20px;
                         letter-spacing: .08em; color: var(--stock); }
      /*
       * ─── ⛑⛑ S1283 · P3-T3 bis — LA PILE DE RÉACTIONS, LUE DE HAUT EN BAS ──
       *
       * Croze : *« on a un repère visuel pour voir la pile de réaction qui
       * s'enchaîne »*. Le repère est le FILET VERTICAL qui relie les rangs :
       * sans lui, trois lignes empilées se lisent comme une liste, pas comme
       * un enchaînement. Il est tiré par `::before` sur le bloc, derrière les
       * lignes — aucun nœud de plus, et il disparaît avec la pile.
       *
       * ⚠ **LA VIGNETTE EST PETITE, ET C'EST LE POINT DE LA RÈGLE ⓐ.** Elle
       * répond à *« laquelle ? »* ; le ⤢ du coin répond à *« montre-la-moi »*.
       * Une carte pleine taille ici aurait repoussé les cartes JOUABLES hors
       * du panneau — la faute du S301, *« six cibles = 1 230 px dans un écran
       * de 1 080 »*.
       *
       * ⚠⚠ **NE PAS RELIRE CETTE FEUILLE POUR SAVOIR SI LE SURVOL AGRANDIT —
       * ELLE N'EN PORTE QUE LA MOITIÉ.** La première version de ce bloc
       * écrivait qu'aucune règle `:hover` ne vise ces cartes (vrai : il n'y a
       * que `.creneau`, `.qtc`, `.fi-carte`) et en concluait que le survol y
       * était inerte. **Mesuré : il les agrandissait quand même** — l'autre
       * moitié du mécanisme est un écouteur `mouseover` de `main.ts`, dont
       * l'ancre était `.cz` NU. L'exception est posée là-bas
       * (`.cz:not(.cz-au-coin)`), et `cz-ouvert` — posée par le ⤢ — est la
       * seule porte qui reste ici.
       */
      .pile-reactions { position: relative; margin: 8px 0 10px; padding: 6px 0 2px; }
      .pile-reactions::before { content: ''; position: absolute; left: 9px;
                                top: 26px; bottom: 10px; width: 1px;
                                background: var(--gold); opacity: .45; }
      .pr-tete { font-family: var(--display); font-weight: 800; font-size: 11px;
                 letter-spacing: .12em; color: var(--stock); opacity: .8;
                 margin: 0 0 6px 26px; }
      .pr-ligne { position: relative; display: flex; align-items: center; gap: 10px;
                  padding: 4px 0; }
      .pr-rang { flex: 0 0 auto; width: 19px; height: 19px; border-radius: 50%;
                 display: flex; align-items: center; justify-content: center;
                 font-family: var(--display); font-weight: 800; font-size: 11px;
                 color: var(--stock); background: rgba(14,12,9,.96);
                 border: 1px solid var(--gold); }
      .pr-carte { flex: 0 0 auto; position: relative; width: 64px; }
      .pr-carte .cz-vignette { width: 100%; height: auto; display: block; }
      .pr-loupe { position: absolute; right: 2px; bottom: 2px; z-index: 3;
                  width: 20px; height: 20px; padding: 0; cursor: pointer;
                  display: flex; align-items: center; justify-content: center;
                  font-size: 12px; line-height: 1; color: var(--stock);
                  background: rgba(14,12,9,.94); border: 1px solid var(--gold); }
      /*
       * ⛑ S1283 — LE ⤢ D'UNE CARTE JOUABLE. Le parent est le `<button>` qui
       * JOUE : il est donc ancré sur la carte (`.opt-carte` devient le repère)
       * et posé en HAUT à droite, pour ne pas manger le verbe (« jouer »)
       * imprimé sous l'art.
       */
      /*
       * ⛑⛑ **S1283 — LE ⤢ D'UNE CARTE JOUABLE ÉTAIT `position: relative`, ET
       * LA MESURE FONCTIONNELLE ÉTAIT VERTE PENDANT CE TEMPS.**
       *
       * `.pr-loupe` le pose en `absolute` ; **une règle vieille de mille
       * paliers le reprend** — `.opt-carte.lit:not(.no) > *` (le scintillement
       * du S492) met TOUS les enfants directs en `relative` pour les lever
       * au-dessus de son `::before`, et elle pèse plus lourd. Mesuré : le ⤢
       * tombait à `[769, 721]` pour une carte à `[771, 567, 97, 189]` — **hors
       * de la carte**, et pourtant le clic marchait, donc tous mes relevés
       * d'ouverture / de fermeture étaient VERTS.
       *
       * *Une classe déjà prise repeint une autre surface en silence, et un
       * relevé de COMPORTEMENT ne dit rien d'une PLACE.* La spécificité est
       * donc écrite exprès, à la même forme que la règle qu'elle doit passer.
       */
      .opt-carte.lit:not(.no) > .opt-loupe,
      .opt-carte > .opt-loupe { position: absolute; top: 2px; right: 2px;
                                bottom: auto; z-index: 4; }
      .pr-quoi { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
      .pr-qui { font-family: var(--display); font-weight: 800; font-size: 10px;
                letter-spacing: .1em; }
      .pr-nom { font-size: 13px; color: var(--stock); }
      /* La SEULE porte du zoom dans cette pile — posée par le ⤢, jamais par le survol. */
      .cz-ouvert > .cz-zoom { opacity: 1; pointer-events: auto;
                              transform: translate(-50%, -50%) scale(1); }

      /* ⛑ S1283 — `position: relative` : le ⤢ du coin s'ancre sur LA CARTE.
         Il est POSÉ ICI, dans la règle qui existe, et pas dans une seconde à
         côté — deux écritures d'une même règle finissent par en dire deux. */
      .opt-carte { flex: 0 0 auto; width: clamp(84px, calc(var(--uvh) * 9), 132px);
                   display: flex; flex-direction: column; gap: 3px; position: relative;
                   background: none; border: none; padding: 0; cursor: pointer; }
      .opt-carte .cz-vignette { width: 100%; height: auto; display: block; }
      .opt-verbe { font-family: var(--display); font-weight: 800; font-size: 11px;
                   letter-spacing: .1em; text-transform: uppercase;
                   color: var(--activable); }
      .card.no .cz-vignette { filter: saturate(.28) brightness(.6); }

      /*
       * ─── ⛑ S187 · LE CHOIX DE PILE, EN SURIMPRESSION SUR LE CARTON ───────
       *
       * Croze : *« pas via un bouton sous la carte »*. Les six piles du Whiff
       * ne peuvent pas se deviner — elles se posent donc SUR la carte, au-dessus
       * du bandeau (`z-index` 4 contre 3), et seulement après le clic qui les
       * demande. `pointer-events: auto` parce que le parent est un `<button>` :
       * sans lui, le clic sur une pile serait avalé par la carte et rejouerait
       * l'ouverture.
       *
       * **Aucune animation** — la règle `transform/opacity only` porte sur le
       * mouvement, et ce panneau n'en fait aucun : il est là ou il n'est pas.
       */
      .cz-piles { position: absolute; inset: auto 6px 6px 6px; z-index: 4;
                  display: flex; flex-wrap: wrap; gap: 4px; justify-content: center;
                  padding: 6px; pointer-events: auto;
                  background: rgba(14,12,9,.94); border: 1px solid var(--gold); }
      .cz-piles button { flex: 0 0 auto; font-size: 10px; padding: 4px 6px; }

      /*
       * ─── LE BANDEAU — CE QUE LE CARTON NE PORTE PAS, POSÉ SUR LE CARTON ──
       *
       * Trois choses ne sont pas dans l'illustration et ne peuvent pas y
       * entrer : le PRIX du coup, ce qui a RÉVEILLÉ la carte, et le MOTIF d'un
       * refus. Elles vivaient sous l'image, dans le gris ; le gris parti, elles
       * seraient tombées sur le fond sombre de la rangée, illisibles.
       *
       * Elles se posent donc en bas de l'illustration, sur un dégradé qui
       * s'éteint vers le haut — la lisibilité vient du dégradé, pas d'un aplat
       * qui redeviendrait un cadre. `pointer-events: none` : le bandeau est une
       * légende, le clic appartient à la carte.
       */
      .cz-bandeau { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
                    display: flex; flex-direction: column; gap: 1px;
                    padding: 14px 8px 6px; pointer-events: none;
                    background: linear-gradient(to top,
                                rgba(14,12,9,.94), rgba(14,12,9,.78) 58%, rgba(14,12,9,0)); }
      .cz-bandeau .motif-lu { padding-top: 0; color: #E2A79E; }
      .cz-bandeau .motif-lu.neutre { color: #CFC8B8; }
      .cz-bandeau .prix { margin-top: 0; }

      /*
       * ─── LE TAMPON DE REFUS (§3) ────────────────────────────────────────
       *
       * **Griser, jamais cacher** : la carte reste là, en carton terni. Ce qui
       * se replie est la RAISON — *« toujours affiché, ça capte trop
       * l'attention et ça noie le joueur »*, décision de Croze, close.
       */
      .stamp { position: absolute; left: 50%; top: 52%;
               transform: translate(-50%, -50%) rotate(-11deg) scale(.94);
               border: 2px solid var(--stamp); outline: 1px solid var(--stamp); outline-offset: 2px;
               color: var(--stamp); background: rgba(217,211,194,.86);
               font-family: var(--display); font-weight: 800; font-size: 14px; line-height: 1.05;
               letter-spacing: .06em; text-transform: uppercase; text-align: center;
               padding: 6px 8px; width: 88%; pointer-events: none; opacity: 0; transition: opacity .1s; }
      /*
       * ⚠⚠ ⛑ S291 — **J'AI POSÉ `--alert` ICI ET L'INSTRUMENT M'A CONTREDIT :
       * `2,40` → `1,70`. LE CHANGEMENT EST ANNULÉ.**
       *
       * J'avais calculé `--alert` sur `--ink-2` (`5,09`) — un fond SUPPOSÉ. Le
       * fond RÉEL de ce tampon-ci, lu dans la page, est
       * `rgba(217, 211, 194, .86)` : **du carton CLAIR**. Une encre claire sur
       * un fond clair perd ce qu'elle gagnait sur du sombre.
       *
       * *C'est mot pour mot la faute que `contraste_dom.js` documente en tête
       * de son propre fichier — « l'instrument avait CHOISI le fond à la place
       * de la page » — et je viens de la refaire à la main, une passe après
       * l'avoir lue.*
       *
       * Le vrai défaut n'est pas l'encre : **c'est que ce tampon a deux fonds**
       * (clair ici, `rgba(31,27,22,.94)` sous `.abil`). Aucune encre de la
       * palette ne passe sur les deux. Déposé en question — changer un FOND
       * n'est pas dans le GO de la note ⑰ ②.
       */
      .stamp small { display: block; font-family: var(--mono); font-weight: 400; font-size: 9px;
                     letter-spacing: .03em; margin-top: 3px; text-transform: none; }
      /*
       * ⛑⛑ **S555 — LE MÊME TAMPON, DEUX FONDS, DEUX VERDICTS.**
       *
       * `.stamp` vit sur le carton CLAIR d'une carte : `--stamp` y rend
       * **4,85** à 14 px, et c'est juste — le S291 avait même ANNULÉ un
       * passage à `--alert` ici, mesure à l'appui. **Mais celui-ci pose sa
       * plaque à `rgba(31,27,22,.94)`**, un fond SOMBRE : mesuré sur pièce,
