       * n'est pas un coup : c'est une PORTE. Elle se distingue par la TAILLE et
       * le contraste, pas par une couleur empruntée.
       */
      .fr-go { display: block; margin: 10px auto 4px; padding: 10px 26px;
               font-family: var(--display); font-weight: 800; font-size: 17px;
               letter-spacing: .06em; }
      /*
       * ⛑⛑ **S826 — CE TITRE N'AVAIT PAS DE TAILLE, ET C'EST LA RÉPONSE À
       * L'ORDRE ⑤ ② (note 100 ②, réclamé QUATRE fois).**
       *
       * Croze demandait *« un vrai écran FIN DU RUN 1 »* et disait ne pas le
       * voir. **Il EST là, et le S680 a bien mis `START RUN 2 →` en premier** —
       * mesuré : c'est le seul bouton de l'écran au-dessus de 12 px. Ce qui
       * manquait est ailleurs, et c'était une OMISSION : cette règle pose la
       * fonte, la graisse, l'interlettre et la marge, **et aucune taille**. Le
       * `h2` retombait donc à **13 px sur un 1920×1080** — mesuré au navigateur,
       * peau JOUEUR, `?jalon=REDRAFT&siege=Joueur 1` :
       *
       * ```
       * FIN DE TOUR   69 px   .borne-titre, clamp(54,6.4vh,96) — la BORNE d un TOUR
       * DEAD          30 px
       * The Guard     21 px   un nom de personnage
       * START RUN 2   17 px   le bouton de CE panneau
       * FIN DU RUN 1  13 px   <- le titre du panneau, sous son propre bouton
       * ```
       *
       * **Le titre du panneau était plus petit que son propre bouton, et cinq
       * fois plus petit que la fin d'un TOUR DE DONJON** — c'est-à-dire que le
       * plus grand moment du jeu s'écrivait cinq fois plus petit que le plus
       * petit. *Une hiérarchie ne se décrète pas dans un commentaire : elle se
       * mesure en pixels.* Le commentaire de `.fr-go`, dix lignes plus haut,
       * disait déjà *« elle se distingue par la TAILLE et le contraste »* — il
       * n'avait été appliqué qu'au bouton.
       *
       * ⚠ **LA TAILLE EST DÉRIVÉE, PAS INVENTÉE** : exactement la MOITIÉ du
       * clamp de `.borne-titre`. Un panneau qui reste à l'écran ne doit pas
       * crier aussi fort qu'un bandeau qui passe — mais il doit dominer sa
       * propre boîte, ce qui n'était pas le cas.
       */
      .fr-titre h2 { font-family: var(--display); font-weight: 800;
                     font-size: clamp(27px, calc(var(--uvh) * 3.2), 48px); line-height: 1.05;
                     letter-spacing: .12em; margin: 0; }
      .fr-sous-titre { font-size: 11px; color: var(--slate); letter-spacing: .04em; }
      /*
       * ⚠ **UNE COLONNE PAR JOUEUR, ET C'EST MESURÉ.** Empilées en lignes, les
       * quatre faisaient **2 350 px dans une fenêtre de 1 080** : il fallait
       * défiler pour lire un tableau qui existe pour se lire d'un coup d'œil.
       * La répartition disait où — `.fr-stuff` 530 px sur les 544 d'une ligne.
       * Côte à côte, la hauteur du tableau devient celle d'UN joueur.
       */
      .fr-table { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
                  gap: 8px; align-items: start; }
      .fr-ligne { display: flex; flex-direction: column; gap: 6px;
                  padding: 6px; background: var(--ink-2);
                  border: 1px solid var(--rule); }
      .fr-tete { display: flex; flex-direction: column; gap: 4px; }
      /*
       * ⚠ **UNE CASE DE TABLEAU N'EST PAS UNE COLONNE DE JOUEUR.** En 16:9
       * pleine largeur la bannière prenait **209 px sur les 917 du tableau** —
       * un quart de la hauteur pour une image qui sert seulement à reconnaître
       * le siège d'un coup d'œil. Recadrée en bandeau, elle dit la même chose
       * et rend la place à ce qu'on vient lire : les points et le stuff.
       */
      .fr-banniere { width: 100%; aspect-ratio: 32 / 9; object-fit: cover;
                     object-position: center 30%;
                     border: 1px solid var(--rule); }
      .fr-nom { display: flex; flex-direction: column; gap: 2px; }
      .fr-perso { font-family: var(--display); font-weight: 800; font-size: 12px;
                  letter-spacing: .04em; }
      .fr-score { font-family: var(--display); font-weight: 800; font-size: 30px;
                  line-height: 1; color: var(--activable); }
      /*
       * ⛑⛑ `M-S835`, S842 — CE QUI A ÉTÉ MARQUÉ DANS CE RUN, À CÔTÉ DU TOTAL.
       * Il est PLUS PETIT et en `--slate` : le total reste ce qu'on lit en
       * premier (c'est lui qui désigne le vainqueur, §10), et le run est la
       * précision. *Deux nombres de même poids se lisent comme deux totaux.*
       */
      .fs-run { font-family: var(--display); font-weight: 800; font-size: 10px;
                letter-spacing: .08em; color: var(--slate); }
      .fr-deux-runs { font-size: 10px; line-height: 1.5; color: var(--slate);
                      margin-top: 8px; max-width: 62ch; }
      .fr-sous { font-family: var(--display); font-weight: 800; font-size: 9px;
                 letter-spacing: .1em; color: var(--slate); margin-bottom: 3px; }
      .fr-sources { display: flex; flex-direction: column; gap: 2px; }
      .fr-source { display: flex; justify-content: space-between; gap: 8px;
                   font-size: 11px; }
      .fr-pts { color: var(--activable); font-weight: 700; }
      .fr-vide { font-size: 11px; color: var(--slate); }
      /*
       * ⛑⛑ S1220 · P4-T2 — CE QUE LE RUN A FAIT. Même grammaire que
       * `.fr-sources` juste au-dessus : deux colonnes, libellé à gauche,
       * nombre à droite. *Une seconde grammaire pour la même forme est une
       * divergence en attente.* Le nombre prend `--stock`, pas `--activable` :
       * `--activable` dit « tu peux cliquer », et une stat ne se clique pas.
       */
      .fr-stats { display: flex; flex-direction: column; gap: 2px;
                  margin-top: 6px; padding-top: 5px;
                  border-top: 1px solid var(--rule); }
      .fr-stat { display: flex; justify-content: space-between; gap: 8px;
                 font-size: 11px; color: var(--slate); }
      .fr-stat-val { color: var(--stock); font-weight: 700; }
      /*
       * ⛑ S1274 — **HUIT LIGNES DANS LA HAUTEUR DE QUATRE.** L'écran de fin
       * porte les huit familles que Croze a validées (#41 D) ; empilées, elles
       * ajoutaient 76 px par siège, soit **304 px de page en plus** sur un
       * tableau qui défilait déjà (2 209 px mesurés à 1920 × 1080). La ligne
       * fait 1 107 px de large pour un libellé et un nombre : la place est
       * HORIZONTALE, et elle ne coûte rien. Le modificateur ne vaut QUE pour
       * l'écran de fin — `FIN DU RUN 1` garde ses quatre lignes en colonne,
       * telles que Croze les a vues.
       */
      .fr-stats.fr-stats2 { display: grid; grid-template-columns: 1fr 1fr;
                            column-gap: 24px; }
      .fr-stats.fr-stats2 > .fr-sous { grid-column: 1 / -1; }
      .fr-stats.fr-stats2 > .fr-vide { grid-column: 1 / -1; }
      /*
       * ⛑ S525 — LA PERTE DU MORT (verdict 24). `--stamp` est le tampon de
       * refus ; `--ember` reste RÉSERVÉ au Collapse, et une perte de points
       * n'est pas un Collapse.
       */
      .fr-perte { border-top: 1px solid color-mix(in srgb, var(--stamp) 45%, transparent);
                  margin-top: 3px; padding-top: 3px; }
      /*
       * ⛑⛑ **S556 — LA PERTE DE POINTS D'UN MORT ÉTAIT À `1,88`.** Guettée
       * sur `?seed=7&jalon=REDRAFT` : le `−1` de *« Dead — run lost »* rend
       * **1,88** à 11 px sur `[21,21,21]`, seuil `4,5`. `--alert` : **4,99**.
       * Le liséré de `.fr-perte` reste en `--stamp` : c'est un APLAT, et la
       * maison lui garde cette teinte.
       */
      .fr-pts-perte { color: var(--alert); font-weight: 700; }
      /*
       * ═══ ⚑⚑ S607 · LE PODIUM DE FIN DE RUN — réf `docs/refs/fin_run_REF.html`
       *
       * Sa réf déclare `--bone:#f2f2f2`, `--blood:#8b0d0d`, `--dust:#8a8578` :
       * ce sont `--stock`, `--rouge` et `--stock-dim`. **Le podium prend les
       * jetons, jamais les hexadécimaux** — une copie est une divergence en
       * attente. Voir `main.ts::podiumDeFinDeRun` pour la seule teinte qui
       * s'écarte de sa réf, et pourquoi (le seuil de lisibilité, S605).
       *
       * ⚠ **`transform` ET `opacity` SEULEMENT**, et l'état AU REPOS est
       * l'état FINAL : un keyframe `from` sans `fill-mode`. Volet masqué,
       * l'horloge du compositeur n'avance pas — un podium dont la hauteur
       * SORTIRAIT de l'animation resterait à plat pour toujours, et se
       * lirait comme un podium cassé.
       */
      .fr-podium { display: flex; flex-direction: column; }
      /*
       * ⛑⛑ **PREMIER JET FAUX, ET IL S'EST TU : LA MARCHE VALAIT `0`.** Vu à
       * l'écran, graine 7 — `.fr-fosse` mesurait **0 px** de haut pendant que
       * le buste en mesurait **391** dans une scène de **300**. Une fosse est
       * un enfant de flex : elle SE COMPRIME avant de déborder, donc l'excès du
       * portrait s'est payé sur la marche, en silence, et le podium rendait un
       * chiffre posé sur rien.
       *
       * ⚠ **LA CAUSE N'EST PAS UNE VALEUR, C'EST UNE PROPORTION QUI NE SE
       * TRANSPOSE PAS.** Sa réf pose la scène dans un 16:9 : elle y est **0,52
       * fois aussi haute que large**, et ses 21 % de créneau valent alors un
       * portrait qui tient sous la marche. Reprise pleine largeur (1 185 px)
       * pour 300 px de haut, la même règle en pourcents rend un portrait deux
       * fois trop grand. **On borne donc la LARGEUR de la scène** — les
       * pourcents de Croze redeviennent les siens — plutôt que de retailler ses
       * proportions une à une.
       */
      .fr-marches { display: flex; align-items: flex-end; justify-content: center;
                    gap: 2.4%; width: 620px; max-width: 100%; height: 320px;
                    margin: 0 auto; }
      .fr-place { flex: 0 0 21%; height: 100%;
                  display: flex; flex-direction: column;
                  align-items: center; justify-content: flex-end; }
      .fr-pod-qui { display: flex; flex-direction: column; align-items: center; gap: 5px;
                    margin-bottom: 6px;
                    animation: fr-pod-parait .5s ease-out; }
      .fr-pod-qui img { width: 72%; aspect-ratio: 3 / 4; object-fit: cover;
                        object-position: center 22%;
                        border: 1px solid var(--rule); display: block; }
      /*
       * ⚠ **`84 %`, ET C'EST LE CHIFFRE DE SA RÉF, PAS UN RÉGLAGE.** Mon jet
       * précédent portait `88 %` : le buste du premier débordait la scène de
       * 15 px par le haut. La réf dit `.p1 .who img{width:84%}` — la marge
       * qu'elle laisse au-dessus n'est pas du vide, c'est ce qui fait tenir le
       * portrait le plus grand au-dessus de la marche la plus haute.
       */
      .fr-place-1 .fr-pod-qui img { width: 84%; border-color: var(--stock); }
      .fr-pod-nom { font-family: var(--display); font-weight: 800; font-size: 12px;
                    letter-spacing: .08em; text-align: center; }
      /*
       * La FOSSE recadre la marche pour qu'elle MONTE du sol au lieu d'y
       * pousser : `overflow` fixe, `transform` seul dedans. C'est ce qui rend
       * le chiffre net pendant le geste — un `scaleY` l'aurait étiré.
       */
      /*
       * ⚠ **`flex-shrink: 0` N'EST PAS UN RÉGLAGE, C'EST LA GARDE.** Sans lui,
       * la fosse redevient la variable d'ajustement de tout ce qu'on posera
       * au-dessus, et elle retombera à zéro sans rien dire. La hauteur de la
       * marche est une DONNÉE de la réf ; elle ne s'ajuste pas.
       */
      .fr-fosse { width: 100%; overflow: hidden; flex-shrink: 0; }
      .fr-marche { height: 100%; min-height: 44px;
                   background: var(--ink-2); border: 1px solid var(--rule);
                   border-bottom: none;
                   display: flex; flex-direction: column;
                   align-items: center; justify-content: center; gap: 2px;

      /*
       * ⚠ **LE DÉCALAGE EST DANS LA DURÉE, PAS DANS `animation-delay`.** Les
       * trois partent ensemble et arrivent décalées — la plus haute met le plus
       * longtemps. Un `delay` sans `fill` laisserait voir l'arrivée avant le
       * départ ; avec `fill: backwards`, une horloge gelée figerait sur le
       * `from`, c'est-à-dire une marche invisible pour toujours.
       */
      .fr-marche-1 { animation-duration: .86s; }
      .fr-marche-2 { animation-duration: .68s; }
      .fr-marche-3 { animation-duration: .5s; }
      .fr-place-1 .fr-marche { border-color: var(--stock); }
      .fr-pod-rang { font-family: var(--display); font-weight: 800; font-size: 11px;
                     letter-spacing: .24em; color: var(--stock-dim); }
      .fr-pod-pts { font-family: var(--display); font-weight: 800; font-size: 38px;

      .fr-place-1 .fr-pod-pts { color: var(--stock); font-size: 46px; }
      .fr-pod-lbl { font-family: var(--display); font-weight: 800; font-size: 9px;
                    letter-spacing: .28em; color: var(--stock-dim); }
      .fr-sol-trait { height: 1px; background: var(--rule); margin: 0 4%; }
      /*
       * Les 17 graines sur 119 où personne ne ressort debout : la scène le DIT
       * plutôt que de rendre 320 px de vide, qui se liraient comme une panne.
       */
      .fr-pod-personne { text-align: center; padding: 14px 0 10px;
                         font-family: var(--display); font-weight: 800;
                         font-size: 15px; letter-spacing: .2em;
                         color: var(--stock-dim);
                         border-bottom: 1px solid var(--rule);
                         margin: 0 4%; }
      /*
       * LE SOL — « ceux qui ne sont pas sur le podium ». Le gris et le badge
       * MORT ne se posent que sur un mort : la rangée dit la PLACE, le badge
       * dit l'ÉTAT.
       */
      .fr-sol { display: flex; justify-content: flex-end; gap: 14px;

                animation: fr-sol-parait 1.3s ease-out; }
      .fr-tombe { width: 120px; text-align: center; }
      .fr-tombe .fr-pod-qui { margin-bottom: 5px; }
      .fr-tombe .fr-pod-qui img { width: 62%; }
      .fr-tombe-mort .fr-pod-qui img { filter: grayscale(1) brightness(.55);
                                       border-color: var(--rule); }
      .fr-tombe-mort .fr-pod-nom { color: var(--stock-dim); }
      /*
       * ⛑ **S605 — SA RÉF PEINT « MORT » EN `--blood` SUR LE NOIR : 1,88.**
       * C'est le chiffre de `Q-ROUGE-ENCRE`, et le rouge ÉCLAIRCI est celui que
       * la maison pose sur fond sombre depuis le S556 (`.fr-pts-perte`).
       */
      .fr-mort-badge { display: inline-block; border: 1px solid var(--alert);
                       color: var(--alert); font-family: var(--display);
                       font-weight: 800; font-size: 10px; letter-spacing: .14em;
                       padding: 3px 7px; }
      .fr-vif-badge { font-family: var(--display); font-weight: 800; font-size: 10px;
                      letter-spacing: .14em; color: var(--stock-dim); }
      .fr-mort-mi { margin-top: 5px; font-size: 10px; font-style: italic;
                    color: var(--stock-dim); }
      @keyframes fr-marche-monte { from { transform: translateY(100%); } }
      @keyframes fr-pod-parait  { from { opacity: 0; transform: translateY(-14px); } }
      @keyframes fr-sol-parait  { 0%, 55% { opacity: 0; } 100% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {

      .fr-splash { text-align: center; padding: 10px 0; }
      .fr-splash-mot { font-family: var(--display); font-weight: 800;

      /*
       * H-T4 · note 156 — LES TRANSITIONS PEINTES. Le clip (`*_alpha.webm` du
       * kit, 1280×720) couvre toute la couche, SANS mode de fusion
       * (`HUD_PEINTURE_BLANCHE.md`) ; le texte de l'annonce passe au-dessus.
       * Aucun clic n'est pris par le clip : « un clic coupe » tient.

      .transition-peinte { position: absolute; inset: 0; width: 100%; height: 100%;
                           object-fit: cover; pointer-events: none; z-index: 0; }
      .dicelayer.transition > .borne-bloc { position: relative; z-index: 1; }
      /* Le titre rouge (`--rouge-vif`) posé sur la peinture SANG ne se lit pas
         — vu au volet, « TU ES MORT » rouge sur la ligne rouge. La DA du kit
         (noir · blanc peint · sang) : sur une annonce peinte, le mot est BLANC,
         la couleur est au clip. */
      .dicelayer.transition .borne-titre { color: #F2F2F2;
        text-shadow: 0 3px 0 #0B0B0B, 0 0 24px rgba(0,0,0,.85); }
      .dicelayer.transition .borne-cause,
      .dicelayer.transition .borne-siege { color: #F2F2F2; font-size: 20px;
        text-shadow: 0 2px 0 #0B0B0B, 0 0 16px rgba(0,0,0,.9); }
      .dicelayer.transition > .skip { z-index: 2; }
      /* S1247 · Q-HT4-RUN1 — l'annonce RUN 1 : la bande BLANCHE du splash RUN 2,
         donc le mot à l'ENCRE et à sa taille, pas en blanc. */
      .dicelayer.transition.run-annonce .borne-titre { color: var(--ink); text-shadow: none;
        font-size: clamp(54px, calc(var(--uvh) * 6.4), 96px); letter-spacing: .22em; }
      /* ⛑ `.fin-run.fr-plein > *` borne chaque enfant à 1 100 px : le splash
         peint n'en couvrait que la gauche (vu au volet). Même poids de
         sélecteur, déclaré plus bas : celui-ci l'emporte. */
      .fr-splash.peint { position: fixed; inset: 0; z-index: 950; display: grid;
                         max-width: none; width: auto;
                         place-items: center; padding: 0;
                         background: rgba(10, 8, 6, .94); }
      .fr-splash.peint .fr-splash-mot { position: relative; z-index: 1;
                                        font-size: clamp(54px, calc(var(--uvh) * 6.4), 96px);
                                        color: var(--ink); }
      .obj-rangee.grandes { gap: 12px; }
      .obj-rangee.grandes .obj-cible { width: 216px; padding: 8px; font-size: 15px; }
      .obj-rangee.grandes .obj-nom { line-height: 1.25; }
      .obj-rangee.grandes .obj-motif { font-size: 12px; }
      .obj-rangee.grandes .obj-cible.levee { transform: translateY(-12px); }
      .tz-calque { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
            /*
       * ⛑ S285 — LE REFUS D'UNE ZONE, SOUS LE VISUEL (note ㉓ ②). Il ne prend
       * ni le rouge du Collapse ni le vert jouable : c'est un REFUS, et le
       * refus a déjà son encre dans cet écran (`motif-lu`). Le cadre le pose
       * simplement là où l'œil vient de cliquer.
       */
      /*
       * S669 - LA LISTE DES SIEGES TROQUABLES, sous le coin du bas-gauche
       * (note 81 (6)). Elle ne parait QUE si plusieurs sieges sont
       * troquables : a une seule cible, le coin fait le geste. Elle vit
       * DANS `.tz-calque`, qui est en `pointer-events: none` - chaque
       * bouton reprend donc le sien, comme `.tz` le fait.
       */
      /* S745 — la liste s’ouvre sous le coin TRADE, passe au rang 1 de la
         rangee basse : 27,225 %. `main.ts` porte la table. */
      .tz-troc-liste { position: absolute; left: 27.225%; top: 60%;
        display: flex; flex-direction: column; gap: 3px; z-index: 4;
        padding: 4px; background: var(--ink-2);
        border: 1px solid var(--rule); pointer-events: auto; }
      .tz-troc-liste button { font-size: 11px; padding: 3px 6px; }
      /* S761 — la liste des cadavres, sous le coin rang 3 : 58,675 %.
         `main.ts` porte la table des abscisses, ici comme pour le troc. */
      .tz-depouille-liste { position: absolute; left: 58.675%; top: 60%;
        display: flex; flex-direction: column; gap: 3px; z-index: 4;
        padding: 4px; background: var(--ink-2);
        border: 1px solid var(--rule); pointer-events: auto; }
      .tz-depouille-liste button { font-size: 11px; padding: 3px 6px; }
      .tz-refus { margin: 6px 0 0; padding: 6px 8px; border: 1px solid var(--rule);
                  background: var(--ink-2); display: flex; flex-direction: column; gap: 3px; }
      /*
       * ⚑ **S580 — L'INERTIE N'EST PAS UN REFUS** (note 67 ③). Elle partage la
       * boîte, pas le liseré : un refus n'a pas eu lieu, une inertie a eu lieu
       * et n'a rien fait. Le liseré pointillé dit « c'est arrivé, et c'est
       * resté vide » — la même graphie que le `?` du roster, qui dit déjà
       * *« provisoire »*, jamais *« interdit »*.
       */
      .tz-inerte { border-style: dashed; }
      /*
       * ═══ ⛑ S293 · « TROP CHEAP » — LE CALQUE PASSE À L'ENCRE (note ⑱ ⑨) ════
       *
       * Verbatim Croze : *« les encadrés sont fonctionnels bravo, maintenant
       * ils gagneraient à être plus jolis peut-être plus subtils, je n'ai pas
       * d'idée mais là c'est trop cheap »*, et sa consigne : *« trait fin, pas
       * de remplissage au repos, le contour qui s'allume au survol, angles
       * doux, dans ta palette d'encre — jamais l'ember, jamais le vert jouable
       * (#7FB069 reste le signal "jouable") »*.
       *
       * ⚑ **TROIS DE SES CINQ DEMANDES ÉTAIENT DÉJÀ TENUES** — trait de 1 px,
       * fond transparent, anneau au survol. Ce qui faisait « cheap » tient en
       * deux choses, et ce sont les deux qu'il nomme :
       *
       * ⓐ **LE CADRE ÉTAIT VERT.** `--activable` au repos, sur toute la
       *    bordure : le signal « jouable » servait de décoration, et un signal
       *    qui décore ne signale plus. Il retourne au TEXTE — `MOVE` reste vert,
       *    c'est lui l'annonce — et le cadre passe à `--stock`, l'encre de la
       *    page.
       * ⓑ **IL Y AVAIT DEUX TRAITS.** Le `border` ET un `box-shadow` noir de
       *    1 px collé dessus : deux liserés de largeur égale, c'est exactement
       *    ce qui fait un cadre bon marché. L'ombre devient une ombre — floue,
       *    portée — au lieu d'un second contour.
       *
       * Angles de `7px` → `10px` : *« angles doux »*, et c'est le seul nombre
       * que sa phrase laisse choisir.
       */
      .tz { position: absolute; pointer-events: auto; cursor: pointer;
            background: transparent;
            /* ⛑ S307 — le trait au repos part : c'est LUI, le « carré tout
               moche » de la note ㉖ ④. Il reste TRANSPARENT et non supprimé,
               pour que la géométrie ne bouge pas d'un pixel, et il reprend son
               encre sous `prefers-reduced-motion`. */
            border: 1px solid transparent;
            /*
             * ⛑⛑ **S624 — LA MARGE D'UN PIXEL QUI DÉCALAIT LES QUATRE ZONES.**
             * La règle posait `padding: 0` et taisait la MARGE : `.tz` est un
             * `button`, et il héritait le `margin: 1px` de la feuille. Sur un
             * élément en `position: absolute` posé par `left`, une marge
             * gauche **DÉPLACE** — elle ne réserve pas de place, elle décale.
             *
             * ⚠ **CE N'EST PAS UNE COQUETTERIE : LES TROIS ZONES SONT MESURÉES
             * AU PIXEL** sur les 90 webp (`0,7908`, écart `0,000`), et elles se
             * peignaient toutes **1 px à droite** de la région qu'elles visent.
             * Invisible à l'œil, et invisible à la relecture — *une déclaration
             * n'est pas une mesure.*
             *
             * ⚑ **C'EST LE MIROIR DE LA NOTE 79 QUI L'A RÉVÉLÉE.** Un décalage
             * COMMUN de +1 px ne se voit sur aucune zone prise seule ; posé
             * devant son symétrique, il compte DOUBLE — relevé `1,98 px`
             * d'écart entre la marge gauche du `MOVE` et la marge droite de
             * l'`EXTRACTION`, alors que les `left` calculés étaient exacts
             * (`255,688` / `18,922` pour un calque de `357,109`). *Une
             * asymétrie mesure ce qu'une symétrie cache.*
             */
            margin: 0;
            border-radius: 10px; padding: 0; color: var(--activable);
            font-family: var(--display); font-weight: 800; font-size: 13px;
            letter-spacing: .1em; display: flex; align-items: flex-start;
            justify-content: flex-end; gap: 4px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, .85);
            box-shadow: 0 1px 4px rgba(0, 0, 0, .45); }
      /* L'anneau du survol : peint d'avance, seule son OPACITÉ bouge. */
      /*
       * ⛑ S293 — l'anneau s'allume à l'ENCRE, plus au vert : *« le contour qui
       * s'allume au survol »*, et il n'a plus besoin d'un liseré noir pour se
       * détacher — le halo intérieur suffit.
       */
      .tz::after, .fcz.ok::after {
            /* ⛑ S307 — `inset: 0` et non `-1px` : la zone est désormais
               `overflow: hidden` pour contenir le voile du scintillement, et
               un anneau débordant d'un pixel s'y ferait rogner. */
            content: ''; position: absolute; inset: 0; border-radius: 10px;
            border: 1px solid color-mix(in srgb, var(--stock) 85%, transparent);
            pointer-events: none;
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--stock) 22%, transparent);
            opacity: 0; transition: opacity .16s ease; }
      .tz:hover::after, .tz:focus-visible::after, .tz:focus-within::after,
      .fcz.ok:hover::after, .fcz.ok:focus-visible::after, .fcz.ok:focus-within::after {
            opacity: 1; }
      /*
       * ⚠ **`:focus-within` EST LÀ POUR QUE LA RÈGLE SOIT MESURABLE.** Premier
       * jet : `:hover, :focus-visible`. Le volet ne simulant pas le survol, le
       * seul levier est `focus()` — et `:focus-visible` ne s'arme PAS sur un
       * focus programmatique : la mesure a rendu `box-shadow: none` sur un
       * bouton pourtant `activeElement`, c'est-à-dire un faux « la règle ne
       * s'applique pas ». `:focus-within` s'arme, lui. *Une règle qu'aucun
       * instrument ne peut atteindre n'est pas vérifiable, donc pas livrable.*
       */
      .tz:hover, .tz:focus-visible, .tz:focus-within { outline: none; }
      /*
       * ═══ ⛑⛑ S473 · LE GRIS MEURT AU SURVOL — note ㊺ ② ══════════════════
       *
       * Verbatim Croze : *« quand on passe la souris dessus, l'encadré ne
       * devienne pas tout gris déjà. »*
       *
       * ⚑ **UNE SEULE RÈGLE LE PEIGNAIT, ET ELLE A ÉTÉ MESURÉE, PAS DEVINÉE.**
       * Toutes les règles `:hover` de la feuille ont été passées devant le nœud
       * réel d'une zone `MOVE` en jeu, sélecteur privé de son `:hover` :
       *
       * ```
       * fond au repos                          rgba(0, 0, 0, 0)   transparent
       * button:hover:not(:disabled)            background: var(--ink-3)
       *                                        --ink-3 = #2B251E   ← LE GRIS
       *                                        (relevé du S32x ; `--ink-3` vaut
       *                                         #1E1E1E depuis le S520)
       * ```
       *
       * **Une, et une seule.** `.tz` déclare pourtant `background: transparent`
       * — mais `button:hover:not(:disabled)` pèse `0,2,1` contre `0,1,0` : le
       * fond général gagnait sur la zone. *Le « déjà » de sa phrase est exact :
       * le voile arrivait AVANT le geste, sur le simple passage.*
       *
       * ⚑ **LA FAMILLE EST CELLE DU LANGAGE UNIQUE (S307), PAS UNE LISTE
       * NEUVE** — les quatre mêmes classes que le scintillement, l'anneau et
       * l'`overflow` plus bas. Croze nomme *« les encadrés cliquables du calque
       * (fiche d'inventaire, tiles) »* : ce sont exactement celles-là. Elles
       * gardent l'anneau qui s'allume et le scintillement ; elles perdent le
       * voile. *On n'ajoute pas un signal, on retire celui qui n'était pas
       * choisi.*
       *
       * ⚠ **LE TRAIT DE BORDURE RESTE**, lui : `border-color: var(--stock)` du
       * même bloc n'est pas un voile, et sur `.tz` il double l'anneau `::after`
       * sans rien recouvrir.
       *
       * ⚠⚠ **ET LE `button` EN TÊTE N'EST PAS DÉCORATIF — LA SPÉCIFICITÉ A ÉTÉ
       * COMPTÉE.** `button:hover:not(:disabled)` pèse **`0,2,1`** (`:disabled`
       * compte à l'intérieur du `:not`). Écrite `.tz:hover`, la contre-règle
       * pèse `0,2,0` et **perd** — le gris serait resté, sur la zone même que
       * Croze montre. Prefixée `button`, elle pèse `0,2,1` : égalité, et c'est
       * l'ORDRE qui tranche (ligne 3285 contre celle-ci). Le même comptage
       * donnait `0,3,0` à `.obj-cible:not(.exclu)` et à `.fcz.ok` — deux
       * gagnaient déjà, deux non. *Quatre sélecteurs qui se ressemblent ne
       * pèsent pas pareil, et c'est le genre de chose qui ne se voit pas en
       * relisant.*
       */
      button.tz:hover, button.fcz.ok:hover,
      button.obj-cible:not(.exclu):hover,
      button.cible-legale:hover { background: transparent; }
      /* Le mot n'est écrit que là où le carton n'imprime rien : la zone MOVE.
         ⛑ S624 — et la zone EXTRACTION (note 79), qui est son miroir : le
         carton n'imprime rien à gauche non plus. `tz-${action.toLowerCase()}`
         rend `tz-use_portal` — le nom vient du moteur, on ne le rhabille pas. */
      .tz-move, .tz-use_portal { padding: 4px 6px; }
      .tz-explore, .tz-interact { font-size: 0; }
      /*
       * ⛑ **S473 — L'EMBLÈME DE CROZE DANS LA ZONE `MOVE`, note ㊺ ④.**
       *
       * Il se pose EN FOND, `contain` et centré : la zone est mesurée à
       * `103,9 × 113` (ratio 0,919) et l'emblème est carré — `contain` le laisse
       * entier plutôt que de le rogner, et il ne déforme rien. `position:
       * absolute` + `inset` le sortent du `flex` de `.tz`, dont
       * l'alignement `flex-end / flex-start` existe pour poser le MOT en haut à
       * droite : l'image, elle, occupe la zone.
       *
       * ⚠⚠ **LE SÉLECTEUR EST `.tz > .tz-logo`, ET LA MESURE L'A EXIGÉ.** Écrit
       * `.tz-logo` tout court, il PERDAIT contre `.tz > *` — la règle qui
       * pousse le contenu devant le voile du scintillement, trente lignes plus
       * bas, à spécificité ÉGALE et déclarée après. Relevé sur le nœud réel :
       *
       * ```
       * position   absolute  demandé  →  relative  OBTENU
       * z-index    0         demandé  →  1         OBTENU
       * ```
       *
       * L'image se posait donc dans la boîte de contenu, décalée par son
       * `inset`, **et par-dessus le scintillement**. *Une déclaration n'est pas
       * une mesure : deux propriétés sur deux étaient perdues, et rien ne le
       * disait.*
       *
       * ⚠ **`z-index: 0` — SOUS LE VOILE DU SCINTILLEMENT, ET C'EST VOULU.**
       * `.tz > *` existe pour que le MOT `MOVE` ne soit pas lavé par le voile.
       * Une IMAGE qui remplit la zone, elle, MASQUERAIT le voile entier : le
       * signal « c'est cliquable » du S307 mourrait sur la seule zone que Croze
       * regarde. L'emblème passe donc dessous, et le scintillement le traverse.
       *
       * ⚠ **`pointer-events: none`** : le clic appartient au bouton, pas à
       * l'image — sans quoi la cible du clic deviendrait l'`img` et le survol se
       * lirait sur elle.
       */
      /*
       * ⚠⚠ **`width`/`height` SONT ÉCRITS, ET `inset` SEUL NE SUFFISAIT PAS.**
       * Sur un élément REMPLACÉ (`img`), `width: auto` se résout à la taille
       * INTRINSÈQUE, et les quatre `inset` cessent alors d'étirer la boîte.
       * Relevé sur le nœud réel : **512 × 512 dans une zone de 104 × 113** —
       * l'emblème débordait de la zone de cinq fois, sous un `overflow: hidden`
       * qui le rognait sans rien dire. *Un `inset` qui n'étire pas se lit
       * exactement comme un `inset` qui étire : le nœud est là, à la bonne
       * place, et faux.*
       */
      .tz > .tz-logo { position: absolute; inset: 6%;
                       width: 88%; height: 88%;
                       object-fit: contain; pointer-events: none;
                       z-index: 0; opacity: .96;
                       filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .7)); }
      /* Le mot ne s'efface QU'UNE FOIS L'IMAGE CHARGÉE (`onload`). Si le
         fichier manque, `onerror` retire l'image et « MOVE » reste écrit. */
      .tz-move.tz-logo-ok, .tz-use_portal.tz-logo-ok,
      .tz-fight_player.tz-logo-ok, .tz-trade.tz-logo-ok { font-size: 0; }

      /*
       * ═══ ⚑ S307 · LE LANGAGE UNIQUE DU « CLIQUABLE » — note ㉖ ④ ════════
       *
       * **Croze, verbatim** : *« plutôt que des carrés tout moches montrant où
       * l'on peut cliquer, fais des zones qui scintillent ou des effets que tu
       * trouves dans VFX qui te paraissent adaptés stp. »* Et sa borne :
       * **jamais l'ember, jamais le vert jouable.**
       *
       * ─── POURQUOI PAS LE PACK VFX, ET C'EST MESURÉ ─────────────────────
       *
       * `playVFX` peint **une planche de sprites à 40 images/s sur une couche
       * canvas, à une position, UNE fois** (`vfx.ts`) — `ball_fire`,
       * `burst_lightning`, `slash_blanc`. Ce sont des effets d'ÉVÉNEMENT : un
       * coup part, quelque chose éclate. *« Ceci est cliquable » n'est pas un
       * événement, c'est un ÉTAT*, et il dure tant que la zone existe. Rejouer
       * une planche de combat en boucle sur chaque zone coûterait un canvas par
       * zone pour dire une chose que le pack ne sait pas dire.
       *
       * Le scintillement est donc en CSS, et il tient la règle gravée
       * **`transform/opacity only`** : un voile en `::before` que l'on
       * TRANSLATE derrière un `overflow: hidden`. Aucun `background-position`
       * animé, aucune couleur qui bouge.
       *
       * ─── CE QUI DISPARAÎT ────────────────────────────────────────────────
       *
       * **Le trait au repos.** C'est lui, le « carré tout moche » : un cadre
       * permanent autour de chaque zone. Le scintillement le remplace ; l'anneau
       * de survol (S293) reste, parce qu'il répond à une AUTRE question —
       * *« sur laquelle suis-je ? »* — et non *« lesquelles sont cliquables ? »*
       *
       * ─── LES TROIS CHOIX, ET ILS SONT À MOI ─────────────────────────────
       *
       * ⓐ **`2,8 s` de cycle dont `0,9 s` de passage.** Deux tiers du temps, la
       *    zone est parfaitement calme. Un scintillement continu serait un
       *    clignotant : *ce qui bouge tout le temps cesse d'être un signal.*
       * ⓑ **`--stock` à 16 %.** L'encre de la page, presque rien. Ni l'ember
       *    (le Collapse), ni `--activable` (le vert des boules et du mot
       *    `MOVE`) : ce sont deux signaux réservés, et un troisième emprunt les
       *    userait.
       * ⓒ **Les zones ne partent PAS toutes en même temps.** Un décalage par
       *    zone (`--scint-retard`) : quatre zones qui brillent à l'unisson font
       *    un gyrophare, quatre zones décalées font une surface qui respire.
       *
       * ⚠⚠ **ET SANS MOUVEMENT, LE TRAIT REVIENT — SINON LE SIGNAL DISPARAÎT
       * POUR CEUX QUI COUPENT LES ANIMATIONS.** `prefers-reduced-motion` ne
       * doit pas rendre les zones INVISIBLES : sous ce réglage, le
       * scintillement s'éteint **et le cadre au repos reprend son travail**.
       * *Un signal porté par le seul mouvement n'existe pas pour qui a coupé le
       * mouvement.*
       */
      /*
       * ⚠ **PAS DE `position: relative` ICI — ET C'ÉTAIT UN PIÈGE.** `.tz` et
       * `.fcz` sont `position: absolute` : leur imposer `relative` les
       * arracherait de leur calque et les empilerait en haut à gauche du
       * carton. Elles établissent DÉJÀ un bloc conteneur pour leur `::before`.
       * Seule `.obj-cible`, qui est un bouton dans le flux, en a besoin.
       */
      .tz, .fcz.ok, .obj-cible:not(.exclu), .cible-legale { overflow: hidden; }
      /* ⛑ S310 — le rail de combat rejoint le langage unique (note ㉘ ②) :
         une CLASSE de plus dans la liste, pas une seconde règle. */
      .obj-cible:not(.exclu), .cible-legale { position: relative; }
      .tz::before, .fcz.ok::before, .obj-cible:not(.exclu)::before,
      .cible-legale::before {
        content: ''; position: absolute; top: -50%; bottom: -50%; left: 0;
        width: 42%; pointer-events: none; z-index: 0;
        background: linear-gradient(100deg,
          transparent 0%,
          color-mix(in srgb, var(--stock) 16%, transparent) 50%,
          transparent 100%);
        transform: translateX(-140%);
        animation: scintille 2.8s var(--scint-retard, 0s) infinite ease-in-out;
      }
      @keyframes scintille {
        0%   { transform: translateX(-140%); }
        32%  { transform: translateX(340%); }
        100% { transform: translateX(340%); }
      }
      /*
       * Le contenu passe DEVANT le voile — le mot `MOVE`, l'art d'une cible.
       * Sans ça le voile laverait le texte à chaque passage.
       */
      .tz > *, .fcz.ok > *, .obj-cible:not(.exclu) > *,
      .cible-legale > * { position: relative; z-index: 1; }

      @media (prefers-reduced-motion: reduce) {
        .tz::before, .fcz.ok::before, .obj-cible:not(.exclu)::before,
        .cible-legale::before { animation: none; opacity: 0; }
        .tz, .fcz.ok {
          border-color: color-mix(in srgb, var(--stock) 30%, transparent);
        }
        /* ⚠ `.obj-cible` n'a PAS besoin de ce repli : son trait vert
           (`--activable`, §2 — « ça, TU peux le jouer ») est visible au repos
           et ne dépend d'aucune animation. Lui imposer l'encre neutre ici
           REMPLACERAIT un signal réservé par une décoration. */
      }

      /*
       * ═══ ⛑ S220 · LES BOULES D'ACTION — note ⑬ ④ ════════════════════════
       *
       * *« au lieu d'écrire "2 actions restantes", des petites boules qui
       * représentent les actions, et une avec un S pour la signature. »*
       *
       * **Rondes, alignées sur la ligne du texte, aucune dimension héritée** :
       * `em` partout, pour qu'elles suivent la taille du bandeau le jour où il
       * change. Le `S` n'est pas une image — c'est une lettre dans une boule,
       * donc elle se lit à toute taille et se traduit toute seule.
       *
       * ⚠ **PLEINE = REMPLIE, VIDE = CONTOUR.** Pas d'opacité pour dire le
       * manque : une boule à 35 % se lit comme une boule mal rendue, pas comme
       * une action dépensée. La différence est une FORME.
       */
      .boules { display: inline-flex; align-items: center; gap: 3px;
                margin-left: 6px; vertical-align: middle; }
      .boule { width: 1.05em; height: 1.05em; border-radius: 50%;
               border: 1px solid var(--rule); box-sizing: border-box;
               display: inline-flex; align-items: center; justify-content: center;
               font-size: 9px; line-height: 1; font-weight: 800; }
      /* Mon tour, et l'action est encore là : c'est jouable, et le vert le dit. */
      .boule.pleine { background: var(--activable); border-color: var(--activable);
                      color: var(--ink); }
      /* Elle m'appartient mais je ne peux pas la prendre maintenant : pas de vert. */
      .boule.tenue  { background: var(--stock-dim); border-color: var(--stock-dim);
                      color: var(--ink); }
      .boule.vide   { background: transparent; color: var(--stock-dim); }
      .boule-s { width: auto; min-width: 1.05em; padding: 0 .28em; border-radius: .6em;
                 letter-spacing: 0; }
      /*
       * ═══ ⚑⚑ S618 · LES GESTES QUI RESTENT SOUFFLENT (note 76 ③) ═══════════
       *
       * **Croze, verbatim** : *« Les ACTIONS non dépensées BRILLENT (VFX doux —
       * pulse/glow) pour qu'on se rappelle qu'il reste des gestes — le « S » de
       * Signature inclus. »*
       *
       * ⚠⚠ **ELLE NE SE POSE QUE SUR `.pleine`, ET C'EST LA MOITIÉ DU TRAVAIL.**
       * `.pleine` est réservée à MON siège quand le geste est prenable ;
       * `.tenue` dit *« elle existe, elle n'est pas à moi maintenant »*. Une
       * lueur sur `.tenue` appellerait vers un geste qui appartient à un autre
       * — la faute que la réserve du vert nomme depuis le S314. **Le `S` ne
       * respectait pas cette réserve : réparé dans le même geste**
       * (`boulesDAction`, `main.ts`), sans quoi trois Signatures adverses se
       * seraient mises à pulser vers moi.
       *
       * ⚠ **`transform` / `opacity` ONLY — la référence gravée.** Le halo de
       * `.creneau[data-halo]` anime un `box-shadow`, ce qui fait travailler la
       * peinture à chaque image. Ici le halo est **statique**, porté par un
       * `::after`, et **seule son opacité respire**. Rien n'est repeint.
       *
       * ⚠ **AUCUNE TEINTE RÉSERVÉE AJOUTÉE** (`ECRANS §2`) : le halo reprend
       * `currentColor`… non — il reprend `--activable`, **la teinte que la
       * boule porte DÉJÀ**. C'est une LUEUR, pas une couleur de plus : elle
       * s'ajoute à ce que le pip dit, elle ne le remplace pas.
       *
       * ⚠ **`pointer-events: none` sur le halo** : il déborde la boule de 6 px,
       * et une lueur qui intercepte un clic serait un couvreur invisible —
       * exactement ce que `couverts` traque.
       */
      .boule.pleine { position: relative; }
      .boule.pleine::after {
        content: ''; position: absolute; inset: -1px; border-radius: inherit;
        pointer-events: none;
        box-shadow: 0 0 6px 1px var(--activable);
        opacity: .85;
        animation: pip-souffle 1.9s ease-in-out infinite; }
      @keyframes pip-souffle {
        0%, 100% { opacity: .25; }
        50%      { opacity: .9; }
      }
      @media (prefers-reduced-motion: reduce) {
        /* Le fait reste LISIBLE sans mouvement : le pip est plein, et la lueur
           tient à une valeur fixe. *Couper l'animation ne coupe pas le signal.* */
        .boule.pleine::after { animation: none; opacity: .55; }
      }
      /* La rangée d'un AUTRE siège, dans son bloc info déplié (note ㉔ bis). */
      .pips-siege { display: inline-flex; align-items: center; gap: 5px; }

      /*
       * ═══ B · LE SCORE, PERMANENT ET DISCRET — forme imposée par Croze ════
       *
       * *« RIEN NE BOUGE TANT QUE RIEN NE CHANGE ; quand il change, seul le
       * DELTA s'anime sur le siège concerné. »* Le chiffre est donc muet et
       * atténué ; c'est le `+3` qui prend l'œil, et lui seul, le temps d'être
       * vu. **Pas d'historique, pas de bandeau d'annonce.**
       */
      .ruban-score { font-family: var(--display); font-size: 10px; font-weight: 700;
                     color: var(--stock-dim); opacity: .75; min-width: 10px;
                     text-align: right; }
      .ruban-siege.actif .ruban-score { color: var(--stock); opacity: 1; }
      @keyframes delta-monte {
        0%   { opacity: 0; transform: translateY(4px); }
        18%  { opacity: 1; transform: translateY(0); }
        76%  { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-3px); }
      }
      .ruban-delta { font-family: var(--display); font-size: 11px; font-weight: 800;
                     color: var(--stock); animation: delta-monte 2.6s ease-out 1 forwards; }

      /*
       * ═══ ⚑ S57 · CE QUI VARIE SE VOIT SUR LA MINIATURE — SPEC CROZE ═══════
       *
       * *« Quand un joueur perd ou gagne des PV ou pioche, il faut qu'on le
       * voie en évidence sur sa miniature. Aujourd'hui on ne se rend pas assez
       * compte, même quand c'est nous qui perdons des vies. Effets ET wording,
       * ex : “+5HP”. »*
       *
       * **DEUX CHOSES, PAS UNE** : le siège REÇOIT un effet (il pulse), et le
       * montant MONTE au-dessus de lui. *Un effet seul dit « il s'est passé
       * quelque chose » sans jamais dire quoi — c'est la leçon déjà écrite pour
       * le clignotement de passage, appliquée ici.*
       *
       * ⚠ **AUCUNE RÉSERVATION N'EST TOUCHÉE.** La perte prend `--stamp`, qui
       * est déjà la teinte des PV dans cet écran (`.pv-coeur`, le remplissage
       * de la pastille, `.perte-montant`) : la grammaire existante étendue à
       * une seconde surface, pas une couleur neuve. Le gain et la pioche
       * restent en `--stock` — *l'ember est au Collapse, le vert jouable à ce
       * qui est jouable* — et c'est le wording qui les sépare.
       *
       * Le flottant est en `position: absolute` DANS le siège : il ne pousse
       * rien, donc le ruban ne se réorganise pas sous les yeux au moment précis
       * où on lui demande d'être lisible. Jetons maison : 220 ms pour la
       * montée, 400 ms pour la retombée du pulse.
       */
      .ruban-siege { position: relative; }
      .ruban-siege[data-varie] { animation: varie-pulse .4s ease-out 1; }
      .ruban-siege[data-varie="perte"] { box-shadow: inset 0 0 0 1px var(--stamp); }
      .ruban-siege[data-varie="gain"]  { box-shadow: inset 0 0 0 1px var(--stock-dim); }
      @keyframes varie-pulse {
        0%   { transform: scale(1); }
        22%  { transform: scale(1.06); }
        100% { transform: scale(1); }
      }
      /*
       * ═══ ⛑ S219 · ELLE SORTAIT PAR LE HAUT DE LA FENÊTRE ═════════════════
       *
       * Note ⑬ ⑤, verbatim Croze : *« en haut, des choses semblent s'afficher
       * et sortir de chaque PSEUDO (JOUEUR 1, TOI, JOUEUR 3…) mais je ne les
       * vois pas, c'est coupé par l'UI. »*
       *
       * **Mesuré à l'écran, mode JOUEUR, 1920×1080, une pioche d'Upkeep :**
       *
       * ```
       * .ruban-siege   x 1316  y   7   126×30
       * .ruban-varie   x 1355  y  -8    49×23     ← « +1 carte »
       * ancêtres : ruban · bande-timer · wrap · tour — overflow VISIBLE partout
       * ```
       *
       * ⚠ **CE N'EST PAS L'UI QUI COUPE, C'EST LE BORD DE LA FENÊTRE.** Aucun
       * ancêtre n'a d'`overflow: hidden` — relevé sur les sept. Le siège est à
       * **7 px** du haut, la bulle en demande 23, et son animation l'emmène
       * encore **12 px plus haut** : il lui faut 35 px de ciel là où il y en a
       * 7. *Un « c'est coupé » se vérifie sur les ancêtres AVANT d'accuser un
       * conteneur — ici les sept étaient innocents.*
       *
       * **Ce qui bouge, et ce qui ne bouge pas.** Rien ne descend d'un pixel :
       * le ruban reste où il est, `bt-palier` aussi (relevé : `y 59`, il reste
       * 22 px libres sous les sièges). **Seule la bulle change de côté** — elle
       * sort du pseudo par le BAS, et son mouvement est retourné avec elle.
       * Elle sort donc toujours du pseudo, comme Croze la décrit ; elle sort
       * juste du côté où il y a de la place.
       */
      .ruban-varie { position: absolute; left: 50%; top: 100%;
                     transform: translateX(-50%); display: flex;
                     flex-direction: column; align-items: center; gap: 1px;
                     pointer-events: none; white-space: nowrap; z-index: 5;
                     font-family: var(--display); font-weight: 800; font-size: 15px;
                     letter-spacing: .04em;
                     animation: varie-monte 2.6s ease-out 1 forwards; }
      /*
       * ⛑⛑ **S545 — CETTE PERTE ÉTAIT ÉCRITE À `1,88` DE CONTRASTE, ET LE
       * COMMENTAIRE D'À CÔTÉ EXPLIQUAIT POURQUOI C'ÉTAIT BIEN.**
       *
       * `main.ts` argumente, au site qui pose cette bulle : *« la perte prend
       * `--stamp`, qui est DÉJÀ la teinte des PV dans cet écran… ce n'est pas
       * une couleur neuve, c'est la grammaire existante étendue à une seconde
       * surface. »* L'argument est juste sur la GRAMMAIRE et faux sur le FOND :
       * les autres porteurs de `--stamp` sont des APLATS ou vivent sur le
       * carton CLAIR ; cette bulle-ci est de l'ENCRE sur le ruban SOMBRE.
       *
       * Le S536 avait déjà tranché la question et déposé les deux jetons —
       * *« une couleur n'a pas un contraste, elle en a un PAR FOND »* (S244) :
       * `--rouge` pour l'aplat, `--rouge-vif` pour l'encre sur ses noirs. Ce
       * site est le seul du fichier à ne pas avoir suivi. **Mesuré au grain,
       * `?seed=3&fait=COMBAT_OPENED`, peau JOUEUR : `varie-ligne · 15 px ·
       * ratio 1,88` pour un seuil de 4,5.**
       *
       * ⚠ **ET LE `text-shadow` NE RATTRAPAIT RIEN** : son halo est `--ink`,
       * c'est-à-dire la couleur même du fond. *Une ombre de la couleur du fond
       * n'ajoute pas de contraste, elle en retire.*
       *
       * ⚠ **`--rouge-vif`, PAS `--ember`** : même valeur, réservation
       * différente — l'ember est au Collapse (`RELANCE ①`), et un jeton se
       * choisit par le FAIT qu'il porte, pas par sa teinte.
       */
      .ruban-varie.perte { color: var(--rouge-vif); }
      .ruban-varie.gain  { color: var(--stock); }
      .varie-ligne { text-shadow: 0 1px 0 var(--ink), 0 0 6px var(--ink); }
      /*
       * ⛑ S981 — **LA CAUSE EXPLIQUE, ELLE N'ANNONCE PAS.** Le montant garde
       * ses 15 px ; le nom qui l'explique passe dessous, plus petit et moins
       * espacé. Il hérite de `.varie-ligne` (donc du halo) et de la teinte de
       * la bulle : *un jeton se choisit par le FAIT qu'il porte* — cette
       * ligne-ci porte le même fait que le montant, elle n'a pas de couleur à
       * elle.
       */
      .varie-cause { font-size: 11px; font-weight: 700; letter-spacing: .02em; }
      /*
       * ⛑ S219 — **LE MOUVEMENT SUIT LA BULLE, IL NE SE RÉINVENTE PAS.** Les
       * quatre temps, leurs pourcentages et leurs opacités sont ceux du S57,
       * au signe près : la bulle naît **collée au pseudo** et s'en éloigne de
       * 12 px — vers le bas maintenant que c'est par là qu'elle sort.
       * *Un rythme se retourne en entier ou il change de rythme* (`§3ter`).
       *
       * Le nom reste `varie-monte` : c'est bien un montant qui monte, et
       * renommer un keyframe cité dans deux règles pour un signe aurait fait
       * une divergence de plus à relire.
       */
      @keyframes varie-monte {
        0%   { opacity: 0; transform: translate(-50%, -6px); }
        8%   { opacity: 1; transform: translate(-50%, 0); }
        70%  { opacity: 1; transform: translate(-50%, 4px); }
        100% { opacity: 0; transform: translate(-50%, 12px); }
      }
      /* Un joueur qui a le mouvement en horreur garde le fait, pas l'effet. */
      @media (prefers-reduced-motion: reduce) {
        .ruban-siege[data-varie] { animation: none; }
        .ruban-varie { animation: varie-monte 2.6s steps(1, end) 1 forwards; }
      }

      /* À QUI EST LE TOUR — en gros, permanent, en haut de la fenêtre. */
      /* ⛑ S259 — le bandeau devient une RANGÉE : le titre à gauche, l'aide de
       * la note ⑱ ⑥ à sa droite. `wrap` pour que l'aide passe dessous plutôt
       * que de pousser le titre — *une aide ne déplace pas la question.* */
      .cf-atoi { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px;
                 padding: 8px 12px; background: var(--ink); border-bottom: 1px solid var(--rule); }
      .cf-atoi-txt { font-family: var(--display); font-weight: 800; font-size: 26px;
                     letter-spacing: .14em; text-transform: uppercase; color: var(--stock-dim); }
      .cf-atoi.on { background: var(--ink-3); }
      .cf-atoi.on .cf-atoi-txt { color: var(--stock); }

      /*
       * Ce qui est DÛ au siège — la fenêtre ne piège plus.
       * ⚙ **S46 — `.cf-pied` PARTAGE LE STYLE, PAS LE NOM.** Les pieds à un
       * bouton (`J'AI LU`) portaient `cf-dues` : même nom, donc même sens pour
       * qui compte. *Un nom emprunté pour son style fait mentir tout instrument.*
       */
      .cf-dues, .cf-pied { padding: 7px 12px; border-bottom: 1px solid var(--rule);
                 background: var(--ink); }
      /*
       * ⊕ **S87 — LA BANDE DES OBLIGATIONS RESTE, MÊME QUAND ON DÉFILE.**
       *
       * `§0.1 ④` a été payé deux fois : *une surface modale porte TOUTES les
       * obligations du siège, ou elle n'est pas modale.* Les deux fois, le
       * défaut était qu'une obligation vivait AILLEURS. **Mesuré au palier 68,
       * il y en avait une troisième forme, et personne ne l'avait vue : la
       * bande est bien DANS la fenêtre, et elle sort de l'écran dès qu'on
       * l'utilise.**
       *
       * ```
       * 1920×1080, etat-Z-combat, la référence gravée
       * .cf-dues        y  254 → 334      ✅ à l'écran quand on arrive
       * .cf-deroule     y 1636 → 2083     ❌ il faut défiler 556 px pour LIRE le combat
       * → à ce défilement, .cf-dues est sorti par le HAUT depuis 300 px
       * ```
       *
       * *Une bande d'obligations qui disparaît au geste même qu'on demande au
       * joueur de faire ne piège pas moins que celle qui n'existe pas.*
       *
       * **Le remède existait à côté, avec sa raison écrite.** `.col-droite`
       * est `sticky` + bornée à la vue + défilante chez elle depuis le palier
       * 56 — *« une colonne qui sort par le bas de la page ne le donne à aucun
       * compte de sièges »*. La bande reçoit la même solidarité avec la
       * FENÊTRE, pas avec la page : `top: 0`, au-dessus de tout ce qui défile
       * sous elle. **Quatrième fois qu'une leçon n'avait traversé qu'une des
       * deux surfaces qui la partagent.**
       *
       * ⚠ **`.cf-pied` NE LA PREND PAS.** Il partage le style, pas le sens
       * (S46) : un `J'AI LU` est une FIN de lecture, il n'a aucune raison de
       * suivre le regard. *Un nom emprunté pour son style ne doit pas hériter
       * d'un comportement.*
       */
      /*
       * ⛑⛑ **S669 — CE `top: 0` NE COLLAIT PLUS RIEN DEPUIS LE S638, ET
       * PERSONNE NE L'AVAIT VU.** Le S87 (ci-dessus) a posé la bande en
       * `sticky · top: 0` quand elle ouvrait la fenêtre : elle restait alors
       * en tête pendant qu'on défilait sous elle. **Le S638 l'a mise en
       * DERNIER**, sur ordre de Croze (note 72 C, *« les boutons EN DESSOUS
       * des fiches »*) — et un `top: 0` sur le DERNIER enfant d'un conteneur
       * ne s'active jamais : il n'y a rien après lui pour le pousser hors du
       * haut. La règle est restée, vraie de sa forme, morte de son sens.
       * *Une règle qui perd sa cause se relit comme une règle.*
       *
       * ⚑ **`bottom: 0` EST CE QUE LE S87 VOULAIT DIRE, POUR CETTE PLACE-CI**
       * — la bande d'obligations reste visible quoi qu'on fasse défiler ;
       * seul le bord auquel elle se colle a changé avec sa position.
       *
       * MESURÉ à 1920×1080 sur `?etat=Z-combat` (note 81 ⑦) :
       *
       *   avant   bande y 1008 → 1083   bouton y 1041 → 1070   air 10 px
       *   après   voir le relevé du palier — la bande se cale sur le bord bas
       *           de la FENÊTRE, qui remonte de 72 px (`max-height` ci-dessus)
       */
      .cf-dues { position: sticky; bottom: 0; z-index: 3; }
      @media (max-width: 1199px) {
        /* Hors de la plage arbitrée, tout est empilé — voir `.col-droite`. */
:where(html[data-verrou="non"]) .cf-dues { position: static; }
      }
      .cf-dues .due { font-size: 10px; letter-spacing: .06em; color: var(--stock-dim);
                      border: 1px solid var(--rule); padding: 1px 6px; }
      .cf-dues .due.on { color: var(--ember); border-color: var(--ember); font-weight: 800; }
      .cf-dues .due-btn { font-weight: 800; }

      .cf-cibles { border: 1px solid var(--rule); padding: 6px 8px; background: var(--ink); }
      .cible-seule { display: flex; flex-direction: column; gap: 2px; padding-top: 3px; }
      .cible-nom { font-family: var(--display); font-weight: 800; font-size: 15px; }
      .cf-cibles .cible-on { font-weight: 800; border-color: var(--stock); }
      .cf-issue { padding: 12px; display: flex; flex-direction: column; gap: 4px; }
      .combat-fenetre.issue { border-color: var(--stock-dim); }
      .portee { font-size: 10px; color: var(--slate); letter-spacing: .04em; }

      /*
       * ═══ §5.1.2bis · L'ÉCRAN D'OUVERTURE — LA PORTE READY ══════════════
       *
       * C'est le SEUL écran qui prend la fenêtre entière — les trois zones de
       * §2 n'existent pas encore, il n'y a pas de partie à regarder. Il se
       * centre au lieu de se poser en haut : *une porte se présente en face,
       * pas dans un coin.*
       *
       * ⚠ **Aucune animation d'entrée.** Le dé d'ouverture, lui, en aura une
       * (spec des 1–3 s) ; ici, l'écran doit être LISIBLE à la première image,
       * y compris dans un onglet qui ne composite pas.
       */
      /*
       * ⛑ S851 — MÊME `100vh` DANS UN CORPS REMBOURRÉ, MÊME DÉBORDEMENT : le
       * document faisait 1 102 px pour une fenêtre de 1 080, donc l'OUVERTURE
       * était DÉFILABLE de 22 px sans que rien ne le demande.
       */
      body.ouverture #app { display: grid; place-items: center;
                            min-height: calc(100 * var(--uvh) - var(--bande-portes)); }
      body.ouverture.avec-debug #app {
        min-height: calc(100 * var(--uvh) - var(--bande-debug) - var(--bande-portes)); }
      .ouv { width: min(1500px, calc(94 * var(--uvw))); text-align: center; padding: calc(4 * var(--uvh)) 0; }
      /*
       * ═══ ⛑⛑ S540 · LES DEUX BLOCS DE LA §6 — note 56, verdict Croze ══════
       *
       * *« ça peut être fait comme le html et après poursuivre sur l'écran
       * qu'on connaît »* — la mise en page revient à la maquette, **et rien de
       * ce que la porte porte ne meurt : tout change de COLONNE.**
       *
       * **LE DÉFAUT MESURÉ QUE ÇA RÉPARE** — `balayage_geometrie`, 1920×1080 :
       * document `1 401 px` de haut, `scrollHeight > clientHeight`. **Croze
       * devait DÉFILER sur l'écran qui n'est QUE ce choix.** La pile :
       * `titre 52 · sous-titre 36 · en-tête 72 · ROSTER 598 · SIÈGES 404 ·
       * pied 42 · remplissage 86`. La §6 range ces blocs CÔTE À CÔTE : les
       * 404 px des sièges quittent la pile.
       *
       * **LES PROPORTIONS SONT CELLES DE SA §6, AU CENTIÈME**, et aucune n'est
       * choisie ici : `titre top 4.6%` · `fiches left 2.4%, top 20%,
       * height 54%` · `roster right 2.6%, top 20%, width 48%` · `sièges
       * right 2.6%, bottom 2.6%, width 48%` · dos décalé `+1.6%/+2%`.
       *
       * ⚠ **LE POURCENTAGE PORTE SUR LA FENÊTRE, PAS SUR UN PARENT DE 1 500 px.**
       * `.ouv-deux-blocs` passe donc à la fenêtre entière — *un pourcentage
       * porté sans son conteneur ne porte rien* (S497, sur ce même écran).
       */
      body.ouverture #app:has(.ouv-deux-blocs) { display: block; }
      .ouv-deux-blocs { position: relative; width: calc(100 * var(--uvw)); height: calc(100 * var(--uvh));
                        max-width: none; padding: 0; overflow: hidden; }
      /*
       * ═══ ⛑⛑ S851 · 80 % DU BOUTON « JE SUIS PRÊT » DU 4ᵉ SIÈGE ÉTAIT
       *              INATTEIGNABLE, ET SEULEMENT SOUS `?debug=1` ════════════
       *
       * **Mesuré à 1920×1080, `elementFromPoint` sur une grille de 21×5 points
       * du bouton :**
       *
       * ```
       * y+ 4  .....................     . = atteignable
       * y+10  #####################     # = couvert
       * y+16  #####################
       * y+22  #####################
       * y+28  #####################     -> 80 % couvert
       * ```
       *
       * Les deux couvreurs sont `.porte-options` (1618→1756) et
       * `.porte-rapport` (1760→1849), **fixes, à `--z-portes: 930`**, qui
       * tapissent ensemble `y 1044→1064`. Le bouton vivait à `y 1035→1064` :
       * seule une bande de 9 px, en haut, restait cliquable.
       *
       * ⚠ **LA CAUSE N'EST PAS LES PORTES, ET C'EST TOUT LE POINT.** Sans
       * `?debug=1`, le même bouton est à `y 1013→1042` et **il est
       * atteignable** : il passe 2 px au-dessus des portes. Le décalage vient
       * de `body.avec-debug { padding-top }` — la bande du drapeau de débogage
       * — que ce bloc ne soustrayait pas de son `100vh`. *Un `100vh` dans un
       * corps rembourré déborde de son rembourrage*, ici de 22 px, et c'est
       * exactement ce qui faisait descendre la dernière rangée sous les
       * portes.
       *
       * ⚑ **ET `couverts` NE L'A PAS VU — SON RELEVÉ DISAIT `RIEN`, 13 DENTS
       * MORDUES.** Sa sonde éprouve cinq points (`[0.5,0.5]`, puis les quatre
       * coins à 0,2/0,8) et rend `atteint` **dès que l'UN d'eux touche**. Le
       * centre était couvert ; `[0.2, 0.2]` tombait dans la bande de 9 px. Il
       * répond donc à *« au moins un point est-il atteignable ? »*, pas à
       * *« le bouton est-il cliquable là où on vise ? »*. **C'est un plafond,
       * pas une faute** — mais il faut le nommer : *deux plafonds qui se
       * compensent rendent un vert qui ne mesure rien.* La dent du CENTRE lui
       * est ajoutée au palier suivant.
       *
       * ⚠ **LA CORRECTION NE TOUCHE NI LES PORTES NI LEUR `z-index`.** Leur
       * rang est un invariant écrit et mesuré deux fois (S398, S504) ; le
       * défaut est ici, et il se répare ici.
       */
      .ouv-deux-blocs { height: calc(100 * var(--uvh) - var(--bande-portes)); }
      body.avec-debug .ouv-deux-blocs {
        height: calc(100 * var(--uvh) - var(--bande-debug) - var(--bande-portes)); }
      /* ① LE TITRE ET SON FILET — `top 4.6%`, filet centré à `top 11%`. */
      .ouv-deux-blocs > h2 { position: absolute; top: 4.6%; left: 0; right: 0;
                             margin: 0; }
      .ouv-deux-blocs > h2::after { content: ""; position: absolute;
                                    top: calc(11% - 4.6%); left: 30%; right: 30%;
                                    height: 1px; background: var(--rule); }
      .ouv-deux-blocs > .ouv-sous { position: absolute; top: 12.5%; left: 2.4%;
                                    width: 45%; margin: 0; text-align: left; }
      /* ② LES FICHES — colonne GAUCHE. */
      /*
       * ⛑⛑ **S577 — LA RÉF v12 LES MET CÔTE À CÔTE, ELLE NE LES EMPILE PLUS.**
       * `docs/refs/ecran_selection_REF.html` est la maquette itérée AVEC Croze
       * et déposée par lui comme autorité (note 68). Son `.sheets` est un
       * `display:flex; gap:1.1%` de DEUX images à `height:54%` — recto ET
       * verso, l'un à côté de l'autre — là où la §6 précédente posait un dos
       * générique décalé derrière. **Le dos générique reste**, mais seulement
       * là où il dit la vérité : tant que ce siège n'a pas choisi.
       *
       * ⚠ **UN SEUL PERSONNAGE A UN VERSO, ET CE N'EST PAS UNE SUPPOSITION** :
       * `public/art/personnages/versos/` n'en porte qu'un (`the_necromancer`),
       * et la réf porte exactement le même — son `VRS` vaut `null` partout sauf
       * à l'indice de THE NECROMANCER. *Deux routes, le même compte.*
       */
      .sel-fiche { position: absolute; left: 2.4%; top: 20%; height: 54%;
                   display: flex; gap: 1.1%; align-items: flex-start; }
      /*
       * ⛑⛑ **S671 — CETTE RÈGLE PRENAIT TOUTE IMAGE DE LA FICHE, ET ELLE A
       * FAIT 256 px D'UN APERÇU DE 34.** Elle s'écrivait `.sel-fiche img` :
       * à l'époque, les seules images de ce bloc étaient les trois faces
       * (`sel-dos`, `sel-recto`, `sel-verso`), et « toutes » voulait dire « les
       * miennes ». Le S671 a posé un aperçu de dé dans la case `sel-peau` — le
       * descendant `.sel-fiche img` (0,1,1) battait `.sel-peau-de` (0,1,0), et
       * la case gonflait à 274 px pendant que la fiche tombait à 0.
       *
       * ⚑ **C'est le JUMEAU EXACT du balai de `peindre`, corrigé dans le même
       * palier** : là un `querySelectorAll('img')`, ici un `.sel-fiche img`.
       * *Un sélecteur nomme ce qu'il habille ; deux fois la même faute, deux
       * fois la même réparation.*
       */
      .sel-fiche img.sel-recto, .sel-fiche img.sel-verso { cursor: zoom-in; }
      .sel-fiche img.sel-dos, .sel-fiche img.sel-recto,
      .sel-fiche img.sel-verso { height: 100%; width: auto; display: block;
                       object-fit: contain; max-height: 2000px; max-width: 1414px; }
      .sel-dos { opacity: .85; }
      /*
       * ⚑ **L'ANIMATION DU VERROUILLAGE — note 67 ④, « recto puis verso, 140 ms
       * de décalage ».** Les deux nombres sont ceux de la réf (`shIn .5s`,
       * `animation-delay .14s`), pas des miens. `transform`/`opacity` seulement.
       */
      /*
       * ⚠ **S578 — `.sel-recto` rend `opacity: 0` au relevé, et ce N'EST PAS un
       * défaut** : c'est l'horloge du volet masqué, mesurée
       * (`document.timeline.currentTime = 0`, `playState 'running'` à `t = 0`,
       * et `anim.currentTime = 1000` rend `opacity 1 / transform none`). Voir
       * la démonstration complète au bloc des onglets de quête. *Ce qu'on ne
       * peut pas voir se sonde ; il ne se déduit pas d'une capture immobile.*
       */
      @keyframes sh-in { from { transform: translateY(2.4%) scale(.982); opacity: 0 }
                         to   { transform: none; opacity: 1 } }
      .sel-fiche.sel-verrou img { animation: sh-in .5s cubic-bezier(.2,1.35,.3,1) both; }
      .sel-fiche.sel-verrou img + img { animation-delay: .14s; }
      /* §6 — le flavor, EN GRAS, sous le nom. `quickRead` du classeur. */
      .sel-flavor { position: absolute; left: 0; right: 0; top: 109.5%;
                    font-size: 22px; font-weight: 700; line-height: 1.35;
                    color: var(--stock-2); text-align: center; }
      /*
       * ⛑ **S1202 — LA HAUTEUR DE LIGNE, MESURÉE APRÈS COUP.** À `40px` avec
       * la hauteur de ligne héritée (1,5), la boîte fait **60 px** et mord de
       * **12 px** sur la phrase d'ambiance juste dessous. *Une taille de police
       * n'est pas une hauteur* : `1.1` rend 44 px, et les trois lignes tiennent.
       */
      .sel-nom { position: absolute; left: 0; right: 0; top: 101%;
                 font-family: var(--display); font-weight: 700; font-size: 40px;
                 line-height: 1.1;
                 letter-spacing: .1em; text-transform: uppercase;
                 color: var(--stock); text-align: center; }
      /* ③ LE ROSTER — colonne DROITE, hauts alignés avec la fiche. */
      /*
       * ═══ ⛑⛑ S587 · LE TITRE DU ROSTER MORDAIT LA PREMIÈRE RANGÉE DE 52 PX
       *     — SUR L'ÉCRAN QUE CROZE MET EN PRIORITÉ ABSOLUE ═════════════════
       *
       * Mesuré à 1920×1080, avant toute retouche : `h2` **102 px de haut**
       * (trois lignes, `CHOISIS TON PERSONNAGE` replié dans une boîte de
       * 330 px), bas à `269` contre la première tuile à `217`. **Chevauchement
       * `+52,4 px`.**
       *
       * ⚠ **ET AUCUN DE MES TROIS INSTRUMENTS NE POUVAIT LE DIRE** :
       * `balayage_geometrie` cherche ce qui est peint DEHORS ou COUPÉ (il rend
       * `RIEN`, 9 dents) · `couverts` demande si un élément est ATTEIGNABLE en
       * son centre, et le titre ne mord que le coin haut-gauche de la rangée
       * (`RIEN`, 24 éléments, 13 dents). *Trois « RIEN » justes, sur trois
       * questions dont aucune n'était celle-là.* Ce qui l'a rendu est **la
       * capture d'écran** — le volet était affiché, ce palier.
       *
       * ⚠ **CE N'EST PAS LE BOUTON DU MODE ADMIN.** Vérifié dans les deux sens,
       * même mesure : `h2` 102 px et chevauchement `+52,4` **avec et sans lui**.
       * Le défaut est antérieur. *On ne s'accuse pas plus qu'on ne s'acquitte :
       * on mesure les deux états.*
       *
       * Après : header `108 → 57 px`, chevauchement `+52,4 → −14,2` (un écart,
       * enfin), aucun débord à droite, document toujours `1920×1080`.
       *
       * ⚑ **ET LA TAILLE DEVIENT UNE PROPORTION** — règle permanente de Croze,
       * *« n'enferme rien dans une fenêtre qui ne bougerait jamais de 1920 »*.
       * `1,78 vw` rend `34,2` à 1920, donc **exactement la valeur actuelle**
       * (le plafond mord) et rien ne bouge sur son écran ; à 1280 il rend
       * `22,8 px`, soit 274 px de titre dans une colonne de 614. Sans ça, un
       * `nowrap` sur un `34px` gravé déborderait la colonne au premier écran
       * plus étroit — on aurait échangé un repli contre un débord.
       */
      /*
       * ⚠⚠ **ET LE PREMIER CORRECTIF NE TENAIT QU'À 1920 — MESURÉ À 1280×720.**
       * Remonter le bloc à `top: 13.5%` marchait sur SON écran et rendait
       * **`+117 px` de chevauchement** sur un 1280 : la hauteur n'est pas
       * décidée par le titre mais par la LÉGENDE, qui se replie en cinq lignes
       * quand la colonne rétrécit. *Un correctif éprouvé sur une seule fenêtre
       * est un correctif éprouvé sur une seule fenêtre.*
       *
       * ⚑ **LA BOÎTE S'ANCRE DONC PAR LE BAS** (`bottom: 81%`, le roster ouvre
       * à `20%`) : elle GRANDIT VERS LE HAUT, quelle que soit sa hauteur, et le
       * chevauchement ne peut plus revenir par une ligne de plus. La légende
       * prend sa propre rangée, pleine largeur — au lieu de se serrer entre le
       * titre et le bouton. *Ce qu'on ancre du côté où ça pousse ne pousse
       * jamais sur le voisin.*
       *
       * ⚠ **ET PAS D'ELLIPSE SUR LA LÉGENDE**, essayée puis rejetée sur mesure :
       * à 1280 elle tombait à `49 px` pour `369` de texte — un `…` qui ne dit
       * rien. *Tronquer jusqu'au silence n'est pas rendre une place.*
       *
       * Relevé après, dans les deux tailles ET les deux titres du mode admin :
       * `1920` header `75,5` · écart `−11,8` · légende 1 ligne · doc 1920×1080
       * `1280` header `58,7` · écart  `−8,2` · légende 1 ligne · doc 1280×720
       */
      .ouv-deux-blocs > .cap-head { position: absolute; right: 2.6%;
                                    top: auto; bottom: 81%;
                                    width: 48%; padding: 0;
                                    display: grid; grid-template-columns: 1fr auto;
                                    align-items: end; gap: 2px 10px; }
      .ouv-deux-blocs > .cap-head h2 { grid-column: 1; grid-row: 1;
                                       white-space: nowrap;
                                       font-size: clamp(15px, calc(1.78 * var(--uvw)), 34px); }
      .ouv-deux-blocs > .cap-head .ouv-admin { grid-column: 2; grid-row: 1;
                                               margin-left: 0; align-self: center; }
      .ouv-deux-blocs > .cap-head .cap { grid-column: 1 / -1; grid-row: 2; }
      /*
       * ⚑ S587 — LA BASCULE DU MODE ADMIN (note 68). Elle prend le vocabulaire
       * de la barre de sa réf : cadre discret, et le liseré OS quand elle est
       * enfoncée — `button[aria-pressed="true"]` chez elle. **Aucune couleur
       * neuve** : `--stock` et `--slate` sont déjà les deux encres de
       * `.cap-head`, et l'ember reste au Collapse.
       */
      .ouv-admin { flex: none; margin-left: 10px; background: transparent;
                   border: 1px solid var(--rule); color: var(--slate);
                   font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
                   padding: 3px 9px; cursor: pointer; }
      .ouv-admin:hover { border-color: var(--stock); color: var(--stock); }
      .ouv-admin[aria-pressed="true"] { border-color: var(--stock);
                                        color: var(--stock);
                                        background: rgba(239, 236, 227, .09); }
      /*
       * ⛑ **S1067 · NOTE 129 ③ — LE ROSTER DESCEND JUSQU'EN BAS.** Le bloc des
       * quatre sièges occupait `bottom: 2.6%` de cette colonne ; il est parti,
       * et la grille reprend la hauteur. *On ne laisse pas un trou à la place
       * de ce qu'on retire.*
       */
      .ouv-deux-blocs > .roster { position: absolute; right: 2.6%; top: 20%;
                                  bottom: 2.6%; width: 48%; margin: 0; }
      /*
       * ═══ ⛑⛑ S1067 · NOTE 129 ③ — LES DEUX POP-UPS DE LA PORTE ═══════════
       *
       * Croze : *« un pop-up pour confirmer son choix, puis un pop-up pour
       * choisir son dé, pas tout sur le même écran en même temps »*.
       *
       * ⚑ **AUCUN VOCABULAIRE NEUF** : le voile est celui de `.volet-rapport`
       * (`fixed inset 0`, scrim `rgba(10, 8, 6, .82)`), la boîte celle de
       * `.vr-boite` (`--ink-2` sur un filet `--rule`). *Une surface modale de
       * plus ne mérite pas une seconde grammaire.*
       *
       * ⚠ Le `z-index` passe **au-dessus de la couche des dés** (900) : la
       * porte peut poser une scène, et une question qu'une scène recouvre est
       * une question qu'on ne voit pas.
       */
      /*
       * ═══ ⛑⛑ S1070 · NOTE 129 ⑥ — LES DEUX MOITIÉS DU DUNGEON VIEW ═══════
       *
       * Croze : *« à gauche la spirale …, à droite le journal exhaustif »*. La
       * mise en page vit sur le CONTENANT, pas sur l'ordre des enfants — *une
       * mise en page qui tient à l'ordre se casse au premier ajout.*
       */
      .vue-donjon { display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
                    align-items: start; }
      .vd-gauche { display: flex; flex-direction: column; align-items: center; }
      /*
       * ⛑ S1095 — LE SCORING, au pied de la moitié gauche (note 129 ⑥). Le
       * gabarit de Croze l'imprime en DEUX COLONNES sous la spirale ; ici une
       * ligne par siège, son total en gros, le détail par source à côté.
       * ⚠ AUCUNE unité de FENÊTRE : le verrou de 1080 est la règle depuis le
       * S1071, et une règle neuve qui en poserait une rouvrirait le chantier.
       */
      .vd-score { margin-top: 14px; border-top: 1px solid var(--rule); padding-top: 10px; }
      .vd-score-siege { display: flex; align-items: baseline; gap: 10px;
                        padding: 3px 0; flex-wrap: wrap; }
      .vd-score-total { font-family: var(--display); font-weight: 800; font-size: 20px;
                        line-height: 1; min-width: 34px; text-align: right; }
      .vd-score-detail { display: flex; gap: 10px; flex-wrap: wrap; margin-left: auto; }
      .vd-score-part { font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
                       color: var(--stock-dim); }
      .vd-journal { display: flex; flex-direction: column; gap: 8px;
                    border-left: 1px solid var(--rule); padding-left: 18px;
                    /*
                     * ⚠ **LA HAUTEUR EST BORNÉE PAR LA MAIN, ET C'EST MESURÉ.**
                     * `.main-basse` est `sticky` et commence à `y 643` ; la vue
                     * ouvre à `y 55`. Il reste donc **588 px**, et le journal
                     * s'arrête à 560 pour laisser respirer le compte. Sans
                     * cette borne il défilait SOUS les cartes — *une surface
                     * qu'on ne peut pas lire entière n'est pas une surface.*
                     */
                    max-height: 560px; }
      .vdj-tete h3 { margin: 0; font-family: var(--display); font-weight: 800;
                     font-size: 22px; letter-spacing: .12em; color: var(--stock); }
      .vdj-sous { font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
                  color: var(--stock-dim); }
      .vdj-barre { display: flex; gap: 10px; align-items: center; }
      .vdj-sel, .vdj-cherche {
        font-family: var(--mono); font-size: 11px; padding: 4px 6px;
        background: var(--ink-2); color: var(--stock-2);
        border: 1px solid var(--rule);
      }
      .vdj-cherche { flex: 1 1 auto; }
      /*
       * ⛑ **S1117 · LE FILTRE COMBAT** (note 136 ②). Même famille que les deux
       * contrôles d'à côté — il partage leur bordure et leur fond, et ne se
       * distingue que par l'état ALLUMÉ. ⚠ **NI L'EMBER NI LE VERT** : l'ember
       * appartient au Collapse et le vert à ce qui est JOUABLE ; un filtre
       * n'est ni l'un ni l'autre. Il prend `--stock`, l'encre du texte fort.
       */
      .vdj-filtre { border: 1px solid var(--rule); background: var(--ink);
                    color: var(--dim); font-size: 12px; letter-spacing: .04em;

      .vdj-tour-ici { color: var(--stock); border-bottom-color: var(--stock-dim); }
      .vdj-ico { display: inline-block; width: 1.4em; opacity: .75; }
      .vdj-compte { font-family: var(--mono); font-size: 10px;

      .porte-voile {

      /*
