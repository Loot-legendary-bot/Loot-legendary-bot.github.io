*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--noir);color:var(--texte)}
body{font-family:"Courier Prime","Courier New",monospace;overflow:hidden;-webkit-font-smoothing:antialiased}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

.scene{position:relative;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:max(2vh,env(safe-area-inset-top)) 4vw 0;isolation:isolate}
.lumiere{position:fixed;inset:0;z-index:-3;pointer-events:none;
  background:radial-gradient(46% 38% at 50% 40%,rgba(241,237,228,.07),transparent 72%),
             radial-gradient(120% 95% at 50% 38%,transparent 52%,#000 100%)}

/* la porte */
.porte{position:relative;display:flex;flex-direction:column;align-items:center;width:100%;margin:0 0 22vh}
.logo{margin:0 0 clamp(14px,3.6vh,40px);line-height:0}
.logo img{display:block;width:min(560px,84vw,58vh);height:auto;user-select:none;-webkit-user-drag:none}

.bouche{position:relative;width:var(--w);display:flex;flex-direction:column;align-items:center}
.cadre{position:relative;z-index:2;width:100%;aspect-ratio:1088/391;
  background:var(--img-cadre) center/100% 100% no-repeat;transition:filter var(--moyen) var(--courbe)}
.cadre:focus-within{filter:drop-shadow(0 0 14px rgba(241,237,228,.16))}
.cadre-rouge{position:absolute;inset:0;pointer-events:none;background:var(--sang);
  -webkit-mask:var(--img-cadre) center/100% 100% no-repeat;mask:var(--img-cadre) center/100% 100% no-repeat;
  opacity:0;mix-blend-mode:multiply;transition:opacity var(--long) var(--courbe)}
.champ{position:absolute;left:6.6%;right:7.4%;top:28.6%;bottom:25.3%;display:flex}
.champ input{flex:1;min-width:0;margin:0;padding:0 .7em;border:0;outline:0;border-radius:0;background:transparent;
  color:var(--texte);caret-color:var(--sang);text-align:center;
  font:400 clamp(17px,calc(var(--w) * .05),24px)/1 "Courier Prime","Courier New",monospace;letter-spacing:.42em;text-indent:.42em}
.champ input::placeholder{color:var(--cendre);opacity:.8;letter-spacing:.24em}
.champ input:-webkit-autofill,.champ input:-webkit-autofill:hover,.champ input:-webkit-autofill:focus{
  -webkit-text-fill-color:var(--texte);caret-color:var(--sang);transition:background-color 99999s 0s,color 99999s 0s}

/* la langue = le bouton OK */
.langue{position:relative;z-index:1;display:block;width:calc(var(--w) * .5);aspect-ratio:240/260;
  margin:calc(var(--w) * -0.074) 0 0;padding:0;border:0;background:none;color:inherit;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.langue:focus-visible{outline:2px dashed var(--sang);outline-offset:6px;border-radius:0 0 46% 46%}
.lechee,.tic{display:block;width:100%;height:100%;transform-origin:50% 0;will-change:transform}
.lechee{transition:transform var(--long) var(--courbe)}
.langue:hover .lechee{transform:scaleY(1.07)}
.langue svg{display:block;width:100%;height:100%;overflow:visible}
.goutte{transform-box:fill-box;transform-origin:50% 0;opacity:0;animation:goutte 5.6s var(--courbe) 1.4s infinite}
@keyframes goutte{
  0%{opacity:0;transform:translateY(0) scale(.15)}
  12%{opacity:1}
  56%{transform:translateY(2px) scale(1)}
  66%{transform:translateY(6px) scale(.92,1.22)}
  78%{opacity:1;transform:translateY(170px) scale(.85,1.3)}
  80%,100%{opacity:0;transform:translateY(190px) scale(.85,1.3)}
}
.tic.tic-on{animation:tic var(--moyen) var(--courbe)}
@keyframes tic{0%{transform:rotate(0)}35%{transform:rotate(-3.5deg) scaleY(1.04)}70%{transform:rotate(2.5deg)}100%{transform:rotate(0)}}

.legende{position:relative;margin:clamp(8px,1.8vh,18px) 0 0;min-height:1.3em;text-align:center}
.cta,.erreur{display:block;transition:opacity var(--moyen) var(--courbe)}
.cta{font:800 clamp(13px,calc(var(--w) * .034),16px)/1.3 "Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  letter-spacing:.34em;text-indent:.34em;opacity:.62}
.langue:hover + .legende .cta,.langue:focus-visible + .legende .cta{opacity:1}
.erreur{position:absolute;left:50%;top:0;transform:translateX(-50%);white-space:nowrap;
  font:400 clamp(14px,calc(var(--w) * .036),17px)/1.3 "Courier Prime","Courier New",monospace;color:#d8473c;opacity:0}
.legende.en-erreur .cta{opacity:0}
.legende.en-erreur .erreur{opacity:1}

/* mauvais mot : la langue recule, le cadre rougit et tremble */
.rate .lechee{animation:recul 900ms var(--courbe)}
.rate .cadre{animation:secoue var(--long) var(--courbe)}
.rate .cadre-rouge{opacity:1}
@keyframes recul{
  0%{transform:scaleY(1)}
  28%{transform:scaleY(1.16) rotate(2deg)}
  48%{transform:scaleY(.3) rotate(-5deg)}
  60%{transform:scaleY(.36) rotate(4deg)}
  72%{transform:scaleY(.32) rotate(-2deg)}
  100%{transform:scaleY(1) rotate(0)}
}
@keyframes secoue{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}

/* bon mot : la langue lèche le sol, le sang tombe du haut */
.lechage .lechee{animation:lecher 820ms cubic-bezier(.3,.6,.3,1) forwards}
.lechage .goutte{animation:none;opacity:0}
.lechage .legende{opacity:0;transition:opacity var(--court)}
.lechage .tache-sol{animation:trainee 380ms var(--courbe) 300ms forwards}
@keyframes lecher{
  0%{transform:scaleY(1) rotate(0)}
  40%{transform:scaleY(var(--etire)) rotate(-2.5deg)}
  56%{transform:scaleY(calc(var(--etire) * .97)) rotate(3deg)}
  70%{transform:scaleY(var(--etire)) rotate(-1.5deg)}
  100%{transform:scaleY(.12) rotate(0)}
}
@keyframes trainee{to{opacity:.95;transform:translate(-50%,-38%) scale(1,1)}}
.rideau{position:fixed;left:0;right:0;top:0;height:132vh;z-index:20;pointer-events:none;transform:translateY(-101%)}

  <p class="apercu" id="apercu">Aperçu : sur le site, c'est ici que le HOME s'ouvre.</p>
</main>
<script>
(function(){
  'use strict';
  /* Même serrure que l'ancienne porte — ne pas toucher sans changer le mot. */
  var H='60d91e576dcdfdb05f2602a5a9b6cd5dac7e34278e2b3f7f3e9ef24ea9ae4586';
  var HOME='/titre/ecran_titre.html';
  var SUR_LE_SITE=/porte\.html$/.test(location.pathname);

  var scene=document.getElementById('scene'), f=document.getElementById('f'), p=document.getElementById('p'),
      langue=document.getElementById('langue'), tic=document.getElementById('tic'),
      legende=document.getElementById('legende'), erreur=document.getElementById('erreur'),
      sol=document.querySelector('.sol'), apercu=document.getElementById('apercu');
  var calme=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var occupe=false, minuteErreur=0;

  function attendre(ms){return new Promise(function(r){setTimeout(r,ms)})}
  async function sha(s){
    var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
    return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('');
  }
  /* jusqu'où la langue doit s'étirer pour toucher le sol, selon l'écran */
  function regler(){
    var r=langue.getBoundingClientRect(), s=sol.getBoundingClientRect();
    var contact=s.top+s.height*.38;
    var etire=Math.min(3.2,Math.max(1.5,(contact-r.top)/r.height));
    scene.style.setProperty('--etire',etire.toFixed(3));
    scene.style.setProperty('--contact-y',(r.top+r.height*etire*.95)+'px');
  }
  function tiquer(){
    if(calme) return;
    tic.classList.remove('tic-on'); void tic.offsetWidth; tic.classList.add('tic-on');
  }
  p.addEventListener('input',tiquer);
  tic.addEventListener('animationend',function(){tic.classList.remove('tic-on')});

  f.addEventListener('submit',async function(e){
    e.preventDefault();
    if(occupe) return;
    var v=p.value.trim();
    if(!v){tiquer();p.focus();return}
    occupe=true;
    var bon=false;
    try{bon=(await sha(v))===H}catch(_){}
    if(bon){
      try{sessionStorage.setItem('ll_pass','ok')}catch(_){}
      p.blur();
      if(calme){ if(SUR_LE_SITE){location.replace(HOME);return} }
      else{
        regler();
        scene.classList.add('lechage'); await attendre(820);
        scene.classList.add('tombe');   await attendre(660);
      }
      scene.classList.add('nuit'); await attendre(300);
      if(SUR_LE_SITE){location.replace(HOME);return}
      apercu.classList.add('on'); await attendre(2200);
      scene.classList.remove('lechage','tombe','nuit'); apercu.classList.remove('on');
      p.value=''; occupe=false; p.focus();
    }else{
      clearTimeout(minuteErreur);
      erreur.textContent='Wrong word. Lick again.';
      legende.classList.add('en-erreur');
      scene.classList.remove('rate'); void scene.offsetWidth; scene.classList.add('rate');
      p.value='';
      await attendre(calme?0:900);
      scene.classList.remove('rate'); occupe=false; p.focus();
      minuteErreur=setTimeout(function(){legende.classList.remove('en-erreur')},2600);
    }
  });
})();
</script>
